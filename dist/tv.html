دَّمَ، وَمَالُ وَارِثِهِ مَا أَخَّرَ"]], "source": "صحيح البخاري · ٦٤٤٢", "english": "Narrated `Abdullah:The Prophet (ﷺ) said, \"Who among you considers the wealth of his heirs dearer to him than his own wealth?\" They replied, \"O Allah's Messenger (ﷺ)! There is none among us but loves his own wealth more.\" The Prophet (ﷺ) said, \"So his wealth is whatever he spends (in Allah's Cause) during his life (on good deeds) while the wealth of his heirs is whatever he leaves after his death", "source_en": "Sahih al-Bukhari · 6442"}, {"parts": [["n", "عن عَبْدِ اللَّهِ بْنِ مَسْعُودٍ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "مَنْ نَزَلَتْ بِهِ فَاقَةٌ فَأَنْزَلَهَا بِالنَّاسِ لَمْ تُسَدَّ فَاقَتُهُ وَمَنْ نَزَلَتْ بِهِ فَاقَةٌ فَأَنْزَلَهَا بِاللَّهِ فَيُوشِكُ اللَّهُ لَهُ بِرِزْقٍ عَاجِلٍ أَوْ آجِلٍ"]], "source": "جامع الترمذي · ٢٣٢٦ · حسن صحيح", "english": "Abdullah bin Mas'ud narrated that the Messenger of Allah (s.a.w) said:\"Whoever suffers from destitution and he beseeches the people for it, his destitution shall not end. And whoever suffers from destitution and he beseeches Allah for it, Allah will send provisions to him, sooner or later", "source_en": "Jami at-Tirmidhi · 2326"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "يَدْخُلُ الْفُقَرَاءُ الْجَنَّةَ قَبْلَ الأَغْنِيَاءِ بِخَمْسِمِائَةِ عَامٍ نِصْفِ يَوْمٍ"]], "source": "جامع الترمذي · ٢٣٥٣ · حسن صحيح عند الألباني", "english": "Abu Hurairah narrated that the Messenger of Allah (s.a.w) said:\"The poor are admitted into Paradise before the rich, by five hundres years, (i.e.) half a day", "source_en": "Jami at-Tirmidhi · 2353"}, {"parts": [["n", "عن جَابِرٍ، قَالَ كُنَّا مَعَ النَّبِيِّ ﷺ فِي غَزَاةٍ فَقَالَ"], ["q", "إِنَّ بِالْمَدِينَةِ لَرِجَالاً مَا سِرْتُمْ مَسِيرًا وَلاَ قَطَعْتُمْ وَادِيًا إِلاَّ كَانُوا مَعَكُمْ حَبَسَهُمُ الْمَرَضُ"]], "source": "صحيح مسلم · ١٩١١", "english": "Abu Wa'il reported:One day we went to 'Abdullah b. Mas'ud after we had observed the dawn prayer and we paid salutation at the door. He permitted us to enter, but we stayed for a while at the door, when the slave-girl came out and said: Why don't you come in? So we went in and (we found 'Abdullah b. Mas'ud) sitting and glorifying Allah (i. e. he was busy in dhikr) and he said: What obstructed you from coming in though you had been granted permission for it? We said: There was nothing (behind it) but we entertained the idea that some inmate of the house might be sleeping. He said: Do you presume any idleness on the part of the family of Ibn Umm 'Abd (the mother of Abdullah b. Mas'ud)? He was again busy with the glorification of Allah till he thought that the sun had risen. He said: Girl, see whether (the sun) has arisen. She glanced but it had not risen (by that time). He was again busy with the glorification (of Allah) and he (again) thought that the sun had arisen. She glanced (and confirmed) that, it had risen. Upon this he ('Abdullah b. Mas'ud) said: Praise be to Allah Who did not call us to account for our sins today. Mahdi said: I think that he said, He did not destroy us for our sins. One among the people said: I recited all the mufassal surahs during the night. 'Abdullah said: (You must have recited them) like the (recitation) of poetry. I heard (the Holy Prophet) combining (the sarahs) and I remember the combinations which the Messenger of Allah (ﷺ) made In the recitation (of surahs). These were constituted of eighteen mufassal surahs and two surahs (commencing with) Ha-Mim", "source_en": "Sahih Muslim · 1911"}, {"parts": [["n", "عن عَبْدِ اللَّهِ بْنِ عَمْرٍو، عَنْ رَسُولِ اللَّهِ ﷺ قَالَ"], ["q", "لاَ يَحِلُّ لِرَجُلٍ أَنْ يُفَرِّقَ بَيْنَ اثْنَيْنِ إِلاَّ بِإِذْنِهِمَا"]], "source": "سنن أبي داود · ٤٨٤٥ · حسن صحيح عند الألباني", "english": "Narrated Abdullah ibn Amr ibn al-'As: The Messenger of Allah (ﷺ) said: It is not lawful for a man to separate two persons except with their permission", "source_en": "Sunan Abi Dawud · 4845"}, {"parts": [["n", "عن أَبِي سَعِيدٍ الْخُدْرِيِّ، قَالَ سَمِعْتُ رَسُولَ اللَّهِ ﷺ يَقُولُ"], ["q", "خَيْرُ الْمَجَالِسِ أَوْسَعُهَا"]], "source": "سنن أبي داود · ٤٨٢٠ · صحيح عند الألباني", "english": "Narrated AbuSa'id al-Khudri: I heard the Messenger of Allah (ﷺ) as saying: The best places to sit are those which provide most room. Abu Dawud said: The name of 'Abd al-Rahman b. Abi 'Amr is 'Abd al-Rahman b. 'Amr b. Abi 'Umrat al-Ansari", "source_en": "Sunan Abi Dawud · 4820"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "مَا مِنْ قَوْمٍ يَقُومُونَ مِنْ مَجْلِسٍ لاَ يَذْكُرُونَ اللَّهَ فِيهِ إِلاَّ قَامُوا عَنْ مِثْلِ جِيفَةِ حِمَارٍ وَكَانَ لَهُمْ حَسْرَةً"]], "source": "سنن أبي داود · ٤٨٥٥ · صحيح عند الألباني", "english": "Narrated AbuHurayrah: The Prophet (ﷺ) said: People who get up from an assembly in which they did not remember Allah will be just as if they had got up from an ass's corpse, and it will be a cause of grief to them", "source_en": "Sunan Abi Dawud · 4855"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، عَنْ رَسُولِ اللَّهِ ﷺ أَنَّهُ قَالَ"], ["q", "مَنْ قَعَدَ مَقْعَدًا لَمْ يَذْكُرِ اللَّهَ فِيهِ كَانَتْ عَلَيْهِ مِنَ اللَّهِ تِرَةً وَمَنِ اضْطَجَعَ مَضْجَعًا لاَ يَذْكُرُ اللَّهَ فِيهِ كَانَتْ عَلَيْهِ مِنَ اللَّهِ تِرَةً"]], "source": "سنن أبي داود · ٤٨٥٦ · حسن صحيح عند الألباني", "english": "Narrated AbuHurayrah: The Prophet (ﷺ) said: If anyone sits at a place where he does not remember Allah, deprivation will descend on him from Allah; and if he lies at a place where he does not remember Allah, deprivation will descend on him from Allah", "source_en": "Sunan Abi Dawud · 4856"}, {"parts": [["n", "عن أَبِي الدَّرْدَاءِ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "أَلاَ أُخْبِرُكُمْ بِأَفْضَلَ مِنْ دَرَجَةِ الصِّيَامِ وَالصَّلاَةِ وَالصَّدَقَةِ"], ["n", "قَالُوا بَلَى. قَالَ"], ["q", "إِصْلاَحُ ذَاتِ الْبَيْنِ وَفَسَادُ ذَاتِ الْبَيْنِ الْحَالِقَةُ"]], "source": "سنن أبي داود · ٤٩١٩ · صحيح عند الألباني", "english": "Narrated AbudDarda': The Prophet (ﷺ) said: Shall I not inform you of something more excellent in degree than fasting, prayer and almsgiving (sadaqah)? The people replied: Yes, Prophet of Allah! He said: It is putting things right between people, spoiling them is the shaver (destructive)", "source_en": "Sunan Abi Dawud · 4919"}, {"parts": [["n", "عن أُمَّهُ أُمَّ كُلْثُومٍ بِنْتَ عُقْبَةَ أَخْبَرَتْهُ أَنَّهَا، سَمِعَتْ رَسُولَ اللَّهِ ﷺ يَقُولُ"], ["q", "لَيْسَ الْكَذَّابُ الَّذِي يُصْلِحُ بَيْنَ النَّاسِ، فَيَنْمِي خَيْرًا، أَوْ يَقُولُ خَيْرًا"]], "source": "صحيح البخاري · ٢٦٩٢", "english": "Narrated Um Kulthum bint `Uqba:That she heard Allah's Messenger (ﷺ) saying, \"He who makes peace between the people by inventing good information or saying good things, is not a liar", "source_en": "Sahih al-Bukhari · 2692"}, {"parts": [["n", "عن عَبْدِ اللَّهِ بْنِ عَمْرٍو رضى الله عنهما قَالَ لَمْ يَكُنِ النَّبِيُّ ﷺ فَاحِشًا وَلاَ مُتَفَحِّشًا وَكَانَ يَقُولُ"], ["q", "إِنَّ مِنْ خِيَارِكُمْ أَحْسَنَكُمْ أَخْلاَقًا"]], "source": "صحيح البخاري · ٣٥٥٩", "english": "Narrated `Abdullah bin `Amr:The Prophet (ﷺ) never used bad language neither a \"Fahish nor a Mutafahish. He used to say \"The best amongst you are those who have the best manners and character.\" (See Hadith No. 56 (B) Vol", "source_en": "Sahih al-Bukhari · 3559"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ رضى الله عنه عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "لَوْ دُعِيتُ إِلَى ذِرَاعٍ أَوْ كُرَاعٍ لأَجَبْتُ، وَلَوْ أُهْدِيَ إِلَىَّ ذِرَاعٌ أَوْ كُرَاعٌ لَقَبِلْتُ"]], "source": "صحيح البخاري · ٢٥٦٨", "english": "Narrated Abu Huraira:The Prophet (ﷺ) said, \"I shall accept the invitation even if I were invited to a meal of a sheep's trotter, and I shall accept the gift even if it were an arm or a trotter of a sheep", "source_en": "Sahih al-Bukhari · 2568"}, {"parts": [["n", "عن جَابِرِ بْنِ عَبْدِ اللَّهِ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "مَنْ أُعْطِيَ عَطَاءً فَوَجَدَ فَلْيَجْزِ بِهِ فَإِنْ لَمْ يَجِدْ فَلْيُثْنِ بِهِ فَمَنْ أَثْنَى بِهِ فَقَدْ شَكَرَهُ وَمَنْ كَتَمَهُ فَقَدْ كَفَرَهُ"]], "source": "سنن أبي داود · ٤٨١٣ · حسن عند الألباني", "english": "Narrated Jabir ibn Abdullah: The Prophet (ﷺ) said: If someone is given something, he should give a return for it provided he can afford; if he cannot afford, he should praise him. He who praises him for it, thanks him, and he who conceals it is ungrateful to him. Abu Dawud said: It has been transmitted by Yahya b. Ayyub, from `Umarah b. Ghaziyyah, from Sharahbil on the authority of Jabir. Abu Dawud said: In the chain of this tradition `Umarah b. Ghaziyyah said: A man from my tribe said. The man referred by him is Sharahbil. It is likely that they disliked him and, therefore, they did not name him", "source_en": "Sunan Abi Dawud · 4813"}, {"parts": [["n", "عن ابْنِ مَسْعُودٍ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "لَقِيتُ إِبْرَاهِيمَ لَيْلَةَ أُسْرِيَ بِي فَقَالَ يَا مُحَمَّدُ أَقْرِئْ أُمَّتَكَ مِنِّي السَّلاَمَ وَأَخْبِرْهُمْ أَنَّ الْجَنَّةَ طَيِّبَةُ التُّرْبَةِ عَذْبَةُ الْمَاءِ وَأَنَّهَا قِيعَانٌ وَأَنَّ غِرَاسَهَا سُبْحَانَ اللَّهِ وَالْحَمْدُ لِلَّهِ وَلاَ إِلَهَ إِلاَّ اللَّهُ وَاللَّهُ أَكْبَرُ"]], "source": "جامع الترمذي · ٣٤٦٢ · حسن عند الألباني", "english": "Ibn Mas`ud narrated that:The Messenger of Allah (ﷺ) said: “I met Ibrahim on the night of my ascent, so he said: ‘O Muhammad, recite Salam from me to your nation, and inform them that Paradise has pure soil and delicious water, and that it is a flat treeless plain, and that its seeds are: “Glory is to Allah (Subḥān Allāh) [and] all praise is due to Allah (Al-ḥamdulillāh) and ‘none has the right to be worshipped but Allah’ (Lā ilāha illallāh), and Allah is the greatest (Allāhu Akbar).”", "source_en": "Jami at-Tirmidhi · 3462"}, {"parts": [["n", "عن الْمِقْدَامِ بْنِ مَعْدِيكَرِبَ، أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "إِنَّ اللَّهَ يُوصِيكُمْ بِأُمَّهَاتِكُمْ - ثَلاَثًا - إِنَّ اللَّهَ يُوصِيكُمْ بِآبَائِكُمْ إِنَّ اللَّهَ يُوصِيكُمْ بِالأَقْرَبِ فَالأَقْرَبِ"]], "source": "سنن ابن ماجه · ٣٦٦١ · صحيح عند الألباني", "english": "Miqdam bin Ma'dikarib, may Allah be pleased with them, narrated that:Allah's Messenger said: \"Allah enjoins you to treat your mother's kindly\"-three times- \"Allah enjoins you to treat your fathers kindly, Allah enjoins you to treat the closest and the next closest kindly", "source_en": "Sunan Ibn Majah · 3661"}, {"parts": [["n", "عن عَائِشَةَ، قَالَتْ قُلْتُ يَا رَسُولَ اللَّهِ إِنَّ لِي جَارَيْنِ فَإِلَى أَيِّهِمَا أُهْدِي قَالَ"], ["q", "إِلَى أَقْرَبِهِمَا مِنْكِ بَابًا"]], "source": "صحيح البخاري · ٦٠٢٠", "english": "Narrated `Aisha:I said, \"O Allah's Messenger (ﷺ)! I have two neighbors! To whom shall I send my gifts?\" He said, \"To the one whose gate in nearer to you", "source_en": "Sahih al-Bukhari · 6020"}, {"parts": [["n", "عن أبي هُرَيْرَةَ رضى الله عنه عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "كَانَ تَاجِرٌ يُدَايِنُ النَّاسَ، فَإِذَا رَأَى مُعْسِرًا قَالَ لِفِتْيَانِهِ تَجَاوَزُوا عَنْهُ، لَعَلَّ اللَّهَ أَنْ يَتَجَاوَزَ عَنَّا، فَتَجَاوَزَ اللَّهُ عَنْهُ"]], "source": "صحيح البخاري · ٢٠٧٨", "english": "Narrated Abu Huraira:The Prophet (ﷺ) said, \"There was a merchant who used to lend the people, and whenever his debtor was in straitened circumstances, he would say to his employees, 'Forgive him so that Allah may forgive us.' So, Allah forgave him", "source_en": "Sahih al-Bukhari · 2078"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "إِذَا أَحْسَنَ أَحَدُكُمْ إِسْلاَمَهُ، فَكُلُّ حَسَنَةٍ يَعْمَلُهَا تُكْتَبُ لَهُ بِعَشْرِ أَمْثَالِهَا إِلَى سَبْعِمِائَةِ ضِعْفٍ، وَكُلُّ سَيِّئَةٍ يَعْمَلُهَا تُكْتَبُ لَهُ بِمِثْلِهَا"]], "source": "صحيح البخاري · ٤٢", "english": "Narrated Abu Huraira: Allah's Messenger (ﷺ) said, \"If any one of you improves (follows strictly) his Islamic religion then his good deeds will be rewarded ten times to seven hundred times for each good deed and a bad deed will be recorded as it is", "source_en": "Sahih al-Bukhari · 42"}, {"parts": [["n", "عن لَهُ فَضْلاً عَلَى مَنْ دُونَهُ، فَقَالَ النَّبِيُّ ﷺ"], ["q", "هَلْ تُنْصَرُونَ وَتُرْزَقُونَ إِلاَّ بِضُعَفَائِكُمْ"]], "source": "صحيح البخاري · ٢٨٩٦", "english": "Narrated Mus`ab bin Sa`d:Once Sa`d (bin Abi Waqqas) thought that he was superior to those who were below him in rank. On that the Prophet (ﷺ) said, \"You gain no victory or livelihood except through (the blessings and invocations of) the poor amongst you", "source_en": "Sahih al-Bukhari · 2896"}, {"parts": [["n", "عن مُعَاذِ بْنِ جَبَلٍ، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "مَا مِنْ مُسْلِمٍ يَبِيتُ عَلَى ذِكْرٍ طَاهِرًا فَيَتَعَارُّ مِنَ اللَّيْلِ فَيَسْأَلُ اللَّهَ خَيْرًا مِنَ الدُّنْيَا وَالآخِرَةِ إِلاَّ أَعْطَاهُ إِيَّاهُ"]], "source": "سنن أبي داود · ٥٠٤٢ · صحيح عند الألباني", "english": "Narrated Mu'adh ibn Jabal: The Prophet (ﷺ) said: If a Muslim sleeps while remembering Allah, in the state of purification, is alarmed while asleep at night, and asks Allah for good in this world and in the Hereafter. He surely gives it to him. Thabit al-Bunani said: AbuZabyah came to visit us and he transmitted this tradition to us from Mu'adh ibn Jabal from the Prophet (ﷺ). Thabit said: So and so said: I tried my best to utter these (prayers) when I got up, but I could not do", "source_en": "Sunan Abi Dawud · 5042"}, {"parts": [["n", "عن فَرْوَةَ بْنِ نَوْفَلٍ، عَنْ أَبِيهِ، أَنَّ النَّبِيَّ ﷺ قَالَ لِنَوْفَلٍ"], ["q", "اقْرَأْ ﴿ قُلْ يَا أَيُّهَا الْكَافِرُونَ ﴾ ثُمَّ نَمْ عَلَى خَاتِمَتِهَا فَإِنَّهَا بَرَاءَةٌ مِنَ الشِّرْكِ"]], "source": "سنن أبي داود · ٥٠٥٥ · صحيح عند الألباني", "english": "Farwah b. Nawfal quoted his father as saying that the Prophet (ﷺ) said to Nawfal (his father):Recite (the Surah) 'Say, O you disbelievers!' and then go to sleep at its end, for it is a declaration of freedom from polytheism", "source_en": "Sunan Abi Dawud · 5055"}, {"parts": [["n", "عن أَنَسٍ، أَنَّ رَسُولَ اللَّهِ ﷺ كَانَ إِذَا أَوَى إِلَى فِرَاشِهِ قَالَ"], ["q", "الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنَا وَسَقَانَا وَكَفَانَا وَآوَانَا فَكَمْ مِمَّنْ لاَ كَافِيَ لَهُ وَلاَ مُئْوِيَ"]], "source": "صحيح مسلم · ٢٧١٥", "english": "A'isha, the Mother of the Believers (Allah be pleased with her), reported:The Apostle of Allah (ﷺ) came to me one day and said: Is there anything with you (to eat)? I said: No. Thereupon he said: I shall then be fasting. Then he came to us another day and we said: Messenger of Allah, hais has been offered to us as a gift. Thereupon he said: Show that to me; I had been fasting since morning. He then ate it", "source_en": "Sahih Muslim · 2715"}, {"parts": [["n", "عن حُذَيْفَةَ بْنِ الْيَمَانِ، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "وَالَّذِي نَفْسِي بِيَدِهِ لَتَأْمُرُنَّ بِالْمَعْرُوفِ وَلَتَنْهَوُنَّ عَنِ الْمُنْكَرِ أَوْ لَيُوشِكَنَّ اللَّهُ أَنْ يَبْعَثَ عَلَيْكُمْ عِقَابًا مِنْهُ ثُمَّ تَدْعُونَهُ فَلاَ يُسْتَجَابُ لَكُمْ"]], "source": "جامع الترمذي · ٢١٦٩ · حسن", "english": "Hudhaifah bin Al-Yaman narrated that the Prophet (s.a.w) said:\"By the One in Whose Hand is my soul! Either you command good and forbid evil, or Allah will soon send upon you a punishment from Him, then you will call upon Him, but He will not respond to you", "source_en": "Jami at-Tirmidhi · 2169"}, {"parts": [["n", "عن أَبِي مُوسَى الأَشْعَرِيِّ، قَالَ قَالَ النَّبِيُّ ﷺ"], ["q", "مَا أَحَدٌ أَصْبَرُ عَلَى أَذًى سَمِعَهُ مِنَ اللَّهِ، يَدَّعُونَ لَهُ الْوَلَدَ، ثُمَّ يُعَافِيهِمْ وَيَرْزُقُهُمْ"]], "source": "صحيح البخاري · ٧٣٧٨", "english": "Narrated Abu Musa Al-Ash`ari:The Prophet (ﷺ) said, \"None is more patient than Allah against the harmful and annoying words He hears (from the people): They ascribe children to Him, yet He bestows upon them health and provision", "source_en": "Sahih al-Bukhari · 7378"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "لَوْ يَعْلَمُ الْمُؤْمِنُ مَا عِنْدَ اللَّهِ مِنَ الْعُقُوبَةِ مَا طَمِعَ بِجَنَّتِهِ أَحَدٌ وَلَوْ يَعْلَمُ الْكَافِرُ مَا عِنْدَ اللَّهِ مِنَ الرَّحْمَةِ مَا قَنِطَ مِنْ جَنَّتِهِ أَحَدٌ"]], "source": "صحيح مسلم · ٢٧٥٥", "english": "Abu Haraira (Allah be pleased with him) reported Allah's Messenger (ﷺ) as saying:The most excellent fast after Ramadan is God's month. al-Muharram, and the most excellent prayer after what is prescribed is prayer during the night", "source_en": "Sahih Muslim · 2755"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "إِنَّ اللَّهَ عَزَّ وَجَلَّ يَقُولُ أَنَا مَعَ عَبْدِي إِذَا هُوَ ذَكَرَنِي وَتَحَرَّكَتْ بِي شَفَتَاهُ"]], "source": "سنن ابن ماجه · ٣٧٩٢ · صحيح عند الألباني", "english": "It was narrated from Abu Hurairah that the Prophet(ﷺ) said:\"Allah says: 'I am with My slave when he remembers Me and his lips move saying My Name", "source_en": "Sunan Ibn Majah · 3792"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "لاَ يَمْشِي أَحَدُكُمْ فِي نَعْلٍ وَاحِدَةٍ لِيُحْفِهِمَا جَمِيعًا، أَوْ لِيَنْعَلْهُمَا جَمِيعًا"]], "source": "صحيح البخاري · ٥٨٥٦", "english": "Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"None of you should walk, wearing one shoe only; he should either put on both shoes or put on no shoes whatsoever", "source_en": "Sahih al-Bukhari · 5856"}, {"parts": [["n", "عن عَبْدِ اللَّهِ بْنِ عَمْرٍو رضى الله عنهما قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "إِنَّ مِنْ أَكْبَرِ الْكَبَائِرِ أَنْ يَلْعَنَ الرَّجُلُ وَالِدَيْهِ"], ["n", "قِيلَ يَا رَسُولَ اللَّهِ وَكَيْفَ يَلْعَنُ الرَّجُلُ وَالِدَيْهِ قَالَ"], ["q", "يَسُبُّ الرَّجُلُ أَبَا الرَّجُلِ، فَيَسُبُّ أَبَاهُ، وَيَسُبُّ أَمَّهُ"]], "source": "صحيح البخاري · ٥٩٧٣", "english": "Narrated `Abdullah bin `Amr:Allah's Messenger (ﷺ) said. \"It is one of the greatest sins that a man should curse his parents.\" It was asked (by the people), \"O Allah's Messenger (ﷺ)! How does a man curse his parents?\" The Prophet (ﷺ) said, \"'The man abuses the father of another man and the latter abuses the father of the former and abuses his mother", "source_en": "Sahih al-Bukhari · 5973"}, {"parts": [["n", "عن عَائِشَةَ، قَالَتْ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "إِنَّ أَطْيَبَ مَا أَكَلْتُمْ مِنْ كَسْبِكُمْ وَإِنَّ أَوْلاَدَكُمْ مِنْ كَسْبِكُمْ"]], "source": "جامع الترمذي · ١٣٥٨ · حسن", "english": "Aishah narrated that the Messenger of Allah (ﷺ) said:\"Indeed the most wholesome of what you consume is from your earnings, and indeed your children are from your earnings", "source_en": "Jami at-Tirmidhi · 1358"}, {"parts": [["n", "عن عَائِشَةَ رضى الله عنها قَالَتْ قَالَ النَّبِيُّ ﷺ"], ["q", "إِذَا أَنْفَقَتِ الْمَرْأَةُ مِنْ طَعَامِ بَيْتِهَا، غَيْرَ مُفْسِدَةٍ، كَانَ لَهَا أَجْرُهَا بِمَا أَنْفَقَتْ، وَلِزَوْجِهَا بِمَا كَسَبَ، وَلِلْخَازِنِ مِثْلُ ذَلِكَ، لاَ يَنْقُصُ بَعْضُهُمْ أَجْرَ بَعْضٍ شَيْئًا"]], "source": "صحيح البخاري · ٢٠٦٥", "english": "Narrated `Aisha:The Prophet (ﷺ) said, \"If a woman gives in charity from her house meals without wasting (i.e. being extravagant), she will get the reward for her giving, and her husband will also get the reward for his earning and the storekeeper will also get a similar reward. The acquisition of the reward of none of them will reduce the reward of the others", "source_en": "Sahih al-Bukhari · 2065"}, {"parts": [["n", "عن أَسْمَاءَ، أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "أَنْفِقِي وَلاَ تُحْصِي فَيُحْصِيَ اللَّهُ عَلَيْكِ، وَلاَ تُوعِي فَيُوعِيَ اللَّهُ عَلَيْكِ"]], "source": "صحيح البخاري · ٢٥٩١", "english": "Narrated Asma:Allah's Messenger (ﷺ) said, \"Give (in charity) and do not give reluctantly lest Allah should give you in a limited amount; and do not withhold your money lest Allah should withhold it from you", "source_en": "Sahih al-Bukhari · 2591"}, {"parts": [["n", "عن عَبْدِ اللَّهِ بْنِ جَعْفَرٍ، قَالَ لَمَّا جَاءَ نَعْىُ جَعْفَرٍ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "اصْنَعُوا لآلِ جَعْفَرٍ طَعَامًا. فَقَدْ أَتَاهُمْ مَا يَشْغَلُهُمْ أَوْ أَمْرٌ يَشْغَلُهُمْ"]], "source": "سنن ابن ماجه · ١٦١٠ · حسن عند الألباني", "english": "It was narrated that ‘Abdullah bin Ja’far said:“When news of the death of Ja’far was brought, the Messenger of Allah (ﷺ) said: ‘Prepare food for the family of Ja’far, for there has come to them that which is keeping them busy or something which is keeping them busy.”", "source_en": "Sunan Ibn Majah · 1610"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ رضى الله عنه أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "إِذَا قَالَ الإِمَامُ سَمِعَ اللَّهُ لِمَنْ حَمِدَهُ. فَقُولُوا اللَّهُمَّ رَبَّنَا لَكَ الْحَمْدُ، فَإِنَّهُ مَنْ وَافَقَ قَوْلُهُ قَوْلَ الْمَلاَئِكَةِ، غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ"]], "source": "صحيح البخاري · ٣٢٢٨", "english": "Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"When the Imam, during the prayer, says, \"Allah hears him who praises Him', say: 'O Allah! Our Lord! All the praises are for You/, for if the saying of anyone of you coincides with the saying of the angels, his past sins will be forgiven", "source_en": "Sahih al-Bukhari · 3228"}, {"parts": [["n", "عن سَعْدِ بْنِ أَبِي وَقَّاصٍ، عَنْ رَسُولِ اللَّهِ ﷺ قَالَ"], ["q", "مَنْ قَالَ حِينَ يَسْمَعُ الْمُؤَذِّنَ وَأَنَا أَشْهَدُ أَنْ لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ وَأَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ رَضِيتُ بِاللَّهِ رَبًّا وَبِمُحَمَّدٍ رَسُولاً وَبِالإِسْلاَمِ دِينًا غُفِرَ لَهُ ذَنْبُهُ"]], "source": "جامع الترمذي · ٢١٠ · حسن صحيح", "english": "Sa'd bin Abi Waqqas narrated that :Allah's Messenger said: \"Whoever says, when he hears the Mu'adh-dhin: (Wa Ana Ashadu An La Ilaha Illallah, Wahdahu La Sharika Lahu, Wa Anna Muhammadan Abduhu Wa Rasuluhu, Radittu Billahi Rabban Wa Bil-Islam Dinan, Wa Bi Muhammadin Rasulan) 'I too testify that none has the right to be worshiped but Allah, Alone without partners, and that Muhammad is His slave and Messenger, I am pleased with Allah as my Lord, with Islam as my religion and Muhammad as a Messenger.' - Allah will pardon his sins for him", "source_en": "Jami at-Tirmidhi · 210"}, {"parts": [["n", "عن ابْنِ عُمَرَ، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "إِنَّ مِنَ الشَّجَرِ شَجَرَةً لاَ يَسْقُطُ وَرَقُهَا، وَإِنَّهَا مَثَلُ الْمُسْلِمِ، حَدِّثُونِي مَا هِيَ"]], "source": "صحيح البخاري · ٦٢", "english": "Narrated Ibn `Umar:The Prophet (ﷺ) said, \"Amongst the trees, there is a tree, the leaves of which do not fall and is like a Muslim. Tell me the name of that tree.\" Everybody started thinking about the trees of the desert areas. And I thought of the date-palm tree. The others then asked, \"Please inform us what is that tree, O Allah's Messenger (ﷺ)?\" He replied, \"It is the date-palm tree", "source_en": "Sahih al-Bukhari · 62"}, {"parts": [["n", "عن كَعْبِ بْنِ عُجْرَةَ، عَنْ رَسُولِ اللَّهِ ﷺ قَالَ"], ["q", "مُعَقِّبَاتٌ لاَ يَخِيبُ قَائِلُهُنَّ - أَوْ فَاعِلُهُنَّ - دُبُرَ كُلِّ صَلاَةٍ مَكْتُوبَةٍ ثَلاَثٌ وَثَلاَثُونَ تَسْبِيحَةً وَثَلاَثٌ وَثَلاَثُونَ تَحْمِيدَةً وَأَرْبَعٌ وَثَلاَثُونَ تَكْبِيرَةً"]], "source": "صحيح مسلم · ٥٩٦", "english": "Ibn 'Abbas reported that he spent a night at the house of the Messenger of Allah (ﷺ), The Apostle of Allah (way peace be upon him) got up for prayer in the latter part of the night. He went out and looked towards the sky and then recited this verse (190th) of AI-i-'Imran:\" Verily in the creation of the heavens and the earth and the alternation of night and day.\" up to the (words)\" save us from the torment of Hell.\" He then returned to his house, used the tooth-stick, performed the ablution, and then got up and offered the prayer. He than lay down on the bed. and again got up and went out and looked towards the sky and recited this verse (mentioned above), then returned, used the tooth-stick, performed ablution and again offered the prayer", "source_en": "Sahih Muslim · 596"}, {"parts": [["n", "عن كَانَ النَّبِيُّ ﷺ لَيَقُومُ لِيُصَلِّيَ حَتَّى تَرِمُ قَدَمَاهُ أَوْ سَاقَاهُ، فَيُقَالُ لَهُ فَيَقُولُ"], ["q", "أَفَلاَ أَكُونُ عَبْدًا شَكُورًا"]], "source": "صحيح البخاري · ١١٣٠", "english": "Narrated Al-Mughira:The Prophet (ﷺ) used to stand (in the prayer) or pray till both his feet or legs swelled. He was asked why (he offered such an unbearable prayer) and he said, \"Should I not be a thankful slave?", "source_en": "Sahih al-Bukhari · 1130"}, {"parts": [["n", "عن عَائِشَةَ رضى الله عنها أَنَّهَا قَالَتْ سُئِلَ النَّبِيُّ ﷺ أَىُّ الأَعْمَالِ أَحَبُّ إِلَى اللَّهِ قَالَ"], ["q", "أَدْوَمُهَا وَإِنْ قَلَّ"], ["n", "وَقَالَ"], ["q", "اكْلَفُوا مِنَ الأَعْمَالِ مَا تُطِيقُونَ"]], "source": "صحيح البخاري · ٦٤٦٥", "english": "Narrated `Aisha:The Prophet (ﷺ) was asked, \"What deeds are loved most by Allah?\" He said, \"The most regular constant deeds even though they may be few.\" He added, 'Don't take upon yourselves, except the deeds which are within your ability", "source_en": "Sahih al-Bukhari · 6465"}, {"parts": [["n", "عن أُمِّ سَلَمَةَ، قَالَتْ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "إِذَا حَضَرْتُمُ الْمَرِيضَ أَوِ الْمَيِّتَ فَقُولُوا خَيْرًا فَإِنَّ الْمَلاَئِكَةَ يُؤَمِّنُونَ عَلَى مَا تَقُولُونَ"], ["n", "قَالَتْ فَلَمَّا مَاتَ أَبُو سَلَمَةَ أَتَيْتُ النَّبِيَّ ﷺ فَقُلْتُ يَا رَسُولَ اللَّهِ إِنَّ أَبَا سَلَمَةَ قَدْ مَاتَ قَالَ"], ["q", "قُولِي اللَّهُمَّ اغْفِرْ لِي وَلَهُ وَأَعْقِبْنِي مِنْهُ عُقْبَى حَسَنَةً"]], "source": "صحيح مسلم · ٩١٩", "english": "A hadith like this is transmitted by Ma'mar from Hammam b. Munabbih on the authority of Abu Huraira who reported it from the Messenger of Allah (ﷺ)", "source_en": "Sahih Muslim · 919"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ ﷺ وَقَفَ عَلَى أُنَاسٍ جُلُوسٍ فَقَالَ"], ["q", "أَلاَ أُخْبِرُكُمْ بِخَيْرِكُمْ مِنْ شَرِّكُمْ"]], "source": "جامع الترمذي · ٢٢٦٣ · حسن صحيح", "english": "Abu Hurairah narrated that the Messenger of Allah(s.a.w) came across some people who were sitting, so he said:'Shall I not inform you of the best of you from your worst?'\" He said: \"They became silent, so he said that three times, then a man said: 'Of course, O Messenger of Allah! Inform us of the best among us from our worst.' He said: 'The best of you is the one whose goodness is hoped for, and people are safe from his evil. And the worst of you is he whose goodness is not hoped for, and people are not  أُكْلَتَيْنِ، فَإِنَّهُ وَلِيَ عِلاَجَهُ"]], "source": "صحيح البخاري · ٢٥٥٧", "english": "Narrated Abu Huraira:The Prophet (ﷺ) said, \"When your servant brings your meals to you then if he does not let him sit and share the meals, then he should at least give him a mouthful or two mouthfuls of that meal or a meal or two meals, as he has prepared it", "source_en": "Sahih al-Bukhari · 2557"}, {"parts": [["n", "عن أَبِي، هُرَيْرَةَ عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "إِذَا قَامَ أَحَدُكُمْ مِنَ اللَّيْلِ فَلْيَفْتَتِحْ صَلاَتَهُ بِرَكْعَتَيْنِ خَفِيفَتَيْنِ"]], "source": "صحيح مسلم · ٧٦٨", "english": "Abd al-Rahman, the son of Abu Sa'id al-Khudri, reported from his father:The Messenger of Allah (ﷺ) said: A man should not see the private parts of another man, and a woman should not see the private parts of another woman, and a man should not lie with another man under one covering, and a woman should not lie with another woman under one covering", "source_en": "Sahih Muslim · 768"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "لاَ يَقُولَنَّ أَحَدُكُمْ عَبْدِي وَأَمَتِي. كُلُّكُمْ عَبِيدُ اللَّهِ وَكُلُّ نِسَائِكُمْ إِمَاءُ اللَّهِ وَلَكِنْ لِيَقُلْ غُلاَمِي وَجَارِيَتِي وَفَتَاىَ وَفَتَاتِي"]], "source": "صحيح مسلم · ٢٢٤٩", "english": "A hadith like this has been narrated by Suhail with the same chain of transmitters", "source_en": "Sahih Muslim · 2249"}, {"parts": [["n", "عن الْمُغِيرَةَ بْنَ شُعْبَةَ، يَقُولُ انْكَسَفَتِ الشَّمْسُ يَوْمَ مَاتَ إِبْرَاهِيمُ، فَقَالَ النَّاسُ انْكَسَفَتْ لِمَوْتِ إِبْرَاهِيمَ. فَقَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "إِنَّ الشَّمْسَ وَالْقَمَرَ آيَتَانِ مِنْ آيَاتِ اللَّهِ، لاَ يَنْكَسِفَانِ لِمَوْتِ أَحَدٍ وَلاَ لِحَيَاتِهِ، فَإِذَا رَأَيْتُمُوهُمَا فَادْعُوا اللَّهَ وَصَلُّوا حَتَّى يَنْجَلِيَ"]], "source": "صحيح البخاري · ١٠٦٠", "english": "Narrated Al-Mughira bin Shu`ba:On the day of Ibrahim's death, the sun eclipsed and the people said that the eclipse was due to the death of Ibrahim (the son of the Prophet). Allah's Messenger (ﷺ) said, \"The sun and the moon are two signs amongst the signs of Allah. They do not eclipse because of someone's death or life. So when you see them, invoke Allah and pray till the eclipse is clear", "source_en": "Sahih al-Bukhari · 1060"}, {"parts": [["n", "عن أَبِي مُوسَى، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "الْخَازِنُ الْمُسْلِمُ الأَمِينُ الَّذِي يُنْفِذُ وَرُبَّمَا قَالَ يُعْطِي مَا أُمِرَ بِهِ كَامِلاً مُوَفَّرًا طَيِّبٌ بِهِ نَفْسُهُ، فَيَدْفَعُهُ إِلَى الَّذِي أُمِرَ لَهُ بِهِ، أَحَدُ الْمُتَصَدِّقَيْنِ"]], "source": "صحيح البخاري · ١٤٣٨", "english": "Narrated Abu Musa:The Prophet (ﷺ) said, \"An honest Muslim storekeeper who carries out the orders of his master and pays fully what he has been ordered to give with a good heart and pays to that person to whom he was ordered to pay, is regarded as one of the two charitable persons", "source_en": "Sahih al-Bukhari · 1438"}, {"parts": [["n", "عن عَاصِمِ بْنِ لَقِيطِ بْنِ صَبِرَةَ، عَنْ أَبِيهِ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "أَسْبِغِ الْوُضُوءَ وَخَلِّلْ بَيْنَ الأَصَابِعِ"]], "source": "سنن ابن ماجه · ٤٤٨ · صحيح عند الألباني", "english": "Asim bin Laqit bin Saabirah narrated that his father said:\"The Messenger of Allah said: perform ablution properly and let the water run between your fingers", "source_en": "Sunan Ibn Majah · 448"}, {"parts": [["n", "عن أبي سَعِيدٍ الْخُدْرِيَّ رضى الله عنه حَدَّثَهُ قَالَ قِيلَ يَا رَسُولَ اللَّهِ، أَىُّ النَّاسِ أَفْضَلُ فَقَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "مُؤْمِنٌ يُجَاهِدُ فِي سَبِيلِ اللَّهِ بِنَفْسِهِ وَمَالِهِ"], ["n", "قَالُوا ثُمَّ مَنْ قَالَ"], ["q", "مُؤْمِنٌ فِي شِعْبٍ مِنَ الشِّعَابِ يَتَّقِي اللَّهَ، وَيَدَعُ النَّاسَ مِنْ شَرِّهِ"]], "source": "صحيح البخاري · ٢٧٨٦", "english": "Narrated Abu Sa`id Al-Khudri:Somebody asked, \"O Allah's Messenger (ﷺ)! Who is the best among the people?\" Allah's Messenger (ﷺ) replied \"A believer who strives his utmost in Allah's Cause with his life and property.\" They asked, \"Who is next?\" He replied, \"A believer who stays in one of the mountain paths worshipping Allah and leaving the people secure from his mischief", "source_en": "Sahih al-Bukhari · 2786"}, {"parts": [["n", "عن عَبْدِ اللَّهِ بْنِ عُمَرَ رضى الله عنهما أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "مَا حَقُّ امْرِئٍ مُسْلِمٍ لَهُ شَىْءٌ، يُوصِي فِيهِ يَبِيتُ لَيْلَتَيْنِ، إِلاَّ وَوَصِيَّتُهُ مَكْتُوبَةٌ عِنْدَهُ"]], "source": "صحيح البخاري · ٢٧٣٨", "english": "Narrated `Abdullah bin `Umar:Allah's Messenger (ﷺ) said, \"It is not permissible for any Muslim who has something to will to stay for two nights without having his last will and testament written and kept ready with him", "source_en": "Sahih al-Bukhari · 2738"}, {"parts": [["n", "عن ابْنِ عُمَرَ، أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "لاَ تَمْنَعُوا إِمَاءَ اللَّهِ مَسَاجِدَ اللَّهِ"]], "source": "صحيح مسلم · ٤٤٢", "english": "Masruq reported:I said to 'A'isha: What about the words of Allah:\" Then he drew nigh and came down, so he was at a distance of two bows or closer still: so He revealed to His servant what He revealed\" (al-Qur'an, liii. 8-10)? She said: It implies Gabriel. He used to come to him (the Holy Prophet) in the shape of men; but he came at this time in his true form and blocked up the horizon of the sky", "source_en": "Sahih Muslim · 442"}, {"parts": [["n", "عن الْحَسَنُ عَلَّمَنِي رَسُولُ اللَّهِ ﷺ كَلِمَاتٍ أَقُولُهُنَّ فِي الْوَتْرِ فِي الْقُنُوتِ"], ["q", "اللَّهُمَّ اهْدِنِي فِيمَنْ هَدَيْتَ وَعَافِنِي فِيمَنْ عَافَيْتَ وَتَوَلَّنِي فِيمَنْ تَوَلَّيْتَ وَبَارِكْ لِي فِيمَا أَعْطَيْتَ وَقِنِي شَرَّ مَا قَضَيْتَ إِنَّكَ تَقْضِي وَلاَ يُقْضَى عَلَيْكَ وَإِنَّهُ لاَ يَذِلُّ مَنْ وَالَيْتَ تَبَارَكْتَ رَبَّنَا وَتَعَالَيْتَ"]], "source": "سنن النسائي · ١٧٤٥ · صحيح عند الألباني", "english": "It was narrated that Abu Al-Jawza said:\"Al-Hasan said: \"The Messenger of Allah (ﷺ) taught me some words to say in witr in Qunut: Allahumma ihdini fiman hadayta wa 'afini fiman afayta wa tawallani fiman tawallayta wa barik li fima a'tayta, wa qini sharra ma qadayta, fa innaka taqdi wa la yuqda 'alayk, wa innahu la yadhilluman walayta, tabarakta Rabbana wa at'alayt (O Allah, guide me among those whom You have guided, pardon me among those You have pardoned, turn to me in friendship among those on whom You have turned in friendship, and bless me in what You have bestowed, and save me from the evil of what You have decreed. For verily You decree and none can influence You; and he is not humiliated whom You have befriended. Blessed are You, O Lord, and Exalted)", "source_en": "Sunan an-Nasa'i · 1745"}];   // assets/shared/hadith.json, through src/build.py
// the text's size steps down with its length (characters): up to 180 as it was, then three smaller steps
const quoteSize = n => n > 420 ? ' q3' : n > 300 ? ' q2' : n > 180 ? ' q1' : '';
// the tafsir cut at a word, «…» after it, until it fits three lines (the build already limits its length); on a card
// that is already full (a long verse on a small screen) fewer lines, none at all if not even one fits
function fitTafsir(ul){
  const el = ul.querySelector('li.tafsir');
  if(!el) return;
  const full = el.textContent.replace(/…$/, ''), words = full.split(' '), was = el.textContent !== full;
  const card = ul.closest('.week'), bar = document.querySelector('.bottom');
  const lines = () => Math.round(el.getBoundingClientRect().height / parseFloat(getComputedStyle(el).lineHeight));
  const crowded = () => { const c = card.getBoundingClientRect(); return c.height > .42 * innerHeight || c.bottom > bar.getBoundingClientRect().top - 4; };
  for(let max = 3; max > 0; max--){
    let n = words.length;
    el.textContent = full + (was ? '…' : '');
    while(lines() > max && n > 1){
      n--;
      el.textContent = words.slice(0, n).join(' ').replace(/[\s،,:؛.]+$/, '') + '…';
    }
    if(!crowded()) return;
  }
  el.remove();
}
// A card in a small place (the launcher's second or third) asks for a text no longer than card.maxLen: the first that short from the
// day's own, going on from it; none that short, the shortest.
function pickShort(list, at, len, card){
  card = card || {};
  card.len = len(list[at % list.length]);
  if(!card.maxLen) return list[at % list.length];
  let best = list[at % list.length];
  for(let k = 0; k < list.length; k++){
    const x = list[(at + k) % list.length];
    if(len(x) <= card.maxLen){ best = x; break; }
    if(len(x) < len(best)) best = x;
  }
  card.len = len(best);
  return best;
}
function quoteOfDay(card){
  const n = riyadhDayNumber(), half = Math.floor(n / 2);

    const v = pickShort(verses.length ? verses : VERSES, half, x => x.text.length + (EN ? (x.english || '').length : 0), card);
    if(EN && v.english) return {title:'Verse of the day', rows:[
      `<li class="quote quran bilingual${quoteSize(v.text.length)}" lang="ar" dir="rtl"><span class="orn">﴿</span><span class="qt">${esc(v.text)}</span><span class="orn">﴾</span></li>`,
      `<li class="translation" lang="en">${esc(v.english)}</li>`,
      `<li class="src bilingual">${esc(v.surah_en)} · ${v.ayah} · ${esc(v.translator)}</li>`]};
    return {title:'آية اليوم', rows:[`<li class="quote quran${v.text.length > 330 ? ' q4' : quoteSize(v.text.length)}"><span class="orn">﴿</span><span class="qt">${esc(v.text)}</span><span class="orn">﴾</span></li>`, `<li class="src">${esc(v.surah)} · ${ar(v.ayah)}</li>`]
      .concat(CONFIG.tafsir && v.tafsir ? [`<li class="tafsir">${esc(v.tafsir)}</li>`] : [])};
  }
  const translated = EN ? HADITH.filter(x => x.english && x.source_en && x.english.length <= 350) : HADITH;
  const list = translated.length ? translated : HADITH;
  const h = pickShort(list, half, x => x.parts.reduce((m, [, t]) => m + t.length, 0) + (EN ? (x.english || '').length : 0), card);

    `<li class="src bilingual">${esc(h.source_en)}</li>`]};
  return {title:'حديث اليوم', rows:[`<li class="quote hadith${quoteSize(h.parts.reduce((n, [, t]) => n + t.length, 0))}">${body}</li>`, `<li class="src">${esc(h.source)}</li>`]};

// the adhkar's place in a card: card.ad = {i: which, t: the timer, mode: morning|evening|night, n: how many}
function adhkarWindow(){
  if(!DAY_TIMES) return '';
  const p = riyadhParts(), now = p.h * 60 + p.mi;
  const at = k => { const [h, mi] = String(DAY_TIMES[k]).split(':').map(Number); return h * 60 + mi; };
  if(now >= at('Fajr') && now < at('Dhuhr')) return 'morning';
  if(now >= at('Asr') && now < at('Maghrib')) return 'evening';
  if(now >= at('Isha') || now < at('Fajr')) return 'night';   // after midnight it is still the night before
  return '';
}
function adhkarNext(card){
  card.ad.t = 0;
  card.ad.i++;
  renderCard(card, card.ad.n > 1);
  fitCards();
}
function adhkarCard(card){
  const ad = card.ad, mode = adhkarWindow(), list = mode ? ADHKAR.filter(d => d.when === mode || (d.when === 'both' && mode !== 'night')) : [];
  if(!list.length){
    clearTimeout(ad.t); ad.t = 0; ad.mode = '';
    return quoteOfDay(card);
  }
  if(mode !== ad.mode){ ad.mode = mode; ad.i = 0; clearTimeout(ad.t); ad.t = 0; }
  let i = ad.i % list.length;
  // a card in a small place skips the dhikr that is too long for it (card.maxLen), if a shorter one follows
  if(card.maxLen) for(let k = 0; k < list.length && list[i].text.length > card.maxLen; k++){ ad.i++; i = ad.i % list.length; }
  const d = list[i];
  card.len = d.text.length;
  ad.n = list.length;
  if(!ad.t) ad.t = setTimeout(() => adhkarNext(card), Math.min(60, 20 + .1 * d.text.length) * 1000);
  const dots = Math.min(list.length, 12), on = Math.floor(i * dots / list.length);
  const text = d.quran ? `<span class="orn">﴿</span><span class="qt">${esc(d.text)}</span><span class="orn">﴾</span>` : esc(d.text);
  const [title, until] = ADHKAR_HEAD[mode];
  return {
    title,
    hd: `${ADHKAR_ICON[mode]}<span>${title}</span><span class="until">${until}</span>`,
    rows: [`<li class="quote${d.quran ? ' quran' : ''}${d.text.length > 560 ? ' q4' : quoteSize(d.text.length)}">${text}</li>`,   // harakat make a dhikr long: one more step
           `<li class="adf"><span class="s">${esc(ar(d.virtue ? `${d.virtue.text} · ${d.virtue.source.replace(' · ', ' ')}` : d.source))}</span><span class="c">${ADHKAR_COUNT[d.count] || ar(d.count) + ' مرة'}</span>`
           + `<span class="d">${Array.from({length: dots}, (_, k) => k === on ? '<i class="on"></i>' : '<i></i>').join('')}</span></li>`],
  };
}

// When the current reading was fetched, and the last dust reading (µg/m³): both are kept on the device. A reading older than 3 hours is
// not shown as «now» (the temperature, the word and the day's range at the top left go blank until a new one arrives).
const WX_STALE_MS = 3*3600000;
let WX = {at: 0, pm: 0, pmAt: 0};
try{ WX = Object.assign(WX, JSON.parse(localStorage.getItem(LS.wx) || '{}')); }catch(e){}
const saveWx = () => { try{ localStorage.setItem(LS.wx, JSON.stringify(WX)); }catch(e){} };
function wxExpire(){

  ['wx-temp', 'wx-desc', 'wx-range'].forEach(id => { const el = document.getElementById(id); if(el){ setText(el, ''); el.classList.remove('dust'); } });
}
async function loadWeather(){
  const q = `latitude=${CONFIG.latitude}&longitude=${CONFIG.longitude}&timezone=${encodeURIComponent(CONFIG.timezone)}`;
  try{
    // the hours card asks in the same request: its hourly values, and sunrise and sunset for the day or night icon
    const hours = USES('hourly');
    const r = await fetchT(`https://api.open-meteo.com/v1/forecast?${q}&current=temperature_2m,weather_code`
                         + `&daily=temperature_2m_max,temperature_2m_min,weather_code${hours ? ',sunrise,sunset' : ''}&forecast_days=5`
                         + (hours ? '&hourly=temperature_2m,weather_code' : ''), 12000);
    if(!r.ok) throw 0;
    const j = await r.json();
    WX.at = Date.now(); saveWx();
    setText(document.getElementById('wx-temp'), ar(Math.round(j.current.temperature_2m)) + '°');
    const d = document.getElementById('wx-desc');
    setText(d, WX_CODES[j.current.weather_code] || '');
    d.classList.remove('dust');
    const hi = j.daily?.temperature_2m_max?.[0], lo = j.daily?.temperature_2m_min?.[0];
    setText(document.getElementById('wx-range'),
      (hi != null && lo != null) ? `${ar(Math.round(hi))}° / ${ar(Math.round(lo))}°` : '');
    const dl = j.daily || {};
    FORECAST = (dl.time || []).map((t, i) => ({date:t, code:dl.weather_code?.[i],
      hi:dl.temperature_2m_max?.[i], lo:dl.temperature_2m_min?.[i]})).filter(x => x.hi != null && x.lo != null);
    try{ localStorage.setItem(LS.forecast, JSON.stringify(FORECAST)); }catch(e){}
    if(hours){
      const hr = j.hourly || {}, from = hourKey();
      HOURLY = (hr.time || []).map((t, i) => ({t, code:hr.weather_code?.[i], temp:hr.temperature_2m?.[i]})).filter(x => x.t > from && x.temp != null).slice(0, 12);
      SUN = {};
      (dl.time || []).forEach((d, i) => { const up = dl.sunrise?.[i], down = dl.sunset?.[i]; if(up && down) SUN[d] = [up.slice(11, 16), down.slice(11, 16)]; });
      try{ localStorage.setItem(LS.hourly, JSON.stringify({h:HOURLY, s:SUN})); }catch(e){}
    }
    renderPanel(false, 'forecast', 'hourly');
    if(slotNow() === 'weather') renderSlot();
  }catch(e){ return; }   // keep the last reading; with none only the city shows

  // dust overrides the condition word: PM10 in µg/m³
  try{
    const r = await fetchT(`https://air-quality-api.open-meteo.com/v1/air-quality?${q}&current=pm10,dust`, 12000);
    if(!r.ok) throw 0;

}

// night dimming: transparent by day, dark after 21:00 and before 07:00
function applyNight(){
  const p = riyadhParts();
  const h = p.h + p.mi/60;
  const MAX = 0.46;
  let o = 0;
  if(h >= 23 || h < 5)      o = MAX;
  else if(h >= 21)          o = MAX * (h - 21) / 2;
  else if(h < 7)            o = MAX * (7 - h) / 2;
  const el = document.getElementById('dimmer');
  const v = Math.max(0, Math.min(MAX, o)).toFixed(2);
  if(el && el.style.opacity !== v) el.style.opacity = v;
}

// gentle pixel shift so static text never burns into the panel
const SHIFT_SEQ = [[0,0],[3,2],[0,4],[-3,2],[-3,-2],[0,-4],[3,-2]];
let shiftTick = 0;
function pixelShift(){
  shiftTick = (shiftTick + 1) % SHIFT_SEQ.length;
  const [dx,dy] = SHIFT_SEQ[shiftTick];
  const st = document.querySelector('.stage');
  if(st) st.style.transform = `translate(${dx}px,${dy}px)`;
}

let REVEALED = false;
function reveal(){

  REVEALED = true;
  // fonts may still be arriving (tv.html loads them as files): wait for them, briefly
  const fonts = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
  Promise.race([fonts, new Promise(r => setTimeout(r, 800))])
    .then(() => document.documentElement.classList.add('ready'));
}

function showBackground(url, b){
  const ph = document.querySelector('.photo');
  reveal();
  if(!ph) return;
  const next = "url('" + url + "')";
  if(ph.style.backgroundImage === next) return;   // same photo: no reload, no new movement
  ph.style.backgroundImage = next;
  ph.style.setProperty('--dim', (1 - (b.d || 0.95)).toFixed(2));
  ph.classList.remove('settle'); void ph.offsetWidth; ph.classList.add('settle');

// ---- card style blur: a copy of the photo behind the card, blurred once per photo, never a live backdrop-filter ----
// Made only after the photo has settled (it drifts for 60 s, then holds still) and thrown away when the photo
// changes, so nothing repaints while the screen is idle. Any failure leaves the card on its plain tint.
const CARD_FILTER = {   // blur px, then the CSS filter functions, as in the approved designs
  dark1:[6,'saturate(140%)'], glass1:[9,'saturate(170%) brightness(.62)'],
  dark3:[6,'saturate(140%)'], glass3:[9,'saturate(160%) brightness(.55)'],
};
const CARD = {cv:null, t:0, url:'', since:0};
function cardRelease(){
  clearTimeout(CARD.t); CARD.t = 0;
  if(CARD.cv){ CARD.cv.width = 0; CARD.cv.remove(); CARD.cv = null; }
}
function cardBlurLater(url){
  CARD.url = url; CARD.since = Date.now();
  cardRelease();
  if(!CARD_FILTER[CONFIG.cardStyle]) return;
  const calm = !window.matchMedia || matchMedia('(prefers-reduced-motion: no-preference)').matches;   // else it never drifts
  CARD.t = setTimeout(cardBlurNow, calm ? 61000 : 0);
}
function cardBlurNow(){
  CARD.t = 0;
  const f = CARD_FILTER[CONFIG.cardStyle], card = document.querySelector('.week'), url = CARD.url;
  if(!f || !card || !url || CONFIG.panel === 'none') return;
  try{
    const img = new Image();
    img.onload = () => {
      try{
        if(url !== CARD.url || CARD.cv) return;   // the photo changed while this loaded
        const W = innerWidth, H = innerHeight, r = card.getBoundingClientRect(), K = .25;   // a quarter size is plenty under a blur
        const [sx, sy] = SHIFT_SEQ[shiftTick];   // the stage's burn-in shift moves the card, not the photo
        const cv = document.createElement('canvas');
        cv.width = Math.max(1, Math.round(r.width * K)); cv.height = Math.max(1, Math.round(r.height * K));
        const g = cv.getContext('2d');
        const patch = () => g.setTransform(K, 0, 0, K, -(r.left - sx) * K, -(r.top - sy) * K);   // canvas = the card's patch of the screen
        patch();
        if(g.filter !== undefined) g.filter = `blur(${f[0] * K}px) ${f[1]}`;
        // where .photo draws it: cover, centred at 26%, then its final scale(1.03) about the centre
        const iw = img.naturalWidth, ih = img.naturalHeight, s = Math.max(W / iw, H / ih), dw = iw * s, dh = ih * s;
        g.translate(W / 2, H / 2); g.scale(1.03, 1.03); g.translate(-W / 2, -H / 2);
        g.drawImage(img, (W - dw) * .5, (H - dh) * .26, dw, dh);
        g.filter = 'none';
        patch();
        g.fillStyle = `rgba(0,0,0,${document.querySelector('.photo').style.getPropertyValue('--dim') || .05})`;   // the photo's own darkness
        g.fillRect(0, 0, W, H);
        const v = g.createLinearGradient(0, 0, 0, H);   // the vertical part of .veil, the part that reaches the card
        v.addColorStop(0, 'rgba(3,10,7,.62)'); v.addColorStop(.22, 'rgba(3,10,7,.30)'); v.addColorStop(.46, 'rgba(3,10,7,.12)');
        v.addColorStop(.74, 'rgba(3,10,7,.42)'); v.addColorStop(1, 'rgba(2,6,4,.88)');
        g.fillStyle = v; g.fillRect(0, 0, W, H);
        g.translate(.22 * W, .34 * H); g.scale(1.2 * W, .85 * H);   // and its soft shade at 22% 34%
        const rg = g.createRadialGradient(0, 0, 0, 0, 0, 1);
        rg.addColorStop(0, 'rgba(3,14,9,.42)'); rg.addColorStop(.58, 'rgba(3,14,9,0)');
        g.fillStyle = rg; g.fillRect(-1, -1, 2, 2);
        cv.className = 'bl';
        card.insertBefore(cv, card.firstChild);
        CARD.cv = cv;
        requestAnimationFrame(() => requestAnimationFrame(() => cv.classList.add('on')));
      }catch(e){ cardRelease(); }
      img.onload = null; img.src = '';
    };
    img.src = url;
  }catch(e){}
}
// a resized screen moves the card over the photo: draw the copy again (at once, the photo has settled)
let CARD_RESIZE = 0;
addEventListener('resize', () => {
  clearTimeout(CARD_RESIZE);
  CARD_RESIZE = setTimeout(() => {
    if(!CARD_FILTER[CONFIG.cardStyle] || !CARD.url) return;
    const wait = Math.max(0, 61000 - (Date.now() - CARD.since));
    cardRelease();
    CARD.t = setTimeout(cardBlurNow, wait);
  }, 400);
});

// Every 4 days a new random set of 5 hosted photos (same draw as the launcher: Park-Miller generator seeded
// by the 4-day period), rotating every CONFIG.photoMinutes (30 unless the owner changed it). Only the photo on screen is downloaded.
const PHOTO_SET = 5, PHOTO_PERIOD_DAYS = 4;
function riyadhDayNumber(){
  const p = riyadhParts();
  return Math.floor(Date.UTC(p.y, p.mo - 1, p.d) / 86400000);
}
function photoSet(n){
  const period = Math.floor(riyadhDayNumber() / PHOTO_PERIOD_DAYS);
  let seed = (period % 2147483646) + 1;
  const pick = [];
  for(let guard = 0; pick.length < Math.min(PHOTO_SET, n) && guard < 1000; guard++){
    seed = (seed * 48271) % 2147483647;
    const k = seed % n;
    if(!pick.includes(k)) pick.push(k);
  }
  return pick;
}
// One of the owner's photos is due. The app answers it from disk, yet on a cold start that can take more than the 1.2 s the page gives
// a hosted photo, and a photo of ours must not show first (only) or in its place (mix). So it is waited for, up to OWN_WAIT_MS; one that
// fails gives way to the next of theirs; none loads, or none in time: a bundled one, so the screen is never empty (theirs still replace
// it when they arrive).
const OWN_WAIT_MS = 6000;
let BG_SLOT = -1, PREFETCHED = false, BG_TURN = 0;
function showOwn(pick, own, local){
  const at = own.indexOf(pick), order = own.slice(at).concat(own.slice(0, at)), turn = ++BG_TURN;
  const bundled = () => { if(turn === BG_TURN && !document.querySelector('.photo').style.backgroundImage) showBackground(local.u, local); };
  const t = setTimeout(bundled, OWN_WAIT_MS);
  const next = i => {
    if(i >= order.length){ clearTimeout(t); bundled(); return; }
    const img = new Image();
    img.onload = () => { clearTimeout(t); if(turn === BG_TURN) showBackground(order[i].url, order[i].b); };
    img.onerror = () => next(i + 1);
    img.src = order[i].url;
  };
  next(0);
}
function applyBackground(force){
  try {
    const p = riyadhParts();
    const slotMin = CONFIG.photoMinutes;   // divides 1440, so slots count on across midnight
    const slot = riyadhDayNumber() * (1440 / slotMin) + Math.floor((p.h * 60 + p.mi) / slotMin);
    if(slot === BG_SLOT && !force) return;
    BG_SLOT = slot; BG_TURN++;   // a photo of theirs still on its way for an earlier turn is dropped
    const only = OWN_ONLY(), own = ownPhotos();
    const set = !only && REMOTE_BGS.length ? photoSet(REMOTE_BGS.length).map(k => REMOTE_BGS[k]) : [];
    const local = BGS[slot % BGS.length];
    // what rotates: ours (the hosted set, else the bundled photos once the owner has some), then the owner's; only = theirs alone
    let pool = own;
    if(!only){
      const ours = set.length ? set.map(b => ({url: PHOTO_BASE + b.f, b})) : own.length ? BGS.map(b => ({url: b.u, b, bundled: true})) : [];
      pool = ours.concat(own);
    }
    if(!pool.length){ showBackground(local.u, local); return; }
    const pick = pool[slot % pool.length], url = pick.url, b = pick.b;
    if(own.includes(pick)){ showOwn(pick, own, local); return; }
    if(pick.bundled){ showBackground(url, b); return; }
    // First photo: wait briefly for the hosted one (the app serves it from disk at once) so the screen
    // doesn't flash a bundled photo first; slow network → bundled one, swapped when the hosted one arrives.
    let done = false;
    const fallback = () => { if(!done && !document.querySelector('.photo').style.backgroundImage) showBackground(local.u, local); };
    const t = setTimeout(fallback, 1200);
    const img = new Image();
    img.onload = () => { done = true; clearTimeout(t); showBackground(url, b); };
    img.onerror = () => { clearTimeout(t); fallback(); done = true; };
    img.src = url;
    // fetch the rest of the set once, quietly, so the app has each one on disk before its turn
    if(!PREFETCHED && set.length){ PREFETCHED = true; setTimeout(() => set.forEach(x => { new Image().src = PHOTO_BASE + x.f; }), 20000); }
  } catch(e) {}
}

// Last painted panels, shown at once on the next start while fresh data loads.
const SNAP_KEY = LS.snap;   // 'snap6:' + the link; bump when the panels' markup changes
const SNAP_SEL = ['.markets', '#match-row'];
let SNAP_LAST = null;   // what is stored now: the panels rarely change, so most saves have nothing to write

// What the cards need to be redrawn on, one place for the screensaver and the launcher: pages turn every 25 s, the clock-driven kinds
// every 15 s (prayers, the row, the hours, the smart card, «يومك»), the windows and markets every minute.
function cardTimers(){
  const clocked = ['prayers', 'hourly', 'prayerrow', 'smart', 'today'];
  setInterval(() => renderPanel(false, ...clocked), 15000);
  setInterval(() => {
    for(const c of CARDS){
      if(c.eff === 'shows' && WEEK_POOL.length > (c.cap || WEEK_ROWS)){ c.page++; renderCard(c, true); }
      else if(c.eff === 'matches'){ c.page++; renderCard(c, matchRows(c).length > (c.cap || MATCH_ROWS)); }
      else if(c.eff === 'stocks' && CONFIG.stocks.length > (c.cap || WEEK_ROWS)){ c.page++; renderCard(c, true); }
      else if(c.eff === 'tasks' && CONFIG.tasks.length > (c.cap || WEEK_ROWS)){ c.page++; renderCard(c, true); }

// Drops what this page no longer needs from localStorage, at boot. Only the families named here are looked at (other keys are not
// this function's to judge): a copy keyed by a whole link, which an older version left behind for each setting change, goes at once;
// a copy for another city, symbol list or link goes after two weeks without being used; of the link-keyed snapshots the newest 6 stay.
const LS_FAMILIES = ['forecast:', 'hourly:', 'wx:', 'stocks:', 'mk:', 'matchesOk:'], LS_IDLE_MS = 14*DAY_MS, LS_SNAPS = 6;
function pruneStorage(){
  try{
    const now = Date.now(), mine = new Set(Object.values(LS));
    let seen = {};
    try{ seen = JSON.parse(localStorage.getItem('lsSeen') || '{}') || {}; }catch(e){}
    mine.forEach(k => { seen[k] = now; });
    const snaps = [];
    localStorage.removeItem('matchesOk');   // (one version kept it for every link at once)
    for(let i = localStorage.length - 1; i >= 0; i--){
      const k = localStorage.key(i);
      if(!k || mine.has(k)) continue;
      const fam = LS_FAMILIES.find(f => k.startsWith(f));
      if(fam && k.charAt(fam.length) === '#'){ localStorage.removeItem(k); delete seen[k]; continue; }   // keyed by a whole link: the old way
      if(fam || k.startsWith('snap6:')){
        if(!seen[k]) seen[k] = now;
        if(now - seen[k] > LS_IDLE_MS){ localStorage.removeItem(k); delete seen[k]; }
        else if(k.startsWith('snap6:')) snaps.push(k);
      }
    }
    snaps.concat(mine.has(LS.snap) ? [LS.snap] : []).sort((a, b) => (seen[b] || 0) - (seen[a] || 0)).slice(LS_SNAPS).forEach(k => {
      if(k !== LS.snap){ localStorage.removeItem(k); delete seen[k]; }
    });
    for(const k in seen) if(localStorage.getItem(k) === null && !mine.has(k)) delete seen[k];
    localStorage.setItem('lsSeen', JSON.stringify(seen));
  }catch(e){}
}

// «يُتلى الآن» (the screensaver only): the app answers window.UrtvNative.nowPlaying() with {"title":"سورة الكهف","who":"ماهر المعيقلي"} while the
// Quran or a station plays in the launcher, and "" otherwise. Asked once at the start and then every minute, and the card goes when the
// answer is empty. The words go in as text. One line: a long one steps down in size (never «…»).
function nowPlayingTick(){
  const card = document.getElementById('np');
  if(!card || CONFIG.widget) return;   // the launcher's cards never carry it
  let s = null;
  try{ const raw = window.UrtvNative && window.UrtvNative.nowPlaying(); s = raw ? JSON.parse(raw) : null; }catch(e){}
  const title = s && typeof s.title === 'string' ? s.title.trim() : '', who = s && typeof s.who === 'string' ? s.who.trim() : '';
  if(!title){ card.hidden = true; return; }
  setText(document.getElementById('np-t'), title);
  setText(document.getElementById('np-w'), who);
  document.getElementById('np-s').hidden = !who;
  card.hidden = false;
  const line = document.getElementById('np-l');
  FIT_STEPS.concat([.64, .56]).find(k => { line.style.fontSize = k === 1 ? '' : k + 'em'; return card.getBoundingClientRect().width <= innerWidth * .42; });
}

function boot(){
  pruneStorage();
  if(CONFIG.widget){ bootWidget(); return; }
  buildCards();
  if(document.fonts) document.fonts.ready.then(() => {   // widths change once the fonts are in
    fitYearStrip();
    fitMatches(document.getElementById('match-row'));
    if(MATCHES_LOADED) CARDS.forEach(c => { if(c.eff === 'matches') c.ul.__h = null; });   // whole names again where they now fit
    renderPanel(false, 'matches');
  });
  if(CONFIG.slot === 'none') document.documentElement.classList.add('slot-none');
  if(!SLOT_MATCHES) document.getElementById('match-row').textContent = '';   // not «لا شيء هذا الأسبوع»: that is the matches slot's
  if(CONFIG.cardStyle !== 'current') document.documentElement.classList.add('cs-' + CONFIG.cardStyle);
  buildMarkets();
  restoreSnap();
  paintMkUp(); wxExpire();
  setTimeout(saveSnap, 15*1000);   // the dream can be killed before pagehide
  setInterval(saveSnap, 60*1000);
  addEventListener('pagehide', saveSnap);
  const wxCity = document.getElementById('wx-city');
  if(wxCity) setText(wxCity, CONFIG.city);
  const cs = document.getElementById('clock-sub');
  if(cs) setText(cs, 'بتوقيت ' + CONFIG.city);
  document.title = EN ? 'UrTV Screen Saver' : 'شاشة تلفزيونك';
  applyBackground(true);
  loadPhotoIndex().then(() => applyBackground(true));
  setInterval(() => applyBackground(false), 60*1000);
  tickClock(); tickDates(); tickOccasion(); renderSlot();
  loadMarkets();
  renderPanel(false, ...CARD_KINDS.filter(k => k !== 'shows'));   // shows: its own data arrives with prayers, weather, matches
  if(NEEDS_MATCHES) loadMatches();
  loadPrayers(); if(USES('shows')) loadWeek(); loadWeather();
  applyNight(); pixelShift();

  nowPlayingTick();
  setInterval(nowPlayingTick, 60*1000);
  setInterval(tickClock, 1000);
  setInterval(()=>{ tickDates(); tickPrayer(); tickOccasion(); wxExpire(); if(!SLOT_MATCHES) renderSlot(); }, 15000);
  if(SLOT_MATCHES){   // the matches timers run only while the slot shows matches
    setInterval(() => renderMatches(false), 60000);
    // 15 s a page (two games), 10 s once a league makes more than 3 pages: a round of 9 games passes in 50 s, not 75
    const turn = () => { renderMatches(true); setTimeout(turn, CONFIG.leagues.length && MATCH_PAGES > 3 ? CONFIG.matchPageFastMs : CONFIG.matchPageMs); };
    setTimeout(turn, CONFIG.matchPageMs);
  }
  if(NEEDS_MATCHES){ periodic(loadLive, 2*60000); periodic(loadMatches, 30*60*1000); }
  periodic(loadPrayers, 6*3600*1000);
  periodic(loadMarkets, 15*60*1000);
  if(USES('shows')) periodic(loadWeek, 6*3600*1000);
  periodic(loadWeather, 30*60*1000);
  cardTimers();
  setInterval(applyNight, 60*1000);
  setInterval(pixelShift, 4*60*1000);
  let lastDay = FMT_DATE.format(new Date());
  setInterval(()=>{
    const d = FMT_DATE.format(new Date());
    if(d !== lastDay){
      lastDay = d; tickDates(); tickOccasion(); renderPanel(false);
      later(() => { loadPhotoIndex().then(() => applyBackground(true)); loadPrayers(); if(NEEDS_MATCHES) loadMatches(); if(USES('shows')) loadWeek(); loadWeather(); });   // each TV at its own minute
    }
  }, 60*1000);
}

// The launcher's cards: the chosen ones only (up to three), refreshed like on the screensaver, nothing else loaded.
function bootWidget(){
  document.documentElement.classList.add('widget');
  if(CONFIG.cardStyle !== 'current') document.documentElement.classList.add('cs-' + CONFIG.cardStyle);   // «شكل البطاقة» applies to each of them
  buildCards();
  restoreSnap();
  setTimeout(saveSnap, 15*1000);
  setInterval(saveSnap, 60*1000);
  addEventListener('pagehide', saveSnap);
  if(document.fonts) document.fonts.ready.then(() => {   // widths change once the fonts are in: the cards are fitted again
    CARDS.forEach(c => { if(c.eff === 'matches') c.ul.__h = null; });
    if(CARDS.length > 1) renderPanel(false); else renderPanel(false, 'matches');
  });
  if(USES('shows')){ loadWeek(); periodic(loadWeek, 6*3600*1000); }
  renderPanel(false, ...CARD_KINDS.filter(k => k !== 'shows'));
  if(USES('adhkar') || USES('prayers') || USES('prayerrow')){ loadPrayers(); periodic(loadPrayers, 6*3600*1000); }
  if(USES('forecast') || USES('hourly')){ loadWeather(); periodic(loadWeather, 30*60*1000); }
  if(USES('matches')){ loadMatches(); periodic(loadMatches, 30*60*1000); periodic(loadLive, 2*60000); }
  if(USES('stocks')){ loadMarkets(); periodic(loadMarkets, 15*60*1000); }
  cardTimers();
  let lastDay = riyadhDayNumber();
  setInterval(() => { if(riyadhDayNumber() !== lastDay){ lastDay = riyadhDayNumber(); renderPanel(false); if(USES('prayers') || USES('prayerrow') || USES('adhkar')) later(loadPrayers); } }, 60*1000);
  reveal();
}

document.addEventListener('keydown', e=>{
  if(e.key === 'f' || e.key === 'F'){
    if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
    else document.exitFullscreen().catch(()=>{});
  }
});

boot();
</script>
