 الأَمَانَةُ فَانْتَظِرِ السَّاعَةَ"], ["n", "قَالَ كَيْفَ إِضَاعَتُهَا يَا رَسُولَ اللَّهِ قَالَ"], ["q", "إِذَا أُسْنِدَ الأَمْرُ إِلَى غَيْرِ أَهْلِهِ، فَانْتَظِرِ السَّاعَةَ"]], "source": "صحيح البخاري · ٦٤٩٦", "english": "Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"When honesty is lost, then wait for the Hour.\" It was asked, \"How will honesty be lost, O Allah's Messenger (ﷺ)?\" He said, \"When authority is given to those who do not deserve it, then wait for the Hour", "source_en": "Sahih al-Bukhari · 6496"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "لَتُؤَدُّنَّ الْحُقُوقَ إِلَى أَهْلِهَا يَوْمَ الْقِيَامَةِ حَتَّى يُقَادَ لِلشَّاةِ الْجَلْحَاءِ مِنَ الشَّاةِ الْقَرْنَاءِ"]], "source": "صحيح مسلم · ٢٥٨٢", "english": "A hadith like this has been narrated by Yahya b. Abu Kathir with the same chain of transmitters", "source_en": "Sahih Muslim · 2582"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، أَنَّ النَّبِيَّ ﷺ كَانَ يَقُولُ"], ["q", "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْفَقْرِ وَالْقِلَّةِ وَالذِّلَّةِ وَأَعُوذُ بِكَ مِنْ أَنْ أَظْلِمَ أَوْ أُظْلَمَ"]], "source": "سنن أبي داود · ١٥٤٤ · صحيح عند الألباني", "english": "Narrated AbuHurayrah: The Prophet (ﷺ) used to say: \"O Allah, I seek refuge in Thee from poverty\", lack and abasement, and I seek refuge in Thee lest I cause or suffer wrong", "source_en": "Sunan Abi Dawud · 1544"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "تَعَوَّذُوا بِاللَّهِ مِنْ جَهْدِ الْبَلاَءِ، وَدَرَكِ الشَّقَاءِ، وَسُوءِ الْقَضَاءِ، وَشَمَاتَةِ الأَعْدَاءِ"]], "source": "صحيح البخاري · ٦٦١٦", "english": "Narrated Abu Huraira:The Prophet (ﷺ) said, \"Take refuge with Allah from the difficulties of severe calamities, from having an evil end and a bad fate and from the malicious joy of your enemies", "source_en": "Sahih al-Bukhari · 6616"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "إِذَا دَخَلَ أَحَدُكُمُ الْمَسْجِدَ فَلْيُسَلِّمْ عَلَى النَّبِيِّ ﷺ وَلْيَقُلِ اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ وَإِذَا خَرَجَ فَلْيُسَلِّمْ عَلَى النَّبِيِّ وَلْيَقُلِ اللَّهُمَّ اعْصِمْنِي مِنَ الشَّيْطَانِ الرَّجِيمِ"]], "source": "سنن ابن ماجه · ٧٧٣ · صحيح عند الألباني", "english": "It was narrated from Abu Hurairah that:The Mesenger of Allah said: \"When anyone of enters the mosque, let him send peace upon the Prophet, then let him say: 'Allahumma aftahli abwaba rahmatik (O Allah, open to me the gates of Your mercy).' And when he leaves, let him send peace upon the Prophet and say: 'Allahumma- simni minash-shaitanir-rajim (O Allah, protect me from the accursed Shaitan)", "source_en": "Sunan Ibn Majah · 773"}, {"parts": [["n", "عن مُعَاوِيَةَ بْنِ أَبِي سُفْيَانَ، أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "إِنَّ الرَّجُلَ لَيَسْأَلُنِي الشَّىْءَ فَأَمْنَعُهُ حَتَّى تَشْفَعُوا فِيهِ فَتُؤْجَرُوا"], ["n", "وَإِنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "اشْفَعُوا تُؤْجَرُوا"]], "source": "سنن النسائي · ٢٥٥٧ · صحيح عند الألباني", "english": "It was narrated from Mu'awiyah bin Sufyan that the Messenger of Allah said:\"A man may come and ask for something, and I refuse until you intercede, so that you will be rewarded.\" And the Messenger of Allah said: \"Intercede and you will be rewarded", "source_en": "Sunan an-Nasa'i · 2557"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "مَنْ رَأَى مُبْتَلًى فَقَالَ الْحَمْدُ لِلَّهِ الَّذِي عَافَانِي مِمَّا ابْتَلاَكَ بِهِ وَفَضَّلَنِي عَلَى كَثِيرٍ مِمَّنْ خَلَقَ تَفْضِيلاً لَمْ يُصِبْهُ ذَلِكَ الْبَلاَءُ"]], "source": "جامع الترمذي · ٣٤٣٢ · حسن غريب", "english": "Abu Hurairah narrated that:The Messenger of Allah (ﷺ) said: “Whoever sees an afflicted person then says: ‘All praise is due to Allah who saved me from that which He has afflicted you with, and blessed me greatly over many of those whom He has created, (Al-ḥamdulillāhi alladhī `āfānī mimmabtalāka bihī wa faḍḍalanī `alā kathīrin mimman khalaqa tafḍīla)’ he shall not be struck by that affliction.”", "source_en": "Jami at-Tirmidhi · 3432"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "رُبَّ أَشْعَثَ مَدْفُوعٍ بِالأَبْوَابِ لَوْ أَقْسَمَ عَلَى اللَّهِ لأَبَرَّهُ"]], "source": "صحيح مسلم · ٢٦٢٢", "english": "Anas (Allah be pleased with him) reported:We were with the Messenger of Allah (ﷺ) on a journey. Some of us had been observing the fast and some of us had not been fasting. We got down at a place on a hot day. Most of us had the cloth for shelter. There were also those amongst us who sheltered (themselves against the rays of the) sun with the help of their hands. The observers of the fast fell down (on account of weakness). Those who had not observed it got up and pitched tents and watered the mounts. Thereupon the Messenger of Allah (ﷺ) said: The breakers of the fast have taken away the reward today", "source_en": "Sahih Muslim · 2622"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ ﷺ"], ["q", "أَنَّ رَجُلاً زَارَ أَخًا لَهُ فِي قَرْيَةٍ أُخْرَى فَأَرْصَدَ اللَّهُ لَهُ عَلَى مَدْرَجَتِهِ مَلَكًا فَلَمَّا أَتَى عَلَيْهِ قَالَ أَيْنَ تُرِيدُ قَالَ أُرِيدُ أَخًا لِي فِي هَذِهِ الْقَرْيَةِ. قَالَ هَلْ لَكَ عَلَيْهِ مِنْ نِعْمَةٍ تَرُبُّهَا قَالَ لاَ غَيْرَ أَنِّي أَحْبَبْتُهُ فِي اللَّهِ عَزَّ وَجَلَّ. قَالَ فَإِنِّي رَسُولُ اللَّهِ إِلَيْكَ بِأَنَّ اللَّهَ قَدْ أَحَبَّكَ كَمَا أَحْبَبْتَهُ فِيهِ"]], "source": "صحيح مسلم · ٢٥٦٧", "english": "Abu Huraira (Allah be pleased with him) reported Allah's Messenger (ﷺ) as saying:Abstain from Saum-Wisal. They (his Companions) said: Messenger of Allah, but you observe Saum Wisal. Upon this he said: You are not like me in this matter, for I spend my night (in a state) that my Lord feeds me and provides me drink Devote yourselves to the deeds (the burden of which) you can bear", "source_en": "Sahih Muslim · 2567"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "مَنْ عَادَ مَرِيضًا أَوْ زَارَ أَخًا لَهُ فِي اللَّهِ نَادَاهُ مُنَادٍ أَنْ طِبْتَ وَطَابَ مَمْشَاكَ وَتَبَوَّأْتَ مِنَ الْجَنَّةِ مَنْزِلاً"]], "source": "جامع الترمذي · ٢٠٠٨ · حسن غريب", "english": "Abu Hurairah narrated that the Messenger of Allah said:\"Whoever visits the sick, or visits his brother in Allah (faith), a caller calls out: 'May you have goodness and livelihood be good, and may you dwell in an adobe in Paradise", "source_en": "Jami at-Tirmidhi · 2008"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ رضى الله عنه عَنْ رَسُولِ اللَّهِ ﷺ قَالَ"], ["q", "تَجِدُونَ النَّاسَ مَعَادِنَ، خِيَارُهُمْ فِي الْجَاهِلِيَّةِ خِيَارُهُمْ فِي الإِسْلاَمِ إِذَا فَقِهُوا، وَتَجِدُونَ خَيْرَ النَّاسِ فِي هَذَا الشَّأْنِ أَشَدَّهُمْ لَهُ كَرَاهِيَةً"], ["q", "وَتَجِدُونَ شَرَّ النَّاسِ ذَا الْوَجْهَيْنِ، الَّذِي يَأْتِي هَؤُلاَءِ بِوَجْهٍ، وَيَأْتِي هَؤُلاَءِ بِوَجْهٍ"]], "source": "صحيح البخاري · ٣٤٩٣", "english": "Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"You see that the people are of different natures. Those who were the best in the pre-Islamic period, are also the best in Islam if they comprehend religious knowledge. You see that the best amongst the people in this respect (i.e. ambition of ruling) are those who hate it most. And you see that the worst among people is the double faced (person) who appears to these with one face and to the others with another face (i.e a hypocrite)", "source_en": "Sahih al-Bukhari · 3493"}, {"parts": [["n", "عن عَائِشَةَ، قَالَتْ قَالَ النَّبِيُّ ﷺ"], ["q", "لاَ تَسُبُّوا الأَمْوَاتَ، فَإِنَّهُمْ قَدْ أَفْضَوْا إِلَى مَا قَدَّمُوا"]], "source": "صحيح البخاري · ٦٥١٦", "english": "Narrated `Aisha:The Prophet (ﷺ) said, \"Do not abuse the dead, for they have reached the result of what they have done", "source_en": "Sahih al-Bukhari · 6516"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، قَالَ زَارَ النَّبِيُّ ﷺ قَبْرَ أُمِّهِ فَبَكَى وَأَبْكَى مَنْ حَوْلَهُ فَقَالَ"], ["q", "اسْتَأْذَنْتُ رَبِّي فِي أَنْ أَسْتَغْفِرَ لَهَا فَلَمْ يُؤْذَنْ لِي وَاسْتَأْذَنْتُهُ فِي أَنْ أَزُورَ قَبْرَهَا فَأُذِنَ لِي فَزُورُوا الْقُبُورَ فَإِنَّهَا تُذَكِّرُ الْمَوْتَ"]], "source": "صحيح مسلم · ٩٧٦", "english": "Anas b. Malik reported:The Messenger of Allah (ﷺ) said: Complete the rows, for I can see you behind my back", "source_en": "Sahih Muslim · 976"}, {"parts": [["n", "عن أَنَسٍ، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "اللَّهُمَّ لاَ عَيْشَ إِلاَّ عَيْشُ الآخِرَة، فَأَصْلِحِ الأَنْصَارَ وَالْمُهَاجِرَة"]], "source": "صحيح البخاري · ٦٤١٣", "english": "Narrated Anas:The Prophet (ﷺ) said, \"O Allah! There is no life worth living except the life of the Hereafter, so (please) make righteous the Ansar and the Emigrants", "source_en": "Sahih al-Bukhari · 6413"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "اللَّهُمَّ اجْعَلْ رِزْقَ آلِ مُحَمَّدٍ قُوتًا"]], "source": "صحيح مسلم · ١٠٥٥", "english": "Anas reported:The Messenger of Allah (ﷺ) would listen to the crying of a lad in the company of his mother, in prayer, and he would recite a short surah or a small surah", "source_en": "Sahih Muslim · 1055"}, {"parts": [["n", "عن أَنَسِ بْنِ مَالِكٍ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "إِنَّ اللَّهَ لاَ يَظْلِمُ مُؤْمِنًا حَسَنَةً يُعْطَى بِهَا فِي الدُّنْيَا وَيُجْزَى بِهَا فِي الآخِرَةِ وَأَمَّا الْكَافِرُ فَيُطْعَمُ بِحَسَنَاتِ مَا عَمِلَ بِهَا لِلَّهِ فِي الدُّنْيَا حَتَّى إِذَا أَفْضَى إِلَى الآخِرَةِ لَمْ تَكُنْ لَهُ حَسَنَةٌ يُجْزَى بِهَا"]], "source": "صحيح مسلم · ٢٨٠٨", "english": "Abu Zubair reported that he heard Jabir b. 'Abdullah (Allah be pleased with them) saying that as he was asked about (the places for entering upon the) state of ihram, he said:I heard (and he then carried the narration directly, I think to) the Messenger of Allah (ﷺ)", "source_en": "Sahih Muslim · 2808"}, {"parts": [["n", "عن أَنَسِ بْنِ مَالِكٍ رضى الله عنه قَالَ سَمِعْتُ النَّبِيَّ ﷺ يَقُولُ"], ["q", "إِنَّ اللَّهَ قَالَ إِذَا ابْتَلَيْتُ عَبْدِي بِحَبِيبَتَيْهِ فَصَبَرَ عَوَّضْتُهُ مِنْهُمَا الْجَنَّةَ"]], "source": "صحيح البخاري · ٥٦٥٣", "english": "Narrated Anas bin Malik:I heard Allah's Messenger (ﷺ) saying, \"Allah said, 'If I deprive my slave of his two beloved things (i.e., his eyes) and he remains patient, I will let him enter Paradise in compensation for them", "source_en": "Sahih al-Bukhari · 5653"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "يَقُولُ اللَّهُ تَعَالَى مَا لِعَبْدِي الْمُؤْمِنِ عِنْدِي جَزَاءٌ، إِذَا قَبَضْتُ صَفِيَّهُ مِنْ أَهْلِ الدُّنْيَا، ثُمَّ احْتَسَبَهُ إِلاَّ الْجَنَّةُ"]], "source": "صحيح البخاري · ٦٤٢٤", "english": "Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"Allah says, 'I have nothing to give but Paradise as a reward to my believer slave, who, if I cause his dear friend (or relative) to die, remains patient (and hopes for Allah's Reward)", "source_en": "Sahih al-Bukhari · 6424"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "السَّفَرُ قِطْعَةٌ مِنَ الْعَذَابِ، يَمْنَعُ أَحَدَكُمْ نَوْمَهُ وَطَعَامَهُ، فَإِذَا قَضَى نَهْمَتَهُ مِنْ وَجْهِهِ فَلْيُعَجِّلْ إِلَى أَهْلِهِ"]], "source": "صحيح البخاري · ٥٤٢٩", "english": "Narrated Abu Huraira:The Prophet (ﷺ) said, \"Traveling is a kind of torture, as it prevents one from sleeping and eating! So when one has finished his job, he should return quickly to his family", "source_en": "Sahih al-Bukhari · 5429"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، قَالَ كَانَ رَسُولُ اللَّهِ ﷺ إِذَا سَافَرَ قَالَ"], ["q", "اللَّهُمَّ أَنْتَ الصَّاحِبُ فِي السَّفَرِ وَالْخَلِيفَةُ فِي الأَهْلِ اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ وَعْثَاءِ السَّفَرِ وَكَآبَةِ الْمُنْقَلَبِ وَسُوءِ الْمَنْظَرِ فِي الأَهْلِ وَالْمَالِ اللَّهُمَّ اطْوِ لَنَا الأَرْضَ وَهَوِّنْ عَلَيْنَا السَّفَرَ"]], "source": "سنن أبي داود · ٢٥٩٨ · حسن صحيح عند الألباني", "english": "Narrated AbuHurayrah: When the Messenger of Allah (ﷺ) proceeded on journey, he would say: O Allah, Thou art the Companion in the journey, and the One Who looks after the family; O Allah, I seek refuge in Thee from the difficulty of travelling, finding harm when I return, and unhappiness in what I see coming to my family and property. O Allah, make the length of his journey short for us, and the journey easy for us", "source_en": "Sunan Abi Dawud · 2598"}, {"parts": [["n", "عن أَنَسٍ، قَالَ جَاءَ رَجُلٌ إِلَى النَّبِيِّ ﷺ فَقَالَ يَا رَسُولَ اللَّهِ إِنِّي أُرِيدُ سَفَرًا فَزَوِّدْنِي. قَالَ"], ["q", "زَوَّدَكَ اللَّهُ التَّقْوَى"], ["n", "قَالَ زِدْنِي. قَالَ"], ["q", "وَغَفَرَ ذَنْبَكَ"], ["n", "قَالَ زِدْنِي بِأَبِي أَنْتَ وَأُمِّي. قَالَ"], ["q", "وَيَسَّرَ لَكَ الْخَيْرَ حَيْثُمَا كُنْتَ"]], "source": "جامع الترمذي · ٣٤٤٤ · حسن صحيح عند الألباني", "english": "Anas said:“A man came to the Messenger of Allah (ﷺ) and said: ‘I intend to undertake a journey, so give me provision. He said: ‘May Allah grant you Taqwa as your provision (Zawwadak Allāhut-taqwā).’ He said: ‘Give me more.’ He said: ‘And may He forgive your sin (Wa ghafara dhanbak).’ He said: ‘Give me more, may my father be ransomed for you, and my mother.’ He said: ‘And may He make goodness easy for you wherever you are (Wa yassara lakal-khaira ḥaithu mā kunt).’”", "source_en": "Jami at-Tirmidhi · 3444"}, {"parts": [["n", "عن جُنْدَبِ بْنِ عَبْدِ اللَّهِ، أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "اقْرَءُوا الْقُرْآنَ مَا ائْتَلَفَتْ عَلَيْهِ قُلُوبُكُمْ، فَإِذَا اخْتَلَفْتُمْ فَقُومُوا عَنْهُ"]], "source": "صحيح البخاري · ٧٣٦٥", "english": "Narrated Jundab bin `Abdullah:Allah's Messenger (ﷺ) said, \"Recite (and study) the Qur'an as long as your hearts are in agreement as to its meanings, but if you have differences as regards its meaning, stop reading it then", "source_en": "Sahih al-Bukhari · 7365"}, {"parts": [["n", "عن أَنَسٍ، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "يَخْرُجُ مِنَ النَّارِ مَنْ قَالَ لاَ إِلَهَ إِلاَّ اللَّهُ، وَفِي قَلْبِهِ وَزْنُ شَعِيرَةٍ مِنْ خَيْرٍ، وَيَخْرُجُ مِنَ النَّارِ مَنْ قَالَ لاَ إِلَهَ إِلاَّ اللَّهُ، وَفِي قَلْبِهِ وَزْنُ بُرَّةٍ مِنْ خَيْرٍ، وَيَخْرُجُ مِنَ النَّارِ مَنْ قَالَ لاَ إِلَهَ إِلاَّ اللَّهُ، وَفِي قَلْبِهِ وَزْنُ ذَرَّةٍ مِنْ خَيْرٍ"]], "source": "صحيح البخاري · ٤٤", "english": "Narrated Anas: The Prophet (ﷺ) said, \"Whoever said \"None has the right to be worshipped but Allah and has in his heart good (faith) equal to the weight of a barley grain will be taken out of Hell. And whoever said: \"None has the right to be worshipped but Allah and has in his heart good (faith) equal to the weight of a wheat grain will be taken out of Hell. And whoever said, \"None has the right to be worshipped but Allah and has in his heart good (faith) equal to the weight of an atom will be taken out of Hell", "source_en": "Sahih al-Bukhari · 44"}, {"parts": [["n", "عن أَبِي سَعِيدٍ الْخُدْرِيِّ، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "لَقِّنُوا مَوْتَاكُمْ لاَ إِلَهَ إِلاَّ اللَّهُ"]], "source": "جامع الترمذي · ٩٧٦ · حسن غريب", "english": "Abu Sa'eed Al-Khudri narrated that:The Prophet said: \"Instruct your dying to say: (La illaha illallah) 'None has the right to be worshipped but Allah", "source_en": "Jami at-Tirmidhi · 976"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "إِنَّ اللَّهَ تَعَالَى يَقُولُ يَا ابْنَ آدَمَ تَفَرَّغْ لِعِبَادَتِي أَمْلأْ صَدْرَكَ غِنًى وَأَسُدَّ فَقْرَكَ وَإِلاَّ تَفْعَلْ مَلأْتُ يَدَيْكَ شُغْلاً وَلَمْ أَسُدَّ فَقْرَكَ"]], "source": "جامع الترمذي · ٢٤٦٦ · صحيح عند الألباني", "english": "Abu Hurairah narrated that the Messenger of Allah(s.a.w) said:\"Indeed Allah, Most High said: 'O son of Adam! Devote yourself to My worship, I will fill your chest with riches and alleviate your poverty. And if you do not do so, then I will fill your hands with problems and not alleviate your poverty", "source_en": "Jami at-Tirmidhi · 2466"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "مَنْ أَقَالَ مُسْلِمًا أَقَالَهُ اللَّهُ عَثْرَتَهُ"]], "source": "سنن أبي داود · ٣٤٦٠ · صحيح عند الألباني", "english": "Narrated AbuHurayrah: The Prophet (ﷺ) said: If anyone rescinds a sale with a Muslim, Allah will cancel his slip, on the Day of Resurrection", "source_en": "Sunan Abi Dawud · 3460"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ رضى الله عنه عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "مَطْلُ الْغَنِيِّ ظُلْمٌ، وَمَنْ أُتْبِعَ عَلَى مَلِيٍّ فَلْيَتَّبِعْ"]], "source": "صحيح البخاري · ٢٢٨٨", "english": "Narrated Abu Huraira:The Prophet (ﷺ) said, \"Procrastination (delay) in paying debts by a wealthy person is injustice. So, if your debt is transferred from your debtor to a rich debtor, you should agree", "source_en": "Sahih al-Bukhari · 2288"}, {"parts": [["n", "عن عَائِشَةَ، زَوْجِ النَّبِيِّ ﷺ أَخْبَرَتْهُ أَنَّ رَسُولَ اللَّهِ ﷺ كَانَ يَدْعُو فِي الصَّلاَةِ"], ["q", "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ وَأَعُوذُ بِكَ مِنْ فِتْنَةِ الْمَسِيحِ الدَّجَّالِ، وَأَعُوذُ بِكَ مِنْ فِتْنَةِ الْمَحْيَا وَفِتْنَةِ الْمَمَاتِ، اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْمَأْثَمِ وَالْمَغْرَمِ"], ["n", "فَقَالَ لَهُ قَائِلٌ مَا أَكْثَرَ مَا تَسْتَعِيذُ مِنَ الْمَغْرَمِ فَقَالَ"], ["q", "إِنَّ الرَّجُلَ إِذَا غَرِمَ حَدَّثَ فَكَذَبَ، وَوَعَدَ فَأَخْلَفَ"]], "source": "صحيح البخاري · ٨٣٢", "english": "Narrated `Aisha:(the wife of the Prophet) Allah's Messenger (ﷺ) used to invoke Allah in the prayer saying \"Allahumma inni a`udhu bika min `adhabi l-qabr, wa a`udhu bika min fitnati l-masihi d-dajjal, wa a`udhu bika min fitnati l-mahya wa fitnati l-mamat. Allahumma inni a`udhu bika mina l-ma'thami wa l-maghram. (O Allah, I seek refuge with You from the punishment of the grave, from the afflictions of the imposter- Messiah, and from the afflictions of life and death. O Allah, I seek refuge with You from sins and from debt).\" Somebody said to him, \"Why do you so frequently seek refuge with Allah from being in debt?\" The Prophet (ﷺ) replied, \"A person in debt tells lies whenever he speaks, and breaks promises whenever he makes (them).\" `Aisha also narrated: I heard Allah's Messenger (ﷺ) in his prayer seeking refuge with Allah from the afflictions of Ad-Dajjal", "source_en": "Sahih al-Bukhari · 832"}, {"parts": [["n", "عن ابْنِ عُمَرَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "مَا مِنْ جُرْعَةٍ أَعْظَمُ أَجْرًا عِنْدَ اللَّهِ مِنْ جُرْعَةِ غَيْظٍ كَظَمَهَا عَبْدٌ ابْتِغَاءَ وَجْهِ اللَّهِ"]], "source": "سنن ابن ماجه · ٤١٨٩ · صحيح عند الألباني", "english": "It was narrated from Ibn ‘Umar that the Messenger of Allah (ﷺ) said:“There is no gulp that brings greater reward with Allah than a gulp of anger that a man swallows (suppresses), seeking thereby the Face of Allah.”", "source_en": "Sunan Ibn Majah · 4189"}, {"parts": [["n", "عن عَائِشَةَ، أَنَّ رَجُلاً، اسْتَأْذَنَ عَلَى النَّبِيِّ ﷺ فَلَمَّا رَآهُ قَالَ"], ["q", "بِئْسَ أَخُو الْعَشِيرَةِ، وَبِئْسَ ابْنُ الْعَشِيرَةِ"], ["n", "فَلَمَّا جَلَسَ تَطَلَّقَ النَّبِيُّ ﷺ فِي وَجْهِهِ وَانْبَسَطَ إِلَيْهِ، فَلَمَّا انْطَلَقَ الرَّجُلُ قَالَتْ لَهُ عَائِشَةُ يَا رَسُولَ اللَّهِ حِينَ رَأَيْتَ الرَّجُلَ قُلْتَ لَهُ كَذَا وَكَذَا، ثُمَّ تَطَلَّقْتَ فِي وَجْهِهِ وَانْبَسَطْتَ إِلَيْهِ فَقَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "يَا عَائِشَةُ مَتَى عَهِدْتِنِي فَحَّاشًا، إِنَّ شَرَّ النَّاسِ عِنْدَ اللَّهِ مَنْزِلَةً يَوْمَ الْقِيَامَةِ مَنْ تَرَكَهُ النَّاسُ اتِّقَاءَ شَرِّهِ"]], "source": "صحيح البخاري · ٦٠٣٢", "english": "Narrated 'Aisha: A man asked permission to enter upon the Prophet. When the Prophet (ﷺ) saw him, he said, \"What an evil brother of his tribe! And what an evil son of his tribe!\" When that man sat down, the Prophet (ﷺ) behaved with him in a nice and polite manner and was completely at ease with him. When that person had left, 'Aisha said (to the Prophet). \"O Allah's Apostle! When you saw that man, you said so-and-so about him, then you showed him a kind and polite behavior, and you enjoyed his company?\" Allah's Messenger (ﷺ) said, \"O 'Aisha! Have you ever seen me speaking a bad and dirty language? (Remember that) the worst people in Allah's sight on the Day of Resurrection will be those whom the people leave (undisturbed) to be away from their evil (deeds)", "source_en": "Sahih al-Bukhari · 6032"}, {"parts": [["n", "عن أَبِي بَرْزَةَ الأَسْلَمِيِّ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "يَا مَعْشَرَ مَنْ آمَنَ بِلِسَانِهِ وَلَمْ يَدْخُلِ الإِيمَانُ قَلْبَهُ لاَ تَغْتَابُوا الْمُسْلِمِينَ وَلاَ تَتَّبِعُوا عَوْرَاتِهِمْ فَإِنَّهُ مَنِ اتَّبَعَ عَوْرَاتِهِمْ يَتَّبِعِ اللَّهُ عَوْرَتَهُ وَمَنْ يَتَّبِعِ اللَّهُ عَوْرَتَهُ يَفْضَحْهُ فِي بَيْتِهِ"]], "source": "سنن أبي داود · ٤٨٨٠ · حسن صحيح عند الألباني", "english": "Narrated AbuBarzah al-Aslami: The Prophet (ﷺ) said: O community of people, who believed by their tongue, and belief did not enter their hearts, do not back-bite Muslims, and do not search for their faults, for if anyone searches for their faults, Allah will search for his fault, and if Allah searches for the fault of anyone, He disgraces him in his house", "source_en": "Sunan Abi Dawud · 4880"}, {"parts": [["n", "عن الْمُغِيرَةِ، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "إِنَّ اللَّهَ حَرَّمَ عَلَيْكُمْ عُقُوقَ الأُمَّهَاتِ، وَمَنْعَ وَهَاتِ، وَوَأْدَ الْبَنَاتِ، وَكَرِهَ لَكُمْ قِيلَ وَقَالَ، وَكَثْرَةَ السُّؤَالِ، وَإِضَاعَةَ الْمَالِ"]], "source": "صحيح البخاري · ٥٩٧٥", "english": "Narrated Al-Mughira:The Prophet (ﷺ) said, \"Allah has forbidden you ( 1 ) to be undutiful to your mothers (2) to withhold (what you should give) or (3) demand (what you do not deserve), and (4) to bury your daughters alive. And Allah has disliked that (A) you talk too much about others ( B), ask too many questions (in religion), or (C) waste your property", "source_en": "Sahih al-Bukhari · 5975"}, {"parts": [["n", "عن عُقْبَةَ بْنَ عَامِرٍ، يَقُولُ سَمِعْتُ رَسُولَ اللَّهِ ﷺ يَقُولُ"], ["q", "مَنْ كَانَ لَهُ ثَلاَثُ بَنَاتٍ فَصَبَرَ عَلَيْهِنَّ وَأَطْعَمَهُنَّ وَسَقَاهُنَّ وَكَسَاهُنَّ مِنْ جِدَتِهِ - كُنَّ لَهُ حِجَابًا مِنَ النَّارِ يَوْمَ الْقِيَامَةِ"]], "source": "سنن ابن ماجه · ٣٦٦٩ · صحيح عند الألباني", "english": "Uqbah bin Amir said, I heard the Messenger of Allah(ﷺ) say:\"Whoever has three daughters and is patient towards them, and feeds them, gives them to drink, and clothes them from his wealth; they will be a shield for him from the Fire on the Day of Resurrection", "source_en": "Sunan Ibn Majah · 3669"}, {"parts": [["n", "عن سَعْدِ بْنِ أَبِي وَقَّاصٍ أَنَّهُ أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "إِنَّكَ لَنْ تُنْفِقَ نَفَقَةً تَبْتَغِي بِهَا وَجْهَ اللَّهِ إِلَّا أُجِرْتَ عَلَيْهَا حَتَّى مَا تَجْعَلُ فِي فَمِ امْرَأَتِكَ"]], "source": "صحيح البخاري · ٥٦", "english": "Narrated Sa'd bin Abi Waqqas: Allah's Messenger (ﷺ) said, \"You will be rewarded for whatever you spend for Allah's sake even if it were a morsel which you put in your wife's mouth", "source_en": "Sahih al-Bukhari · 56"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "دِينَارٌ أَنْفَقْتَهُ فِي سَبِيلِ اللَّهِ وَدِينَارٌ أَنْفَقْتَهُ فِي رَقَبَةٍ وَدِينَارٌ تَصَدَّقْتَ بِهِ عَلَى مِسْكِينٍ وَدِينَارٌ أَنْفَقْتَهُ عَلَى أَهْلِكَ أَعْظَمُهَا أَجْرًا الَّذِي أَنْفَقْتَهُ عَلَى أَهْلِكَ"]], "source": "صحيح مسلم · ٩٩٥", "english": "Ibn Umar reported:The Messenger of Allah (ﷺ) said: Do not deprive women of their share of the mosques, when they seek permission from you. Bilal said: By Allah, we would certainly prevent them. 'Abdullah said: I say that the Messenger of Allah (ﷺ) said it and you say: We would certainly prevent them", "source_en": "Sahih Muslim · 995"}, {"parts": [["n", "عن أَبِي مَسْعُودٍ، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "إِذَا أَنْفَقَ الرَّجُلُ عَلَى أَهْلِهِ يَحْتَسِبُهَا فَهُوَ لَهُ صَدَقَةٌ"]], "source": "صحيح البخاري · ٥٥", "english": "Narrated Abu Mas'ud: The Prophet (ﷺ) said, \"If a man spends on his family (with the intention of having a reward from Allah) sincerely for Allah's sake then it is a (kind of) alms-giving in reward for him", "source_en": "Sahih al-Bukhari · 55"}, {"parts": [["n", "عن ثَوْبَانَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "أَفْضَلُ دِينَارٍ يُنْفِقُهُ الرَّجُلُ دِينَارٌ يُنْفِقُهُ عَلَى عِيَالِهِ وَدِينَارٌ يُنْفِقُهُ عَلَى فَرَسٍ فِي سَبِيلِ اللَّهِ وَدِينَارٌ يُنْفِقُهُ الرَّجُلُ عَلَى أَصْحَابِهِ فِي سَبِيلِ اللَّهِ"]], "source": "سنن ابن ماجه · ٢٧٦٠ · صحيح عند الألباني", "english": "It was narrated from Thawban that the Messenger of Allah (ﷺ) said:“The best Dinar that a man can spend is a Dinar that he spends on his family, a Dinar that he spends on a horse in the cause of Allah, and a Dinar that a man spends on his companions in the cause of Allah.”", "source_en": "Sunan Ibn Majah · 2760"}, {"parts": [["n", "عن أَبِي سَعِيدٍ، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "لاَ تُصَاحِبْ إِلاَّ مُؤْمِنًا وَلاَ يَأْكُلْ طَعَامَكَ إِلاَّ تَقِيٌّ"]], "source": "سنن أبي داود · ٤٨٣٢ · حسن عند الألباني", "english": "Narrated AbuSa'id al-Khudri: The Prophet (ﷺ) said: Associate only with a believer, and let only a God-fearing man eat your meals", "source_en": "Sunan Abi Dawud · 4832"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، أَنَّ النَّبِيَّ ﷺ قَالَ"], ["q", "إِذَا اسْتَيْقَظَ أَحَدُكُمْ مِنْ نَوْمِهِ فَلاَ يَغْمِسْ يَدَهُ فِي الإِنَاءِ حَتَّى يَغْسِلَهَا ثَلاَثًا فَإِنَّهُ لاَ يَدْرِي أَيْنَ بَاتَتْ يَدُهُ"]], "source": "صحيح مسلم · ٢٧٨", "english": "(It is narrated on the authority of Usama b. Zaid:The Messenger of Allah may peace be upon him) sent us to Huraqat, a tribe of Juhaina. We attacked that tribe early in the morning and defeated them and I and a man from the Ansar caught hold of a person (of the defeated tribe). When we overcame him, he said: There is no god but Allah. At that moment the Ansari spared him, but I attacked him with my spear and killed him. The news had already reached the Apostle (peace be upon him), so when we came back he (the Apostle) said to me: Usama, did you kill him after he had made the profession: There is no god but Allah? I said. Messenger of Allah, he did it only as a shelter. The Prophet observed: Did you kill him after he had made the profession that there is no god but Allah? He (the Holy Prophet) went on repeating this to me till I wished I had not embraced Islam before that day", "source_en": "Sahih Muslim · 278"}, {"parts": [["n", "عن عَائِشَةَ، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "السِّوَاكُ مَطْهَرَةٌ لِلْفَمِ مَرْضَاةٌ لِلرَّبِّ"]], "source": "سنن النسائي · ٥ · صحيح عند الألباني", "english": "Abdur-Rahman bin Abu 'Atiq said:\"My father told me: 'I heard 'Aishah say, (narrating) from the Prophet (ﷺ): \"Siwak is a means of purification for the mouth and is pleasing to the Lord", "source_en": "Sunan an-Nasa'i · 5"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "نَحْنُ الآخِرُونَ السَّابِقُونَ يَوْمَ الْقِيَامَةِ، أُوتُوا الْكِتَابَ مِنْ قَبْلِنَا، وَأُوتِينَاهُ مِنْ بَعْدِهِمْ، فَهَذَا الْيَوْمُ الَّذِي اخْتَلَفُوا فِيهِ فَهَدَانَا اللَّهُ، فَغَدًا لِلْيَهُودِ وَبَعْدَ غَدٍ لِلنَّصَارَى"], ["n", "فَسَكَتَ. ثُمَّ قَالَ"], ["q", "حَقٌّ عَلَى كُلِّ مُسْلِمٍ أَنْ يَغْتَسِلَ فِي كُلِّ سَبْعَةِ أَيَّامٍ يَوْمًا يَغْسِلُ فِيهِ رَأْسَهُ وَجَسَدَهُ"], ["n", "ثُمَّ قَالَ"], ["q", "حَقٌّ عَلَى كُلِّ مُسْلِمٍ أَنْ يَغْتَسِلَ فِي كُلِّ سَبْعَةِ أَيَّامٍ يَوْمًا يَغْسِلُ فِيهِ رَأْسَهُ وَجَسَدَهُ"]], "source": "صحيح البخاري · ٨٩٦", "english": "Narrated Abu Huraira: Allah's Messenger (ﷺ) said \"We are the last (to come amongst the nations) but (will be) the foremost on the Day of Resurrection. They were given the Holy Scripture before us and we were given the Quran after them. And this was the day (Friday) about which they differed and Allah gave us the guidance (for that). So tomorrow (i.e. Saturday) is the Jews' (day), and the day after tomorrow (i.e. Sunday) is the Christians'.\" The Prophet (ﷺ) remained silent (for a while) and then said, \"It is obligatory for every Muslim that he should take a bath once in seven days, when he should wash his head and body", "source_en": "Sahih al-Bukhari · 896"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "مَنْ تَوَضَّأَ فَأَحْسَنَ الْوُضُوءَ ثُمَّ أَتَى الْجُمُعَةَ فَاسْتَمَعَ وَأَنْصَتَ غُفِرَ لَهُ مَا بَيْنَهُ وَبَيْنَ الْجُمُعَةِ وَزِيَادَةُ ثَلاَثَةِ أَيَّامٍ وَمَنْ مَسَّ الْحَصَى فَقَدْ لَغَا"]], "source": "صحيح مسلم · ٨٥٧", "english": "Abu Huraira reported:The Messenger of Allah (ﷺ) said: When the Mu'adhdhin calls to prayer, Satan runs back vehemently", "source_en": "Sahih Muslim · 857"}, {"parts": [["n", "عن أبي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "إِذَا قُلْتَ لِصَاحِبِكَ يَوْمَ الْجُمُعَةِ أَنْصِتْ. وَالإِمَامُ يَخْطُبُ فَقَدْ لَغَوْتَ"]], "source": "صحيح البخاري · ٩٣٤", "english": "Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"When the Imam is delivering the Khutba, and you ask your companion to keep quiet and listen, then no doubt you have done an evil act", "source_en": "Sahih al-Bukhari · 934"}, {"parts": [["n", "عن أبي هُرَيْرَةَ، قَالَ سَمِعْتُ رَسُولَ اللَّهِ ﷺ يَقُولُ"], ["q", "إِذَا أُقِيمَتِ الصَّلاَةُ فَلاَ تَأْتُوهَا تَسْعَوْنَ وَأْتُوهَا تَمْشُونَ وَعَلَيْكُمُ السَّكِينَةُ فَمَا أَدْرَكْتُمْ فَصَلُّوا وَمَا فَاتَكُمْ فَأَتِمُّوا"]], "source": "سنن أبي داود · ٥٧٢ · حسن صحيح عند الألباني", "english": "Abu Hurairah said:I heard the Messenger of Allah( may peace be upon him) say: When the iqamah is pronounced for prayer, do not come to it running, but come walking(slowly). You should observe tranquility. The part of the prayer you get(along with the imam) offer it, and the part you miss complete it(afterwards). Abu Dawud said: The version narrated by al-Zubaidi, Ibn Abi Dhi’b, Ibrahim b. Sa’d, Ma’mar, Shu’aib b. Abi Hamzah on the authority of al-Zuhri has the words: “the part you miss then complete it”. Ibn ‘Uyainah alone narrated from al-Zuhri the words “then offer it afterwards”. And Muhammad b. ‘Amr narrated from Abu Salamah on the authority of Abu Hurairah, and Ja’far b. Rabi’ah narrated from al-A’raj on the authority of Abu Hurairah the words “then complete it”. And Ibn Mas’ud narrated from the Prophet(ﷺ) and Abu Qatadah and Anas reported from the Prophet( may peace be upon him) the words” then complete it”", "source_en": "Sunan Abi Dawud · 572"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "إِذَا صَلَّى أَحَدُكُمْ لِلنَّاسِ فَلْيُخَفِّفْ، فَإِنَّ مِنْهُمُ الضَّعِيفَ وَالسَّقِيمَ وَالْكَبِيرَ، وَإِذَا صَلَّى أَحَدُكُمْ لِنَفْسِهِ فَلْيُطَوِّلْ مَا شَاءَ"]], "source": "صحيح البخاري · ٧٠٣", "english": "Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"If anyone of you leads the people in the prayer, he should shorten it for amongst them are the weak, the sick and the old; and if anyone among you prays alone then he may prolong (the prayer) as much as he wishes", "source_en": "Sahih al-Bukhari · 703"}, {"parts": [["n", "عن عَبْدِ اللَّهِ بْنِ أَبِي قَتَادَةَ، عَنْ أَبِيهِ أَبِي قَتَادَةَ، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "إِنِّي لأَقُومُ فِي الصَّلاَةِ أُرِيدُ أَنْ أُطَوِّلَ فِيهَا، فَأَسْمَعُ بُكَاءَ الصَّبِيِّ، فَأَتَجَوَّزُ فِي صَلاَتِي كَرَاهِيَةَ أَنْ أَشُقَّ عَلَى أُمِّهِ"]], "source": "صحيح البخاري · ٧٠٧", "english": "Narrated `Abdullah bin 'Abi Qatada:My father said, \"The Prophet (ﷺ) said, 'When I stand for prayer, I intend to prolong it but on hearing the cries of a child, I cut it short, as I dislike to trouble the child's mother", "source_en": "Sahih al-Bukhari · 707"}, {"parts": [["n", "عن عَبْدَ اللَّهِ بْنَ عَمْرٍو، قَالَ قَالَ لِي رَسُولُ اللَّهِ ﷺ"], ["q", "أَحَبُّ الصِّيَامِ إِلَى اللَّهِ صِيَامُ دَاوُدَ، كَانَ يَصُومُ يَوْمًا وَيُفْطِرُ يَوْمًا، وَأَحَبُّ الصَّلاَةِ إِلَى اللَّهِ صَلاَةُ دَاوُدَ، كَانَ يَنَامُ نِصْفَ اللَّيْلِ وَيَقُومُ ثُلُثَهُ وَيَنَامُ سُدُسَهُ"]], "source": "صحيح البخاري · ٣٤٢٠", "english": "Narrated `Abdullah bin `Amr:Allah's Messenger (ﷺ) said to me, \"The most beloved fasting to Allah was the fasting of (the Prophet) David who used to fast on alternate days. And the most beloved prayer to Allah was the prayer of David who used to sleep for (the first) half of the night and pray for 1/3 of it and (again) sleep for a sixth of it", "source_en": "Sahih al-Bukhari · 3420"}, {"parts": [["n", "عن عَبْدِ اللَّهِ بْنِ عَمْرِو بْنِ الْعَاصِ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "مَنْ قَامَ بِعَشْرِ آيَاتٍ لَمْ يُكْتَبْ مِنَ الْغَافِلِينَ وَمَنْ قَامَ بِمِائَةِ آيَةٍ كُتِبَ مِنَ الْقَانِتِينَ وَمَنْ قَامَ بِأَلْفِ آيَةٍ كُتِبَ مِنَ الْمُقَنْطَرِينَ"]], "source": "سنن أبي داود · ١٣٩٨ · صحيح عند الألباني", "english": "Narrated Abdullah ibn Amr ibn al-'As: The Prophet (ﷺ) said: If anyone prays at night reciting regularly ten verses, he will not be recorded among the negligent; if anyone prays at night and recites a hundred verses, he will be recorded among those who are obedient to Allah; and if anyone prays at night reciting one thousand verses, he will be recorded among those who receive huge rewards. Abu Dawud said: The name of Ibn Hujairah al-Asghar is 'Abd Allah b. 'Abd al-Rahman b. Hujairah", "source_en": "Sunan Abi Dawud · 1398"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "يَتَعَاقَبُونَ فِيكُمْ مَلاَئِكَةٌ بِاللَّيْلِ وَمَلاَئِكَةٌ بِالنَّهَارِ، وَيَجْتَمِعُونَ فِي صَلاَةِ الْعَصْرِ وَصَلاَةِ الْفَجْرِ، ثُمَّ يَعْرُجُ الَّذِينَ بَاتُوا فِيكُمْ فَيَسْأَلُهُمْ وَهْوَ أَعْلَمُ كَيْفَ تَرَكْتُمْ عِبَادِي فَيَقُولُونَ تَرَكْنَاهُمْ وَهُمْ يُصَلُّونَ، وَأَتَيْنَاهُمْ وَهُمْ يُصَلُّونَ"]], "source": "صحيح البخاري · ٧٤٨٦", "english": "Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"There are angels coming to you in succession at night, and others during the day, and they all gather at the time of `Asr and Fajr prayers. Then the angels who have stayed with you overnight ascend (to the heaven) and He (Allah) asks them though He perfectly knows their affairs. 'In what state have you left my slaves?' They say, 'When we left them, they were praying and when we came to them they were praying", "source_en": "Sahih al-Bukhari · 7486"}, {"parts": [["n", "عن أَبِي أُمَامَةَ، أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "مَنْ خَرَجَ مِنْ بَيْتِهِ مُتَطَهِّرًا إِلَى صَلاَةٍ مَكْتُوبَةٍ فَأَجْرُهُ كَأَجْرِ الْحَاجِّ الْمُحْرِمِ وَمَنْ خَرَجَ إِلَى تَسْبِيحِ الضُّحَى لاَ يُنْصِبُهُ إِلاَّ إِيَّاهُ فَأَجْرُهُ كَأَجْرِ الْمُعْتَمِرِ وَصَلاَةٌ عَلَى أَثَرِ صَلاَةٍ لاَ لَغْوَ بَيْنَهُمَا كِتَابٌ فِي عِلِّيِّينَ"]], "source": "سنن أبي داود · ٥٥٨ · حسن عند الألباني", "english": "Narrated AbuUmamah: The Messenger of Allah (ﷺ) said: If anyone goes out from his house after performing ablution for saying the prescribed prayer in congregation (in the mosque), his reward will be like that of one who goes for hajj pilgrimage after wearing ihram (robe worn by the hajj pilgrims). And he who goes out to say the mid-morning (duha) prayer, and takes the trouble for this purpose, will take the reward like that of a person who performs umrah. And a prayer followed by a prayer with no worldly talk during the gap between them will be recorded in Illiyyun", "source_en": "Sunan Abi Dawud · 558"}, {"parts": [["n", "عن جَابِرِ بْنِ عَبْدِ اللَّهِ، قَالَ قَالَ النَّبِيُّ ﷺ"], ["q", "مَنْ أَكَلَ ثُومًا أَوْ بَصَلاً، فَلْيَعْتَزِلْنَا أَوْ لِيَعْتَزِلْ مَسْجِدَنَا، وَلْيَقْعُدْ فِي بَيْتِهِ"], ["n", "وَإِنَّهُ أُتِيَ بِبَدْرٍ قَالَ ابْنُ وَهْبٍ يَعْنِي طَبَقًا فِيهِ خَضِرَاتٌ مِنْ بُقُولٍ، فَوَجَدَ لَهَا رِيحًا فَسَأَلَ عَنْهَا أُخْبِرَ بِمَا فِيهَا مِنَ الْبُقُولِ فَقَالَ قَرِّبُوهَا فَقَرَّبُوهَا إِلَى بَعْضِ أَصْحَابِهِ كَانَ مَعَهُ، فَلَمَّا رَآهُ كَرِهَ أَكْلَهَا قَالَ"], ["q", "كُلْ، فَإِنِّي أُنَاجِي مَنْ لاَ تُنَاجِي"]], "source": "صحيح البخاري · ٧٣٥٩", "english": "Narrated Jabir bin `Abdullah:The Prophet (ﷺ) said, \"Whoever has eaten garlic or onion, should keep away from us, or should keep away from our mosque and should stay at home.\" Ibn Wahb said, \"Once a plate full of cooked vegetables was brought to the Prophet (ﷺ) at Badr. Detecting a bad smell from it, he asked about the dish and was informed of the kinds of vegetables in contained. He then said, \"Bring it near,\" and so it was brought near to one of his companions who was with him. When the Prophet (ﷺ) saw it, he disliked eating it and said (to his companion), \"Eat, for I talk in secret to ones whom you do not talk to", "source_en": "Sahih al-Bukhari · 7359"}, {"parts": [["n", "عن أَنَسٍ رضى الله عنه قَالَ قَالَ النَّبِيُّ ﷺ"], ["q", "لَوْ تَعْلَمُونَ مَا أَعْلَمُ لَضَحِكْتُمْ قَلِيلاً وَلَبَكَيْتُمْ كَثِيرًا"]], "source": "صحيح البخاري · ٦٤٨٦", "english": "Narrated Anas:The Prophet (ﷺ) said, \"If you knew that which I know, you would laugh little and weep much", "source_en": "Sahih al-Bukhari · 6486"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "لاَ يَلِجُ النَّارَ رَجُلٌ بَكَى مِنْ خَشْيَةِ اللَّهِ حَتَّى يَعُودَ اللَّبَنُ فِي الضَّرْعِ وَلاَ يَجْتَمِعُ غُبَارٌ فِي سَبِيلِ اللَّهِ وَدُخَانُ جَهَنَّمَ"]], "source": "جامع الترمذي · ١٦٣٣ · حسن صحيح", "english": "Narrated Abu Hurairah: That the Messenger of Allah (ﷺ) said, \"A man who wept out of the fear of Allah shall not enter the Fire until the milk returns to the udder; and dust in the cause of Allah and the smoke of Hell shall not come together.\" [Abu 'Eisa said:] This Hadith is Hasan Sahih. Muhammad bin 'Abdur-Rahman is freed slave of Abu Talhah, and he is from Al-Madinah", "source_en": "Jami at-Tirmidhi · 1633"}, {"parts": [["n", "عن أبي هُرَيْرَةَ، يَقُولُ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "مَنْ خَافَ أَدْلَجَ وَمَنْ أَدْلَجَ بَلَغَ الْمَنْزِلَ أَلاَ إِنَّ سِلْعَةَ اللَّهِ غَالِيَةٌ أَلاَ إِنَّ سِلْعَةَ اللَّهِ الْجَنَّةُ"]], "source": "جامع الترمذي · ٢٤٥٠ · حسن غريب", "english": "Abu Hurairah narrated that The Messenger of Allah (s.a.w) said:\"Whoever fears traveling at night - and whoever travels at night reaches his destination - Allah provides him with the most precious of goods, and indeed Allah's goods are but Paradise", "source_en": "Jami at-Tirmidhi · 2450"}, {"parts": [["n", "عن ابْنِ مَعْقِلٍ، قَالَ: دَخَلْتُ مَعَ أَبِي عَلَى عَبْدِ اللَّهِ فَسَمِعْتُهُ يَقُولُ قَالَ رَسُولُ اللَّهِ ﷺ:"], ["q", "النَّدَمُ تَوْبَةٌ"], ["n", "فَقَالَ لَهُ أَبِي: أَنْتَ سَمِعْتَ النَّبِيَّ ﷺ يَقُولُ:"], ["q", "النَّدَمُ تَوْبَةٌ"]], "source": "سنن ابن ماجه · ٤٢٥٢ · صحيح عند الألباني", "english": "It was narrated that Ibn Ma’qil said:“I entered with my father upon ‘Abdullah, and I heard him say: ‘The messenger of Allah (ﷺ) said: “Regret is repentance.” My father said: ‘Did you hear the Prophet (ﷺ) say: “Regret is repentance?” He said: ‘Yes.’”", "source_en": "Sunan Ibn Majah · 4252"}, {"parts": [["n", "عن كُنَّ لَنَعُدُّ لِرَسُولِ اللَّهِ ﷺ فِي الْمَجْلِسِ الْوَاحِدِ مِائَةَ مَرَّةٍ"], ["q", "رَبِّ اغْفِرْ لِي وَتُبْ عَلَىَّ إِنَّكَ أَنْتَ التَّوَّابُ الرَّحِيمُ"]], "source": "سنن أبي داود · ١٥١٦ · صحيح عند الألباني", "english": "Narrated Abdullah ibn Umar: We counted that the Messenger of Allah (ﷺ) would say a hundred times during a meeting: \"My Lord, forgive me and pardon me; Thou art the Pardoning and forgiving One", "source_en": "Sunan Abi Dawud · 1516"}, {"parts": [["n", "عن أَسْمَاءَ بِنْتِ عُمَيْسٍ، قَالَتْ قَالَ لِي رَسُولُ اللَّهِ ﷺ"], ["q", "أَلاَ أُعَلِّمُكِ كَلِمَاتٍ تَقُولِينَهُنَّ عِنْدَ الْكَرْبِ أَوْ فِي الْكَرْبِ اللَّهُ اللَّهُ رَبِّي لاَ أُشْرِكُ بِهِ شَيْئًا"]], "source": "سنن أبي داود · ١٥٢٥ · صحيح عند الألباني", "english": "Narrated Asma' daughter of Umays: The Messenger of Allah (ﷺ) said to me: May I not teach you phrases which you utter in distress? (These are:) \"Allah , Allah is my Lord, I do not associate anything as partner with Him.\" Abu Dawud said: The narrator Hilal is a client of 'Umar b. 'Abd al-Aziz. The name of Ja'far, a narrator, is 'Abd Allah b. Ja'far", "source_en": "Sunan Abi Dawud · 1525"}, {"parts": [["n", "عن أَنَسٍ، أَنَّ النَّبِيَّ ﷺ كَانَ يَقُولُ"], ["q", "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْبَرَصِ وَالْجُنُونِ وَالْجُذَامِ وَمِنْ سَيِّئِ الأَسْقَامِ"]], "source": "سنن أبي داود · ١٥٥٤ · صحيح عند الألباني", "english": "Narrated Anas ibn Malik: The Prophet (ﷺ) used to say: \"O Allah, I seek refuge in Thee from leprosy, madness, elephantiasis, and evil diseases", "source_en": "Sunan Abi Dawud · 1554"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، قَالَ كَانَ رَسُولُ اللَّهِ ﷺ يَقُولُ"], ["q", "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْجُوعِ فَإِنَّهُ بِئْسَ الضَّجِيعُ وَأَعُوذُ بِكَ مِنَ الْخِيَانَةِ فَإِنَّهَا بِئْسَتِ الْبِطَانَةُ"]], "source": "سنن أبي داود · ١٥٤٧ · حسن عند الألباني", "english": "Narrated AbuHurayrah: The Messenger of Allah (ﷺ) used to say: \"O Allah, I seek refuge in Thee from hunger, for it is an evil bed-fellow; and I seek refuge in Thee from treachery, for it is an evil hidden trait", "source_en": "Sunan Abi Dawud · 1547"}, {"parts": [["n", "عن حَفْصَةَ، زَوْجِ النَّبِيِّ ﷺ أَنَّ رَسُولَ اللَّهِ ﷺ كَانَ إِذَا أَرَادَ أَنْ يَرْقُدَ وَضَعَ يَدَهُ الْيُمْنَى تَحْتَ خَدِّهِ ثُمَّ يَقُولُ"], ["q", "اللَّهُمَّ قِنِي عَذَابَكَ يَوْمَ تَبْعَثُ عِبَادَكَ"]], "source": "سنن أبي داود · ٥٠٤٥ · صحيح عند الألباني", "english": "Narrated Hafsah, Ummul Mu'minin: When the Messenger of Allah (ﷺ) wanted to go to sleep, he put his right hand under his cheek and would then say three times: O Allah, guard me from Thy punishment on the day when Thou raisest up Thy servants", "source_en": "Sunan Abi Dawud · 5045"}, {"parts": [["n", "عن أَبِي الْيَسَرِ، قَالَ كَانَ رَسُولُ اللَّهِ ﷺ يَقُولُ"], ["q", "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ التَّرَدِّي وَالْهَدْمِ وَالْغَرَقِ وَالْحَرِيقِ وَأَعُوذُ بِكَ أَنْ يَتَخَبَّطَنِي الشَّيْطَانُ عِنْدَ الْمَوْتِ وَأَعُوذُ بِكَ أَنْ أَمُوتَ فِي سَبِيلِكَ مُدْبِرًا وَأَعُوذُ بِكَ أَنْ أَمُوتَ لَدِيغًا"]], "source": "سنن النسائي · ٥٥٣١ · صحيح عند الألباني", "english": "It was narrated that Abu Al-Yasar said:\"The Messenger of Allah [SAW] used to say: 'Allahumma inni a'udhu bika minat-taraddi, wal-hadmi, wal-gharaqi, wal-hariqi, wa a'udhu bika, an yatakhabbatanish-shaitanu 'indal-mawti, wa a'udhu bika an amuta fi sabilika mudbiran, wa a'udhu bika an amuta ladigha (O Allah, I seek refuge with You from being thrown from a high place or crushed beneath a falling wall, or drowning or being burned, and I seek refuge with You from being led astray by the Shaitan at the time of death, and I seek refuge with You from dying in Your cause while fleeing from the battlefield, and I seek refuge with You from dying of a scorpion sting)", "source_en": "Sunan an-Nasa'i · 5531"}, {"parts": [["n", "عن أُمِّ سَلَمَةَ، قَالَتْ مَا خَرَجَ النَّبِيُّ ﷺ مِنْ بَيْتِي قَطُّ إِلاَّ رَفَعَ طَرْفَهُ إِلَى السَّمَاءِ فَقَالَ"], ["q", "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ أَنْ أَضِلَّ أَوْ أُضَلَّ أَوْ أَزِلَّ أَوْ أُزَلَّ أَوْ أَظْلِمَ أَوْ أُظْلَمَ أَوْ أَجْهَلَ أَوْ يُجْهَلَ عَلَىَّ"]], "source": "سنن أبي داود · ٥٠٩٤ · صحيح عند الألباني", "english": "Narrated Umm Salamah, Ummul Mu'minin: The Messenger of Allah (ﷺ) never went out of my house without raising his eye to the sky and saying: \"O Allah! I seek refuge in Thee lest I stray or be led astray, or slip or made to slip, or cause injustice, or suffer injustice, or do wrong, or have wrong done to me", "source_en": "Sunan Abi Dawud · 5094"}, {"parts": [["n", "عن صَخْرٍ الْغَامِدِيِّ، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "اللَّهُمَّ بَارِكْ لأُمَّتِي فِي بُكُورِهَا"]], "source": "سنن أبي داود · ٢٦٠٦ · صحيح عند الألباني", "english": "Narrated Sakhr al-Ghamidi: The Prophet (ﷺ) said: \"O Allah, bless my people in their early mornings.\" When he sent out a detachment or an army, he sent them at the beginning of the day. Sakhr was a merchant, and he would send off his merchandise at the beginning of the day; and he became rich and had much wealth. Abu Dawud said: He is Sakhr b. Wada'ah", "source_en": "Sunan Abi Dawud · 2606"}, {"parts": [["n", "عن عَائِشَةَ رضى الله عنها قَالَتْ كَانَ النَّبِيُّ ﷺ يَقُولُ فِي رُكُوعِهِ وَسُجُودِهِ"], ["q", "سُبْحَانَكَ اللَّهُمَّ رَبَّنَا وَبِحَمْدِكَ، اللَّهُمَّ اغْفِرْ لِي"]], "source": "صحيح البخاري · ٧٩٤", "english": "Narrated `Aisha:The Prophet (ﷺ) used to say in his bowing and prostrations, \"Subhanaka l-lahumma Rabbana wa bihamdika; Allahumma ghfir li.' (Exalted [from unbecoming attributes] Are you O Allah our Lord, and by Your praise [do I exalt You]. O Allah! Forgive me", "source_en": "Sahih al-Bukhari · 794"}, {"parts": [["n", "عن عَائِشَةَ، أَنَّ النَّبِيَّ ﷺ كَانَ يَقُولُ فِي رُكُوعِهِ وَسُجُودِهِ"], ["q", "سُبُّوحٌ قُدُّوسٌ رَبُّ الْمَلاَئِكَةِ وَالرُّوحِ"]], "source": "سنن أبي داود · ٨٧٢ · صحيح عند الألباني", "english": "‘Aishah said that the prophet (ﷺ) used to say when bowing and prostrating, “All-Glorious, All-Holy, Lord of the angels and spirit", "source_en": "Sunan Abi Dawud · 872"}, {"parts": [["n", "عن عَلِيِّ بْنِ أَبِي طَالِبٍ، رضى الله عنه أَنَّ رَسُولَ اللَّهِ ﷺ كَانَ يَقُولُ فِي آخِرِ وِتْرِهِ"], ["q", "اللَّهُمَّ إِنِّي أَعُوذُ بِرِضَاكَ مِنْ سَخَطِكَ وَبِمُعَافَاتِكَ مِنْ عُقُوبَتِكَ وَأَعُوذُ بِكَ مِنْكَ لاَ أُحْصِي ثَنَاءً عَلَيْكَ أَنْتَ كَمَا أَثْنَيْتَ عَلَى نَفْسِكَ"]], "source": "سنن أبي داود · ١٤٢٧ · صحيح عند الألباني", "english": "Narrated Ali ibn AbuTalib: The Messenger of Allah (ﷺ) used to say at the end of his witr: \"O Allah, I seek refuge in Thy good pleasure from Thy anger, and in Thy forgiveness from Thy punishment, and I seek refuge in Thy mercy from Thy wrath. I cannot reckon the praise due to Thee. Thou art as Thou hast praised Thyself.\" Abu Dawud said: Hisham is the earliest teacher of Hammad. Yahya b. Ma'in said: No one is reported to have narrated traditions form him except Hammad b. Salamah. Abu Dawud said: Ubayy b. Ka'b said: The Messenger of Allah (ﷺ) recited supplication in the witr before bowing. Abu Dawud said: This tradition has also been narrated by 'Isa b. Yunus through a different chain of narrators from Ubayy b. Ka'b. He also narrated it through a different chain of narrators on the authority of Ubayy b. Ka'b that the Messenger of Allah (ﷺ) recited the supplication in the witr before bowing. Abu Dawud said: The chain of narrators of the tradition of Sa'id from Qatadah goes: Yazid b. Zurai' narrated from Sa'id, from Qatadah, from 'Azrah, from Sa'id b. 'Abd al-Rahman b. Abza, on the authority of his father, from the Prophet (ﷺ). This version does not mention the supplication and the name of Ubayy. This tradition has also been narrated by 'Abd al-A'la and Muhammad b. Bishr al-'Abdi. He heard the traditions from 'Isa b. Yunus at Kufah. They did not mention the supplication in their version. This tradition has also been narrated by Hisham al-Dastuwa'i and Shu'bah from Qatadah. They did not mention the supplication in their version. The tradition of Zubaid has been narrated by Sulaiman al-A'mash, Shu'bah, 'Abd al-Malik b. Abi Sulaiman, and Jarir b. Hazim; all of them narrated on the authority of Zubaid. None of them mention the supplication in his version, except in the tradition transmitted by Hafs b. Ghiyath from Mis'ar from Zubaid; he narrated in his version that he (the Prophet) recited supplication before bowing. Abu Dawud said: This version of tradition is not well know. There is doubt that Hafs might have narrated this tradition from some other narrator than Mis'ar. Abu Dawud said: It is reported that Ubayy (b. Ka'b) used to recited the supplication )in the witr) in the second half of Ramadan", "source_en": "Sunan Abi Dawud · 1427"}, {"parts": [["n", "عن أبي إِبْرَاهِيمَ الأَشْهَلِيُّ، عَنْ أَبِيهِ، قَالَ كَانَ رَسُولُ اللَّهِ ﷺ إِذَا صَلَّى عَلَى الْجَنَازَةِ قَالَ"], ["q", "اللَّهُمَّ اغْفِرْ لِحَيِّنَا وَمَيِّتِنَا وَشَاهِدِنَا وَغَائِبِنَا وَصَغِيرِنَا وَكَبِيرِنَا وَذَكَرِنَا وَأُنْثَانَا"]], "source": "جامع الترمذي · ١٠٢٤ · حسن صحيح", "english": "Abu Ibrahim Al-Ashhali narrated :from his father who said: \"When the Messenger of Allah would perform the Salat for the funeral he would said: (Allahammaghfir li-hayyina wa mayyittina, wa shahidina wa gha'ibina, wa saghirina wa kabirina, wa dhakarina wa unthana) 'O Allah! Forgive our living and our deceased, our present and our absent, our young and our old, our male and our female", "source_en": "Jami at-Tirmidhi · 1024"}, {"parts": [["n", "عن أَنَسٍ، أَنَّ النَّبِيَّ ﷺ جَاءَ إِلَى سَعْدِ بْنِ عُبَادَةَ فَجَاءَ بِخُبْزٍ وَزَيْتٍ فَأَكَلَ ثُمَّ قَالَ النَّبِيُّ ﷺ"], ["q", "أَفْطَرَ عِنْدَكُمُ الصَّائِمُونَ وَأَكَلَ طَعَامَكُمُ الأَبْرَارُ وَصَلَّتْ عَلَيْكُمُ الْمَلاَئِكَةُ"]], "source": "سنن أبي داود · ٣٨٥٤ · صحيح عند الألباني", "english": "Narrated Anas ibn Malik: The Prophet (ﷺ) came to visit Sa'd ibn Ubaydah, and he brought bread and olive oil, and he ate (them). Them). Then the Prophet (ﷺ) said: May the fasting (men) break their fast with you, and the pious eat your food, and the angels pray for blessing on you", "source_en": "Sunan Abi Dawud · 3854"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، أَنَّ النَّبِيَّ ﷺ كَانَ إِذَا رَفَّأَ الإِنْسَانَ إِذَا تَزَوَّجَ قَالَ"], ["q", "بَارَكَ اللَّهُ لَكَ وَبَارَكَ عَلَيْكَ وَجَمَعَ بَيْنَكُمَا فِي خَيْرٍ"]], "source": "سنن أبي داود · ٢١٣٠ · صحيح عند الألباني", "english": "Narrated AbuHurayrah: When the Prophet (ﷺ) congratulated a man on his marriage, he said: May Allah bless for you, and may He bless on you, and combine both of you in good (works)", "source_en": "Sunan Abi Dawud · 2130"}, {"parts": [["n", "عن أَبِي سَعِيدٍ الْخُدْرِيِّ، قَالَ كَانَ رَسُولُ اللَّهِ ﷺ إِذَا اسْتَجَدَّ ثَوْبًا سَمَّاهُ بِاسْمِهِ إِمَّا قَمِيصًا أَوْ عِمَامَةً ثُمَّ يَقُولُ"], ["q", "اللَّهُمَّ لَكَ الْحَمْدُ أَنْتَ كَسَوْتَنِيهِ أَسْأَلُكَ مِنْ خَيْرِهِ وَخَيْرِ مَا صُنِعَ لَهُ وَأَعُوذُ بِكَ مِنْ شَرِّهِ وَشَرِّ مَا صُنِعَ لَهُ"]], "source": "سنن أبي داود · ٤٠٢٠ · صحيح عند الألباني", "english": "Narrated AbuSa'id al-Khudri: When the Messenger of Allah (ﷺ) put on a new garment he mentioned it by name, turban or shirt, and would then say: O Allah, praise be to Thee! as Thou hast clothed me with it, I ask Thee for its good and the good of that for which it was made, and I seek refuge in Thee from its evil and the evil of that for which it was made. Abu Nadrah said: When any of the Companions of the Prophet (ﷺ) put on a new garment, he was told: May you wear it out and may Allah give you another in its place", "source_en": "Sunan Abi Dawud · 4020"}, {"parts": [["n", "عن أُمَّهُ، مَاتَتْ فَقَالَ يَا رَسُولَ اللَّهِ إِنَّ أُمِّي مَاتَتْ أَفَأَتَصَدَّقُ عَنْهَا قَالَ"], ["q", "نَعَمْ"], ["n", "قَالَ فَأَىُّ الصَّدَقَةِ أَفْضَلُ قَالَ"], ["q", "سَقْىُ الْمَاءِ"]], "source": "سنن النسائي · ٣٦٦٦ · حسن عند الألباني", "english": "It was narrated from Sa'd bin 'Ubadah that his mother died. He said:\"O Messenger of Allah, my mother has died; can I give charity on her behalf?\" He said: \"Yes.\" He said: \"What kind of charity is best?\" He said: \"Providing drinking water.\" And that is the drinking-fountain of Sa'd in Al-Madinah", "source_en": "Sunan an-Nasa'i · 3666"}, {"parts": [["n", "عن أَنَسٍ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "مَا كَانَ الْفُحْشُ فِي شَيْءٍ إِلاَّ شَانَهُ وَمَا كَانَ الْحَيَاءُ فِي شَيْءٍ إِلاَّ زَانَهُ"]], "source": "جامع الترمذي · ١٩٧٤ · حسن غريب", "english": "Anas narrated that the Messenger of Allah said:\"Al-Fuhsh is not present in anything but it mars it, and Al-Haya' is not present in anything but it beautifies it", "source_en": "Jami at-Tirmidhi · 1974"}, {"parts": [["n", "عن سَمُرَةَ بْنِ جُنْدَبٍ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "لاَ تَلاَعَنُوا بِلَعْنَةِ اللَّهِ وَلاَ بِغَضَبِهِ وَلاَ بِالنَّارِ"]], "source": "جامع الترمذي · ١٩٧٦ · حسن صحيح", "english": "Samurah bin Jundab narrated that the Messenger of Allah said:\"Do not curse yourselves with Allah's curse, nor with His anger, nor with the Fire", "source_en": "Jami at-Tirmidhi · 1976"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "لاَ يَنْبَغِي لِصِدِّيقٍ أَنْ يَكُونَ لَعَّانًا"]], "source": "صحيح مسلم · ٢٥٩٧", "english": "Abu Huraira reported that a person had intercourse with his wife during Ramadan (while fasting). He asked for the religious verdict (about it) from the Messenger of Allah (ﷺ), whereupon he (the Holy Prophet) said:Can you find a slave (to grant him freedom)? He said: No. He (the Prophet again) said: Can you afford to observe fasts for two (consecutive) months? He said: No. He (the Holy Prophet) said: Then feed sixty poor men", "source_en": "Sahih Muslim · 2597"}, {"parts": [["n", "عن أَبِي الدَّرْدَاءِ، سَمِعْتُ رَسُولَ اللَّهِ ﷺ يَقُولُ"], ["q", "إِنَّ اللَّعَّانِينَ لاَ يَكُونُونَ شُهَدَاءَ وَلاَ شُفَعَاءَ يَوْمَ الْقِيَامَةِ"]], "source": "صحيح مسلم · ٢٥٩٨", "english": "This hadith has been narrated on the authority of Zuhri with the same chain of transmitters that a person broke fast in Ramadan whereupon the Messenger of Allah (ﷺ) commanded him to free a slave (as an atonement), and the rest of the hadith is the same as narrated by Ibn Uyaina", "source_en": "Sahih Muslim · 2598"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ رضى الله عنه أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "إِذَا قَالَ الرَّجُلُ لأَخِيهِ يَا كَافِرُ فَقَدْ بَاءَ بِهِ أَحَدُهُمَا"]], "source": "صحيح البخاري · ٦١٠٣", "english": "Narrated Abu Huraira: Allah's Messenger (ﷺ) said, \"If a man says to his brother, O Kafir (disbeliever)!' Then surely one of them is such (i.e., a Kafir)", "source_en": "Sahih al-Bukhari · 6103"}, {"parts": [["n", "عن عَبْدِ اللَّهِ رضى الله عنه أَنَّ النَّبِيَّ ﷺ قَالَ"], ["q", "مَنْ كَانَ حَالِفًا فَلْيَحْلِفْ بِاللَّهِ أَوْ لِيَصْمُتْ"]], "source": "صحيح البخاري · ٢٦٧٩", "english": "Narrated `Abdullah:The Prophet (ﷺ) said, \"Whoever has to take an oath should swear by Allah or remain silent.\" (i.e. He should not swear by other than Allah)", "source_en": "Sahih al-Bukhari · 2679"}, {"parts": [["n", "عن أبي هُرَيْرَةَ رضى الله عنه قَالَ سَمِعْتُ رَسُولَ اللَّهِ ﷺ يَقُولُ"], ["q", "الْحَلِفُ مُنَفِّقَةٌ لِلسِّلْعَةِ مُمْحِقَةٌ لِلْبَرَكَةِ"]], "source": "صحيح البخاري · ٢٠٨٧", "english": "Narrated Abu Huraira:I heard Allah's Messenger (ﷺ) saying, \"The swearing (by the seller) may persuade the buyer to purchase the goods but that will be deprived of Allah's blessing", "source_en": "Sahih al-Bukhari · 2087"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "مَنْ حَلَفَ عَلَى يَمِينٍ فَرَأَى غَيْرَهَا خَيْرًا مِنْهَا فَلْيَأْتِ الَّذِي هُوَ خَيْرٌ وَلْيُكَفِّرْ عَنْ يَمِينِهِ"]], "source": "صحيح مسلم · ١٦٥٠", "english": "Ibn Buhaina reported:The dawn prayer had commenced when the Messen- ger of Allah (ﷺ) saw a person observing prayer, whereas the Mu'adhdhin had pronounced the Iqama. Upon this he (the Holy Prophet) remarked: Do you say four (rak'ahs) of Fard in the dawn prayer?", "source_en": "Sahih Muslim · 1650"}, {"parts": [["n", "عن أَنَسِ بْنِ مَالِكٍ، أَنَّ رَسُولَ اللَّهِ ﷺ كَانَ إِذَا أَكَلَ طَعَامًا لَعِقَ أَصَابِعَهُ الثَّلاَثَ وَقَالَ"], ["q", "إِذَا سَقَطَتْ لُقْمَةُ أَحَدِكُمْ فَلْيُمِطْ عَنْهَا الأَذَى وَلْيَأْكُلْهَا وَلاَ يَدَعْهَا لِلشَّيْطَانِ"], ["n", "وَأَمَرَنَا أَنْ نَسْلُتَ الصَّحْفَةَ وَقَالَ"], ["q", "إِنَّ أَحَدَكُمْ لاَ يَدْرِي فِي أَىِّ طَعَامِهِ يُبَارَكُ لَهُ"]], "source": "سنن أبي داود · ٣٨٤٥ · صحيح عند الألباني", "english": "Anas b. Malik said that when the Messenger of Allah (ﷺ) ate food, he licked his three fingers. And he said:If the morsel of one of you falls down, he should wipe away anything injurious on it and eat it and not leave it for the devil. And he ordered us to clean the dish, for one of you does not leave it for the devil. And he ordered us to clean the dish, for one of you does not know in what part of his food the blessing lies", "source_en": "Sunan Abi Dawud · 3845"}, {"parts": [["n", "عن عَائِشَةَ، قَالَتْ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "يَا عَائِشَةُ بَيْتٌ لاَ تَمْرَ فِيهِ جِيَاعٌ أَهْلُهُ يَا عَائِشَةُ بَيْتٌ لاَ تَمْرَ فِيهِ جِيَاعٌ أَهْلُهُ أَوْ جَاعَ أَهْلُهُ"]], "source": "صحيح مسلم · ٢٠٤٦", "english": "Ibn 'Abbas reported:I bear testimony to the Messenger of Allah (ﷺ) offering prayer before Kbutba. He (after saying prayer) delivered the Kutba, and he found that the women could not hear it, so he came to them and exhorted them and preached them and commanded them to give alms, and Bilal had stretched his cloth and the women were throwing rings, earrings and other things. This hadith has been narrated on the authority of Ayyub with the same chain of transmitters", "source_en": "Sahih Muslim · 2046"}, {"parts": [["n", "عن ابْنِ عَبَّاسٍ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "الْبَسُوا مِنْ ثِيَابِكُمُ الْبَيَاضَ فَإِنَّهَا مِنْ خَيْرِ ثِيَابِكُمْ وَكَفِّنُوا فِيهَا مَوْتَاكُمْ وَإِنَّ خَيْرَ أَكْحَالِكُمُ الإِثْمِدُ يَجْلُو الْبَصَرَ وَيُنْبِتُ الشَّعْرَ"]], "source": "سنن أبي داود · ٣٨٧٨ · صحيح عند الألباني", "english": "Narrated Abdullah ibn Abbas: The Prophet (ﷺ) said: Wear your white garments, for they are among your best garments, and shroud your dead in them. Among the best types of collyrium you use is antimony (ithmid): it clears the vision and makes the hair sprout", "source_en": "Sunan Abi Dawud · 3878"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ رضى الله عنه أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "إِذَا انْتَعَلَ أَحَدُكُمْ فَلْيَبْدَأْ بِالْيَمِينِ وَإِذَا نَزَعَ فَلْيَبْدَأْ بِالشِّمَالِ، لِتَكُنِ الْيُمْنَى أَوَّلَهُمَا تُنْعَلُ وَآخِرَهُمَا تُنْزَعُ"]], "source": "صحيح البخاري · ٥٨٥٥", "english": "Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"If you want to put on your shoes, put on the right shoe first; and if you want to take them off, take the left one first. Let the right shoe be the first to be put on and the last to be taken off", "source_en": "Sahih al-Bukhari · 5855"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "مَنْ كَانَ لَهُ شَعْرٌ فَلْيُكْرِمْهُ"]], "source": "سنن أبي داود · ٤١٦٣ · حسن صحيح عند الألباني", "english": "Narrated AbuHurayrah: The Prophet (ﷺ) said: He who has hair should honour it", "source_en": "Sunan Abi Dawud · 4163"}, {"parts": [["n", "عن أَنَسٍ رضى الله عنه عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "اللَّهُمَّ اجْعَلْ بِالْمَدِينَةِ ضِعْفَىْ مَا جَعَلْتَ بِمَكَّةَ مِنَ الْبَرَكَةِ"]], "source": "صحيح البخاري · ١٨٨٥", "english": "Narrated Anas:The Prophet (ﷺ) said, \"O Allah! Bestow on Medina twice the blessings You bestowed on Mecca", "source_en": "Sahih al-Bukhari · 1885"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "عَلَى أَنْقَابِ الْمَدِينَةِ مَلاَئِكَةٌ، لاَ يَدْخُلُهَا الطَّاعُونُ وَلاَ الدَّجَّالُ"]], "source": "صحيح البخاري · ٧١٣٣", "english": "Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"There are angels at the mountain passes of Medina (so that) neither plague nor Ad-Dajjal can enter it", "source_en": "Sahih al-Bukhari · 7133"}, {"parts": [["n", "عن جَابِرَ بْنَ عَبْدِ اللَّهِ، يَقُولُ سَمِعْتُ رَسُولَ اللَّهِ ﷺ يَقُولُ"], ["q", "مَاءُ زَمْزَمَ لِمَا شُرِبَ لَهُ"]], "source": "سنن ابن ماجه · ٣٠٦٢ · صحيح عند الألباني", "english": "It was narrated that Jabir bin ‘Abdullah said:“I heard the Messenger of Allah (ﷺ) say: ‘The water of Zamzam is for whatever it is drunk for.’”", "source_en": "Sunan Ibn Majah · 3062"}, {"parts": [["n", "عن عَائِشَةَ رضى الله عنها أَنَّهَا قَالَتْ يَا رَسُولَ اللَّهِ تُرَى الْجِهَادَ أَفْضَلَ الْعَمَلِ، أَفَلاَ نُجَاهِدُ قَالَ"], ["q", "لَكِنَّ أَفْضَلَ الْجِهَادِ حَجٌّ مَبْرُورٌ"]], "source": "صحيح البخاري · ٢٧٨٤", "english": "Narrated `Aisha:(That she said), \"O Allah's Messenger (ﷺ)! We consider Jihad as the best deed. Should we not fight in Allah's Cause?\" He said, \"The best Jihad (for women) is Hajj-Mabrur (i.e. Hajj which is done according to the Prophet's tradition and is accepted by Allah)", "source_en": "Sahih al-Bukhari · 2784"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ رضى الله عنه أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "الشُّهَدَاءُ خَمْسَةٌ الْمَطْعُونُ، وَالْمَبْطُونُ، وَالْغَرِقُ وَصَاحِبُ الْهَدْمِ، وَالشَّهِيدُ فِي سَبِيلِ اللَّهِ"]], "source": "صحيح البخاري · ٢٨٢٩", "english": "Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"Five are regarded as martyrs: They are those who die because of plague, Abdominal disease, drowning or a falling building etc., and the martyrs in Allah's Cause", "source_en": "Sahih al-Bukhari · 2829"}, {"parts": [["n", "عن سُلَيْمَانَ بْنِ بُرَيْدَةَ، عَنْ أَبِيهِ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "مَنْ قُتِلَ دُونَ مَالِهِ فَهُوَ شَهِيدٌ"]], "source": "سنن النسائي · ٤٠٩٢ · صحيح عند الألباني", "english": "It was narrated from Sulaiman bin Buraidah that his father said:\"The Messenger of Allah [SAW] said: 'Whoever is killed defending his wealth, he is a martyr", "source_en": "Sunan an-Nasa'i · 4092"}, {"parts": [["n", "عن أَبِي الدَّرْدَاءِ، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "مَا مِنْ شَىْءٍ أَثْقَلُ فِي الْمِيزَانِ مِنْ حُسْنِ الْخُلُقِ"]], "source": "سنن أبي داود · ٤٧٩٩ · صحيح عند الألباني", "english": "Narrated AbudDarda': The Prophet (ﷺ) said: There is nothing heavier than good character put in the scale of a believer on the Day of Resurrection. Abu al-Walid said: I heard 'Ata al-Kaikharani say: Abu Dawud said: His name is 'Ata b. Ya'qub. He is the maternal uncle of Ibrahim b. Nafi'. He is called Kaikharani or Kukharani", "source_en": "Sunan Abi Dawud · 4799"}, {"parts": [["n", "عن عِمْرَانَ بْنِ حُصَيْنٍ، قَالَ كَانَ بِيَ النَّاصُورُ فَسَأَلْتُ النَّبِيَّ ﷺ فَقَالَ"], ["q", "صَلِّ قَائِمًا فَإِنْ لَمْ تَسْتَطِعْ فَقَاعِدًا فَإِنْ لَمْ تَسْتَطِعْ فَعَلَى جَنْبٍ"]], "source": "سنن أبي داود · ٩٥٢ · صحيح عند الألباني", "english": "‘Imran b. Husain said :I had a fistula; so I asked the prophet (ﷺ). He said: offer prayer in standing condition; if you are unable to do so, then in sitting condition: if you are then at your side(i.e, in lying condition)", "source_en": "Sunan Abi Dawud · 952"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "دَعُونِي مَا تَرَكْتُكُمْ، إِنَّمَا هَلَكَ مَنْ كَانَ قَبْلَكُمْ بِسُؤَالِهِمْ وَاخْتِلاَفِهِمْ عَلَى أَنْبِيَائِهِمْ، فَإِذَا نَهَيْتُكُمْ عَنْ شَىْءٍ فَاجْتَنِبُوهُ، وَإِذَا أَمَرْتُكُمْ بِأَمْرٍ فَأْتُوا مِنْهُ مَا اسْتَطَعْتُمْ"]], "source": "صحيح البخاري · ٧٢٨٨", "english": "Narrated Abu Huraira:The Prophet (ﷺ) said, \"Leave me as I leave you, for the people who were before you were ruined because of their questions and their differences over their prophets. So, if I forbid you to do something, then keep away from it. And if I order you to do something, then do of it as much as you can", "source_en": "Sahih al-Bukhari · 7288"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ رضى الله عنه أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "لاَ يَقُولَنَّ أَحَدُكُمُ اللَّهُمَّ اغْفِرْ لِي، اللَّهُمَّ ارْحَمْنِي، إِنْ شِئْتَ. لِيَعْزِمِ الْمَسْأَلَةَ، فَإِنَّهُ لاَ مُكْرِهَ لَهُ"]], "source": "صحيح البخاري · ٦٣٣٩", "english": "Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"None of you should say: 'O Allah, forgive me if You wish; O Allah, be merciful to me if You wish,' but he should always appeal to Allah with determination, for nobody can force Allah to do something against His Will", "source_en": "Sahih al-Bukhari · 6339"}, {"parts": [["n", "عن عُبَادَةَ بْنَ الصَّامِتِ، حَدَّثَهُمْ أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "مَا عَلَى الأَرْضِ مُسْلِمٌ يَدْعُو اللَّهَ بِدَعْوَةٍ إِلاَّ آتَاهُ اللَّهُ إِيَّاهَا أَوْ صَرَفَ عَنْهُ مِنَ السُّوءِ مِثْلَهَا مَا لَمْ يَدْعُ بِمَأْثَمٍ أَوْ قَطِيعَةِ رَحِمٍ"], ["n", "فَقَالَ رَجُلٌ مِنَ الْقَوْمِ إِذًا نُكْثِرَ. قَالَ"], ["q", "اللَّهُ أَكْثَرُ"]], "source": "جامع الترمذي · ٣٥٧٣ · حسن صحيح", "english": "Jubair bin Nufair narrated that `Ubadah bin As-Samit narrated to them that, the Messenger of Allah (ﷺ) said:“There is not a Muslim upon the earth who calls upon Allah with any supplication, except that Allah grants it to him, or he turns away from him the like of it in evil; as long as he does not supplicate for something sinful, or the severing of the ties of kinship.” So a man from the people said: “What if we should increase (in it)” He (ﷺ) said: “(With) Allah is more.”", "source_en": "Jami at-Tirmidhi · 3573"}, {"parts": [["n", "عن ابْنِ عَبَّاسٍ، أَنَّ النَّبِيَّ ﷺ كَشَفَ السِّتَارَةَ وَالنَّاسُ صُفُوفٌ خَلْفَ أَبِي بَكْرٍ فَقَالَ"], ["q", "يَا أَيُّهَا النَّاسُ إِنَّهُ لَمْ يَبْقَ مِنْ مُبَشِّرَاتِ النُّبُوَّةِ إِلاَّ الرُّؤْيَا الصَّالِحَةُ يَرَاهَا الْمُسْلِمُ أَوْ تُرَى لَهُ وَإِنِّي نُهِيتُ أَنْ أَقْرَأَ رَاكِعًا أَوْ سَاجِدًا فَأَمَّا الرُّكُوعُ فَعَظِّمُوا الرَّبَّ فِيهِ وَأَمَّا السُّجُودُ فَاجْتَهِدُوا فِي الدُّعَاءِ فَقَمِنٌ أَنْ يُسْتَجَابَ لَكُمْ"]], "source": "سنن أبي داود · ٨٧٦ · صحيح عند الألباني", "english": "Ibn ‘Abbas said:The Prophet(ﷺ) lifted the curtain (and saw that) the people were standing in rows(of prayers) behind Abu Bakr. He said: O people, there remained nothing that gives good tidings from prophethood except a true dream which a Muslim has himself or which another Muslim has for him. I have been prohibited to recite the Qur’an while bowing or prostration. As regards owing, exalt the Lord in it, and as to prostration, make supplication with exertion in it, that is worthy of being accepted", "source_en": "Sunan Abi Dawud · 876"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "إِذَا قَرَأَ ابْنُ آدَمَ السَّجْدَةَ فَسَجَدَ اعْتَزَلَ الشَّيْطَانُ يَبْكِي يَقُولُ يَا وَيْلَهُ - وَفِي رِوَايَةِ أَبِي كُرَيْبٍ يَا وَيْلِي - أُمِرَ ابْنُ آدَمَ بِالسُّجُودِ فَسَجَدَ فَلَهُ الْجَنَّةُ وَأُمِرْتُ بِالسُّجُودِ فَأَبَيْتُ فَلِيَ النَّارُ"]], "source": "صحيح مسلم · ٨١"}, {"parts": [["n", "عن جَابِرٍ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "إِذَا قَضَى أَحَدُكُمُ الصَّلاَةَ فِي مَسْجِدِهِ فَلْيَجْعَلْ لِبَيْتِهِ نَصِيبًا مِنْ صَلاَتِهِ فَإِنَّ اللَّهَ جَاعِلٌ فِي بَيْتِهِ مِنْ صَلاَتِهِ خَيْرًا"]], "source": "صحيح مسلم · ٧٧٨", "english": "Abu Sa'id al-Khudri reported:The Messenger of Allah (ﷺ) happened to pass by (the house) of a man amongst the Ansar, and he sent for him. He came out and water was trickling down from his head. Upon this he (the Holy Prophet) said: Perhaps we put you to haste. He said: Yes. Messenger of Allah. He (the Holy Prophet) said: When you made haste or semen is not emitted, bathing is not obligatory for you, but ablution is binding. Ibn Bashshir has narrated it with a minor alteration", "source_en": "Sahih Muslim · 778"}, {"parts": [["n", "عن عَبْدِ اللَّهِ بْنِ مُغَفَّلٍ، قَالَ قَالَ النَّبِيُّ ﷺ"], ["q", "بَيْنَ كُلِّ أَذَانَيْنِ صَلاَةٌ بَيْنَ كُلِّ أَذَانَيْنِ صَلاَةٌ ثُمَّ قَالَ فِي الثَّالِثَةِ لِمَنْ شَاءَ"]], "source": "صحيح البخاري · ٦٢٧", "english": "Narrated `Abdullah bin Mughaffal:The prophet said, \"There is a prayer between the two Adhans (Adhan and Iqama), there is a prayer between the two Adhans.\" And then while saying it the third time he added, \"For the one who wants to (pray)", "source_en": "Sahih al-Bukhari · 627"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "إِذَا أَتَاكُمْ مَنْ تَرْضَوْنَ خُلُقَهُ وَدِينَهُ فَزَوِّجُوهُ إِلاَّ تَفْعَلُوا تَكُنْ فِتْنَةٌ فِي الأَرْضِ وَفَسَادٌ عَرِيضٌ"]], "source": "سنن ابن ماجه · ١٩٦٧ · حسن عند الألباني", "english": "It was narrated from Abu Hurairah:that the Messenger of Allah said: \"If there comes to you one with whose character and religious commitment you are pleased, then marry (your daughter or female relative under your care) to him, for if you do not do that there will be Fitnah in the land and widespread corruption", "source_en": "Sunan Ibn Majah · 1967"}, {"parts": [["n", "عن أَنَسٍ، قَالَ لَمَّا قَدِمَ عَلَيْنَا عَبْدُ الرَّحْمَنِ فَآخَى النَّبِيُّ ﷺ بَيْنَهُ وَبَيْنَ سَعْدِ بْنِ الرَّبِيعِ فَقَالَ النَّبِيُّ ﷺ"], ["q", "أَوْلِمْ وَلَوْ بِشَاةٍ"]], "source": "صحيح البخاري · ٦٠٨٢", "english": "Narrated Anas:When `Abdur-Rahman came to us, the Prophet (ﷺ) established a bond of brotherhood between him and Sa`d bin Ar-Rabi`. Once the Prophet (ﷺ) said, \"As you (O `Abdur-Rahman) have married, give a wedding banquet even if with one sheep", "source_en": "Sahih al-Bukhari · 6082"}, {"parts": [["n", "عن عَبْدِ اللَّهِ بْنِ عُمَرَ رضى الله عنهما أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "إِذَا دُعِيَ أَحَدُكُمْ إِلَى الْوَلِيمَةِ فَلْيَأْتِهَا"]], "source": "صحيح البخاري · ٥١٧٣", "english": "Narrated `Abdullah bin `Umar:Allah's Messenger (ﷺ) said, \"If anyone of you is invited to a wedding banquet, he must go for it (accept the invitation)", "source_en": "Sahih al-Bukhari · 5173"}, {"parts": [["n", "عن عَبْدِ الرَّحْمَنِ بْنِ أَبِي بَكْرَةَ، عَنْ أَبِيهِ رضى الله عنه قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "أَلاَ أُنَبِّئُكُمْ بِأَكْبَرِ الْكَبَائِرِ"], ["n", "قُلْنَا بَلَى يَا رَسُولَ اللَّهِ. قَالَ"], ["q", "الإِشْرَاكُ بِاللَّهِ، وَعُقُوقُ الْوَالِدَيْنِ"], ["n", "وَكَانَ مُتَّكِئًا فَجَلَسَ فَقَالَ"], ["q", "أَلاَ وَقَوْلُ الزُّورِ وَشَهَادَةُ الزُّورِ، أَلاَ وَقَوْلُ الزُّورِ وَشَهَادَةُ الزُّورِ"]], "source": "صحيح البخاري · ٥٩٧٦", "english": "Narrated Abu Bakra:Allah's Messenger (ﷺ) said thrice, \"Shall I not inform you of the biggest of the great sins?\" We said, \"Yes, O Allah's Messenger (ﷺ)\" He said, \"To join partners in worship with Allah: to be undutiful to one's parents.\" The Prophet (ﷺ) sat up after he had been reclining and added, \"And I warn you against giving forged statement and a false witness; I warn you against giving a forged statement and a false witness.\" The Prophet kept on saying that warning till we thought that he would not stop", "source_en": "Sahih al-Bukhari · 5976"}, {"parts": [["n", "عن عَائِشَةَ، قَالَتْ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "مَا يُصِيبُ الْمُؤْمِنَ مِنْ شَوْكَةٍ فَمَا فَوْقَهَا إِلاَّ رَفَعَهُ اللَّهُ بِهَا دَرَجَةً أَوْ حَطَّ عَنْهُ بِهَا خَطِيئَةً"]], "source": "صحيح مسلم · ٢٥٧٢", "english": "A'isha (Allah be pleased with her) said:The Apostle of Allah (ﷺ) forbade them (his Companions) to observe Saum Wisal out of mercy for them. They said: You (Holy Prophet) yourself observe it. Upon this he said: I am not like you. My Lord feeds me and provides me drink", "source_en": "Sahih Muslim · 2572"}, {"parts": [["n", "عن جَابِرُ بْنُ عَبْدِ اللَّهِ، أَنَّ رَسُولَ اللَّهِ ﷺ دَخَلَ عَلَى أُمِّ السَّائِبِ أَوْ أُمِّ الْمُسَيَّبِ فَقَالَ"], ["q", "مَا لَكِ يَا أُمَّ السَّائِبِ أَوْ يَا أُمَّ الْمُسَيَّبِ تُزَفْزِفِينَ"], ["n", "قَالَتِ الْحُمَّى لاَ بَارَكَ اللَّهُ فِيهَا. فَقَالَ"], ["q", "لاَ تَسُبِّي الْحُمَّى فَإِنَّهَا تُذْهِبُ خَطَايَا بَنِي آدَمَ كَمَا يُذْهِبُ الْكِيرُ خَبَثَ الْحَدِيدِ"]], "source": "صحيح مسلم · ٢٥٧٥", "english": "A'isha reported:Allah's Messenger (ﷺ) used to kiss me while observing fast; and who among you can control his desire as the Messenger of Allah (ﷺ) could control his desire", "source_en": "Sahih Muslim · 2575"}, {"parts": [["n", "عن ابْنِ عَبَّاسٍ، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "مَنْ عَادَ مَرِيضًا لَمْ يَحْضُرْ أَجَلُهُ فَقَالَ عِنْدَهُ سَبْعَ مِرَارٍ أَسْأَلُ اللَّهَ الْعَظِيمَ رَبَّ الْعَرْشِ الْعَظِيمِ أَنْ يَشْفِيَكَ إِلاَّ عَافَاهُ اللَّهُ مِنْ ذَلِكَ الْمَرَضِ"]], "source": "سنن أبي داود · ٣١٠٦ · صحيح عند الألباني", "english": "Narrated Abdullah ibn Abbas: The Prophet (ﷺ) said: If anyone visits a sick whose time (of death) has not come, and says with him seven times: I ask Allah, the Mighty, the Lord of the mighty Throne, to cure you, Allah will cure him from that disease", "source_en": "Sunan Abi Dawud · 3106"}, {"parts": [["n", "عن جِبْرَائِيلَ، أَتَى النَّبِيَّ ﷺ فَقَالَ يَا مُحَمَّدُ اشْتَكَيْتَ قَالَ"], ["q", "نَعَمْ"]], "source": "سنن ابن ماجه · ٣٥٢٣ · صحيح عند الألباني", "english": "It was narrated from Abu Sa’eed that Jibra’il came to the Prophet (ﷺ) and said:“O Muhammad, you are ill. He said: ‘Yes.’ He said: Bismillahi arqika, min kulli shay’in yu’dhika, min sharri kulli nafsin aw ‘aynin aw hasidin. Allahu yashfika, bismillahi arqika (In the Name of Allah I perform Ruqyah for you, from everything that is harming you, from the evil of every soul or envious eye, may Allah heal you. In the Name of Allah I perform Ruqyah for you)", "source_en": "Sunan Ibn Majah · 3523"}, {"parts": [["n", "عن عُقْبَةَ بْنِ عَامِرٍ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "أَلَمْ تَرَ آيَاتٍ أُنْزِلَتِ اللَّيْلَةَ لَمْ يُرَ مِثْلُهُنَّ قَطُّ ﴿ قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ﴾ وَ ﴿ قُلْ أَعُوذُ بِرَبِّ النَّاسِ﴾"]], "source": "صحيح مسلم · ٨١٤", "english": "Abu al-Khair reported:I saw Ibn Wa'la al-Saba'i wear a fur. I touched it. He said: Why do you touch it? I asked Ibn 'Abbas saying: We are the inhabitants of the western regions, and there (live) with us Berbers and Magians. They bring with them rams and slaughter them, but we do not eat (the meat of the animals) slaughtered by them, and they come with skins full of fat. Upon this Ibn 'Abbas said: We asked the Messenger of Allah (ﷺ) about this and he said: Its tanning makes it pure", "source_en": "Sahih Muslim · 814"}, {"parts": [["n", "عن جَابِرِ بْنِ عَبْدِ اللَّهِ الأَنْصَارِيِّ، قَالَ سَمِعْتُ رَسُولَ اللَّهِ ﷺ قَبْلَ مَوْتِهِ بِثَلاَثَةِ أَيَّامٍ يَقُولُ"], ["q", "لاَ يَمُوتَنَّ أَحَدُكُمْ إِلاَّ وَهُوَ يُحْسِنُ الظَّنَّ بِاللَّهِ عَزَّ وَجَلَّ"]], "source": "صحيح مسلم · ٢٨٧٧", "english": "Ka'b b. 'Ujra (Allah be pleased with him) reported:The Messenger of Allah (ﷺ) came to me on the occasion of Hudaibiya and I was kindling fire under my cooking pot and lice were creeping on my face. Thereupon he (the Holy Prophet) said: Do the vermins harm your head? I said: Yes. He said: Get your head shaved and (in lieu of it) observe fasts for three days or feed six needy persons, or offer sacrifice (of an animal). Ayyub said: I do not know with what (type of expiation) did he commence (the statement)", "source_en": "Sahih Muslim · 2877"}, {"parts": [["n", "عن جَابِرٍ، قَالَ سَمِعْتُ النَّبِيَّ ﷺ يَقُولُ"], ["q", "يُبْعَثُ كُلُّ عَبْدٍ عَلَى مَا مَاتَ عَلَيْهِ"]], "source": "صحيح مسلم · ٢٨٧٨", "english": "This hadith is narrated on the authority of Ayyub", "source_en": "Sahih Muslim · 2878"}, {"parts": [["n", "عن عُثْمَانَ بْنِ عَفَّانَ، قَالَ كَانَ النَّبِيُّ ﷺ إِذَا فَرَغَ مِنْ دَفْنِ الْمَيِّتِ وَقَفَ عَلَيْهِ فَقَالَ"], ["q", "اسْتَغْفِرُوا لأَخِيكُمْ وَسَلُوا لَهُ التَّثْبِيتَ فَإِنَّهُ الآنَ يُسْأَلُ"]], "source": "سنن أبي داود · ٣٢٢١ · صحيح عند الألباني", "english": "Narrated Uthman ibn Affan: Whenever the Prophet (ﷺ) became free from burying the dead, he used to stay at him (i.e. his grave) and say: Seek forgiveness for your brother, and beg steadfastness for him, for he will be questioned now. Abu Dawud said: The full name of the narrator Buhair is Buhair b. Raisan", "source_en": "Sunan Abi Dawud · 3221"}, {"parts": [["n", "عن أَنَسَ بْنَ مَالِكٍ رضى الله عنه يَقُولُ مَرُّوا بِجَنَازَةٍ فَأَثْنَوْا عَلَيْهَا خَيْرًا، فَقَالَ النَّبِيُّ ﷺ"], ["q", "وَجَبَتْ"], ["n", "ثُمَّ مَرُّوا بِأُخْرَى فَأَثْنَوْا عَلَيْهَا شَرًّا فَقَالَ"], ["q", "وَجَبَتْ"], ["n", "فَقَالَ عُمَرُ بْنُ الْخَطَّابِ رضى الله عنه مَا وَجَبَتْ قَالَ"], ["q", "هَذَا أَثْنَيْتُمْ عَلَيْهِ خَيْرًا فَوَجَبَتْ لَهُ الْجَنَّةُ، وَهَذَا أَثْنَيْتُمْ عَلَيْهِ شَرًّا فَوَجَبَتْ لَهُ النَّارُ، أَنْتُمْ شُهَدَاءُ اللَّهِ فِي الأَرْضِ"]], "source": "صحيح البخاري · ١٣٦٧", "english": "Narrated Anas bin Malik:A funeral procession passed and the people praised the deceased. The Prophet (ﷺ) said, \"It has been affirmed to him.\" Then another funeral procession passed and the people spoke badly of the deceased. The Prophet (ﷺ) said, \"It has been affirmed to him\". `Umar bin Al-Khattab asked (Allah's Messenger (ﷺ) ), \"What has been affirmed?\" He replied, \"You praised this, so Paradise has been affirmed to him; and you spoke badly of this, so Hell has been affirmed to him. You people are Allah's witnesses on earth", "source_en": "Sahih al-Bukhari · 1367"}, {"parts": [["n", "عن عَبْدِ اللَّهِ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "أَوَّلُ مَا يُقْضَى بَيْنَ النَّاسِ يَوْمَ الْقِيَامَةِ فِي الدِّمَاءِ"]], "source": "سنن ابن ماجه · ٢٦١٧ · صحيح عند الألباني", "english": "It was narrated from Abdullah that the Messenger of Allah (ﷺ) said:The first matter concerning which judgment will be passed among the people on the Day of Resurrection will be bloodshed.”", "source_en": "Sunan Ibn Majah · 2617"}, {"parts": [["n", "عن أَنَسِ بْنِ مَالِكٍ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "آتِي بَابَ الْجَنَّةِ يَوْمَ الْقِيَامَةِ فَأَسْتَفْتِحُ فَيَقُولُ الْخَازِنُ مَنْ أَنْتَ فَأَقُولُ مُحَمَّدٌ. فَيَقُولُ بِكَ أُمِرْتُ لاَ أَفْتَحُ لأَحَدٍ قَبْلَكَ"]], "source": "صحيح مسلم · ١٩٧", "english": "Muhammad b. Hatim and others narrate the same hadith of the Apostle (may peace and blessings be upon him) on the authority of Tamim ad-Dari", "source_en": "Sahih Muslim · 197"}, {"parts": [["n", "عن أَنَسِ بْنِ مَالِكٍ، أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "إِنَّ فِي الْجَنَّةِ لَسُوقًا يَأْتُونَهَا كُلَّ جُمُعَةٍ فَتَهُبُّ رِيحُ الشَّمَالِ فَتَحْثُو فِي وُجُوهِهِمْ وَثِيَابِهِمْ فَيَزْدَادُونَ حُسْنًا وَجَمَالاً فَيَرْجِعُونَ إِلَى أَهْلِيهِمْ وَقَدِ ازْدَادُوا حُسْنًا وَجَمَالاً فَيَقُولُ لَهُمْ أَهْلُوهُمْ وَاللَّهِ لَقَدِ ازْدَدْتُمْ بَعْدَنَا حُسْنًا وَجَمَالاً. فَيَقُولُونَ وَأَنْتُمْ وَاللَّهِ لَقَدِ ازْدَدْتُمْ بَعْدَنَا حُسْنًا وَجَمَالاً"]], "source": "صحيح مسلم · ٢٨٣٣", "english": "A'isha (Allah be pleased with her) reported:I still seem to see the glistening of the perfume where the hair parted on Allah's Messenger's (ﷺ) head and he was free from Ihram", "source_en": "Sahih Muslim · 2833"}, {"parts": [["n", "عن جَابِرٍ، قَالَ سَمِعْتُ النَّبِيَّ ﷺ يَقُولُ"], ["q", "إِنَّ أَهْلَ الْجَنَّةِ يَأْكُلُونَ فِيهَا وَيَشْرَبُونَ وَلاَ يَتْفُلُونَ وَلاَ يَبُولُونَ وَلاَ يَتَغَوَّطُونَ وَلاَ يَمْتَخِطُونَ"], ["n", "قَالُوا فَمَا بَالُ الطَّعَامِ قَالَ"], ["q", "جُشَاءٌ وَرَشْحٌ كَرَشْحِ الْمِسْكِ يُلْهَمُونَ التَّسْبِيحَ وَالتَّحْمِيدَ كَمَا يُلْهَمُونَ النَّفَسَ"]], "source": "صحيح مسلم · ٢٨٣٥", "english": "A'isha (Allah be pleased with her) reported:I still seem to see; the rest of the hadith is the same", "source_en": "Sahih Muslim · 2835"}, {"parts": [["n", "عن عَمْرِو بْنِ مُرَّةَ، قَالَ قَالَ لِي النَّبِيُّ ﷺ"], ["q", "اقْرَأْ عَلَىَّ"], ["n", "قُلْتُ آقْرَأُ عَلَيْكَ وَعَلَيْكَ أُنْزِلَ قَالَ"], ["q", "فَإِنِّي أُحِبُّ أَنْ أَسْمَعَهُ مِنْ غَيْرِي"], ["n", "فَقَرَأْتُ عَلَيْهِ سُورَةَ النِّسَاءِ حَتَّى بَلَغْتُ ﴿فَكَيْفَ إِذَا جِئْنَا مِنْ كُلِّ أُمَّةٍ بِشَهِيدٍ وَجِئْنَا بِكَ عَلَى هَؤُلاَءِ شَهِيدًا﴾ قَالَ"], ["q", "أَمْسِكْ"]], "source": "صحيح البخاري · ٤٥٨٢", "english": "Narrated `Abdullah bin Masud:Allah's Messenger (ﷺ) said to me, \"Recite (of the Qur'an) for me,\" I said, \"Shall I recite it to you although it had been revealed to you?\" He said, \"I like to hear (the Qur'an) from others.\" So I recited Surat-an- Nisa' till I reached: \"How (will it be) then when We bring from each nation a witness, and We bring you (O Muhammad) as a witness against these people?\" (4.41) Then he said, \"Stop!\" And behold, his eyes were overflowing with tears", "source_en": "Sahih al-Bukhari · 4582"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، قَالَ: قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "رُبَّ صَائِمٍ لَيْسَ لَهُ مِنْ صِيَامِهِ إِلاَّ الْجُوعُ. وَرُبَّ قَائِمٍ لَيْسَ لَهُ مِنْ قِيَامِهِ إِلاَّ السَّهَرُ"]], "source": "سنن ابن ماجه · ١٦٩٠ · صحيح عند الألباني", "english": "It was narrated from Abu Hurairah that the Messenger of Allah (ﷺ) said:“There are people who fast and get nothing from their fast except hunger, and there are those who pray and get nothing from their prayer but a sleepless night.”", "source_en": "Sunan Ibn Majah · 1690"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "إِذَا دُعِيَ أَحَدُكُمْ إِلَى طَعَامٍ وَهُوَ صَائِمٌ فَلْيَقُلْ إِنِّي صَائِمٌ"]], "source": "سنن أبي داود · ٢٤٦١ · صحيح عند الألباني", "english": "Abu Hurairah reported Messenger of Allah (ﷺ) as saying:When one of you is invited (to a meal), and he is fasting, he should say that he is fasting", "source_en": "Sunan Abi Dawud · 2461"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "نِعْمَ سَحُورُ الْمُؤْمِنِ التَّمْرُ"]], "source": "سنن أبي داود · ٢٣٤٥ · صحيح عند الألباني", "english": "Narrated Abu Hurairah:The Prophet (ﷺ) as saying: How good is the believers meal of dates shortly before dawn", "source_en": "Sunan Abi Dawud · 2345"}, {"parts": [["n", "عن عَائِشَةَ رضى الله عنها أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "تَحَرَّوْا لَيْلَةَ الْقَدْرِ فِي الْوِتْرِ مِنَ الْعَشْرِ الأَوَاخِرِ مِنْ رَمَضَانَ"]], "source": "صحيح البخاري · ٢٠١٧", "english": "Narrated `Aisha:Allah's Messenger (ﷺ) said, \"Search for the Night of Qadr in the odd nights of the last ten days of Ramadan", "source_en": "Sahih al-Bukhari · 2017"}, {"parts": [["n", "عن الْحَارِثِ بْنِ سُوَيْدٍ، قَالَ عَبْدُ اللَّهِ قَالَ النَّبِيُّ ﷺ"], ["q", "أَيُّكُمْ مَالُ وَارِثِهِ أَحَبُّ إِلَيْهِ مِنْ مَالِهِ"], ["n", "قَالُوا يَا رَسُولَ اللَّهِ مَا مِنَّا أَحَدٌ إِلاَّ مَالُهُ أَحَبُّ إِلَيْهِ. قَالَ"], ["q", "فَإِنَّ مَالَهُ مَا قَ
