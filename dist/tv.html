ys, \"Our Lord, give us in this world [that which is] good and in the Hereafter [that which is] good and protect us from the punishment of the Fire.\"", "surah_en": "Al-Baqara", "translator": "Saheeh International"}, {"text": "قَالَ رَبِّ ٱشۡرَحۡ لِي صَدۡرِي", "surah": "سورة طه", "ayah": 25, "english": "[Moses] said, \"My Lord, expand for me my breast [with assurance]", "surah_en": "Taa-Haa", "translator": "Saheeh International"}, {"text": "وَلَسَوۡفَ يُعۡطِيكَ رَبُّكَ فَتَرۡضَىٰٓ", "surah": "سورة الضحى", "ayah": 5, "english": "And your Lord is going to give you, and you will be satisfied.", "surah_en": "Ad-Dhuhaa", "translator": "Saheeh International"}, {"text": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُواْ ٱذۡكُرُواْ ٱللَّهَ ذِكۡرٗا كَثِيرٗا", "surah": "سورة الأحزاب", "ayah": 41, "english": "O you who have believed, remember Allah with much remembrance", "surah_en": "Al-Ahzaab", "translator": "Saheeh International"}, {"text": "يُرِيدُ ٱللَّهُ أَن يُخَفِّفَ عَنكُمۡۚ وَخُلِقَ ٱلۡإِنسَٰنُ ضَعِيفٗا", "surah": "سورة النساء", "ayah": 28, "english": "And Allah wants to lighten for you [your difficulties]; and mankind was created weak.", "surah_en": "An-Nisaa", "translator": "Saheeh International"}, {"text": "ٱلۡمَالُ وَٱلۡبَنُونَ زِينَةُ ٱلۡحَيَوٰةِ ٱلدُّنۡيَاۖ وَٱلۡبَٰقِيَٰتُ ٱلصَّٰلِحَٰتُ خَيۡرٌ عِندَ رَبِّكَ ثَوَابٗا وَخَيۡرٌ أَمَلٗا", "surah": "سورة الكهف", "ayah": 46, "english": "Wealth and children are [but] adornment of the worldly life. But the enduring good deeds are better to your Lord for reward and better for [one's] hope.", "surah_en": "Al-Kahf", "translator": "Saheeh International"}, {"text": "قُلۡ يَٰعِبَادِيَ ٱلَّذِينَ أَسۡرَفُواْ عَلَىٰٓ أَنفُسِهِمۡ لَا تَقۡنَطُواْ مِن رَّحۡمَةِ ٱللَّهِۚ إِنَّ ٱللَّهَ يَغۡفِرُ ٱلذُّنُوبَ جَمِيعًاۚ إِنَّهُۥ هُوَ ٱلۡغَفُورُ ٱلرَّحِيمُ", "surah": "سورة الزمر", "ayah": 53, "english": "Say, \"O My servants who have transgressed against themselves [by sinning], do not despair of the mercy of Allah. Indeed, Allah forgives all sins. Indeed, it is He who is the Forgiving, the Merciful.\"", "surah_en": "Az-Zumar", "translator": "Saheeh International"}, {"text": "وَقَالَ رَبُّكُمُ ٱدۡعُونِيٓ أَسۡتَجِبۡ لَكُمۡۚ إِنَّ ٱلَّذِينَ يَسۡتَكۡبِرُونَ عَنۡ عِبَادَتِي سَيَدۡخُلُونَ جَهَنَّمَ دَاخِرِينَ", "surah": "سورة غافر", "ayah": 60, "english": "And your Lord says, \"Call upon Me; I will respond to you.\" Indeed, those who disdain My worship will enter Hell [rendered] contemptible.", "surah_en": "Ghafir", "translator": "Saheeh International"}, {"text": "وَإِذَا سَأَلَكَ عِبَادِي عَنِّي فَإِنِّي قَرِيبٌۖ أُجِيبُ دَعۡوَةَ ٱلدَّاعِ إِذَا دَعَانِۖ فَلۡيَسۡتَجِيبُواْ لِي وَلۡيُؤۡمِنُواْ بِي لَعَلَّهُمۡ يَرۡشُدُونَ", "surah": "سورة البقرة", "ayah": 186, "english": "And when My servants ask you, [O Muhammad], concerning Me - indeed I am near. I respond to the invocation of the supplicant when he calls upon Me. So let them respond to Me [by obedience] and believe in Me that they may be [rightly] guided.", "surah_en": "Al-Baqara", "translator": "Saheeh International"}, {"text": "وَيَرۡزُقۡهُ مِنۡ حَيۡثُ لَا يَحۡتَسِبُۚ وَمَن يَتَوَكَّلۡ عَلَى ٱللَّهِ فَهُوَ حَسۡبُهُۥٓۚ إِنَّ ٱللَّهَ بَٰلِغُ أَمۡرِهِۦۚ قَدۡ جَعَلَ ٱللَّهُ لِكُلِّ شَيۡءٖ قَدۡرٗا", "surah": "سورة الطلاق", "ayah": 3, "english": "And will provide for him from where he does not expect. And whoever relies upon Allah - then He is sufficient for him. Indeed, Allah will accomplish His purpose. Allah has already set for everything a [decreed] extent.", "surah_en": "At-Talaaq", "translator": "Saheeh International"}, {"text": "وَأَطِيعُواْ ٱللَّهَ وَرَسُولَهُۥ وَلَا تَنَٰزَعُواْ فَتَفۡشَلُواْ وَتَذۡهَبَ رِيحُكُمۡۖ وَٱصۡبِرُوٓاْۚ إِنَّ ٱللَّهَ مَعَ ٱلصَّٰبِرِينَ", "surah": "سورة الأنفال", "ayah": 46, "english": "And obey Allah and His Messenger, and do not dispute and [thus] lose courage and [then] your strength would depart; and be patient. Indeed, Allah is with the patient.", "surah_en": "Al-Anfaal", "translator": "Saheeh International"}, {"text": "وَٱلَّذِينَ يَقُولُونَ رَبَّنَا هَبۡ لَنَا مِنۡ أَزۡوَٰجِنَا وَذُرِّيَّٰتِنَا قُرَّةَ أَعۡيُنٖ وَٱجۡعَلۡنَا لِلۡمُتَّقِينَ إِمَامًا", "surah": "سورة الفرقان", "ayah": 74, "english": "And those who say, \"Our Lord, grant us from among our wives and offspring comfort to our eyes and make us an example for the righteous.\"", "surah_en": "Al-Furqaan", "translator": "Saheeh International"}, {"text": "وَلَا تُفۡسِدُواْ فِي ٱلۡأَرۡضِ بَعۡدَ إِصۡلَٰحِهَا وَٱدۡعُوهُ خَوۡفٗا وَطَمَعًاۚ إِنَّ رَحۡمَتَ ٱللَّهِ قَرِيبٞ مِّنَ ٱلۡمُحۡسِنِينَ", "surah": "سورة الأعراف", "ayah": 56, "english": "And cause not corruption upon the earth after its reformation. And invoke Him in fear and aspiration. Indeed, the mercy of Allah is near to the doers of good.", "surah_en": "Al-A'raaf", "translator": "Saheeh International"}, {"text": "إِلَّا ٱلَّذِينَ ءَامَنُواْ وَعَمِلُواْ ٱلصَّٰلِحَٰتِ وَتَوَاصَوۡاْ بِٱلۡحَقِّ وَتَوَاصَوۡاْ بِٱلصَّبۡرِ", "surah": "سورة العصر", "ayah": 3, "english": "Except for those who have believed and done righteous deeds and advised each other to truth and advised each other to patience.", "surah_en": "Al-Asr", "translator": "Saheeh International"}, {"text": "وَإِلَىٰ رَبِّكَ فَٱرۡغَب", "surah": "سورة الشرح", "ayah": 8, "english": "And to your Lord direct [your] longing.", "surah_en": "Ash-Sharh", "translator": "Saheeh International"}, {"text": "وَقُل رَّبِّ أَدۡخِلۡنِي مُدۡخَلَ صِدۡقٖ وَأَخۡرِجۡنِي مُخۡرَجَ صِدۡقٖ وَٱجۡعَل لِّي مِن لَّدُنكَ سُلۡطَٰنٗا نَّصِيرٗا", "surah": "سورة الإسراء", "ayah": 80, "english": "And say, \"My Lord, cause me to enter a sound entrance and to exit a sound exit and grant me from Yourself a supporting authority.\"", "surah_en": "Al-Israa", "translator": "Saheeh International"}, {"text": "وَزَكَرِيَّآ إِذۡ نَادَىٰ رَبَّهُۥ رَبِّ لَا تَذَرۡنِي فَرۡدٗا وَأَنتَ خَيۡرُ ٱلۡوَٰرِثِينَ", "surah": "سورة الأنبياء", "ayah": 89, "english": "And [mention] Zechariah, when he called to his Lord, \"My Lord, do not leave me alone [with no heir], while you are the best of inheritors.\"", "surah_en": "Al-Anbiyaa", "translator": "Saheeh International"}, {"text": "فَسَقَىٰ لَهُمَا ثُمَّ تَوَلَّىٰٓ إِلَى ٱلظِّلِّ فَقَالَ رَبِّ إِنِّي لِمَآ أَنزَلۡتَ إِلَيَّ مِنۡ خَيۡرٖ فَقِيرٞ", "surah": "سورة القصص", "ayah": 24, "english": "So he watered [their flocks] for them; then he went back to the shade and said, \"My Lord, indeed I am, for whatever good You would send down to me, in need.\"", "surah_en": "Al-Qasas", "translator": "Saheeh International"}, {"text": "ٱلۡحَمۡدُ لِلَّهِ رَبِّ ٱلۡعَٰلَمِينَ", "surah": "سورة الفاتحة", "ayah": 2, "english": "[All] praise is [due] to Allah, Lord of the worlds -", "surah_en": "Al-Faatiha", "translator": "Saheeh International"}, {"text": "إِيَّاكَ نَعۡبُدُ وَإِيَّاكَ نَسۡتَعِينُ", "surah": "سورة الفاتحة", "ayah": 5, "english": "It is You we worship and You we ask for help.", "surah_en": "Al-Faatiha", "translator": "Saheeh International"}, {"text": "ٱهۡدِنَا ٱلصِّرَٰطَ ٱلۡمُسۡتَقِيمَ", "surah": "سورة الفاتحة", "ayah": 6, "english": "Guide us to the straight path -", "surah_en": "Al-Faatiha", "translator": "Saheeh International"}, {"text": "وَأَقِيمُواْ ٱلصَّلَوٰةَ وَءَاتُواْ ٱلزَّكَوٰةَۚ وَمَا تُقَدِّمُواْ لِأَنفُسِكُم مِّنۡ خَيۡرٖ تَجِدُوهُ عِندَ ٱللَّهِۗ إِنَّ ٱللَّهَ بِمَا تَعۡمَلُونَ بَصِيرٞ", "surah": "سورة البقرة", "ayah": 110, "english": "And establish prayer and give zakah, and whatever good you put forward for yourselves - you will find it with Allah. Indeed, Allah of what you do, is Seeing.", "surah_en": "Al-Baqara", "translator": "Saheeh International"}, {"text": "وَلِلَّهِ ٱلۡمَشۡرِقُ وَٱلۡمَغۡرِبُۚ فَأَيۡنَمَا تُوَلُّواْ فَثَمَّ وَجۡهُ ٱللَّهِۚ إِنَّ ٱللَّهَ وَٰسِعٌ عَلِيمٞ", "surah": "سورة البقرة", "ayah": 115, "english": "And to Allah belongs the east and the west. So wherever you [might] turn, there is the Face of Allah. Indeed, Allah is all-Encompassing and Knowing.", "surah_en": "Al-Baqara", "translator": "Saheeh International"}, {"text": "ٱلَّذِينَ إِذَآ أَصَٰبَتۡهُم مُّصِيبَةٞ قَالُوٓاْ إِنَّا لِلَّهِ وَإِنَّآ إِلَيۡهِ رَٰجِعُونَ", "surah": "سورة البقرة", "ayah": 156, "english": "Who, when disaster strikes them, say, \"Indeed we belong to Allah, and indeed to Him we will return.\"", "surah_en": "Al-Baqara", "translator": "Saheeh International"}, {"text": "وَإِلَٰهُكُمۡ إِلَٰهٞ وَٰحِدٞۖ لَّآ إِلَٰهَ إِلَّا هُوَ ٱلرَّحۡمَٰنُ ٱلرَّحِيمُ", "surah": "سورة البقرة", "ayah": 163, "english": "And your god is one God. There is no deity [worthy of worship] except Him, the Entirely Merciful, the Especially Merciful.", "surah_en": "Al-Baqara", "translator": "Saheeh International"}, {"text": "يُؤۡتِي ٱلۡحِكۡمَةَ مَن يَشَآءُۚ وَمَن يُؤۡتَ ٱلۡحِكۡمَةَ فَقَدۡ أُوتِيَ خَيۡرٗا كَثِيرٗاۗ وَمَا يَذَّكَّرُ إِلَّآ أُوْلُواْ ٱلۡأَلۡبَٰبِ", "surah": "سورة البقرة", "ayah": 269, "english": "He gives wisdom to whom He wills, and whoever has been given wisdom has certainly been given much good. And none will remember except those of understanding.", "surah_en": "Al-Baqara", "translator": "Saheeh International"}, {"text": "قُلۡ إِن كُنتُمۡ تُحِبُّونَ ٱللَّهَ فَٱتَّبِعُونِي يُحۡبِبۡكُمُ ٱللَّهُ وَيَغۡفِرۡ لَكُمۡ ذُنُوبَكُمۡۚ وَٱللَّهُ غَفُورٞ رَّحِيمٞ", "surah": "سورة آل عمران", "ayah": 31, "english": "Say, [O Muhammad], \"If you should love Allah, then follow me, [so] Allah will love you and forgive you your sins. And Allah is Forgiving and Merciful.\"", "surah_en": "Aal-i-Imraan", "translator": "Saheeh International"}, {"text": "لَن تَنَالُواْ ٱلۡبِرَّ حَتَّىٰ تُنفِقُواْ مِمَّا تُحِبُّونَۚ وَمَا تُنفِقُواْ مِن شَيۡءٖ فَإِنَّ ٱللَّهَ بِهِۦ عَلِيمٞ", "surah": "سورة آل عمران", "ayah": 92, "english": "Never will you attain the good [reward] until you spend [in the way of Allah] from that which you love. And whatever you spend - indeed, Allah is Knowing of it.", "surah_en": "Aal-i-Imraan", "translator": "Saheeh International"}, {"text": "ٱلَّذِينَ يُنفِقُونَ فِي ٱلسَّرَّآءِ وَٱلضَّرَّآءِ وَٱلۡكَٰظِمِينَ ٱلۡغَيۡظَ وَٱلۡعَافِينَ عَنِ ٱلنَّاسِۗ وَٱللَّهُ يُحِبُّ ٱلۡمُحۡسِنِينَ", "surah": "سورة آل عمران", "ayah": 134, "english": "Who spend [in the cause of Allah] during ease and hardship and who restrain anger and who pardon the people - and Allah loves the doers of good;", "surah_en": "Aal-i-Imraan", "translator": "Saheeh International"}, {"text": "ٱلَّذِينَ قَالَ لَهُمُ ٱلنَّاسُ إِنَّ ٱلنَّاسَ قَدۡ جَمَعُواْ لَكُمۡ فَٱخۡشَوۡهُمۡ فَزَادَهُمۡ إِيمَٰنٗا وَقَالُواْ حَسۡبُنَا ٱللَّهُ وَنِعۡمَ ٱلۡوَكِيلُ", "surah": "سورة آل عمران", "ayah": 173, "english": "Those to whom hypocrites said, \"Indeed, the people have gathered against you, so fear them.\" But it [merely] increased them in faith, and they said, \"Sufficient for us is Allah, and [He is] the best Disposer of affairs.\"", "surah_en": "Aal-i-Imraan", "translator": "Saheeh International"}, {"text": "كُلُّ نَفۡسٖ ذَآئِقَةُ ٱلۡمَوۡتِۗ وَإِنَّمَا تُوَفَّوۡنَ أُجُورَكُمۡ يَوۡمَ ٱلۡقِيَٰمَةِۖ فَمَن زُحۡزِحَ عَنِ ٱلنَّارِ وَأُدۡخِلَ ٱلۡجَنَّةَ فَقَدۡ فَازَۗ وَمَا ٱلۡحَيَوٰةُ ٱلدُّنۡيَآ إِلَّا مَتَٰعُ ٱلۡغُرُورِ", "surah": "سورة آل عمران", "ayah": 185, "english": "Every soul will taste death, and you will only be given your [full] compensation on the Day of Resurrection. So he who is drawn away from the Fire and admitted to Paradise has attained [his desire]. And what is the life of this world except the enjoyment of delusion.", "surah_en": "Aal-i-Imraan", "translator": "Saheeh International"}, {"text": "إِنَّ فِي خَلۡقِ ٱلسَّمَٰوَٰتِ وَٱلۡأَرۡضِ وَٱخۡتِلَٰفِ ٱلَّيۡلِ وَٱلنَّهَارِ لَأٓيَٰتٖ لِّأُوْلِي ٱلۡأَلۡبَٰبِ", "surah": "سورة آل عمران", "ayah": 190, "english": "Indeed, in the creation of the heavens and the earth and the alternation of the night and the day are signs for those of understanding.", "surah_en": "Aal-i-Imraan", "translator": "Saheeh International"}, {"text": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُواْ ٱصۡبِرُواْ وَصَابِرُواْ وَرَابِطُواْ وَٱتَّقُواْ ٱللَّهَ لَعَلَّكُمۡ تُفۡلِحُونَ", "surah": "سورة آل عمران", "ayah": 200, "english": "O you who have believed, persevere and endure and remain stationed and fear Allah that you may be successful.", "surah_en": "Aal-i-Imraan", "translator": "Saheeh International"}, {"text": "وَإِذَا حُيِّيتُم بِتَحِيَّةٖ فَحَيُّواْ بِأَحۡسَنَ مِنۡهَآ أَوۡ رُدُّوهَآۗ إِنَّ ٱللَّهَ كَانَ عَلَىٰ كُلِّ شَيۡءٍ حَسِيبًا", "surah": "سورة النساء", "ayah": 86, "english": "And when you are greeted with a greeting, greet [in return] with one better than it or [at least] return it [in a like manner]. Indeed, Allah is ever, over all things, an Accountant.", "surah_en": "An-Nisaa", "translator": "Saheeh International"}, {"text": "وَمَن يَعۡمَلۡ سُوٓءًا أَوۡ يَظۡلِمۡ نَفۡسَهُۥ ثُمَّ يَسۡتَغۡفِرِ ٱللَّهَ يَجِدِ ٱللَّهَ غَفُورٗا رَّحِيمٗا", "surah": "سورة النساء", "ayah": 110, "english": "And whoever does a wrong or wrongs himself but then seeks forgiveness of Allah will find Allah Forgiving and Merciful.", "surah_en": "An-Nisaa", "translator": "Saheeh International"}, {"text": "قُلۡ إِنَّ صَلَاتِي وَنُسُكِي وَمَحۡيَايَ وَمَمَاتِي لِلَّهِ رَبِّ ٱلۡعَٰلَمِينَ", "surah": "سورة الأنعام", "ayah": 162, "english": "Say, \"Indeed, my prayer, my rites of sacrifice, my living and my dying are for Allah, Lord of the worlds.", "surah_en": "Al-An'aam", "translator": "Saheeh International"}, {"text": "قَالَا رَبَّنَا ظَلَمۡنَآ أَنفُسَنَا وَإِن لَّمۡ تَغۡفِرۡ لَنَا وَتَرۡحَمۡنَا لَنَكُونَنَّ مِنَ ٱلۡخَٰسِرِينَ", "surah": "سورة الأعراف", "ayah": 23, "english": "They said, \"Our Lord, we have wronged ourselves, and if You do not forgive us and have mercy upon us, we will surely be among the losers.\"", "surah_en": "Al-A'raaf", "translator": "Saheeh International"}, {"text": "خُذِ ٱلۡعَفۡوَ وَأۡمُرۡ بِٱلۡعُرۡفِ وَأَعۡرِضۡ عَنِ ٱلۡجَٰهِلِينَ", "surah": "سورة الأعراف", "ayah": 199, "english": "Take what is given freely, enjoin what is good, and turn away from the ignorant.", "surah_en": "Al-A'raaf", "translator": "Saheeh International"}, {"text": "قُل لَّن يُصِيبَنَآ إِلَّا مَا كَتَبَ ٱللَّهُ لَنَا هُوَ مَوۡلَىٰنَاۚ وَعَلَى ٱللَّهِ فَلۡيَتَوَكَّلِ ٱلۡمُؤۡمِنُونَ", "surah": "سورة التوبة", "ayah": 51, "english": "Say, \"Never will we be struck except by what Allah has decreed for us; He is our protector.\" And upon Allah let the believers rely.", "surah_en": "At-Tawba", "translator": "Saheeh International"}, {"text": "فَإِن تَوَلَّوۡاْ فَقُلۡ حَسۡبِيَ ٱللَّهُ لَآ إِلَٰهَ إِلَّا هُوَۖ عَلَيۡهِ تَوَكَّلۡتُۖ وَهُوَ رَبُّ ٱلۡعَرۡشِ ٱلۡعَظِيمِ", "surah": "سورة التوبة", "ayah": 129, "english": "But if they turn away, [O Muhammad], say, \"Sufficient for me is Allah; there is no deity except Him. On Him I have relied, and He is the Lord of the Great Throne.\"", "surah_en": "At-Tawba", "translator": "Saheeh International"}, {"text": "أَلَآ إِنَّ أَوۡلِيَآءَ ٱللَّهِ لَا خَوۡفٌ عَلَيۡهِمۡ وَلَا هُمۡ يَحۡزَنُونَ", "surah": "سورة يونس", "ayah": 62, "english": "Unquestionably, [for] the allies of Allah there will be no fear concerning them, nor will they grieve", "surah_en": "Yunus", "translator": "Saheeh International"}, {"text": "وَمَا مِن دَآبَّةٖ فِي ٱلۡأَرۡضِ إِلَّا عَلَى ٱللَّهِ رِزۡقُهَا وَيَعۡلَمُ مُسۡتَقَرَّهَا وَمُسۡتَوۡدَعَهَاۚ كُلّٞ فِي كِتَٰبٖ مُّبِينٖ", "surah": "سورة هود", "ayah": 6, "english": "And there is no creature on earth but that upon Allah is its provision, and He knows its place of dwelling and place of storage. All is in a clear register.", "surah_en": "Hud", "translator": "Saheeh International"}, {"text": "وَأَقِمِ ٱلصَّلَوٰةَ طَرَفَيِ ٱلنَّهَارِ وَزُلَفٗا مِّنَ ٱلَّيۡلِۚ إِنَّ ٱلۡحَسَنَٰتِ يُذۡهِبۡنَ ٱلسَّيِّـَٔاتِۚ ذَٰلِكَ ذِكۡرَىٰ لِلذَّٰكِرِينَ", "surah": "سورة هود", "ayah": 114, "english": "And establish prayer at the two ends of the day and at the approach of the night. Indeed, good deeds do away with misdeeds. That is a reminder for those who remember.", "surah_en": "Hud", "translator": "Saheeh International"}, {"text": "وَٱصۡبِرۡ فَإِنَّ ٱللَّهَ لَا يُضِيعُ أَجۡرَ ٱلۡمُحۡسِنِينَ", "surah": "سورة هود", "ayah": 115, "english": "And be patient, for indeed, Allah does not allow to be lost the reward of those who do good.", "surah_en": "Hud", "translator": "Saheeh International"}, {"text": "قَالَ إِنَّمَآ أَشۡكُواْ بَثِّي وَحُزۡنِيٓ إِلَى ٱللَّهِ وَأَعۡلَمُ مِنَ ٱللَّهِ مَا لَا تَعۡلَمُونَ", "surah": "سورة يوسف", "ayah": 86, "english": "He said, \"I only complain of my suffering and my grief to Allah, and I know from Allah that which you do not know.", "surah_en": "Yusuf", "translator": "Saheeh International"}, {"text": "يَٰبَنِيَّ ٱذۡهَبُواْ فَتَحَسَّسُواْ مِن يُوسُفَ وَأَخِيهِ وَلَا تَاْيۡـَٔسُواْ مِن رَّوۡحِ ٱللَّهِۖ إِنَّهُۥ لَا يَاْيۡـَٔسُ مِن رَّوۡحِ ٱللَّهِ إِلَّا ٱلۡقَوۡمُ ٱلۡكَٰفِرُونَ", "surah": "سورة يوسف", "ayah": 87, "english": "O my sons, go and find out about Joseph and his brother and despair not of relief from Allah. Indeed, no one despairs of relief from Allah except the disbelieving people.\"", "surah_en": "Yusuf", "translator": "Saheeh International"}, {"text": "رَبِّ ٱجۡعَلۡنِي مُقِيمَ ٱلصَّلَوٰةِ وَمِن ذُرِّيَّتِيۚ رَبَّنَا وَتَقَبَّلۡ دُعَآءِ", "surah": "سورة إبراهيم", "ayah": 40, "english": "My Lord, make me an establisher of prayer, and [many] from my descendants. Our Lord, and accept my supplication.", "surah_en": "Ibrahim", "translator": "Saheeh International"}, {"text": "رَبَّنَا ٱغۡفِرۡ لِي وَلِوَٰلِدَيَّ وَلِلۡمُؤۡمِنِينَ يَوۡمَ يَقُومُ ٱلۡحِسَابُ", "surah": "سورة إبراهيم", "ayah": 41, "english": "Our Lord, forgive me and my parents and the believers the Day the account is established.\"", "surah_en": "Ibrahim", "translator": "Saheeh International"}, {"text": "نَبِّئۡ عِبَادِيٓ أَنِّيٓ أَنَا ٱلۡغَفُورُ ٱلرَّحِيمُ", "surah": "سورة الحجر", "ayah": 49, "english": "[O Muhammad], inform My servants that it is I who am the Forgiving, the Merciful.", "surah_en": "Al-Hijr", "translator": "Saheeh International"}, {"text": "فَسَبِّحۡ بِحَمۡدِ رَبِّكَ وَكُن مِّنَ ٱلسَّٰجِدِينَ", "surah": "سورة الحجر", "ayah": 98, "english": "So exalt [Allah] with praise of your Lord and be of those who prostrate [to Him].", "surah_en": "Al-Hijr", "translator": "Saheeh International"}, {"text": "وَإِن تَعُدُّواْ نِعۡمَةَ ٱللَّهِ لَا تُحۡصُوهَآۗ إِنَّ ٱللَّهَ لَغَفُورٞ رَّحِيمٞ", "surah": "سورة النحل", "ayah": 18, "english": "And if you should count the favors of Allah, you could not enumerate them. Indeed, Allah is Forgiving and Merciful.", "surah_en": "An-Nahl", "translator": "Saheeh International"}, {"text": "إِنَّ ٱللَّهَ يَأۡمُرُ بِٱلۡعَدۡلِ وَٱلۡإِحۡسَٰنِ وَإِيتَآيِٕ ذِي ٱلۡقُرۡبَىٰ وَيَنۡهَىٰ عَنِ ٱلۡفَحۡشَآءِ وَٱلۡمُنكَرِ وَٱلۡبَغۡيِۚ يَعِظُكُمۡ لَعَلَّكُمۡ تَذَكَّرُونَ", "surah": "سورة النحل", "ayah": 90, "english": "Indeed, Allah orders justice and good conduct and giving to relatives and forbids immorality and bad conduct and oppression. He admonishes you that perhaps you will be reminded.", "surah_en": "An-Nahl", "translator": "Saheeh International"}, {"text": "مَنۡ عَمِلَ صَٰلِحٗا مِّن ذَكَرٍ أَوۡ أُنثَىٰ وَهُوَ مُؤۡمِنٞ فَلَنُحۡيِيَنَّهُۥ حَيَوٰةٗ طَيِّبَةٗۖ وَلَنَجۡزِيَنَّهُمۡ أَجۡرَهُم بِأَحۡسَنِ مَا كَانُواْ يَعۡمَلُونَ", "surah": "سورة النحل", "ayah": 97, "english": "Whoever does righteousness, whether male or female, while he is a believer - We will surely cause him to live a good life, and We will surely give them their reward [in the Hereafter] according to the best of what they used to do.", "surah_en": "An-Nahl", "translator": "Saheeh International"}, {"text": "وَٱخۡفِضۡ لَهُمَا جَنَاحَ ٱلذُّلِّ مِنَ ٱلرَّحۡمَةِ وَقُل رَّبِّ ٱرۡحَمۡهُمَا كَمَا رَبَّيَانِي صَغِيرٗا", "surah": "سورة الإسراء", "ayah": 24, "english": "And lower to them the wing of humility out of mercy and say, \"My Lord, have mercy upon them as they brought me up [when I was] small.\"", "surah_en": "Al-Israa", "translator": "Saheeh International"}, {"text": "وَنُنَزِّلُ مِنَ ٱلۡقُرۡءَانِ مَا هُوَ شِفَآءٞ وَرَحۡمَةٞ لِّلۡمُؤۡمِنِينَ وَلَا يَزِيدُ ٱلظَّٰلِمِينَ إِلَّا خَسَارٗا", "surah": "سورة الإسراء", "ayah": 82, "english": "And We send down of the Qur'an that which is healing and mercy for the believers, but it does not increase the wrongdoers except in loss.", "surah_en": "Al-Israa", "translator": "Saheeh International"}, {"text": "إِذۡ أَوَى ٱلۡفِتۡيَةُ إِلَى ٱلۡكَهۡفِ فَقَالُواْ رَبَّنَآ ءَاتِنَا مِن لَّدُنكَ رَحۡمَةٗ وَهَيِّئۡ لَنَا مِنۡ أَمۡرِنَا رَشَدٗا", "surah": "سورة الكهف", "ayah": 10, "english": "[Mention] when the youths retreated to the cave and said, \"Our Lord, grant us from Yourself mercy and prepare for us from our affair right guidance.\"", "surah_en": "Al-Kahf", "translator": "Saheeh International"}, {"text": "قَالَ لَا تَخَافَآۖ إِنَّنِي مَعَكُمَآ أَسۡمَعُ وَأَرَىٰ", "surah": "سورة طه", "ayah": 46, "english": "[Allah] said, \"Fear not. Indeed, I am with you both; I hear and I see.", "surah_en": "Taa-Haa", "translator": "Saheeh International"}, {"text": "فَتَعَٰلَى ٱللَّهُ ٱلۡمَلِكُ ٱلۡحَقُّۗ وَلَا تَعۡجَلۡ بِٱلۡقُرۡءَانِ مِن قَبۡلِ أَن يُقۡضَىٰٓ إِلَيۡكَ وَحۡيُهُۥۖ وَقُل رَّبِّ زِدۡنِي عِلۡمٗا", "surah": "سورة طه", "ayah": 114, "english": "So high [above all] is Allah, the Sovereign, the Truth. And, [O Muhammad], do not hasten with [recitation of] the Qur'an before its revelation is completed to you, and say, \"My Lord, increase me in knowledge.\"", "surah_en": "Taa-Haa", "translator": "Saheeh International"}, {"text": "وَأۡمُرۡ أَهۡلَكَ بِٱلصَّلَوٰةِ وَٱصۡطَبِرۡ عَلَيۡهَاۖ لَا نَسۡـَٔلُكَ رِزۡقٗاۖ نَّحۡنُ نَرۡزُقُكَۗ وَٱلۡعَٰقِبَةُ لِلتَّقۡوَىٰ", "surah": "سورة طه", "ayah": 132, "english": "And enjoin prayer upon your family [and people] and be steadfast therein. We ask you not for provision; We provide for you, and the [best] outcome is for [those of] righteousness.", "surah_en": "Taa-Haa", "translator": "Saheeh International"}, {"text": "وَأَيُّوبَ إِذۡ نَادَىٰ رَبَّهُۥٓ أَنِّي مَسَّنِيَ ٱلضُّرُّ وَأَنتَ أَرۡحَمُ ٱلرَّٰحِمِينَ", "surah": "سورة الأنبياء", "ayah": 83, "english": "And [mention] Job, when he called to his Lord, \"Indeed, adversity has touched me, and you are the Most Merciful of the merciful.\"", "surah_en": "Al-Anbiyaa", "translator": "Saheeh International"}, {"text": "وَذَا ٱلنُّونِ إِذ ذَّهَبَ مُغَٰضِبٗا فَظَنَّ أَن لَّن نَّقۡدِرَ عَلَيۡهِ فَنَادَىٰ فِي ٱلظُّلُمَٰتِ أَن لَّآ إِلَٰهَ إِلَّآ أَنتَ سُبۡحَٰنَكَ إِنِّي كُنتُ مِنَ ٱلظَّٰلِمِينَ", "surah": "سورة الأنبياء", "ayah": 87, "english": "And [mention] the man of the fish, when he went off in anger and thought that We would not decree [anything] upon him. And he called out within the darknesses, \"There is no deity except You; exalted are You. Indeed, I have been of the wrongdoers.\"", "surah_en": "Al-Anbiyaa", "translator": "Saheeh International"}, {"text": "وَقُل رَّبِّ ٱغۡفِرۡ وَٱرۡحَمۡ وَأَنتَ خَيۡرُ ٱلرَّٰحِمِينَ", "surah": "سورة المؤمنون", "ayah": 118, "english": "And, [O Muhammad], say, \"My Lord, forgive and have mercy, and You are the best of the merciful.\"", "surah_en": "Al-Muminoon", "translator": "Saheeh International"}, {"text": "وَتَوَكَّلۡ عَلَى ٱلۡحَيِّ ٱلَّذِي لَا يَمُوتُ وَسَبِّحۡ بِحَمۡدِهِۦۚ وَكَفَىٰ بِهِۦ بِذُنُوبِ عِبَادِهِۦ خَبِيرًا", "surah": "سورة الفرقان", "ayah": 58, "english": "And rely upon the Ever-Living who does not die, and exalt [Allah] with His praise. And sufficient is He to be, with the sins of His servants, Acquainted -", "surah_en": "Al-Furqaan", "translator": "Saheeh International"}, {"text": "وَعِبَادُ ٱلرَّحۡمَٰنِ ٱلَّذِينَ يَمۡشُونَ عَلَى ٱلۡأَرۡضِ هَوۡنٗا وَإِذَا خَاطَبَهُمُ ٱلۡجَٰهِلُونَ قَالُواْ سَلَٰمٗا", "surah": "سورة الفرقان", "ayah": 63, "english": "And the servants of the Most Merciful are those who walk upon the earth easily, and when the ignorant address them [harshly], they say [words of] peace,", "surah_en": "Al-Furqaan", "translator": "Saheeh International"}, {"text": "وَإِذَا مَرِضۡتُ فَهُوَ يَشۡفِينِ", "surah": "سورة الشعراء", "ayah": 80, "english": "And when I am ill, it is He who cures me", "surah_en": "Ash-Shu'araa", "translator": "Saheeh International"}, {"text": "رَبِّ هَبۡ لِي حُكۡمٗا وَأَلۡحِقۡنِي بِٱلصَّٰلِحِينَ", "surah": "سورة الشعراء", "ayah": 83, "english": "[And he said], \"My Lord, grant me authority and join me with the righteous.", "surah_en": "Ash-Shu'araa", "translator": "Saheeh International"}, {"text": "أَمَّن يُجِيبُ ٱلۡمُضۡطَرَّ إِذَا دَعَاهُ وَيَكۡشِفُ ٱلسُّوٓءَ وَيَجۡعَلُكُمۡ خُلَفَآءَ ٱلۡأَرۡضِۗ أَءِلَٰهٞ مَّعَ ٱللَّهِۚ قَلِيلٗا مَّا تَذَكَّرُونَ", "surah": "سورة النمل", "ayah": 62, "english": "Is He [not best] who responds to the desperate one when he calls upon Him and removes evil and makes you inheritors of the earth? Is there a deity with Allah? Little do you remember.", "surah_en": "An-Naml", "translator": "Saheeh International"}, {"text": "وَمِنۡ ءَايَٰتِهِۦٓ أَنۡ خَلَقَ لَكُم مِّنۡ أَنفُسِكُمۡ أَزۡوَٰجٗا لِّتَسۡكُنُوٓاْ إِلَيۡهَا وَجَعَلَ بَيۡنَكُم مَّوَدَّةٗ وَرَحۡمَةًۚ إِنَّ فِي ذَٰلِكَ لَأٓيَٰتٖ لِّقَوۡمٖ يَتَفَكَّرُونَ", "surah": "سورة الروم", "ayah": 21, "english": "And of His signs is that He created for you from yourselves mates that you may find tranquillity in them; and He placed between you affection and mercy. Indeed in that are signs for a people who give thought.", "surah_en": "Ar-Room", "translator": "Saheeh International"}, {"text": "يَٰبُنَيَّ أَقِمِ ٱلصَّلَوٰةَ وَأۡمُرۡ بِٱلۡمَعۡرُوفِ وَٱنۡهَ عَنِ ٱلۡمُنكَرِ وَٱصۡبِرۡ عَلَىٰ مَآ أَصَابَكَۖ إِنَّ ذَٰلِكَ مِنۡ عَزۡمِ ٱلۡأُمُورِ", "surah": "سورة لقمان", "ayah": 17, "english": "O my son, establish prayer, enjoin what is right, forbid what is wrong, and be patient over what befalls you. Indeed, [all] that is of the matters [requiring] determination.", "surah_en": "Luqman", "translator": "Saheeh International"}, {"text": "وَتَوَكَّلۡ عَلَى ٱللَّهِۚ وَكَفَىٰ بِٱللَّهِ وَكِيلٗا", "surah": "سورة الأحزاب", "ayah": 3, "english": "And rely upon Allah; and sufficient is Allah as Disposer of affairs.", "surah_en": "Al-Ahzaab", "translator": "Saheeh International"}, {"text": "إِنَّ ٱللَّهَ وَمَلَٰٓئِكَتَهُۥ يُصَلُّونَ عَلَى ٱلنَّبِيِّۚ يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُواْ صَلُّواْ عَلَيۡهِ وَسَلِّمُواْ تَسۡلِيمًا", "surah": "سورة الأحزاب", "ayah": 56, "english": "Indeed, Allah confers blessing upon the Prophet, and His angels [ask Him to do so]. O you who have believed, ask [Allah to confer] blessing upon him and ask [Allah to grant him] peace.", "surah_en": "Al-Ahzaab", "translator": "Saheeh International"}, {"text": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُواْ ٱتَّقُواْ ٱللَّهَ وَقُولُواْ قَوۡلٗا سَدِيدٗا", "surah": "سورة الأحزاب", "ayah": 70, "english": "O you who have believed, fear Allah and speak words of appropriate justice.", "surah_en": "Al-Ahzaab", "translator": "Saheeh International"}, {"text": "وَقَالُواْ ٱلۡحَمۡدُ لِلَّهِ ٱلَّذِيٓ أَذۡهَبَ عَنَّا ٱلۡحَزَنَۖ إِنَّ رَبَّنَا لَغَفُورٞ شَكُورٌ", "surah": "سورة فاطر", "ayah": 34, "english": "And they will say, \"Praise to Allah, who has removed from us [all] sorrow. Indeed, our Lord is Forgiving and Appreciative -", "surah_en": "Faatir", "translator": "Saheeh International"}, {"text": "قُلۡ يَٰعِبَادِ ٱلَّذِينَ ءَامَنُواْ ٱتَّقُواْ رَبَّكُمۡۚ لِلَّذِينَ أَحۡسَنُواْ فِي هَٰذِهِ ٱلدُّنۡيَا حَسَنَةٞۗ وَأَرۡضُ ٱللَّهِ وَٰسِعَةٌۗ إِنَّمَا يُوَفَّى ٱلصَّٰبِرُونَ أَجۡرَهُم بِغَيۡرِ حِسَابٖ", "surah": "سورة الزمر", "ayah": 10, "english": "Say, \"O My servants who have believed, fear your Lord. For those who do good in this world is good, and the earth of Allah is spacious. Indeed, the patient will be given their reward without account.\"", "surah_en": "Az-Zumar", "translator": "Saheeh International"}, {"text": "أَلَيۡسَ ٱللَّهُ بِكَافٍ عَبۡدَهُۥۖ وَيُخَوِّفُونَكَ بِٱلَّذِينَ مِن دُونِهِۦۚ وَمَن يُضۡلِلِ ٱللَّهُ فَمَا لَهُۥ مِنۡ هَادٖ", "surah": "سورة الزمر", "ayah": 36, "english": "Is not Allah sufficient for His Servant [Prophet Muhammad]? And [yet], they threaten you with those [they worship] other than Him. And whoever Allah leaves astray - for him there is no guide.", "surah_en": "Az-Zumar", "translator": "Saheeh International"}, {"text": "فَسَتَذۡكُرُونَ مَآ أَقُولُ لَكُمۡۚ وَأُفَوِّضُ أَمۡرِيٓ إِلَى ٱللَّهِۚ إِنَّ ٱللَّهَ بَصِيرُۢ بِٱلۡعِبَادِ", "surah": "سورة غافر", "ayah": 44, "english": "And you will remember what I [now] say to you, and I entrust my affair to Allah. Indeed, Allah is Seeing of [His] servants.\"", "surah_en": "Ghafir", "translator": "Saheeh International"}, {"text": "فَٱصۡبِرۡ إِنَّ وَعۡدَ ٱللَّهِ حَقّٞ وَٱسۡتَغۡفِرۡ لِذَنۢبِكَ وَسَبِّحۡ بِحَمۡدِ رَبِّكَ بِٱلۡعَشِيِّ وَٱلۡإِبۡكَٰرِ", "surah": "سورة غافر", "ayah": 55, "english": "So be patient, [O Muhammad]. Indeed, the promise of Allah is truth. And ask forgiveness for your sin and exalt [Allah] with praise of your Lord in the evening and the morning.", "surah_en": "Ghafir", "translator": "Saheeh International"}, {"text": "وَلَا تَسۡتَوِي ٱلۡحَسَنَةُ وَلَا ٱلسَّيِّئَةُۚ ٱدۡفَعۡ بِٱلَّتِي هِيَ أَحۡسَنُ فَإِذَا ٱلَّذِي بَيۡنَكَ وَبَيۡنَهُۥ عَدَٰوَةٞ كَأَنَّهُۥ وَلِيٌّ حَمِيمٞ", "surah": "سورة فصلت", "ayah": 34, "english": "And not equal are the good deed and the bad. Repel [evil] by that [deed] which is better; and thereupon the one whom between you and him is enmity [will become] as though he was a devoted friend.", "surah_en": "Fussilat", "translator": "Saheeh International"}, {"text": "ٱللَّهُ لَطِيفُۢ بِعِبَادِهِۦ يَرۡزُقُ مَن يَشَآءُۖ وَهُوَ ٱلۡقَوِيُّ ٱلۡعَزِيزُ", "surah": "سورة الشورى", "ayah": 19, "english": "Allah is Subtle with His servants; He gives provisions to whom He wills. And He is the Powerful, the Exalted in Might.", "surah_en": "Ash-Shura", "translator": "Saheeh International"}, {"text": "وَلَمَن صَبَرَ وَغَفَرَ إِنَّ ذَٰلِكَ لَمِنۡ عَزۡمِ ٱلۡأُمُورِ", "surah": "سورة الشورى", "ayah": 43, "english": "And whoever is patient and forgives - indeed, that is of the matters [requiring] determination.", "surah_en": "Ash-Shura", "translator": "Saheeh International"}, {"text": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓاْ إِن تَنصُرُواْ ٱللَّهَ يَنصُرۡكُمۡ وَيُثَبِّتۡ أَقۡدَامَكُمۡ", "surah": "سورة محمد", "ayah": 7, "english": "O you who have believed, if you support Allah, He will support you and plant firmly your feet.", "surah_en": "Muhammad", "translator": "Saheeh International"}, {"text": "إِنَّمَا ٱلۡمُؤۡمِنُونَ إِخۡوَةٞ فَأَصۡلِحُواْ بَيۡنَ أَخَوَيۡكُمۡۚ وَٱتَّقُواْ ٱللَّهَ لَعَلَّكُمۡ تُرۡحَمُونَ", "surah": "سورة الحجرات", "ayah": 10, "english": "The believers are but brothers, so make settlement between your brothers. And fear Allah that you may receive mercy.", "surah_en": "Al-Hujuraat", "translator": "Saheeh International"}, {"text": "وَمَا خَلَقۡتُ ٱلۡجِنَّ وَٱلۡإِنسَ إِلَّا لِيَعۡبُدُونِ", "surah": "سورة الذاريات", "ayah": 56, "english": "And I did not create the jinn and mankind except to worship Me.", "surah_en": "Adh-Dhaariyat", "translator": "Saheeh International"}, {"text": "وَٱصۡبِرۡ لِحُكۡمِ رَبِّكَ فَإِنَّكَ بِأَعۡيُنِنَاۖ وَسَبِّحۡ بِحَمۡدِ رَبِّكَ حِينَ تَقُومُ", "surah": "سورة الطور", "ayah": 48, "english": "And be patient, [O Muhammad], for the decision of your Lord, for indeed, you are in Our eyes. And exalt [Allah] with praise of your Lord when you arise.", "surah_en": "At-Tur", "translator": "Saheeh International"}, {"text": "وَأَن لَّيۡسَ لِلۡإِنسَٰنِ إِلَّا مَا سَعَىٰ", "surah": "سورة النجم", "ayah": 39, "english": "And that there is not for man except that [good] for which he strives", "surah_en": "An-Najm", "translator": "Saheeh International"}, {"text": "وَلَقَدۡ يَسَّرۡنَا ٱلۡقُرۡءَانَ لِلذِّكۡرِ فَهَلۡ مِن مُّدَّكِرٖ", "surah": "سورة القمر", "ayah": 17, "english": "And We have certainly made the Qur'an easy for remembrance, so is there any who will remember?", "surah_en": "Al-Qamar", "translator": "Saheeh International"}, {"text": "وَيَبۡقَىٰ وَجۡهُ رَبِّكَ ذُو ٱلۡجَلَٰلِ وَٱلۡإِكۡرَامِ", "surah": "سورة الرحمن", "ayah": 27, "english": "And there will remain the Face of your Lord, Owner of Majesty and Honor.", "surah_en": "Ar-Rahmaan", "translator": "Saheeh International"}, {"text": "هَلۡ جَزَآءُ ٱلۡإِحۡسَٰنِ إِلَّا ٱلۡإِحۡسَٰنُ", "surah": "سورة الرحمن", "ayah": 60, "english": "Is the reward for good [anything] but good?", "surah_en": "Ar-Rahmaan", "translator": "Saheeh International"}, {"text": "هُوَ ٱللَّهُ ٱلَّذِي لَآ إِلَٰهَ إِلَّا هُوَۖ عَٰلِمُ ٱلۡغَيۡبِ وَٱلشَّهَٰدَةِۖ هُوَ ٱلرَّحۡمَٰنُ ٱلرَّحِيمُ", "surah": "سورة الحشر", "ayah": 22, "english": "He is Allah, other than whom there is no deity, Knower of the unseen and the witnessed. He is the Entirely Merciful, the Especially Merciful.", "surah_en": "Al-Hashr", "translator": "Saheeh International"}, {"text": "مَآ أَصَابَ مِن مُّصِيبَةٍ إِلَّا بِإِذۡنِ ٱللَّهِۗ وَمَن يُؤۡمِنۢ بِٱللَّهِ يَهۡدِ قَلۡبَهُۥۚ وَٱللَّهُ بِكُلِّ شَيۡءٍ عَلِيمٞ", "surah": "سورة التغابن", "ayah": 11, "english": "No disaster strikes except by permission of Allah. And whoever believes in Allah - He will guide his heart. And Allah is Knowing of all things.", "surah_en": "At-Taghaabun", "translator": "Saheeh International"}, {"text": "ٱلَّذِي خَلَقَ ٱلۡمَوۡتَ وَٱلۡحَيَوٰةَ لِيَبۡلُوَكُمۡ أَيُّكُمۡ أَحۡسَنُ عَمَلٗاۚ وَهُوَ ٱلۡعَزِيزُ ٱلۡغَفُورُ", "surah": "سورة الملك", "ayah": 2, "english": "[He] who created death and life to test you [as to] which of you is best in deed - and He is the Exalted in Might, the Forgiving -", "surah_en": "Al-Mulk", "translator": "Saheeh International"}, {"text": "فَقُلۡتُ ٱسۡتَغۡفِرُواْ رَبَّكُمۡ إِنَّهُۥ كَانَ غَفَّارٗا", "surah": "سورة نوح", "ayah": 10, "english": "And said, 'Ask forgiveness of your Lord. Indeed, He is ever a Perpetual Forgiver.", "surah_en": "Nooh", "translator": "Saheeh International"}, {"text": "وَٱذۡكُرِ ٱسۡمَ رَبِّكَ وَتَبَتَّلۡ إِلَيۡهِ تَبۡتِيلٗا", "surah": "سورة المزمل", "ayah": 8, "english": "And remember the name of your Lord and devote yourself to Him with [complete] devotion.", "surah_en": "Al-Muzzammil", "translator": "Saheeh International"}, {"text": "إِنَّمَا نُطۡعِمُكُمۡ لِوَجۡهِ ٱللَّهِ لَا نُرِيدُ مِنكُمۡ جَزَآءٗ وَلَا شُكُورًا", "surah": "سورة الإنسان", "ayah": 9, "english": "[Saying], \"We feed you only for the countenance of Allah. We wish not from you reward or gratitude.", "surah_en": "Al-Insaan", "translator": "Saheeh International"}, {"text": "قَدۡ أَفۡلَحَ مَن تَزَكَّىٰ", "surah": "سورة الأعلى", "ayah": 14, "english": "He has certainly succeeded who purifies himself", "surah_en": "Al-A'laa", "translator": "Saheeh International"}, {"text": "وَٱلۡأٓخِرَةُ خَيۡرٞ وَأَبۡقَىٰٓ", "surah": "سورة الأعلى", "ayah": 17, "english": "While the Hereafter is better and more enduring.", "surah_en": "Al-A'laa", "translator": "Saheeh International"}, {"text": "يَٰٓأَيَّتُهَا ٱلنَّفۡسُ ٱلۡمُطۡمَئِنَّةُ", "surah": "سورة الفجر", "ayah": 27, "english": "[To the righteous it will be said], \"O reassured soul,", "surah_en": "Al-Fajr", "translator": "Saheeh International"}, {"text": "ٱرۡجِعِيٓ إِلَىٰ رَبِّكِ رَاضِيَةٗ مَّرۡضِيَّةٗ", "surah": "سورة الفجر", "ayah": 28, "english": "Return to your Lord, well-pleased and pleasing [to Him],", "surah_en": "Al-Fajr", "translator": "Saheeh International"}, {"text": "مَا وَدَّعَكَ رَبُّكَ وَمَا قَلَىٰ", "surah": "سورة الضحى", "ayah": 3, "english": "Your Lord has not taken leave of you, [O Muhammad], nor has He detested [you].", "surah_en": "Ad-Dhuhaa", "translator": "Saheeh International"}, {"text": "وَأَمَّا بِنِعۡمَةِ رَبِّكَ فَحَدِّثۡ", "surah": "سورة الضحى", "ayah": 11, "english": "But as for the favor of your Lord, report [it].", "surah_en": "Ad-Dhuhaa", "translator": "Saheeh International"}, {"text": "فَإِنَّ مَعَ ٱلۡعُسۡرِ يُسۡرًا", "surah": "سورة الشرح", "ayah": 5, "english": "For indeed, with hardship [will be] ease.", "surah_en": "Ash-Sharh", "translator": "Saheeh International"}, {"text": "ٱقۡرَأۡ بِٱسۡمِ رَبِّكَ ٱلَّذِي خَلَقَ", "surah": "سورة العلق", "ayah": 1, "english": "Recite in the name of your Lord who created -", "surah_en": "Al-Alaq", "translator": "Saheeh International"}, {"text": "فَمَن يَعۡمَلۡ مِثۡقَالَ ذَرَّةٍ خَيۡرٗا يَرَهُۥ", "surah": "سورة الزلزلة", "ayah": 7, "english": "So whoever does an atom's weight of good will see it,", "surah_en": "Az-Zalzala", "translator": "Saheeh International"}, {"text": "إِنَّآ أَعۡطَيۡنَٰكَ ٱلۡكَوۡثَرَ", "surah": "سورة الكوثر", "ayah": 1, "english": "Indeed, We have granted you, [O Muhammad], al-Kawthar.", "surah_en": "Al-Kawthar", "translator": "Saheeh International"}, {"text": "فَسَبِّحۡ بِحَمۡدِ رَبِّكَ وَٱسۡتَغۡفِرۡهُۚ إِنَّهُۥ كَانَ تَوَّابَۢا", "surah": "سورة النصر", "ayah": 3, "english": "Then exalt [Him] with praise of your Lord and ask forgiveness of Him. Indeed, He is ever Accepting of repentance.", "surah_en": "An-Nasr", "translator": "Saheeh International"}, {"text": "قُلۡ هُوَ ٱللَّهُ أَحَدٌ", "surah": "سورة الإخلاص", "ayah": 1, "english": "Say, \"He is Allah, [who is] One,", "surah_en": "Al-Ikhlaas", "translator": "Saheeh International"}, {"text": "ذَٰلِكَ ٱلۡكِتَٰبُ لَا رَيۡبَۛ فِيهِۛ هُدٗى لِّلۡمُتَّقِينَ", "surah": "سورة البقرة", "ayah": 2, "english": "This is the Book about which there is no doubt, a guidance for those conscious of Allah -", "surah_en": "Al-Baqara", "translator": "Saheeh International"}, {"text": "يَٰٓأَيُّهَا ٱلنَّاسُ ٱعۡبُدُواْ رَبَّكُمُ ٱلَّذِي خَلَقَكُمۡ وَٱلَّذِينَ مِن قَبۡلِكُمۡ لَعَلَّكُمۡ تَتَّقُونَ", "surah": "سورة البقرة", "ayah": 21, "english": "O mankind, worship your Lord, who created you and those before you, that you may become righteous -", "surah_en": "Al-Baqara", "translator": "Saheeh International"}, {"text": "بَلَىٰۚ مَنۡ أَسۡلَمَ وَجۡهَهُۥ لِلَّهِ وَهُوَ مُحۡسِنٞ فَلَهُۥٓ أَجۡرُهُۥ عِندَ رَبِّهِۦ وَلَا خَوۡفٌ عَلَيۡهِمۡ وَلَا هُمۡ يَحۡزَنُونَ", "surah": "سورة البقرة", "ayah": 112, "english": "Yes [on the contrary], whoever submits his face in Islam to Allah while being a doer of good will have his reward with his Lord. And no fear will there be concerning them, nor will they grieve.", "surah_en": "Al-Baqara", "translator": "Saheeh International"}, {"text": "وَإِذۡ يَرۡفَعُ إِبۡرَٰهِـۧمُ ٱلۡقَوَاعِدَ مِنَ ٱلۡبَيۡتِ وَإِسۡمَٰعِيلُ رَبَّنَا تَقَبَّلۡ مِنَّآۖ إِنَّكَ أَنتَ ٱلسَّمِيعُ ٱلۡعَلِيمُ", "surah": "سورة البقرة", "ayah": 127, "english": "And [mention] when Abraham was raising the foundations of the House and [with him] Ishmael, [saying], \"Our Lord, accept [this] from us. Indeed You are the Hearing, the Knowing.", "surah_en": "Al-Baqara", "translator": "Saheeh International"}, {"text": "وَلِكُلّٖ وِجۡهَةٌ هُوَ مُوَلِّيهَاۖ فَٱسۡتَبِقُواْ ٱلۡخَيۡرَٰتِۚ أَيۡنَ مَا تَكُونُواْ يَأۡتِ بِكُمُ ٱللَّهُ جَمِيعًاۚ إِنَّ ٱللَّهَ عَلَىٰ كُلِّ شَيۡءٖ قَدِيرٞ", "surah": "سورة البقرة", "ayah": 148, "english": "For each [religious following] is a direction toward which it faces. So race to [all that is] good. Wherever you may be, Allah will bring you forth [for judgement] all together. Indeed, Allah is over all things competent.", "surah_en": "Al-Baqara", "translator": "Saheeh International"}, {"text": "وَلَنَبۡلُوَنَّكُم بِشَيۡءٖ مِّنَ ٱلۡخَوۡفِ وَٱلۡجُوعِ وَنَقۡصٖ مِّنَ ٱلۡأَمۡوَٰلِ وَٱلۡأَنفُسِ وَٱلثَّمَرَٰتِۗ وَبَشِّرِ ٱلصَّٰبِرِينَ", "surah": "سورة البقرة", "ayah": 155, "english": "And We will surely test you with something of fear and hunger and a loss of wealth and lives and fruits, but give good tidings to the patient,", "surah_en": "Al-Baqara", "translator": "Saheeh International"}, {"text": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُواْ كُتِبَ عَلَيۡكُمُ ٱلصِّيَامُ كَمَا كُتِبَ عَلَى ٱلَّذِينَ مِن قَبۡلِكُمۡ لَعَلَّكُمۡ تَتَّقُونَ", "surah": "سورة البقرة", "ayah": 183, "english": "O you who have believed, decreed upon you is fasting as it was decreed upon those before you that you may become righteous -", "surah_en": "Al-Baqara", "translator": "Saheeh International"}, {"text": "حَٰفِظُواْ عَلَى ٱلصَّلَوَٰتِ وَٱلصَّلَوٰةِ ٱلۡوُسۡطَىٰ وَقُومُواْ لِلَّهِ قَٰنِتِينَ", "surah": "سورة البقرة", "ayah": 238, "english": "Maintain with care the [obligatory] prayers and [in particular] the middle prayer and stand before Allah, devoutly obedient.", "surah_en": "Al-Baqara", "translator": "Saheeh International"}, {"text": "مَّن ذَا ٱلَّذِي يُقۡرِضُ ٱللَّهَ قَرۡضًا حَسَنٗا فَيُضَٰعِفَهُۥ لَهُۥٓ أَضۡعَافٗا كَثِيرَةٗۚ وَٱللَّهُ يَقۡبِضُ وَيَبۡصُۜطُ وَإِلَيۡهِ تُرۡجَعُونَ", "surah": "سورة البقرة", "ayah": 245, "english": "Who is it that would loan Allah a goodly loan so He may multiply it for him many times over? And it is Allah who withholds and grants abundance, and to Him you will be returned.", "surah_en": "Al-Baqara", "translator": "Saheeh International"}, {"text": "قَوۡلٞ مَّعۡرُوفٞ وَمَغۡفِرَةٌ خَيۡرٞ مِّن صَدَقَةٖ يَتۡبَعُهَآ أَذٗىۗ وَٱللَّهُ غَنِيٌّ حَلِيمٞ", "surah": "سورة البقرة", "ayah": 263, "english": "Kind speech and forgiveness are better than charity followed by injury. And Allah is Free of need and Forbearing.", "surah_en": "Al-Baqara", "translator": "Saheeh International"}, {"text": "ٱلَّذِينَ يُنفِقُونَ أَمۡوَٰلَهُم بِٱلَّيۡلِ وَٱلنَّهَارِ سِرّٗا وَعَلَانِيَةٗ فَلَهُمۡ أَجۡرُهُمۡ عِندَ رَبِّهِمۡ وَلَا خَوۡفٌ عَلَيۡهِمۡ وَلَا هُمۡ يَحۡزَنُونَ", "surah": "سورة البقرة", "ayah": 274, "english": "Those who spend their wealth [in Allah 's way] by night and by day, secretly and publicly - they will have their reward with their Lord. And no fear will there be concerning them, nor will they grieve.", "surah_en": "Al-Baqara", "translator": "Saheeh International"}, {"text": "إِنَّ ٱلَّذِينَ ءَامَنُواْ وَعَمِلُواْ ٱلصَّٰلِحَٰتِ وَأَقَامُواْ ٱلصَّلَوٰةَ وَءَاتَوُاْ ٱلزَّكَوٰةَ لَهُمۡ أَجۡرُهُمۡ عِندَ رَبِّهِمۡ وَلَا خَوۡفٌ عَلَيۡهِمۡ وَلَا هُمۡ يَحۡزَنُونَ", "surah": "سورة البقرة", "ayah": 277, "english": "Indeed, those who believe and do righteous deeds and establish prayer and give zakah will have their reward with their Lord, and there will be no fear concerning them, nor will they grieve.", "surah_en": "Al-Baqara", "translator": "Saheeh International"}, {"text": "وَإِن كَانَ ذُو عُسۡرَةٖ فَنَظِرَةٌ إِلَىٰ مَيۡسَرَةٖۚ وَأَن تَصَدَّقُواْ خَيۡرٞ لَّكُمۡ إِن كُنتُمۡ تَعۡلَمُونَ", "surah": "سورة البقرة", "ayah": 280, "english": "And if someone is in hardship, then [let there be] postponement until [a time of] ease. But if you give [from your right as] charity, then it is better for you, if you only knew.", "surah_en": "Al-Baqara", "translator": "Saheeh International"}, {"text": "رَبَّنَآ إِنَّكَ جَامِعُ ٱلنَّاسِ لِيَوۡمٖ لَّا رَيۡبَ فِيهِۚ إِنَّ ٱللَّهَ لَا يُخۡلِفُ ٱلۡمِيعَادَ", "surah": "سورة آل عمران", "ayah": 9, "english": "Our Lord, surely You will gather the people for a Day about which there is no doubt. Indeed, Allah does not fail in His promise.\"", "surah_en": "Aal-i-Imraan", "translator": "Saheeh International"}, {"text": "ٱلَّذِينَ يَقُولُونَ رَبَّنَآ إِنَّنَآ ءَامَنَّا فَٱغۡفِرۡ لَنَا ذُنُوبَنَا وَقِنَا عَذَابَ ٱلنَّارِ", "surah": "سورة آل عمران", "ayah": 16, "english": "Those who say, \"Our Lord, indeed we have believed, so forgive us our sins and protect us from the punishment of the Fire,\"", "surah_en": "Aal-i-Imraan", "translator": "Saheeh International"}, {"text": "قُلِ ٱللَّهُمَّ مَٰلِكَ ٱلۡمُلۡكِ تُؤۡتِي ٱلۡمُلۡكَ مَن تَشَآءُ وَتَنزِعُ ٱلۡمُلۡكَ مِمَّن تَشَآءُ وَتُعِزُّ مَن تَشَآءُ وَتُذِلُّ مَن تَشَآءُۖ بِيَدِكَ ٱلۡخَيۡرُۖ إِنَّكَ عَلَىٰ كُلِّ شَيۡءٖ قَدِيرٞ", "surah": "سورة آل عمران", "ayah": 26, "english": "Say, \"O Allah, Owner of Sovereignty, You give sovereignty to whom You will and You take sovereignty away from whom You will. You honor whom You will and You humble whom You will. In Your hand is [all] good. Indeed, You are over all things competent.", "surah_en": "Aal-i-Imraan", "translator": "Saheeh International"}, {"text": "هُنَالِكَ دَعَا زَكَرِيَّا رَبَّهُۥۖ قَالَ رَبِّ هَبۡ لِي مِن لَّدُنكَ ذُرِّيَّةٗ طَيِّبَةًۖ إِنَّكَ سَمِيعُ ٱلدُّعَآءِ", "surah": "سورة آل عمران", "ayah": 38, "english": "At that, Zechariah called upon his Lord, saying, \"My Lord, grant me from Yourself a good offspring. Indeed, You are the Hearer of supplication.\"", "surah_en": "Aal-i-Imraan", "translator": "Saheeh International"}, {"text": "رَبَّنَآ ءَامَنَّا بِمَآ أَنزَلۡتَ وَٱتَّبَعۡنَا ٱلرَّسُولَ فَٱكۡتُبۡنَا مَعَ ٱلشَّٰهِدِينَ", "surah": "سورة آل عمران", "ayah": 53, "english": "Our Lord, we have believed in what You revealed and have followed the messenger Jesus, so register us among the witnesses [to truth].\"", "surah_en": "Aal-i-Imraan", "translator": "Saheeh International"}, {"text": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُواْ ٱتَّقُواْ ٱللَّهَ حَقَّ تُقَاتِهِۦ وَلَا تَمُوتُنَّ إِلَّا وَأَنتُم مُّسۡلِمُونَ", "surah": "سورة آل عمران", "ayah": 102, "english": "O you who have believed, fear Allah as He should be feared and do not die except as Muslims [in submission to Him].", "surah_en": "Aal-i-Imraan", "translator": "Saheeh International"}, {"text": "وَلۡتَكُن مِّنكُمۡ أُمَّةٞ يَدۡعُونَ إِلَى ٱلۡخَيۡرِ وَيَأۡمُرُونَ بِٱلۡمَعۡرُوفِ وَيَنۡهَوۡنَ عَنِ ٱلۡمُنكَرِۚ وَأُوْلَٰٓئِكَ هُمُ ٱلۡمُفۡلِحُونَ", "surah": "سورة آل عمران", "ayah": 104, "english": "And let there be [arising] from you a nation inviting to [all that is] good, enjoining what is right and forbidding what is wrong, and those will be the successful.", "surah_en": "Aal-i-Imraan", "translator": "Saheeh International"}, {"text": "وَسَارِعُوٓاْ إِلَىٰ مَغۡفِرَةٖ مِّن رَّبِّكُمۡ وَجَنَّةٍ عَرۡضُهَا ٱلسَّمَٰوَٰتُ وَٱلۡأَرۡضُ أُعِدَّتۡ لِلۡمُتَّقِينَ", "surah": "سورة آل عمران", "ayah": 133, "english": "And hasten to forgiveness from your Lord and a garden as wide as the heavens and earth, prepared for the righteous", "surah_en": "Aal-i-Imraan", "translator": "Saheeh International"}, {"text": "وَٱلَّذِينَ إِذَا فَعَلُواْ فَٰحِشَةً أَوۡ ظَلَمُوٓاْ أَنفُسَهُمۡ ذَكَرُواْ ٱللَّهَ فَٱسۡتَغۡفَرُواْ لِذُنُوبِهِمۡ وَمَن يَغۡفِرُ ٱلذُّنُوبَ إِلَّا ٱللَّهُ وَلَمۡ يُصِرُّواْ عَلَىٰ مَا فَعَلُواْ وَهُمۡ يَعۡلَمُونَ", "surah": "سورة آل عمران", "ayah": 135, "english": "And those who, when they commit an immorality or wrong themselves [by transgression], remember Allah and seek forgiveness for their sins - and who can forgive sins except Allah? - and [who] do not persist in what they have done while they know.", "surah_en": "Aal-i-Imraan", "translator": "Saheeh International"}, {"text": "وَمَا كَانَ قَوۡلَهُمۡ إِلَّآ أَن قَالُواْ رَبَّنَا ٱغۡفِرۡ لَنَا ذُنُوبَنَا وَإِسۡرَافَنَا فِيٓ أَمۡرِنَا وَثَبِّتۡ أَقۡدَامَنَا وَٱنصُرۡنَا عَلَى ٱلۡقَوۡمِ ٱلۡكَٰفِرِينَ", "surah": "سورة آل عمران", "ayah": 147, "english": "And their words were not but that they said, \"Our Lord, forgive us our sins and the excess [committed] in our affairs and plant firmly our feet and give us victory over the disbelieving people.\"", "surah_en": "Aal-i-Imraan", "translator": "Saheeh International"}, {"text": "إِن يَنصُرۡكُمُ ٱللَّهُ فَلَا غَالِبَ لَكُمۡۖ وَإِن يَخۡذُلۡكُمۡ فَمَن ذَا ٱلَّذِي يَنصُرُكُم مِّنۢ بَعۡدِهِۦۗ وَعَلَى ٱللَّهِ فَلۡيَتَوَكَّلِ ٱلۡمُؤۡمِنُونَ", "surah": "سورة آل عمران", "ayah": 160, "english": "If Allah should aid you, no one can overcome you; but if He should forsake you, who is there that can aid you after Him? And upon Allah let the believers rely.", "surah_en": "Aal-i-Imraan", "translator": "Saheeh International"}, {"text": "رَبَّنَا وَءَاتِنَا مَا وَعَدتَّنَا عَلَىٰ رُسُلِكَ وَلَا تُخۡزِنَا يَوۡمَ ٱلۡقِيَٰمَةِۖ إِنَّكَ لَا تُخۡلِفُ ٱلۡمِيعَادَ", "surah": "سورة آل عمران", "ayah": 194, "english": "Our Lord, and grant us what You promised us through Your messengers and do not disgrace us on the Day of Resurrection. Indeed, You do not fail in [Your] promise.\"", "surah_en": "Aal-i-Imraan", "translator": "Saheeh International"}, {"text": "إِن تَجۡتَنِبُواْ كَبَآئِرَ مَا تُنۡهَوۡنَ عَنۡهُ نُكَفِّرۡ عَنكُمۡ سَيِّـَٔاتِكُمۡ وَنُدۡخِلۡكُم مُّدۡخَلٗا كَرِيمٗا", "surah": "سورة النساء", "ayah": 31, "english": "If you avoid the major sins which you are forbidden, We will remove from you your lesser sins and admit you to a noble entrance [into Paradise].", "surah_en": "An-Nisaa", "translator": "Saheeh International"}, {"text": "إِنَّ ٱللَّهَ لَا يَظۡلِمُ مِثۡقَالَ ذَرَّةٖۖ وَإِن تَكُ حَسَنَةٗ يُضَٰعِفۡهَا وَيُؤۡتِ مِن لَّدُنۡهُ أَجۡرًا عَظِيمٗا", "surah": "سورة النساء", "ayah": 40, "english": "Indeed, Allah does not do injustice, [even] as much as an atom's weight; while if there is a good deed, He multiplies it and gives from Himself a great reward.", "surah_en": "An-Nisaa", "translator": "Saheeh International"}, {"text": "مَّا يَفۡعَلُ ٱللَّهُ بِعَذَابِكُمۡ إِن شَكَرۡتُمۡ وَءَامَنتُمۡۚ وَكَانَ ٱللَّهُ شَاكِرًا عَلِيمٗا", "surah": "سورة النساء", "ayah": 147, "english": "What would Allah do with your punishment if you are grateful and believe? And ever is Allah Appreciative and Knowing.", "surah_en": "An-Nisaa", "translator": "Saheeh International"}, {"text": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُواْ ٱتَّقُواْ ٱللَّهَ وَٱبۡتَغُوٓاْ إِلَيۡهِ ٱلۡوَسِيلَةَ وَجَٰهِدُواْ فِي سَبِيلِهِۦ لَعَلَّكُمۡ تُفۡلِحُونَ", "surah": "سورة المائـدة", "ayah": 35, "english": "O you who have believed, fear Allah and seek the means [of nearness] to Him and strive in His cause that you may succeed.", "surah_en": "Al-Maaida", "translator": "Saheeh International"}, {"text": "وَإِن يَمۡسَسۡكَ ٱللَّهُ بِضُرّٖ فَلَا كَاشِفَ لَهُۥٓ إِلَّا هُوَۖ وَإِن يَمۡسَسۡكَ بِخَيۡرٖ فَهُوَ عَلَىٰ كُلِّ شَيۡءٖ قَدِيرٞ", "surah": "سورة الأنعام", "ayah": 17, "english": "And if Allah should touch you with adversity, there is no remover of it except Him. And if He touches you with good - then He is over all things competent.", "surah_en": "Al-An'aam", "translator": "Saheeh International"}, {"text": "وَمَا ٱلۡحَيَوٰةُ ٱلدُّنۡيَآ إِلَّا لَعِبٞ وَلَهۡوٞۖ وَلَلدَّارُ ٱلۡأٓخِرَةُ خَيۡرٞ لِّلَّذِينَ يَتَّقُونَۚ أَفَلَا تَعۡقِلُونَ", "surah": "سورة الأنعام", "ayah": 32, "english": "And the worldly life is not but amusement and diversion; but the home of the Hereafter is best for those who fear Allah, so will you not reason?", "surah_en": "Al-An'aam", "translator": "Saheeh International"}, {"text": "لَّا تُدۡرِكُهُ ٱلۡأَبۡصَٰرُ وَهُوَ يُدۡرِكُ ٱلۡأَبۡصَٰرَۖ وَهُوَ ٱللَّطِيفُ ٱلۡخَبِيرُ", "surah": "سورة الأنعام", "ayah": 103, "english": "Vision perceives Him not, but He perceives [all] vision; and He is the Subtle, the Acquainted.", "surah_en": "Al-An'aam", "translator": "Saheeh International"}, {"text": "مَن جَآءَ بِٱلۡحَسَنَةِ فَلَهُۥ عَشۡرُ أَمۡثَالِهَاۖ وَمَن جَآءَ بِٱلسَّيِّئَةِ فَلَا يُجۡزَىٰٓ إِلَّا مِثۡلَهَا وَهُمۡ لَا يُظۡلَمُونَ", "surah": "سورة الأنعام", "ayah": 160, "english": "Whoever comes [on the Day of Judgement] with a good deed will have ten times the like thereof [to his credit], and whoever comes with an evil deed will not be recompensed except the like thereof; and they will not be wronged.", "surah_en": "Al-An'aam", "translator": "Saheeh International"}, {"text": "يَٰبَنِيٓ ءَادَمَ خُذُواْ زِينَتَكُمۡ عِندَ كُلِّ مَسۡجِدٖ وَكُلُواْ وَٱشۡرَبُواْ وَلَا تُسۡرِفُوٓاْۚ إِنَّهُۥ لَا يُحِبُّ ٱلۡمُسۡرِفِينَ", "surah": "سورة الأعراف", "ayah": 31, "english": "O children of Adam, take your adornment at every masjid, and eat and drink, but be not excessive. Indeed, He likes not those who commit excess.", "surah_en": "Al-A'raaf", "translator": "Saheeh International"}, {"text": "ٱدۡعُواْ رَبَّكُمۡ تَضَرُّعٗا وَخُفۡيَةًۚ إِنَّهُۥ لَا يُحِبُّ ٱلۡمُعۡتَدِينَ", "surah": "سورة الأعراف", "ayah": 55, "english": "Call upon your Lord in humility and privately; indeed, He does not like transgressors.", "surah_en": "Al-A'raaf", "translator": "Saheeh International"}, {"text": "وَلِلَّهِ ٱلۡأَسۡمَآءُ ٱلۡحُسۡنَىٰ فَٱدۡعُوهُ بِهَاۖ وَذَرُواْ ٱلَّذِينَ يُلۡحِدُونَ فِيٓ أَسۡمَٰٓئِهِۦۚ سَيُجۡزَوۡنَ مَا كَانُواْ يَعۡمَلُونَ", "surah": "سورة الأعراف", "ayah": 180, "english": "And to Allah belong the best names, so invoke Him by them. And leave [the company of] those who practice deviation concerning His names. They will be recompensed for what they have been doing.", "surah_en": "Al-A'raaf", "translator": "Saheeh International"}, {"text": "إِنَّ ٱلَّذِينَ ٱتَّقَوۡاْ إِذَا مَسَّهُمۡ طَٰٓئِفٞ مِّنَ ٱلشَّيۡطَٰنِ تَذَكَّرُواْ فَإِذَا هُم مُّبۡصِرُونَ", "surah": "سورة الأعراف", "ayah": 201, "english": "Indeed, those who fear Allah - when an impulse touches them from Satan, they remember [Him] and at once they have insight.", "surah_en": "Al-A'raaf", "translator": "Saheeh International"}, {"text": "وَإِذَا قُرِئَ ٱلۡقُرۡءَانُ فَٱسۡتَمِعُواْ لَهُۥ وَأَنصِتُواْ لَعَلَّكُمۡ تُرۡحَمُونَ", "surah": "سورة الأعراف", "ayah": 204, "english": "So when the Qur'an is recited, then listen to it and pay attention that you may receive mercy.", "surah_en": "Al-A'raaf", "translator": "Saheeh International"}, {"text": "إِنَّمَا ٱلۡمُؤۡمِنُونَ ٱلَّذِينَ إِذَا ذُكِرَ ٱللَّهُ وَجِلَتۡ قُلُوبُهُمۡ وَإِذَا تُلِيَتۡ عَلَيۡهِمۡ ءَايَٰتُهُۥ زَادَتۡهُمۡ إِيمَٰنٗا وَعَلَىٰ رَبِّهِمۡ يَتَوَكَّلُونَ", "surah": "سورة الأنفال", "ayah": 2, "english": "The believers are only those who, when Allah is mentioned, their hearts become fearful, and when His verses are recited to them, it increases them in faith; and upon their Lord they rely -", "surah_en": "Al-Anfaal", "translator": "Saheeh International"}, {"text": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓاْ إِن تَتَّقُواْ ٱللَّهَ يَجۡعَل لَّكُمۡ فُرۡقَانٗا وَيُكَفِّرۡ عَنكُمۡ سَيِّـَٔاتِكُمۡ وَيَغۡفِرۡ لَكُمۡۗ وَٱللَّهُ ذُو ٱلۡفَضۡلِ ٱلۡعَظِيمِ", "surah": "سورة الأنفال", "ayah": 29, "english": "O you who have believed, if you fear Allah, He will grant you a criterion and will remove from you your misdeeds and forgive you. And Allah is the possessor of great bounty.", "surah_en": "Al-Anfaal", "translator": "Saheeh International"}, {"text": "وَقُلِ ٱعۡمَلُواْ فَسَيَرَى ٱللَّهُ عَمَلَكُمۡ وَرَسُولُهُۥ وَٱلۡمُؤۡمِنُونَۖ وَسَتُرَدُّونَ إِلَىٰ عَٰلِمِ ٱلۡغَيۡبِ وَٱلشَّهَٰدَةِ فَيُنَبِّئُكُم بِمَا كُنتُمۡ تَعۡمَلُونَ", "surah": "سورة التوبة", "ayah": 105, "english": "And say, \"Do [as you will], for Allah will see your deeds, and [so, will] His Messenger and the believers. And you will be returned to the Knower of the unseen and the witnessed, and He will inform you of what you used to do.\"", "surah_en": "At-Tawba", "translator": "Saheeh International"}, {"text": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُواْ ٱتَّقُواْ ٱللَّهَ وَكُونُواْ مَعَ ٱلصَّٰدِقِينَ", "surah": "سورة التوبة", "ayah": 119, "english": "O you who have believed, fear Allah and be with those who are true.", "surah_en": "At-Tawba", "translator": "Saheeh International"}, {"text": "لَقَدۡ جَآءَكُمۡ رَسُولٞ مِّنۡ أَنفُسِكُمۡ عَزِيزٌ عَلَيۡهِ مَا عَنِتُّمۡ حَرِيصٌ عَلَيۡكُم بِٱلۡمُؤۡمِنِينَ رَءُوفٞ رَّحِيمٞ", "surah": "سورة التوبة", "ayah": 128, "english": "There has certainly come to you a Messenger from among yourselves. Grievous to him is what you suffer; [he is] concerned over you and to the believers is kind and merciful.", "surah_en": "At-Tawba", "translator": "Saheeh International"}, {"text": "إِنَّ ٱلَّذِينَ ءَامَنُواْ وَعَمِلُواْ ٱلصَّٰلِحَٰتِ يَهۡدِيهِمۡ رَبُّهُم بِإِيمَٰنِهِمۡۖ تَجۡرِي مِن تَحۡتِهِمُ ٱلۡأَنۡهَٰرُ فِي جَنَّٰتِ ٱلنَّعِيمِ", "surah": "سورة يونس", "ayah": 9, "english": "Indeed, those who have believed and done righteous deeds - their Lord will guide them because of their faith. Beneath them rivers will flow in the Gardens of Pleasure", "surah_en": "Yunus", "translator": "Saheeh International"}, {"text": "إِنَّ ٱللَّهَ لَا يَظۡلِمُ ٱلنَّاسَ شَيۡـٔٗا وَلَٰكِنَّ ٱلنَّاسَ أَنفُسَهُمۡ يَظۡلِمُونَ", "surah": "سورة يونس", "ayah": 44, "english": "Indeed, Allah does not wrong the people at all, but it is the people who are wronging themselves.", "surah_en": "Yunus", "translator": "Saheeh International"}, {"text": "يَٰٓأَيُّهَا ٱلنَّاسُ قَدۡ جَآءَتۡكُم مَّوۡعِظَةٞ مِّن رَّبِّكُمۡ وَشِفَآءٞ لِّمَا فِي ٱلصُّدُورِ وَهُدٗى وَرَحۡمَةٞ لِّلۡمُؤۡمِنِينَ", "surah": "سورة يونس", "ayah": 57, "english": "O mankind, there has to come to you instruction from your Lord and healing for what is in the breasts and guidance and mercy for the believers.", "surah_en": "Yunus", "translator": "Saheeh International"}, {"text": "قُلۡ بِفَضۡلِ ٱللَّهِ وَبِرَحۡمَتِهِۦ فَبِذَٰلِكَ فَلۡيَفۡرَحُواْ هُوَ خَيۡرٞ مِّمَّا يَجۡمَعُونَ", "surah": "سورة يونس", "ayah": 58, "english": "Say, \"In the bounty of Allah and in His mercy - in that let them rejoice; it is better than what they accumulate.\"", "surah_en": "Yunus", "translator": "Saheeh International"}, {"text": "وَٱسۡتَغۡفِرُواْ رَبَّكُمۡ ثُمَّ تُوبُوٓاْ إِلَيۡهِۚ إِنَّ رَبِّي رَحِيمٞ وَدُودٞ", "surah": "سورة هود", "ayah": 90, "english": "And ask forgiveness of your Lord and then repent to Him. Indeed, my Lord is Merciful and Affectionate.\"", "surah_en": "Hud", "translator": "Saheeh International"}, {"text": "وَمَآ أُبَرِّئُ نَفۡسِيٓۚ إِنَّ ٱلنَّفۡسَ لَأَمَّارَةُۢ بِٱلسُّوٓءِ إِلَّا مَا رَحِمَ رَبِّيٓۚ إِنَّ رَبِّي غَفُورٞ رَّحِيمٞ", "surah": "سورة يوسف", "ayah": 53, "english": "And I do not acquit myself. Indeed, the soul is a persistent enjoiner of evil, except those upon which my Lord has mercy. Indeed, my Lord is Forgiving and Merciful.\"", "surah_en": "Yusuf", "translator": "Saheeh International"}, {"text": "قَالَ لَا تَثۡرِيبَ عَلَيۡكُمُ ٱلۡيَوۡمَۖ يَغۡفِرُ ٱللَّهُ لَكُمۡۖ وَهُوَ أَرۡحَمُ ٱلرَّٰحِمِينَ", "surah": "سورة يوسف", "ayah": 92, "english": "He said, \"No blame will there be upon you today. Allah will forgive you; and He is the most merciful of the merciful.\"", "surah_en": "Yusuf", "translator": "Saheeh International"}, {"text": "ٱلَّذِينَ ءَامَنُواْ وَعَمِلُواْ ٱلصَّٰلِحَٰتِ طُوبَىٰ لَهُمۡ وَحُسۡنُ مَـَٔابٖ", "surah": "سورة الرعد", "ayah": 29, "english": "Those who have believed and done righteous deeds - a good state is theirs and a good return.", "surah_en": "Ar-Ra'd", "translator": "Saheeh International"}, {"text": "يَمۡحُواْ ٱللَّهُ مَا يَشَآءُ وَيُثۡبِتُۖ وَعِندَهُۥٓ أُمُّ ٱلۡكِتَٰبِ", "surah": "سورة الرعد", "ayah": 39, "english": "Allah eliminates what He wills or confirms, and with Him is the Mother of the Book.", "surah_en": "Ar-Ra'd", "translator": "Saheeh International"}, {"text": "أَلَمۡ تَرَ كَيۡفَ ضَرَبَ ٱللَّهُ مَثَلٗا كَلِمَةٗ طَيِّبَةٗ كَشَجَرَةٖ طَيِّبَةٍ أَصۡلُهَا ثَابِتٞ وَفَرۡعُهَا فِي ٱلسَّمَآءِ", "surah": "سورة إبراهيم", "ayah": 24, "english": "Have you not considered how Allah presents an example, [making] a good word like a good tree, whose root is firmly fixed and its branches [high] in the sky?", "surah_en": "Ibrahim", "translator": "Saheeh International"}, {"text": "وَءَاتَىٰكُم مِّن كُلِّ مَا سَأَلۡتُمُوهُۚ وَإِن تَعُدُّواْ نِعۡمَتَ ٱللَّهِ لَا تُحۡصُوهَآۗ إِنَّ ٱلۡإِنسَٰنَ لَظَلُومٞ كَفَّارٞ", "surah": "سورة إبراهيم", "ayah": 34, "english": "And He gave you from all you asked of Him. And if you should count the favor of Allah, you could not enumerate them. Indeed, mankind is [generally] most unjust and ungrateful.", "surah_en": "Ibrahim", "translator": "Saheeh International"}, {"text": "هَٰذَا بَلَٰغٞ لِّلنَّاسِ وَلِيُنذَرُواْ بِهِۦ وَلِيَعۡلَمُوٓاْ أَنَّمَا هُوَ إِلَٰهٞ وَٰحِدٞ وَلِيَذَّكَّرَ أُوْلُواْ ٱلۡأَلۡبَٰبِ", "surah": "سورة إبراهيم", "ayah": 52, "english": "This [Qur'an] is notification for the people that they may be warned thereby and that they may know that He is but one God and that those of understanding will be reminded.", "surah_en": "Ibrahim", "translator": "Saheeh International"}, {"text": "إِنَّا نَحۡنُ نَزَّلۡنَا ٱلذِّكۡرَ وَإِنَّا لَهُۥ لَحَٰفِظُونَ", "surah": "سورة الحجر", "ayah": 9, "english": "Indeed, it is We who sent down the Qur'an and indeed, We will be its guardian.", "surah_en": "Al-Hijr", "translator": "Saheeh International"}, {"text": "وَٱعۡبُدۡ رَبَّكَ حَتَّىٰ يَأۡتِيَكَ ٱلۡيَقِينُ", "surah": "سورة الحجر", "ayah": 99, "english": "And worship your Lord until there comes to you the certainty (death).", "surah_en": "Al-Hijr", "translator": "Saheeh International"}, {"text": "وَمَا بِكُم مِّن نِّعۡمَةٖ فَمِنَ ٱللَّهِۖ ثُمَّ إِذَا مَسَّكُمُ ٱلضُّرُّ فَإِلَيۡهِ تَجۡـَٔرُونَ", "surah": "سورة النحل", "ayah": 53, "english": "And whatever you have of favor - it is from Allah. Then when adversity touches you, to Him you cry for help.", "surah_en": "An-Nahl", "translator": "Saheeh International"}, {"text": "مَا عِندَكُمۡ يَنفَدُ وَمَا عِندَ ٱللَّهِ بَاقٖۗ وَلَنَجۡزِيَنَّ ٱلَّذِينَ صَبَرُوٓاْ أَجۡرَهُم بِأَحۡسَنِ مَا كَانُواْ يَعۡمَلُونَ", "surah": "سورة النحل", "ayah": 96, "english": "Whatever you have will end, but what Allah has is lasting. And We will surely give those who were patient their reward according to the best of what they used to do.", "surah_en": "An-Nahl", "translator": "Saheeh International"}, {"text": "فَكُلُواْ مِمَّا رَزَقَكُمُ ٱللَّهُ حَلَٰلٗا طَيِّبٗا وَٱشۡكُرُواْ نِعۡمَتَ ٱللَّهِ إِن كُنتُمۡ إِيَّاهُ تَعۡبُدُونَ", "surah": "سورة النحل", "ayah": 114, "english": "Then eat of what Allah has provided for you [which is] lawful and good. And be grateful for the favor of Allah, if it is [indeed] Him that you worship.", "surah_en": "An-Nahl", "translator": "Saheeh International"}, {"text": "ٱدۡعُ إِلَىٰ سَبِيلِ رَبِّكَ بِٱلۡحِكۡمَةِ وَٱلۡمَوۡعِظَةِ ٱلۡحَسَنَةِۖ وَجَٰدِلۡهُم بِٱلَّتِي هِيَ أَحۡسَنُۚ إِنَّ رَبَّكَ هُوَ أَعۡلَمُ بِمَن ضَلَّ عَن سَبِيلِهِۦ وَهُوَ أَعۡلَمُ بِٱلۡمُهۡتَدِينَ", "surah": "سورة النحل", "ayah": 125, "english": "Invite to the way of your Lord with wisdom and good instruction, and argue with them in a way that is best. Indeed, your Lord is most knowing of who has strayed from His way, and He is most knowing of who is [rightly] guided.", "surah_en": "An-Nahl", "translator": "Saheeh International"}, {"text": "وَٱصۡبِرۡ وَمَا صَبۡرُكَ إِلَّا بِٱللَّهِۚ وَلَا تَحۡزَنۡ عَلَيۡهِمۡ وَلَا تَكُ فِي ضَيۡقٖ مِّمَّا يَمۡكُرُونَ", "surah": "سورة النحل", "ayah": 127, "english": "And be patient, [O Muhammad], and your patience is not but through Allah. And do not grieve over them and do not be in distress over what they conspire.", "surah_en": "An-Nahl", "translator": "Saheeh International"}, {"text": "إِنَّ هَٰذَا ٱلۡقُرۡءَانَ يَهۡدِي لِلَّتِي هِيَ أَقۡوَمُ وَيُبَشِّرُ ٱلۡمُؤۡمِنِينَ ٱلَّذِينَ يَعۡمَلُونَ ٱلصَّٰلِحَٰتِ أَنَّ لَهُمۡ أَجۡرٗا كَبِيرٗا", "surah": "سورة الإسراء", "ayah": 9, "english": "Indeed, this Qur'an guides to that which is most suitable and gives good tidings to the believers who do righteous deeds that they will have a great reward.", "surah_en": "Al-Israa", "translator": "Saheeh International"}, {"text": "وَمَنۡ أَرَادَ ٱلۡأٓخِرَةَ وَسَعَىٰ لَهَا سَعۡيَهَا وَهُوَ مُؤۡمِنٞ فَأُوْلَٰٓئِكَ كَانَ سَعۡيُهُم مَّشۡكُورٗا", "surah": "سورة الإسراء", "ayah": 19, "english": "But whoever desires the Hereafter and exerts the effort due to it while he is a believer - it is those whose effort is ever appreciated [by Allah].", "surah_en": "Al-Israa", "translator": "Saheeh International"}, {"text": "وَلَا تَقۡفُ مَا لَيۡسَ لَكَ بِهِۦ عِلۡمٌۚ إِنَّ ٱلسَّمۡعَ وَٱلۡبَصَرَ وَٱلۡفُؤَادَ كُلُّ أُوْلَٰٓئِكَ كَانَ عَنۡهُ مَسۡـُٔولٗا", "surah": "سورة الإسراء", "ayah": 36, "english": "And do not pursue that of which you have no knowledge. Indeed, the hearing, the sight and the heart - about all those [one] will be questioned.", "surah_en": "Al-Israa", "translator": "Saheeh International"}, {"text": "وَلَا تَمۡشِ فِي ٱلۡأَرۡضِ مَرَحًاۖ إِنَّكَ لَن تَخۡرِقَ ٱلۡأَرۡضَ وَلَن تَبۡلُغَ ٱلۡجِبَالَ طُولٗا", "surah": "سورة الإسراء", "ayah": 37, "english": "And do not walk upon the earth exultantly. Indeed, you will never tear the earth [apart], and you will never reach the mountains in height.", "surah_en": "Al-Israa", "translator": "Saheeh International"}, {"text": "وَقُل لِّعِبَادِي يَقُولُواْ ٱلَّتِي هِيَ أَحۡسَنُۚ إِنَّ ٱلشَّيۡطَٰنَ يَنزَغُ بَيۡنَهُمۡۚ إِنَّ ٱلشَّيۡطَٰنَ كَانَ لِلۡإِنسَٰنِ عَدُوّٗا مُّبِينٗا", "surah": "سورة الإسراء", "ayah": 53, "english": "And tell My servants to say that which is best. Indeed, Satan induces [dissension] among them. Indeed Satan is ever, to mankind, a clear enemy.", "surah_en": "Al-Israa", "translator": "Saheeh International"}, {"text": "وَلَقَدۡ كَرَّمۡنَا بَنِيٓ ءَادَمَ وَحَمَلۡنَٰهُمۡ فِي ٱلۡبَرِّ وَٱلۡبَحۡرِ وَرَزَقۡنَٰهُم مِّنَ ٱلطَّيِّبَٰتِ وَفَضَّلۡنَٰهُمۡ عَلَىٰ كَثِيرٖ مِّمَّنۡ خَلَقۡنَا تَفۡضِيلٗا", "surah": "سورة الإسراء", "ayah": 70, "english": "And We have certainly honored the children of Adam and carried them on the land and sea and provided for them of the good things and preferred them over much of what We have created, with [definite] preference.", "surah_en": "Al-Israa", "translator": "Saheeh International"}, {"text": "قُلۡ كُلّٞ يَعۡمَلُ عَلَىٰ شَاكِلَتِهِۦ فَرَبُّكُمۡ أَعۡلَمُ بِمَنۡ هُوَ أَهۡدَىٰ سَبِيلٗا", "surah": "سورة الإسراء", "ayah": 84, "english": "Say, \"Each works according to his manner, but your Lord is most knowing of who is best guided in way.\"", "surah_en": "Al-Israa", "translator": "Saheeh International"}, {"text": "إِنَّ ٱلَّذِينَ ءَامَنُواْ وَعَمِلُواْ ٱلصَّٰلِحَٰتِ إِنَّا لَا نُضِيعُ أَجۡرَ مَنۡ أَحۡسَنَ عَمَلًا", "surah": "سورة الكهف", "ayah": 30, "english": "Indeed, those who have believed and done righteous deeds - indeed, We will not allow to be lost the reward of any who did well in deeds.", "surah_en": "Al-Kahf", "translator": "Saheeh International"}, {"text": "إِنَّ ٱلَّذِينَ ءَامَنُواْ وَعَمِلُواْ ٱلصَّٰلِحَٰتِ كَانَتۡ لَهُمۡ جَنَّٰتُ ٱلۡفِرۡدَوۡسِ نُزُلًا", "surah": "سورة الكهف", "ayah": 107, "english": "Indeed, those who have believed and done righteous deeds - they will have the Gardens of Paradise as a lodging,", "surah_en": "Al-Kahf", "translator": "Saheeh International"}, {"text": "إِنَّ ٱلَّذِينَ ءَامَنُواْ وَعَمِلُواْ ٱلصَّٰلِحَٰتِ سَيَجۡعَلُ لَهُمُ ٱلرَّحۡمَٰنُ وُدّٗا", "surah": "سورة مريم", "ayah": 96, "english": "Indeed, those who have believed and done righteous deeds - the Most Merciful will appoint for them affection.", "surah_en": "Maryam", "translator": "Saheeh International"}, {"text": "مَآ أَنزَلۡنَا عَلَيۡكَ ٱلۡقُرۡءَانَ لِتَشۡقَىٰٓ", "surah": "سورة طه", "ayah": 2, "english": "We have not sent down to you the Qur'an that you be distressed", "surah_en": "Taa-Haa", "translator": "Saheeh International"}, {"text": "إِنَّنِيٓ أَنَا ٱللَّهُ لَآ إِلَٰهَ إِلَّآ أَنَا۠ فَٱعۡبُدۡنِي وَأَقِمِ ٱلصَّلَوٰةَ لِذِكۡرِيٓ", "surah": "سورة طه", "ayah": 14, "english": "Indeed, I am Allah. There is no deity except Me, so worship Me and establish prayer for My remembrance.", "surah_en": "Taa-Haa", "translator": "Saheeh International"}, {"text": "وَإِنِّي لَغَفَّارٞ لِّمَن تَابَ وَءَامَنَ وَعَمِلَ صَٰلِحٗا ثُمَّ ٱهۡتَدَىٰ", "surah": "سورة طه", "ayah": 82, "english": "But indeed, I am the Perpetual Forgiver of whoever repents and believes and does righteousness and then continues in guidance.", "surah_en": "Taa-Haa", "translator": "Saheeh International"}, {"text": "كُلُّ نَفۡسٖ ذَآئِقَةُ ٱلۡمَوۡتِۗ وَنَبۡلُوكُم بِٱلشَّرِّ وَٱلۡخَيۡرِ فِتۡنَةٗۖ وَإِلَيۡنَا تُرۡجَعُونَ", "surah": "سورة الأنبياء", "ayah": 35, "english": "Every soul will taste death. And We test you with evil and with good as trial; and to Us you will be returned.", "surah_en": "Al-Anbiyaa", "translator": "Saheeh International"}, {"text": "وَمَآ أَرۡسَلۡنَٰكَ إِلَّا رَحۡمَةٗ لِّلۡعَٰلَمِينَ", "surah": "سورة الأنبياء", "ayah": 107, "english": "And We have not sent you, [O Muhammad], except as a mercy to the worlds.", "surah_en": "Al-Anbiyaa", "translator": "Saheeh International"}, {"text": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُواْ ٱرۡكَعُواْ وَٱسۡجُدُواْۤ وَٱعۡبُدُواْ رَبَّكُمۡ وَٱفۡعَلُواْ ٱلۡخَيۡرَ لَعَلَّكُمۡ تُفۡلِحُونَ۩", "surah": "سورة الحج", "ayah": 77, "english": "O you who have believed, bow and prostrate and worship your Lord and do good - that you may succeed.", "surah_en": "Al-Hajj", "translator": "Saheeh International"}, {"text": "قَدۡ أَفۡلَحَ ٱلۡمُؤۡمِنُونَ", "surah": "سورة المؤمنون", "ayah": 1, "english": "Certainly will the believers have succeeded:", "surah_en": "Al-Muminoon", "translator": "Saheeh International"}, {"text": "ٱلَّذِينَ هُمۡ فِي صَلَاتِهِمۡ خَٰشِعُونَ", "surah": "سورة المؤمنون", "ayah": 2, "english": "They who are during their prayer humbly submissive", "surah_en": "Al-Muminoon", "translator": "Saheeh International"}, {"text": "وَٱلَّذِينَ هُمۡ عَنِ ٱللَّغۡوِ مُعۡرِضُونَ", "surah": "سورة المؤمنون", "ayah": 3, "english": "And they who turn away from ill speech", "surah_en": "Al-Muminoon", "translator": "Saheeh International"}, {"text": "أَفَحَسِبۡتُمۡ أَنَّمَا خَلَقۡنَٰكُمۡ عَبَثٗا وَأَنَّكُمۡ إِلَيۡنَا لَا تُرۡجَعُونَ", "surah": "سورة المؤمنون", "ayah": 115, "english": "Then did you think that We created you uselessly and that to Us you would not be returned?\"", "surah_en": "Al-Muminoon", "translator": "Saheeh International"}, {"text": "وَمَن يُطِعِ ٱللَّهَ وَرَسُولَهُۥ وَيَخۡشَ ٱللَّهَ وَيَتَّقۡهِ فَأُوْلَٰٓئِكَ هُمُ ٱلۡفَآئِزُونَ", "surah": "سورة النور", "ayah": 52, "english": "And whoever obeys Allah and His Messenger and fears Allah and is conscious of Him - it is those who are the attainers.", "surah_en": "An-Noor", "translator": "Saheeh International"}, {"text": "وَٱلَّذِينَ لَا يَشۡهَدُونَ ٱلزُّورَ وَإِذَا مَرُّواْ بِٱللَّغۡوِ مَرُّواْ كِرَامٗا", "surah": "سورة الفرقان", "ayah": 72, "english": "And [they are] those who do not testify to falsehood, and when they pass near ill speech, they pass by with dignity.", "surah_en": "Al-Furqaan", "translator": "Saheeh International"}, {"text": "أُوْلَٰٓئِكَ يُجۡزَوۡنَ ٱلۡغُرۡفَةَ بِمَا صَبَرُواْ وَيُلَقَّوۡنَ فِيهَا تَحِيَّةٗ وَسَلَٰمًا", "surah": "سورة الفرقان", "ayah": 75, "english": "Those will be awarded the Chamber for what they patiently endured, and they will be received therein with greetings and [words of] peace.", "surah_en": "Al-Furqaan", "translator": "Saheeh International"}, {"text": "ٱلَّذِي خَلَقَنِي فَهُوَ يَهۡدِينِ", "surah": "سورة الشعراء", "ayah": 78, "english": "Who created me, and He [it is who] guides me.", "surah_en": "Ash-Shu'araa", "translator": "Saheeh International"}, {"text": "وَٱلَّذِي هُوَ يُطۡعِمُنِي وَيَسۡقِينِ", "surah": "سورة الشعراء", "ayah": 79, "english": "And it is He who feeds me and gives me drink.", "surah_en": "Ash-Shu'araa", "translator": "Saheeh International"}, {"text": "وَٱلَّذِيٓ أَطۡمَعُ أَن يَغۡفِرَ لِي خَطِيٓـَٔتِي يَوۡمَ ٱلدِّينِ", "surah": "سورة الشعراء", "ayah": 82, "english": "And who I aspire that He will forgive me my sin on the Day of Recompense.\"", "surah_en": "Ash-Shu'araa", "translator": "Saheeh International"}, {"text": "يَوۡمَ لَا يَنفَعُ مَالٞ وَلَا بَنُونَ", "surah": "سورة الشعراء", "ayah": 88, "english": "The Day when there will not benefit [anyone] wealth or children", "surah_en": "Ash-Shu'araa", "translator": "Saheeh International"}, {"text": "وَتَوَكَّلۡ عَلَى ٱلۡعَزِيزِ ٱلرَّحِيمِ", "surah": "سورة الشعراء", "ayah": 217, "english": "And rely upon the Exalted in Might, the Merciful,", "surah_en": "Ash-Shu'araa", "translator": "Saheeh International"}, {"text": "إِنَّكَ لَا تَهۡدِي مَنۡ أَحۡبَبۡتَ وَلَٰكِنَّ ٱللَّهَ يَهۡدِي مَن يَشَآءُۚ وَهُوَ أَعۡلَمُ بِٱلۡمُهۡتَدِينَ", "surah": "سورة القصص", "ayah": 56, "english": "Indeed, [O Muhammad], you do not guide whom you like, but Allah guides whom He wills. And He is most knowing of the [rightly] guided.", "surah_en": "Al-Qasas", "translator": "Saheeh International"}, {"text": "وَمَآ أُوتِيتُم مِّن شَيۡءٖ فَمَتَٰعُ ٱلۡحَيَوٰةِ ٱلدُّنۡيَا وَزِينَتُهَاۚ وَمَا عِندَ ٱللَّهِ خَيۡرٞ وَأَبۡقَىٰٓۚ أَفَلَا تَعۡقِلُونَ", "surah": "سورة القصص", "ayah": 60, "english": "And whatever thing you [people] have been given - it is [only for] the enjoyment of worldly life and its adornment. And what is with Allah is better and more lasting; so will you not use reason?", "surah_en": "Al-Qasas", "translator": "Saheeh International"}, {"text": "تِلۡكَ ٱلدَّارُ ٱلۡأٓخِرَةُ نَجۡعَلُهَا لِلَّذِينَ لَا يُرِيدُونَ عُلُوّٗا فِي ٱلۡأَرۡضِ وَلَا فَسَادٗاۚ وَٱلۡعَٰقِبَةُ لِلۡمُتَّقِينَ", "surah": "سورة القصص", "ayah": 83, "english": "That home of the Hereafter We assign to those who do not desire exaltedness upon the earth or corruption. And the [best] outcome is for the righteous.", "surah_en": "Al-Qasas", "translator": "Saheeh International"}, {"text": "أَحَسِبَ ٱلنَّاسُ أَن يُتۡرَكُوٓاْ أَن يَقُولُوٓاْ ءَامَنَّا وَهُمۡ لَا يُفۡتَنُونَ", "surah": "سورة العنكبوت", "ayah": 2, "english": "Do the people think that they will be left to say, \"We believe\" and they will not be tried?", "surah_en": "Al-Ankaboot", "translator": "Saheeh International"}, {"text": "وَمَن جَٰهَدَ فَإِنَّمَا يُجَٰهِدُ لِنَفۡسِهِۦٓۚ إِنَّ ٱللَّهَ لَغَنِيٌّ عَنِ ٱلۡعَٰلَمِينَ", "surah": "سورة العنكبوت", "ayah": 6, "english": "And whoever strives only strives for [the benefit of] himself. Indeed, Allah is free from need of the worlds.", "surah_en": "Al-Ankaboot", "translator": "Saheeh International"}, {"text": "كُلُّ نَفۡسٖ ذَآئِقَةُ ٱلۡمَوۡتِۖ ثُمَّ إِلَيۡنَا تُرۡجَعُونَ", "surah": "سورة العنكبوت", "ayah": 57, "english": "Every soul will taste death. Then to Us will you be returned.", "surah_en": "Al-Ankaboot", "translator": "Saheeh International"}, {"text": "وَمَا هَٰذِهِ ٱلۡحَيَوٰةُ ٱلدُّنۡيَآ إِلَّا لَهۡوٞ وَلَعِبٞۚ وَإِنَّ ٱلدَّارَ ٱلۡأٓخِرَةَ لَهِيَ ٱلۡحَيَوَانُۚ لَوۡ كَانُواْ يَعۡلَمُونَ", "surah": "سورة العنكبوت", "ayah": 64, "english": "And this worldly life is not but diversion and amusement. And indeed, the home of the Hereafter - that is the [eternal] life, if only they knew.", "surah_en": "Al-Ankaboot", "translator": "Saheeh International"}, {"text": "فَٱصۡبِرۡ إِنَّ وَعۡدَ ٱللَّهِ حَقّٞۖ وَلَا يَسۡتَخِفَّنَّكَ ٱلَّذِينَ لَا يُوقِنُونَ", "surah": "سورة الروم", "ayah": 60, "english": "So be patient. Indeed, the promise of Allah is truth. And let them not disquiet you who are not certain [in faith].", "surah_en": "Ar-Room", "translator": "Saheeh International"}, {"text": "وَإِذۡ قَالَ لُقۡمَٰنُ لِٱبۡنِهِۦ وَهُوَ يَعِظُهُۥ يَٰبُنَيَّ لَا تُشۡرِكۡ بِٱللَّهِۖ إِنَّ ٱلشِّرۡكَ لَظُلۡمٌ عَظِيمٞ", "surah": "سورة لقمان", "ayah": 13, "english": "And [mention, O Muhammad], when Luqman said to his son while he was instructing him, \"O my son, do not associate [anything] with Allah. Indeed, association [with him] is great injustice.\"", "surah_en": "Luqman", "translator": "Saheeh International"}, {"text": "وَلَا تُصَعِّرۡ خَدَّكَ لِلنَّاسِ وَلَا تَمۡشِ فِي ٱلۡأَرۡضِ مَرَحًاۖ إِنَّ ٱللَّهَ لَا يُحِبُّ كُلَّ مُخۡتَالٖ فَخُورٖ", "surah": "سورة لقمان", "ayah": 18, "english": "And do not turn your cheek [in contempt] toward people and do not walk through the earth exultantly. Indeed, Allah does not like everyone self-deluded and boastful.", "surah_en": "Luqman", "translator": "Saheeh International"}, {"text": "وَٱقۡصِدۡ فِي مَشۡيِكَ وَٱغۡضُضۡ مِن صَوۡتِكَۚ إِنَّ أَنكَرَ ٱلۡأَصۡوَٰتِ لَصَوۡتُ ٱلۡحَمِيرِ", "surah": "سورة لقمان", "ayah": 19, "english": "And be moderate in your pace and lower your voice; indeed, the most disagreeable of sounds is the voice of donkeys.\"", "surah_en": "Luqman", "translator": "Saheeh International"}, {"text": "وَمَن يُسۡلِمۡ وَجۡهَهُۥٓ إِلَى ٱللَّهِ وَهُوَ مُحۡسِنٞ فَقَدِ ٱسۡتَمۡسَكَ بِٱلۡعُرۡوَةِ ٱلۡوُثۡقَىٰۗ وَإِلَى ٱللَّهِ عَٰقِبَةُ ٱلۡأُمُورِ", "surah": "سورة لقمان", "ayah": 22, "english": "And whoever submits his face to Allah while he is a doer of good - then he has grasped the most trustworthy handhold. And to Allah will be the outcome of [all] matters.", "surah_en": "Luqman", "translator": "Saheeh International"}, {"text": "لَّقَدۡ كَانَ لَكُمۡ فِي رَسُولِ ٱللَّهِ أُسۡوَةٌ حَسَنَةٞ لِّمَن كَانَ يَرۡجُواْ ٱللَّهَ وَٱلۡيَوۡمَ ٱلۡأٓخِرَ وَذَكَرَ ٱللَّهَ كَثِيرٗا", "surah": "سورة الأحزاب", "ayah": 21, "english": "There has certainly been for you in the Messenger of Allah an excellent pattern for anyone whose hope is in Allah and the Last Day and [who] remembers Allah often.", "surah_en": "Al-Ahzaab", "translator": "Saheeh International"}, {"text": "يَٰٓأَيُّهَا ٱلنَّاسُ إِنَّ وَعۡدَ ٱللَّهِ حَقّٞۖ فَلَا تَغُرَّنَّكُمُ ٱلۡحَيَوٰةُ ٱلدُّنۡيَا وَلَا يَغُرَّنَّكُم بِٱللَّهِ ٱلۡغَرُورُ", "surah": "سورة فاطر", "ayah": 5, "english": "O mankind, indeed the promise of Allah is truth, so let not the worldly life delude you and be not deceived about Allah by the Deceiver.", "surah_en": "Faatir", "translator": "Saheeh International"}, {"text": "يَٰٓأَيُّهَا ٱلنَّاسُ أَنتُمُ ٱلۡفُقَرَآءُ إِلَى ٱللَّهِۖ وَٱللَّهُ هُوَ ٱلۡغَنِيُّ ٱلۡحَمِيدُ", "surah": "سورة فاطر", "ayah": 15, "english": "O mankind, you are those in need of Allah, while Allah is the Free of need, the Praiseworthy.", "surah_en": "Faatir", "translator": "Saheeh International"}, {"text": "سَلَٰمٞ قَوۡلٗا مِّن رَّبّٖ رَّحِيمٖ", "surah": "سورة يس", "ayah": 58, "english": "[And] \"Peace,\" a word from a Merciful Lord.", "surah_en": "Yaseen", "translator": "Saheeh International"}, {"text": "إِنَّمَآ أَمۡرُهُۥٓ إِذَآ أَرَادَ شَيۡـًٔا أَن يَقُولَ لَهُۥ كُن فَيَكُونُ", "surah": "سورة يس", "ayah": 82, "english": "His command is only when He intends a thing that He says to it, \"Be,\" and it is.", "surah_en": "Yaseen", "translator": "Saheeh International"}, {"text": "سُبۡحَٰنَ رَبِّكَ رَبِّ ٱلۡعِزَّةِ عَمَّا يَصِفُونَ", "surah": "سورة الصافات", "ayah": 180, "english": "Exalted is your Lord, the Lord of might, above what they describe.", "surah_en": "As-Saaffaat", "translator": "Saheeh International"}, {"text": "وَسَلَٰمٌ عَلَى ٱلۡمُرۡسَلِينَ", "surah": "سورة الصافات", "ayah": 181, "english": "And peace upon the messengers.", "surah_en": "As-Saaffaat", "translator": "Saheeh International"}, {"text": "وَٱلۡحَمۡدُ لِلَّهِ رَبِّ ٱلۡعَٰلَمِينَ", "surah": "سورة الصافات", "ayah": 182, "english": "And praise to Allah, Lord of the worlds.", "surah_en": "As-Saaffaat", "translator": "Saheeh International"}, {"text": "ٱلَّذِينَ يَسۡتَمِعُونَ ٱلۡقَوۡلَ فَيَتَّبِعُونَ أَحۡسَنَهُۥٓۚ أُوْلَٰٓئِكَ ٱلَّذِينَ هَدَىٰهُمُ ٱللَّهُۖ وَأُوْلَٰٓئِكَ هُمۡ أُوْلُواْ ٱلۡأَلۡبَٰبِ", "surah": "سورة الزمر", "ayah": 18, "english": "Who listen to speech and follow the best of it. Those are the ones Allah has guided, and those are people of understanding.", "surah_en": "Az-Zumar", "translator": "Saheeh International"}, {"text": "وَأَنِيبُوٓاْ إِلَىٰ رَبِّكُمۡ وَأَسۡلِمُواْ لَهُۥ مِن قَبۡلِ أَن يَأۡتِيَكُمُ ٱلۡعَذَابُ ثُمَّ لَا تُنصَرُونَ", "surah": "سورة الزمر", "ayah": 54, "english": "And return [in repentance] to your Lord and submit to Him before the punishment comes upon you; then you will not be helped.", "surah_en": "Az-Zumar", "translator": "Saheeh International"}, {"text": "يَٰقَوۡمِ إِنَّمَا هَٰذِهِ ٱلۡحَيَوٰةُ ٱلدُّنۡيَا مَتَٰعٞ وَإِنَّ ٱلۡأٓخِرَةَ هِيَ دَارُ ٱلۡقَرَارِ", "surah": "سورة غافر", "ayah": 39, "english": "O my people, this worldly life is only [temporary] enjoyment, and indeed, the Hereafter - that is the home of [permanent] settlement.", "surah_en": "Ghafir", "translator": "Saheeh International"}, {"text": "هُوَ ٱلۡحَيُّ لَآ إِلَٰهَ إِلَّا هُوَ فَٱدۡعُوهُ مُخۡلِصِينَ لَهُ ٱلدِّينَۗ ٱلۡحَمۡدُ لِلَّهِ رَبِّ ٱلۡعَٰلَمِينَ", "surah": "سورة غافر", "ayah": 65, "english": "He is the Ever-Living; there is no deity except Him, so call upon Him, [being] sincere to Him in religion. [All] praise is [due] to Allah, Lord of the worlds.", "surah_en": "Ghafir", "translator": "Saheeh International"}, {"text": "إِنَّ ٱلَّذِينَ قَالُواْ رَبُّنَا ٱللَّهُ ثُمَّ ٱسۡتَقَٰمُواْ تَتَنَزَّلُ عَلَيۡهِمُ ٱلۡمَلَٰٓئِكَةُ أَلَّا تَخَافُواْ وَلَا تَحۡزَنُواْ وَأَبۡشِرُواْ بِٱلۡجَنَّةِ ٱلَّتِي كُنتُمۡ تُوعَدُونَ", "surah": "سورة فصلت", "ayah": 30, "english": "Indeed, those who have said, \"Our Lord is Allah \" and then remained on a right course - the angels will descend upon them, [saying], \"Do not fear and do not grieve but receive good tidings of Paradise, which you were promised.", "surah_en": "Fussilat", "translator": "Saheeh International"}, {"text": "وَمَنۡ أَحۡسَنُ قَوۡلٗا مِّمَّن دَعَآ إِلَى ٱللَّهِ وَعَمِلَ صَٰلِحٗا وَقَالَ إِنَّنِي مِنَ ٱلۡمُسۡلِمِينَ", "surah": "سورة فصلت", "ayah": 33, "english": "And who is better in speech than one who invites to Allah and does righteousness and says, \"Indeed, I am of the Muslims.\"", "surah_en": "Fussilat", "translator": "Saheeh International"}, {"text": "مَّنۡ عَمِلَ صَٰلِحٗا فَلِنَفۡسِهِۦۖ وَمَنۡ أَسَآءَ فَعَلَيۡهَاۗ وَمَا رَبُّكَ بِظَلَّٰمٖ لِّلۡعَبِيدِ", "surah": "سورة فصلت", "ayah": 46, "english": "Whoever does righteousness - it is for his [own] soul; and whoever does evil [does so] against it. And your Lord is not ever unjust to [His] servants.", "surah_en": "Fussilat", "translator": "Saheeh International"}, {"text": "فَاطِرُ ٱلسَّمَٰوَٰتِ وَٱلۡأَرۡضِۚ جَعَلَ لَكُم مِّنۡ أَنفُسِكُمۡ أَزۡوَٰجٗا وَمِنَ ٱلۡأَنۡعَٰمِ أَزۡوَٰجٗا يَذۡرَؤُكُمۡ فِيهِۚ لَيۡسَ كَمِثۡلِهِۦ شَيۡءٞۖ وَهُوَ ٱلسَّمِيعُ ٱلۡبَصِيرُ", "surah": "سورة الشورى", "ayah": 11, "english": "[He is] Creator of the heavens and the earth. He has made for you from yourselves, mates, and among the cattle, mates; He multipli
