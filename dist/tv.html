irham equal to what he is owed by the first", "source_en": "Jami at-Tirmidhi · 1264"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، أَنَّ النَّبِيَّ ﷺ قَالَ"], ["q", "الرَّجُلُ عَلَى دِينِ خَلِيلِهِ فَلْيَنْظُرْ أَحَدُكُمْ مَنْ يُخَالِلُ"]], "source": "سنن أبي داود · ٤٨٣٣ · حسن عند الألباني", "english": "Narrated AbuHurayrah: The Prophet (ﷺ) said: A man follows the religion of his friend; so each one should consider whom he makes his friend", "source_en": "Sunan Abi Dawud · 4833"}, {"parts": [["n", "عن أَبِي مُوسَى رضى الله عنه عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "مَثَلُ الْجَلِيسِ الصَّالِحِ وَالسَّوْءِ كَحَامِلِ الْمِسْكِ وَنَافِخِ الْكِيرِ، فَحَامِلُ الْمِسْكِ إِمَّا أَنْ يُحْذِيَكَ، وَإِمَّا أَنْ تَبْتَاعَ مِنْهُ، وَإِمَّا أَنْ تَجِدَ مِنْهُ رِيحًا طَيِّبَةً، وَنَافِخُ الْكِيرِ إِمَّا أَنْ يُحْرِقَ ثِيَابَكَ، وَإِمَّا أَنْ تَجِدَ رِيحًا خَبِيثَةً"]], "source": "صحيح البخاري · ٥٥٣٤", "english": "Narrated Abu Musa:The Prophet (ﷺ) said, 'The example of a good pious companion and an evil one is that of a person carrying musk and another blowing a pair of bellows. The one who is carrying musk will either give you some perfume as a present, or you will buy some from him, or you will get a good smell from him, but the one who is blowing a pair of bellows will either burn your clothes or you will get a bad smell from him", "source_en": "Sahih al-Bukhari · 5534"}, {"parts": [["n", "عن سَلْمَانَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "لاَ يَرُدُّ الْقَضَاءَ إِلاَّ الدُّعَاءُ وَلاَ يَزِيدُ فِي الْعُمُرِ إِلاَّ الْبِرُّ"]], "source": "جامع الترمذي · ٢١٣٩ · حسن غريب", "english": "Salman narrated that the Messenger of Allah (s.a.w) said:\"Nothing turns back the Decree except supplication, and nothing increases the life-span except righteousness", "source_en": "Jami at-Tirmidhi · 2139"}, {"parts": [["n", "عن سَهْلٍ رضى الله عنه عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "إِنَّ فِي الْجَنَّةِ بَابًا يُقَالُ لَهُ الرَّيَّانُ، يَدْخُلُ مِنْهُ الصَّائِمُونَ يَوْمَ الْقِيَامَةِ، لاَ يَدْخُلُ مِنْهُ أَحَدٌ غَيْرُهُمْ يُقَالُ أَيْنَ الصَّائِمُونَ فَيَقُومُونَ، لاَ يَدْخُلُ مِنْهُ أَحَدٌ غَيْرُهُمْ، فَإِذَا دَخَلُوا أُغْلِقَ، فَلَمْ يَدْخُلْ مِنْهُ أَحَدٌ"]], "source": "صحيح البخاري · ١٨٩٦", "english": "Narrated Sahl:The Prophet (ﷺ) said, \"There is a gate in Paradise called Ar-Raiyan, and those who observe fasts will enter through it on the Day of Resurrection and none except them will enter through it. It will be said, 'Where are those who used to observe fasts?' They will get up, and none except them will enter through it. After their entry the gate will be closed and nobody will enter through it", "source_en": "Sahih al-Bukhari · 1896"}, {"parts": [["n", "عن زَيْدِ بْنِ خَالِدٍ الْجُهَنِيِّ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "مَنْ فَطَّرَ صَائِمًا كَانَ لَهُ مِثْلُ أَجْرِهِ غَيْرَ أَنَّهُ لاَ يَنْقُصُ مِنْ أَجْرِ الصَّائِمِ شَيْئًا"]], "source": "جامع الترمذي · ٨٠٧ · حسن صحيح", "english": "Zaid bin Khalid Al-Juhani narrated that:The Messenger of Allah said: \"Whoever provides the food for a fasting person to break his fast with, then for him is the same reward as his (the fasting person's), without anything being diminished from the reward of the fasting person", "source_en": "Jami at-Tirmidhi · 807"}, {"parts": [["n", "عن أبي هُرَيْرَةَ، يَقُولُ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "خَيْرُ يَوْمٍ طَلَعَتْ عَلَيْهِ الشَّمْسُ يَوْمُ الْجُمُعَةِ فِيهِ خُلِقَ آدَمُ وَفِيهِ أُدْخِلَ الْجَنَّةَ وَفِيهِ أُخْرِجَ مِنْهَا"]], "source": "صحيح مسلم · ٨٥٤", "english": "Abu Sufyan reported it on the authority of Jabir that he had heard the Messenger of Allah (ﷺ) say:When Satan hears the call to prayer, he runs away to a distance like that of Rauha. Sulaimin said: I asked him about Rauha. He replied: It is at a distance of thirty-six miles from Medina", "source_en": "Sahih Muslim · 854"}, {"parts": [["n", "عن عَائِشَةَ، قَالَتْ سُئِلَ رَسُولُ اللَّهِ ﷺ عَنِ الرَّجُلِ يَجِدُ الْبَلَلَ وَلاَ يَذْكُرُ احْتِلاَمًا قَالَ"], ["q", "يَغْتَسِلُ"], ["n", "وَعَنِ الرَّجُلِ يَرَى أَنَّهُ قَدِ احْتَلَمَ وَلاَ يَجِدُ الْبَلَلَ قَالَ"], ["q", "لاَ غُسْلَ عَلَيْهِ"], ["n", "فَقَالَتْ أُمُّ سُلَيْمٍ الْمَرْأَةُ تَرَى ذَلِكَ أَعَلَيْهَا غُسْلٌ قَالَ"], ["q", "نَعَمْ إِنَّمَا النِّسَاءُ شَقَائِقُ الرِّجَالِ"]], "source": "سنن أبي داود · ٢٣٦ · حسن عند الألباني", "english": "Narrated Aisha, Ummul Mu'minin: The Prophet (ﷺ) was asked about a person who found moisture (on his body or clothes) but did not remember the sexual dream. He replied: He should take a bath. He was asked about a person who remembered that he had a sexual dream but did not find moisture. He replied: Bath is not necessary for him. Umm Salamah then asked: Is washing necessary for a woman if she sees that (in her dream)? He replied: Yes. Woman are counterpart of men", "source_en": "Sunan Abi Dawud · 236"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ رضى الله عنه أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "فَوَالَّذِي نَفْسِي بِيَدِهِ لاَ يُؤْمِنُ أَحَدُكُمْ حَتَّى أَكُونَ أَحَبَّ إِلَيْهِ مِنْ وَالِدِهِ وَوَلَدِهِ"]], "source": "صحيح البخاري · ١٤", "english": "Narrated Abu Huraira: \"Allah's Messenger (ﷺ) said, \"By Him in Whose Hands my life is, none of you will have faith till he loves me more than his father and his children", "source_en": "Sahih al-Bukhari · 14"}, {"parts": [["n", "عن أَنَسٍ رضى الله عنه عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "ثَلاَثٌ مَنْ كُنَّ فِيهِ وَجَدَ حَلاَوَةَ الإِيمَانِ مَنْ كَانَ اللَّهُ وَرَسُولُهُ أَحَبَّ إِلَيْهِ مِمَّا سِوَاهُمَا، وَمَنْ أَحَبَّ عَبْدًا لاَ يُحِبُّهُ إِلاَّ لِلَّهِ، وَمَنْ يَكْرَهُ أَنْ يَعُودَ فِي الْكُفْرِ بَعْدَ إِذْ أَنْقَذَهُ اللَّهُ، كَمَا يَكْرَهُ أَنْ يُلْقَى فِي النَّارِ"]], "source": "صحيح البخاري · ٢١", "english": "Narrated Anas: The Prophet (ﷺ) said, \"Whoever possesses the following three qualities will taste the sweetness of faith: 1. The one to whom Allah and His Apostle become dearer than anything else. 2. Who loves a person and he loves him only for Allah's sake. 3. Who hates to revert to disbelief (Atheism) after Allah has brought (saved) him out from it, as he hates to be thrown in fire", "source_en": "Sahih al-Bukhari · 21"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "الإِيمَانُ بِضْعٌ وَسَبْعُونَ أَوْ بِضْعٌ وَسِتُّونَ شُعْبَةً فَأَفْضَلُهَا قَوْلُ لاَ إِلَهَ إِلاَّ اللَّهُ وَأَدْنَاهَا إِمَاطَةُ الأَذَى عَنِ الطَّرِيقِ وَالْحَيَاءُ شُعْبَةٌ مِنَ الإِيمَانِ"]], "source": "صحيح مسلم · ٣٥"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "اجْتَنِبُوا السَّبْعَ الْمُوبِقَاتِ"], ["n", "قَالُوا يَا رَسُولَ اللَّهِ وَمَا هُنَّ قَالَ"], ["q", "الشِّرْكُ بِاللَّهِ، وَالسِّحْرُ، وَقَتْلُ النَّفْسِ الَّتِي حَرَّمَ اللَّهُ إِلاَّ بِالْحَقِّ، وَأَكْلُ الرِّبَا، وَأَكْلُ مَالِ الْيَتِيمِ، وَالتَّوَلِّي يَوْمَ الزَّحْفِ، وَقَذْفُ الْمُحْصَنَاتِ الْمُؤْمِنَاتِ الْغَافِلاَتِ"]], "source": "صحيح البخاري · ٦٨٥٧", "english": "Narrated Abu Huraira:The Prophet (ﷺ) said, \"Avoid the seven great destructive sins.\" They (the people!) asked, \"O Allah's Apostle! What are they?\" He said, \"To join partners in worship with Allah; to practice sorcery; to kill the life which Allah has forbidden except for a just cause (according to Islamic law); to eat up usury (Riba), to eat up the property of an orphan; to give one's back to the enemy and fleeing from the battle-field at the time of fighting and to accuse chaste women who never even think of anything touching chastity and are good believers", "source_en": "Sahih al-Bukhari · 6857"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ رضى الله عنه عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "إِنَّ اللَّهَ تَجَاوَزَ عَنْ أُمَّتِي مَا حَدَّثَتْ بِهِ أَنْفُسَهَا، مَا لَمْ تَعْمَلْ أَوْ تَتَكَلَّمْ"]], "source": "صحيح البخاري · ٥٢٦٩", "english": "Narrated Abu Huraira:The Prophet (ﷺ) said, \"Allah has forgiven my followers the evil thoughts that occur to their minds, as long as such thoughts are not put into action or uttered.\" And Qatada said, \"If someone divorces his wife just in his mind, such an unuttered divorce has no effect.:", "source_en": "Sahih al-Bukhari · 5269"}, {"parts": [["n", "عن أَبِي أُمَامَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "أَنَا زَعِيمٌ بِبَيْتٍ فِي رَبَضِ الْجَنَّةِ لِمَنْ تَرَكَ الْمِرَاءَ وَإِنْ كَانَ مُحِقًّا وَبِبَيْتٍ فِي وَسَطِ الْجَنَّةِ لِمَنْ تَرَكَ الْكَذِبَ وَإِنْ كَانَ مَازِحًا وَبِبَيْتٍ فِي أَعْلَى الْجَنَّةِ لِمَنْ حَسَّنَ خُلُقَهُ"]], "source": "سنن أبي داود · ٤٨٠٠ · حسن عند الألباني", "english": "Narrated AbuUmamah: The Prophet (ﷺ) said: I guarantee a house in the surroundings of Paradise for a man who avoids quarrelling even if he were in the right, a house in the middle of Paradise for a man who avoids lying even if he were joking, and a house in the upper part of Paradise for a man who made his character good", "source_en": "Sunan Abi Dawud · 4800"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "إِنَّ الْعَبْدَ لَيَتَكَلَّمُ بِالْكَلِمَةِ مِنْ رِضْوَانِ اللَّهِ لاَ يُلْقِي لَهَا بَالاً، يَرْفَعُ اللَّهُ بِهَا دَرَجَاتٍ، وَإِنَّ الْعَبْدَ لَيَتَكَلَّمُ بِالْكَلِمَةِ مِنْ سَخَطِ اللَّهِ لاَ يُلْقِي لَهَا بَالاً يَهْوِي بِهَا فِي جَهَنَّمَ"]], "source": "صحيح البخاري · ٦٤٧٨", "english": "Narrated Abu Huraira:The Prophet; said, \"A slave (of Allah) may utter a word which pleases Allah without giving it much importance, and because of that Allah will raise him to degrees (of reward): a slave (of Allah) may utter a word (carelessly) which displeases Allah without thinking of its gravity and because of that he will be thrown into the Hell-Fire", "source_en": "Sahih al-Bukhari · 6478"}, {"parts": [["n", "عن سَهْلِ بْنِ سَعْدٍ، عَنْ رَسُولِ اللَّهِ ﷺ قَالَ"], ["q", "مَنْ يَضْمَنْ لِي مَا بَيْنَ لَحْيَيْهِ وَمَا بَيْنَ رِجْلَيْهِ أَضْمَنْ لَهُ الْجَنَّةَ"]], "source": "صحيح البخاري · ٦٤٧٤", "english": "Narrated Sahl bin Sa`d:Allah's Messenger (ﷺ) said, \"Whoever can guarantee (the chastity of) what is between his two jaw-bones and what is between his two legs (i.e. his tongue and his private parts), I guarantee Paradise for him", "source_en": "Sahih al-Bukhari · 6474"}, {"parts": [["n", "عن عَائِشَةَ رضى الله عنها عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "إِنَّ أَبْغَضَ الرِّجَالِ إِلَى اللَّهِ الأَلَدُّ الْخَصِمُ"]], "source": "صحيح البخاري · ٢٤٥٧", "english": "Narrated `Aisha:The Prophet (ﷺ) said, \"The most hated person in the sight of Allah is the most quarrelsome person", "source_en": "Sahih al-Bukhari · 2457"}, {"parts": [["n", "عن عَبْدِ اللَّهِ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "لَيْسَ الْمُؤْمِنُ بِالطَّعَّانِ وَلاَ اللَّعَّانِ وَلاَ الْفَاحِشِ وَلاَ الْبَذِيءِ"]], "source": "جامع الترمذي · ١٩٧٧ · حسن غريب", "english": "Abdullah narrated that the Messenger of Allah said:\"The believer does not insult the honor of others, nor curse, nor commit Fahishah, nor is he foul", "source_en": "Jami at-Tirmidhi · 1977"}, {"parts": [["n", "عن عَبْدِ اللَّهِ بْنِ عَمْرٍو، أَنَّ النَّبِيَّ ﷺ قَالَ"], ["q", "أَرْبَعٌ مَنْ كُنَّ فِيهِ كَانَ مُنَافِقًا خَالِصًا، وَمَنْ كَانَتْ فِيهِ خَصْلَةٌ مِنْهُنَّ كَانَتْ فِيهِ خَصْلَةٌ مِنَ النِّفَاقِ حَتَّى يَدَعَهَا إِذَا اؤْتُمِنَ خَانَ وَإِذَا حَدَّثَ كَذَبَ وَإِذَا عَاهَدَ غَدَرَ، وَإِذَا خَاصَمَ فَجَرَ"]], "source": "صحيح البخاري · ٣٤", "english": "Narrated 'Abdullah bin 'Amr: The Prophet (ﷺ) said, \"Whoever has the following four (characteristics) will be a pure hypocrite and whoever has one of the following four characteristics will have one characteristic of hypocrisy unless and until he gives it up. 1. Whenever he is entrusted, he betrays. 2. Whenever he speaks, he tells a lie. 3. Whenever he makes a covenant, he proves treacherous. 4. Whenever he quarrels, he behaves in a very imprudent, evil and insulting manner", "source_en": "Sahih al-Bukhari · 34"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، عَنْ رَسُولِ اللَّهِ ﷺ قَالَ"], ["q", "الْمُؤْمِنُ مِرْآةُ الْمُؤْمِنِ وَالْمُؤْمِنُ أَخُو الْمُؤْمِنِ يَكُفُّ عَلَيْهِ ضَيْعَتَهُ وَيَحُوطُهُ مِنْ وَرَائِهِ"]], "source": "سنن أبي داود · ٤٩١٨ · حسن عند الألباني", "english": "Narrated AbuHurayrah: The Prophet (ﷺ) said: The believer is the believer's mirror, and the believer is the believer's brother who guards him against loss and protects him when he is absent", "source_en": "Sunan Abi Dawud · 4918"}, {"parts": [["n", "عن عَبْدِ اللَّهِ بْنِ عَمْرٍو، أَنَّ رَجُلاً، سَأَلَ رَسُولَ اللَّهِ ﷺ أَىُّ الإِسْلاَمِ خَيْرٌ قَالَ"], ["q", "تُطْعِمُ الطَّعَامَ، وَتَقْرَأُ السَّلاَمَ عَلَى مَنْ عَرَفْتَ وَمَنْ لَمْ تَعْرِفْ"]], "source": "صحيح البخاري · ٢٨", "english": "Narrated 'Abdullah bin 'Amr: A person asked Allah's Messenger (ﷺ), \"What (sort of) deeds in or (what qualities of) Islam are good?\" He replied, \"To feed (the poor) and greet those whom you know and those whom you don't know", "source_en": "Sahih al-Bukhari · 28"}, {"parts": [["n", "عن أَبِي مُوسَى رضى الله عنه قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "إِنَّ اللَّهَ لَيُمْلِي لِلظَّالِمِ حَتَّى إِذَا أَخَذَهُ لَمْ يُفْلِتْهُ"]], "source": "صحيح البخاري · ٤٦٨٦", "english": "Narrated Abu Musa:Allah's Messenger (ﷺ) said, \"Allah gives respite to the oppressor, but when He takes him over, He never releases him.\" Then he recited:-- \"Such is the seizure of your Lord when He seizes (population of) towns in the midst of their wrong: Painful indeed, and severe is His seizure", "source_en": "Sahih al-Bukhari · 4686"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "الْمُسْتَشَارُ مُؤْتَمَنٌ"]], "source": "سنن أبي داود · ٥١٢٨ · صحيح عند الألباني", "english": "Narrated AbuHurayrah: The Prophet (ﷺ) said: He who is consulted is trustworthy", "source_en": "Sunan Abi Dawud · 5128"}, {"parts": [["n", "عن أَبِي شُرَيْحٍ، أَنَّ النَّبِيَّ ﷺ قَالَ"], ["q", "وَاللَّهِ لاَ يُؤْمِنُ، وَاللَّهِ لاَ يُؤْمِنُ، وَاللَّهِ لاَ يُؤْمِنُ"], ["n", "قِيلَ وَمَنْ يَا رَسُولَ اللَّهِ قَالَ"], ["q", "الَّذِي لاَ يَأْمَنُ جَارُهُ بَوَايِقَهُ"]], "source": "صحيح البخاري · ٦٠١٦", "english": "Narrated Abu Shuraih:The Prophet (ﷺ) said, \"By Allah, he does not believe! By Allah, he does not believe! By Allah, he does not believe!\" It was said, \"Who is that, O Allah's Messenger (ﷺ)?\" He said, \"That person whose neighbor does not feel safe from his evil", "source_en": "Sahih al-Bukhari · 6016"}, {"parts": [["n", "عن عَبْدِ اللَّهِ بْنِ عَمْرٍو، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "خَيْرُ الأَصْحَابِ عِنْدَ اللَّهِ خَيْرُهُمْ لِصَاحِبِهِ وَخَيْرُ الْجِيرَانِ عِنْدَ اللَّهِ خَيْرُهُمْ لِجَارِهِ"]], "source": "جامع الترمذي · ١٩٤٤ · حسن غريب", "english": "Abdullah bin Amr narrated that the Messenger of Allah said :\"The companion who is the best to Allah is the one who is best to his companion. And the neighbor that is the best to Allah is the one that is best to his neighbor", "source_en": "Jami at-Tirmidhi · 1944"}, {"parts": [["n", "عن مُسْتَوْرِدً، أَخَا بَنِي فِهْرٍ قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "مَا الدُّنْيَا فِي الآخِرَةِ إِلاَّ مِثْلُ مَا يَجْعَلُ أَحَدُكُمْ إِصْبَعَهُ فِي الْيَمِّ فَلْيَنْظُرْ بِمَاذَا يَرْجِعُ"]], "source": "جامع الترمذي · ٢٣٢٣ · حسن صحيح", "english": "Qa'is bin Abi Hazim said:I heard Mustawrid, a member of Banu Fihr, saying: The Messenger of Allah (s.a.w) said: \"The world compared to the Hereafter is but like what one of you gets when placing his finger into the sea, so look at what you draw from it", "source_en": "Jami at-Tirmidhi · 2323"}, {"parts": [["n", "عن سَهْلِ بْنِ سَعْدٍ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "لَوْ كَانَتِ الدُّنْيَا تَعْدِلُ عِنْدَ اللَّهِ جَنَاحَ بَعُوضَةٍ مَا سَقَى كَافِرًا مِنْهَا شَرْبَةَ مَاءٍ"]], "source": "جامع الترمذي · ٢٣٢٠ · صحيح غريب", "english": "Sahl bin Sa'd narrated that the Messenger of Allah (s.a.w) said:\"If the world to Allah was equal to a mosquito's wing, then He would not allow the disbeliever to have a sip of water from it", "source_en": "Jami at-Tirmidhi · 2320"}, {"parts": [["n", "عن أَنَسِ بْنِ مَالِكٍ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "مَنْ كَانَتِ الآخِرَةُ هَمَّهُ جَعَلَ اللَّهُ غِنَاهُ فِي قَلْبِهِ وَجَمَعَ لَهُ شَمْلَهُ وَأَتَتْهُ الدُّنْيَا وَهِيَ رَاغِمَةٌ وَمَنْ كَانَتِ الدُّنْيَا هَمَّهُ جَعَلَ اللَّهُ فَقْرَهُ بَيْنَ عَيْنَيْهِ وَفَرَّقَ عَلَيْهِ شَمْلَهَ وَلَمْ يَأْتِهِ مِنَ الدُّنْيَا إِلاَّ مَا قُدِّرَ لَهُ"]], "source": "جامع الترمذي · ٢٤٦٥ · صحيح عند الألباني", "english": "Anas bin Malik narrated that the Messenger of Allah (ﷺ) said:\"Whoever makes the Hereafter his goal, Allah makes his heart rich, and organizes his affairs, and the world comes to him whether it wants to or not. And whoever makes the world his goal, Allah puts his poverty right before his eyes, and disorganizes his affairs, and the world does not come to him, except what has been decreed for him", "source_en": "Jami at-Tirmidhi · 2465"}, {"parts": [["n", "عن أَنَسَ بْنَ مَالِكٍ، يَقُولُ قَالَ رَسُولُ اللَّهُ ﷺ"], ["q", "يَتْبَعُ الْمَيِّتَ ثَلاَثَةٌ، فَيَرْجِعُ اثْنَانِ وَيَبْقَى مَعَهُ وَاحِدٌ، يَتْبَعُهُ أَهْلُهُ وَمَالُهُ وَعَمَلُهُ، فَيَرْجِعُ أَهْلُهُ وَمَالُهُ، وَيَبْقَى عَمَلُهُ"]], "source": "صحيح البخاري · ٦٥١٤", "english": "Narrated Anas bin Malik:Allah's Messenger (ﷺ) said, \"When carried to his grave, a dead person is followed by three, two of which return (after his burial) and one remains with him: his relative, his property, and his deeds follow him; relatives and his property go back while his deeds remain with him", "source_en": "Sahih al-Bukhari · 6514"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "أَكْثِرُوا ذِكْرَ هَاذِمِ اللَّذَّاتِ"]], "source": "جامع الترمذي · ٢٣٠٧ · حسن غريب", "english": "Abu Hurairah narrated that the Messenger of Allah (s.a.w) said:\"Increase in remembrance of the severer of pleasures.\" Meaning death", "source_en": "Jami at-Tirmidhi · 2307"}, {"parts": [["n", "عن عَبْدِ اللَّهِ بْنِ عَمْرِو بْنِ الْعَاصِ، قَالَ سَمِعْتُ رَسُولَ اللَّهِ ﷺ يَقُولُ"], ["q", "إِنَّ اللَّهَ لاَ يَقْبِضُ الْعِلْمَ انْتِزَاعًا، يَنْتَزِعُهُ مِنَ الْعِبَادِ، وَلَكِنْ يَقْبِضُ الْعِلْمَ بِقَبْضِ الْعُلَمَاءِ، حَتَّى إِذَا لَمْ يُبْقِ عَالِمًا، اتَّخَذَ النَّاسُ رُءُوسًا جُهَّالاً فَسُئِلُوا، فَأَفْتَوْا بِغَيْرِ عِلْمٍ، فَضَلُّوا وَأَضَلُّوا"]], "source": "صحيح البخاري · ١٠٠", "english": "Narrated `Abdullah bin `Amr bin Al-`As:I heard Allah's Messenger (ﷺ) saying, \"Allah does not take away the knowledge, by taking it away from (the hearts of) the people, but takes it away by the death of the religious learned men till when none of the (religious learned men) remains, people will take as their leaders ignorant persons who when consulted will give their verdict without knowledge. So they will go astray and will lead the people astray", "source_en": "Sahih al-Bukhari · 100"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "مَنْ سُئِلَ عَنْ عِلْمٍ فَكَتَمَهُ أَلْجَمَهُ اللَّهُ بِلِجَامٍ مِنْ نَارٍ يَوْمَ الْقِيَامَةِ"]], "source": "سنن أبي داود · ٣٦٥٨ · حسن صحيح عند الألباني", "english": "Narrated AbuHurayrah: The Prophet (ﷺ) said: He who is asked something he knows and conceals it will have a bridle of fire put on him on the Day of Resurrection", "source_en": "Sunan Abi Dawud · 3658"}, {"parts": [["n", "عن زَيْدِ بْنِ ثَابِتٍ، قَالَ سَمِعْتُ رَسُولَ اللَّهِ ﷺ يَقُولُ"], ["q", "نَضَّرَ اللَّهُ امْرَأً سَمِعَ مِنَّا حَدِيثًا فَحَفِظَهُ حَتَّى يُبَلِّغَهُ فَرُبَّ حَامِلِ فِقْهٍ إِلَى مَنْ هُوَ أَفْقَهُ مِنْهُ وَرُبَّ حَامِلِ فِقْهٍ لَيْسَ بِفَقِيهٍ"]], "source": "سنن أبي داود · ٣٦٦٠ · صحيح عند الألباني", "english": "Narrated Zayd ibn Thabit: I heard the Messenger of Allah (ﷺ) say: May Allah brighten a man who hears a tradition from us, gets it by heart and passes it on to others. Many a bearer of knowledge conveys it to one who is more versed than he is; and many a bearer of knowledge is not versed in it", "source_en": "Sunan Abi Dawud · 3660"}, {"parts": [["n", "عن أَبِي مُوسَى الأَشْعَرِيِّ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "مَثَلُ الْمُؤْمِنِ الَّذِي يَقْرَأُ الْقُرْآنَ مَثَلُ الأُتْرُجَّةِ رِيحُهَا طَيِّبٌ وَطَعْمُهَا طَيِّبٌ وَمَثَلُ الْمُؤْمِنِ الَّذِي لاَ يَقْرَأُ الْقُرْآنَ مَثَلُ التَّمْرَةِ لاَ رِيحَ لَهَا وَطَعْمُهَا حُلْوٌ وَمَثَلُ الْمُنَافِقِ الَّذِي يَقْرَأُ الْقُرْآنَ مَثَلُ الرَّيْحَانَةِ رِيحُهَا طَيِّبٌ وَطَعْمُهَا مُرٌّ وَمَثَلُ الْمُنَافِقِ الَّذِي لاَ يَقْرَأُ الْقُرْآنَ كَمَثَلِ الْحَنْظَلَةِ لَيْسَ لَهَا رِيحٌ وَطَعْمُهَا مُرٌّ"]], "source": "صحيح مسلم · ٧٩٧", "english": "Abu Rafi' reported:I testify that I used to roast the liver of the goat for the Messenger of Allah (may peace be tipcn him) and then he offered praver but did not perform ablution", "source_en": "Sahih Muslim · 797"}, {"parts": [["n", "عن أَبِي مُوسَى، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "تَعَاهَدُوا الْقُرْآنَ فَوَالَّذِي نَفْسِي بِيَدِهِ لَهُوَ أَشَدُّ تَفَصِّيًا مِنَ الإِبِلِ فِي عُقُلِهَا"]], "source": "صحيح البخاري · ٥٠٣٣", "english": "Narrated Abu Musa:The Prophet (ﷺ) said, \"Commit yourself to the Qur'an, for by Him in whose Hand is my soul, it is surely more prone to break away than a camel in its bind", "source_en": "Sahih al-Bukhari · 5033"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "لَيْسَ مِنَّا مَنْ لَمْ يَتَغَنَّ بِالْقُرْآنِ"]], "source": "صحيح البخاري · ٧٥٢٧", "english": "Narrated Abu Salama:Abu Huraira said, \"Allah's Messenger (ﷺ) said, 'Whoever does not recite Qur'an in a nice voice is not from us,' and others said extra,\" (that means) to recite it aloud", "source_en": "Sahih al-Bukhari · 7527"}, {"parts": [["n", "عن الْبَرَاءِ بْنِ عَازِبٍ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "زَيِّنُوا الْقُرْآنَ بِأَصْوَاتِكُمْ"]], "source": "سنن أبي داود · ١٤٦٨ · صحيح عند الألباني", "english": "Narrated Al-Bara' ibn Azib: The Prophet (ﷺ) said: Beautify the Qur'an with your voices", "source_en": "Sunan Abi Dawud · 1468"}, {"parts": [["n", "عن عَبْدِ اللَّهِ بْنِ عَمْرٍو، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "يُقَالُ لِصَاحِبِ الْقُرْآنِ اقْرَأْ وَارْتَقِ وَرَتِّلْ كَمَا كُنْتَ تُرَتِّلُ فِي الدُّنْيَا فَإِنَّ مَنْزِلَكَ عِنْدَ آخِرِ آيَةٍ تَقْرَؤُهَا"]], "source": "سنن أبي داود · ١٤٦٤ · حسن صحيح عند الألباني", "english": "Narrated Abdullah ibn Amr ibn al-'As: The Messenger of Allah (ﷺ) said: One who was devoted to the Qur'an will be told to recite, ascend and recite carefully as he recited carefully when he was in the world, for he will reach his abode when he comes to the last verse he recites", "source_en": "Sunan Abi Dawud · 1464"}, {"parts": [["n", "عن أَبِي مَسْعُودٍ رضى الله عنه قَالَ قَالَ النَّبِيُّ ﷺ"], ["q", "مَنْ قَرَأَ بِالآيَتَيْنِ مِنْ آخِرِ سُورَةِ الْبَقَرَةِ فِي لَيْلَةٍ كَفَتَاهُ"]], "source": "صحيح البخاري · ٥٠٠٩", "english": "Narrated Abu Mas'ud: The Prophet (ﷺ) said, \"If somebody recited the last two Verses of Surat Al-Baqara at night, that will be sufficient for him", "source_en": "Sahih al-Bukhari · 5009"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "لاَ تَجْعَلُوا بُيُوتَكُمْ مَقَابِرَ إِنَّ الشَّيْطَانَ يَنْفِرُ مِنَ الْبَيْتِ الَّذِي تُقْرَأُ فِيهِ سُورَةُ الْبَقَرَةِ"]], "source": "صحيح مسلم · ٧٨٠", "english": "Ubayy ibn Ka'b narrated it from the Messenger of Allah (ﷺ) that he said:If a person has sexual intercourse with his wife, but does not experience orgasm, he should wash his organ and perform an ablution", "source_en": "Sahih Muslim · 780"}, {"parts": [["n", "عن جَابِرَ بْنَ عَبْدِ اللَّهِ، يَقُولُ سَمِعْتُ رَسُولَ اللَّهِ ﷺ يَقُولُ"], ["q", "بَيْنَ الرَّجُلِ وَبَيْنَ الشِّرْكِ وَالْكُفْرِ تَرْكُ الصَّلاَةِ"]], "source": "صحيح مسلم · ٨٢"}, {"parts": [["n", "عن عَبْدِ اللَّهِ بْنِ بُرَيْدَةَ، عَنْ أَبِيهِ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "إِنَّ الْعَهْدَ الَّذِي بَيْنَنَا وَبَيْنَهُمُ الصَّلاَةُ فَمَنْ تَرَكَهَا فَقَدْ كَفَرَ"]], "source": "سنن النسائي · ٤٦٣ · صحيح عند الألباني", "english": "It was narrated from 'Abdullah bin Buraidah that his father said:\"The Messenger of Allah (ﷺ) said: 'The covenant that stands between us and them is the Salah; whoever abandons it, he has committed disbelief", "source_en": "Sunan an-Nasa'i · 463"}, {"parts": [["n", "عن جُنْدَبَ بْنَ عَبْدِ اللَّهِ، يَقُولُ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "مَنْ صَلَّى الصُّبْحَ فَهُوَ فِي ذِمَّةِ اللَّهِ فَلاَ يَطْلُبَنَّكُمُ اللَّهُ مِنْ ذِمَّتِهِ بِشَىْءٍ فَيُدْرِكَهُ فَيَكُبَّهُ فِي نَارِ جَهَنَّمَ"]], "source": "صحيح مسلم · ٦٥٧", "english": "Hammam b. Munabbih said:Of the ahadith narrated to us by Abfi Huraira from Muhammad the Messenger of Allah (ﷺ) one is this: The Messenger or Allah (ﷺ) said: You should not urinate in standing water, that is not flowing, then wash in it", "source_en": "Sahih Muslim · 657"}, {"parts": [["n", "عن عَائِشَةَ، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "رَكْعَتَا الْفَجْرِ خَيْرٌ مِنَ الدُّنْيَا وَمَا فِيهَا"]], "source": "صحيح مسلم · ٧٢٥", "english": "A'isha reported:When the Messenger of Allah (ﷺ) took a bath because of sexual intercourse, he called for a vessel and took a handful of water from it and first (washed) the right side of his head, then left, and then took a handful (of water) and poured it on his head", "source_en": "Sahih Muslim · 725"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، - رضى الله عنه - قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "أَفْضَلُ الصِّيَامِ بَعْدَ رَمَضَانَ شَهْرُ اللَّهِ الْمُحَرَّمُ وَأَفْضَلُ الصَّلاَةِ بَعْدَ الْفَرِيضَةِ صَلاَةُ اللَّيْلِ"]], "source": "صحيح مسلم · ١١٦٣", "english": "Jabir b. 'Abdullah al-Ansari reported:The Prophet (ﷺ) said: I have been conferred upon five (things) which were not granted to anyone before me (and these are): Every apostle wassent particularly to his own people, whereas I have been sent to all the red and the black the spoils of war have been made lawful for me, and these were never made lawful to anyone before me, and the earth has been made sacred and pure and mosque for me, so whenever the time of prayer comes for any one of you he should pray whenever he is, and I have been supported by awe (by which the enemy is overwhelmed) from the distance (which one takes) one month to cover and I have been granted intercession", "source_en": "Sahih Muslim · 1163"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ رضى الله عنه أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "يَنْزِلُ رَبُّنَا تَبَارَكَ وَتَعَالَى كُلَّ لَيْلَةٍ إِلَى السَّمَاءِ الدُّنْيَا حِينَ يَبْقَى ثُلُثُ اللَّيْلِ الآخِرُ يَقُولُ مَنْ يَدْعُونِي فَأَسْتَجِيبَ لَهُ مَنْ يَسْأَلُنِي فَأُعْطِيَهُ مَنْ يَسْتَغْفِرُنِي فَأَغْفِرَ لَهُ"]], "source": "صحيح البخاري · ١١٤٥", "english": "Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"Our Lord, the Blessed, the Superior, comes every night down on the nearest Heaven to us when the last third of the night remains, saying: \"Is there anyone to invoke Me, so that I may respond to invocation? Is there anyone to ask Me, so that I may grant him his request? Is there anyone seeking My forgiveness, so that I may forgive him?", "source_en": "Sahih al-Bukhari · 1145"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "أَلاَ أَدُلُّكُمْ عَلَى مَا يَمْحُو اللَّهُ بِهِ الْخَطَايَا وَيَرْفَعُ بِهِ الدَّرَجَاتِ"], ["n", "قَالُوا بَلَى يَا رَسُولَ اللَّهِ. قَالَ"], ["q", "إِسْبَاغُ الْوُضُوءِ عَلَى الْمَكَارِهِ وَكَثْرَةُ الْخُطَا إِلَى الْمَسَاجِدِ وَانْتِظَارُ الصَّلاَةِ بَعْدَ الصَّلاَةِ فَذَلِكُمُ الرِّبَاطُ"]], "source": "صحيح مسلم · ٢٥١", "english": "Muhammad b. Abu Rafi' narrated the hadith on the authority of Abu Dharr with a slight difference", "source_en": "Sahih Muslim · 251"}, {"parts": [["n", "عن أبي هُرَيْرَةَ رضى الله عنه أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "لَوْلاَ أَنْ أَشُقَّ عَلَى أُمَّتِي لأَمَرْتُهُمْ بِالسِّوَاكِ"]], "source": "صحيح البخاري · ٧٢٤٠", "english": "Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"Were I not afraid that it would be hard on my followers, I would order them to use the siwak (as obligatory, for cleaning the teeth)", "source_en": "Sahih al-Bukhari · 7240"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "مَنْ صَلَّى عَلَىَّ صَلاَةً صَلَّى اللَّهُ عَلَيْهِ بِهَا عَشْرًا"]], "source": "جامع الترمذي · ٤٨٥ · حسن صحيح", "english": "Abu Hurairah narrated that :Allah's Messenger said: \"Whoever sends Salat upon me, Allah sends Salat upon him ten times", "source_en": "Jami at-Tirmidhi · 485"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ رضى الله عنه أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "مَنْ قَالَ لاَ إِلَهَ إِلاَّ اللَّهُ، وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهْوَ عَلَى كُلِّ شَىْءٍ قَدِيرٌ. فِي يَوْمٍ مِائَةَ مَرَّةٍ، كَانَتْ لَهُ عَدْلَ عَشْرِ رِقَابٍ، وَكُتِبَ لَهُ مِائَةُ حَسَنَةٍ، وَمُحِيَتْ عَنْهُ مِائَةُ سَيِّئَةٍ، وَكَانَتْ لَهُ حِرْزًا مِنَ الشَّيْطَانِ يَوْمَهُ ذَلِكَ، حَتَّى يُمْسِيَ، وَلَمْ يَأْتِ أَحَدٌ بِأَفْضَلَ مِمَّا جَاءَ بِهِ إِلاَّ رَجُلٌ عَمِلَ أَكْثَرَ مِنْهُ"]], "source": "صحيح البخاري · ٦٤٠٣", "english": "Narrated Abu Huraira:Allah's Messenger (ﷺ) said,\" Whoever says: \"La ilaha illal-lah wahdahu la sharika lahu, lahu-l-mulk wa lahul- hamd wa huwa 'ala kulli shai'in qadir,\" one hundred times will get the same reward as given for manumitting ten slaves; and one hundred good deeds will be written in his accounts, and one hundred sins will be deducted from his accounts, and it (his saying) will be a shield for him from Satan on that day till night, and nobody will be able to do a better deed except the one who does more than he", "source_en": "Sahih al-Bukhari · 6403"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "لأَنْ أَقُولَ سُبْحَانَ اللَّهِ وَالْحَمْدُ لِلَّهِ وَلاَ إِلَهَ إِلاَّ اللَّهُ وَاللَّهُ أَكْبَرُ أَحَبُّ إِلَىَّ مِمَّا طَلَعَتْ عَلَيْهِ الشَّمْسُ"]], "source": "صحيح مسلم · ٢٦٩٥", "english": "This hadith has been narrated on the authority of Ibn 'Abbas (Allah be pleased with them) from the Messenger of Allah (ﷺ)", "source_en": "Sahih Muslim · 2695"}, {"parts": [["n", "عن جَابِرٍ، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "مَنْ قَالَ سُبْحَانَ اللَّهِ الْعَظِيمِ وَبِحَمْدِهِ غُرِسَتْ لَهُ نَخْلَةٌ فِي الْجَنَّةِ"]], "source": "جامع الترمذي · ٣٤٦٥ · حسن غريب", "english": "Jabir narrated that :The Prophet (ﷺ) said: “Whoever says: ‘Glory is to Allah, the Magnificent, and with His Praise (Subḥān Allāhil-Aẓīm, wa biḥamdih)’ a date-palm tree is planted for him in Paradise.”", "source_en": "Jami at-Tirmidhi · 3465"}, {"parts": [["n", "عن شَدَّادِ بْنِ أَوْسٍ، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "سَيِّدُ الاِسْتِغْفَارِ اللَّهُمَّ أَنْتَ رَبِّي لاَ إِلَهَ إِلاَّ أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ، وَأَبُوءُ لَكَ بِذَنْبِي، فَاغْفِرْ لِي، فَإِنَّهُ لاَ يَغْفِرُ الذُّنُوبَ إِلاَّ أَنْتَ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ. إِذَا قَالَ حِينَ يُمْسِي فَمَاتَ دَخَلَ الْجَنَّةَ أَوْ كَانَ مِنْ أَهْلِ الْجَنَّةِ وَإِذَا قَالَ حِينَ يُصْبِحُ فَمَاتَ مِنْ يَوْمِهِ"]], "source": "صحيح البخاري · ٦٣٢٣", "english": "Narrated Shaddad bin 'Aus:The Prophet (ﷺ) said, \"The most superior way of asking for forgiveness from Allah is: 'Allahumma anta Rabbi la ilaha illa anta. Khalaqtani wa ana `Abduka, wa ana 'ala 'ahdika wa Wa'dika mastata'tu abu'u Laka bi ni 'matika wa abu'u Laka bidhanbi; faghfirli fa'innahu la yaghfiru-dh-dhunuba ill a ant a. A'uidhu bika min sharri ma sana'tu.' If somebody recites this invocation during the night, and if he should die then, he will go to Paradise (or he will be from the people of Paradise). And if he recites it in the morning, and if he should die on the same day, he will have the same fate", "source_en": "Sahih al-Bukhari · 6323"}, {"parts": [["n", "عن الأَغَرَّ، وَكَانَ، مِنْ أَصْحَابِ النَّبِيِّ ﷺ يُحَدِّثُ ابْنَ عُمَرَ قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "يَا أَيُّهَا النَّاسُ تُوبُوا إِلَى اللَّهِ فَإِنِّي أَتُوبُ فِي الْيَوْمِ إِلَيْهِ مِائَةَ مَرَّةٍ"]], "source": "صحيح مسلم · ٢٧٠٢", "english": "Abu Huraira (Allah be pleased with him) reported Allah's Apostle (ﷺ) as saying:If any one of you is invited to a meal when he is fasting, he should say:\" I am fasting", "source_en": "Sahih Muslim · 2702"}, {"parts": [["n", "عن ابْنِ عُمَرَ، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "إِنَّ اللَّهَ يَقْبَلُ تَوْبَةَ الْعَبْدِ مَا لَمْ يُغَرْغِرْ"]], "source": "جامع الترمذي · ٣٥٣٧ · حسن غريب", "english": "Ibn `Umar narrated that the Prophet (ﷺ) said:“Indeed Allah accepts the repentance of a slave as long as (his soul does not reach his throat).”", "source_en": "Jami at-Tirmidhi · 3537"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "يُسْتَجَابُ لأَحَدِكُمْ مَا لَمْ يَعْجَلْ يَقُولُ دَعَوْتُ فَلَمْ يُسْتَجَبْ لِي"]], "source": "صحيح البخاري · ٦٣٤٠", "english": "Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"The invocation of anyone of you is granted (by Allah) if he does not show impatience (by saying, \"I invoked Allah but my request has not been granted)", "source_en": "Sahih al-Bukhari · 6340"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، رضى الله عنه قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "مَنْ لَمْ يَسْأَلِ اللَّهَ يَغْضَبْ عَلَيْهِ"]], "source": "جامع الترمذي · ٣٣٧٣ · حسن عند الألباني", "english": "Abu Hurairah (ra) narrated that :the Messenger of Allah (ﷺ) said: “Indeed, he who does not ask Allah, he gets angry with him.”", "source_en": "Jami at-Tirmidhi · 3373"}, {"parts": [["n", "عن أَنَسً، قَالَ كَانَ النَّبِيُّ ﷺ يَقُولُ"], ["q", "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَالْعَجْزِ وَالْكَسَلِ، وَالْجُبْنِ وَالْبُخْلِ، وَضَلَعِ الدَّيْنِ، وَغَلَبَةِ الرِّجَالِ"]], "source": "صحيح البخاري · ٦٣٦٩", "english": "Narrated Anas bin Malik:The Prophet (ﷺ) used to say, \"O Allah! I seek refuge with You from worry and grief, from incapacity and laziness, from cowardice and miserliness, from being heavily in debt and from being overpowered by (other) men.\" (See Hadith No)", "source_en": "Sahih al-Bukhari · 6369"}, {"parts": [["n", "عن أَنَسٍ، قَالَ كَانَ رَسُولُ اللَّهِ ﷺ يُكْثِرُ أَنْ يَقُولَ"], ["q", "يَا مُقَلِّبَ الْقُلُوبِ ثَبِّتْ قَلْبِي عَلَى دِينِكَ"], ["n", "فَقُلْتُ يَا رَسُولَ اللَّهِ آمَنَّا بِكَ وَبِمَا جِئْتَ بِهِ فَهَلْ تَخَافُ عَلَيْنَا قَالَ"], ["q", "نَعَمْ إِنَّ الْقُلُوبَ بَيْنَ أَصْبُعَيْنِ مِنْ أَصَابِعِ اللَّهِ يُقَلِّبُهَا كَيْفَ يَشَاءُ"]], "source": "جامع الترمذي · ٢١٤٠ · حسن", "english": "Anas narrated:\"The Messenger of Allah (s.a.w) would often say: Ya Muqallibal-qulub, thabbit qalbi 'ala dinik('O Changer of the Hearts! Strengthen my heart upon Your Religion.)' So I said: 'O Prophet of Allah! We believe in you and what you have come with, but do you fear for us?' He said: 'Yes. Indeed the hearts are between two Fingers of Allah's Fingers, He changes them as He wills", "source_en": "Jami at-Tirmidhi · 2140"}, {"parts": [["n", "عن عَبْدِ اللَّهِ، عَنِ النَّبِيِّ ﷺ أَنَّهُ كَانَ يَقُولُ"], ["q", "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْهُدَى وَالتُّقَى وَالْعَفَافَ وَالْغِنَى"]], "source": "صحيح مسلم · ٢٧٢١", "english": "A'isha, the Mother of the Believers (Allah be pleased with her), reported that the Messenger of Allah (ﷺ) used to fast (so continuously) that we said that he would not break, and did not fast at all till we said that he would not fast. And I did not see the Messenger of Allah (ﷺ) completing the fast of a month, but that of Ramadan, and I did not see him fasting more in any other month than that of Sha'ban", "source_en": "Sahih Muslim · 2721"}, {"parts": [["n", "عن أَنَسٍ، قَالَ كَانَ النَّبِيُّ ﷺ يَقُولُ"], ["q", "اللَّهُمَّ رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ"]], "source": "صحيح البخاري · ٤٥٢٢", "english": "Narrated Anas:The Prophet (ﷺ) used to say, \"O Allah! Our Lord! Give us in this world that, which is good and in the Hereafter that, which is good and save us from the torment of the Fire", "source_en": "Sahih al-Bukhari · 4522"}, {"parts": [["n", "عن عَائِشَةَ، أَنَّهَا قَالَتْ يَا رَسُولَ اللَّهِ أَرَأَيْتَ إِنْ وَافَقْتُ لَيْلَةَ الْقَدْرِ مَا أَدْعُو قَالَ"], ["q", "تَقُولِينَ اللَّهُمَّ إِنَّكَ عَفُوٌّ تُحِبُّ الْعَفْوَ فَاعْفُ عَنِّي"]], "source": "سنن ابن ماجه · ٣٨٥٠ · صحيح عند الألباني", "english": "It was narrated from 'Aishah that she said:\"O Messenger of Allah, what do you think I should say in my supplication, if I come upon Laylatul-Qadr?\" He said: \"Say: 'Allahumma innaka 'afuwwun tuhibbul-'afwa, fa'fu 'anni (O Allah, You are Forgiving and love forgiveness, so forgive me)", "source_en": "Sunan Ibn Majah · 3850"}, {"parts": [["n", "عن أَنَسٍ، أَنَّ النَّبِيَّ ﷺ كَانَ يَدْعُو بِهَذِهِ الدَّعَوَاتِ"], ["q", "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عِلْمٍ لاَ يَنْفَعُ وَقَلْبٍ لاَ يَخْشَعُ وَدُعَاءٍ لاَ يُسْمَعُ وَنَفْسٍ لاَ تَشْبَعُ"], ["n", "ثُمَّ يَقُولُ"], ["q", "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ هَؤُلاَءِ الأَرْبَعِ"]], "source": "سنن النسائي · ٥٤٧٠ · صحيح عند الألباني", "english": "It was narrated from Anas that :The Prophet [SAW] used to say these supplications: \"Allahumma inni a'udhu bika min 'ilmin la yanfa'u, wa qalbin la yakhsha'u, wa du'a'in la yasma'u, wa nafsin la tashba'u. (O Allah, I seek refuge with You from knowledge that is of no benefit, a heart that is not humble, a supplication that is not heard and a soul that is not satisfied.)\" Then he would say: 'Allahumma inni a'udhu bika min ha'ula'il-arba' (O Allah, I seek refuge with You from these four)", "source_en": "Sunan an-Nasa'i · 5470"}, {"parts": [["n", "عن الْعَبَّاسِ بْنِ عَبْدِ الْمُطَّلِبِ، أَنَّهُ سَمِعَ رَسُولَ اللَّهِ ﷺ يَقُولُ"], ["q", "ذَاقَ طَعْمَ الإِيمَانِ مَنْ رَضِيَ بِاللَّهِ رَبًّا وَبِالإِسْلاَمِ دِينًا وَبِمُحَمَّدٍ نَبِيًّا"]], "source": "جامع الترمذي · ٢٦٢٣ · حسن صحيح", "english": "Narrated Al-Abbas bin Abdul-Muttalib:that he heard the Messenger of Allah (ﷺ) say: \"Whoever is pleased with Allah as (his) Lord, and Islam as (his) religion, and Muhammad as (his) Prophet, then he has tasted the sweetness of faith", "source_en": "Jami at-Tirmidhi · 2623"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ رضى الله عنه أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "إِذَا جَاءَ رَمَضَانُ فُتِحَتْ أَبْوَابُ الْجَنَّةِ"]], "source": "صحيح البخاري · ١٨٩٨", "english": "Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"When Ramadan begins, the gates of Paradise are opened", "source_en": "Sahih al-Bukhari · 1898"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ رضى الله عنه قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "مَنْ لَمْ يَدَعْ قَوْلَ الزُّورِ وَالْعَمَلَ بِهِ فَلَيْسَ لِلَّهِ حَاجَةٌ فِي أَنْ يَدَعَ طَعَامَهُ وَشَرَابَهُ"]], "source": "صحيح البخاري · ١٩٠٣", "english": "Narrated Abu Huraira:The Prophet (ﷺ) said, \"Whoever does not give up forged speech and evil actions, Allah is not in need of his leaving his food and drink (i.e. Allah will not accept his fasting)", "source_en": "Sahih al-Bukhari · 1903"}, {"parts": [["n", "عن سَهْلِ بْنِ سَعْدٍ، أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "لاَ يَزَالُ النَّاسُ بِخَيْرٍ مَا عَجَّلُوا الْفِطْرَ"]], "source": "صحيح البخاري · ١٩٥٧", "english": "Narrated Sahl bin Sa`d:Allah's Messenger (ﷺ) said, \"The people will remain on the right path as long as they hasten the breaking of the fast", "source_en": "Sahih al-Bukhari · 1957"}, {"parts": [["n", "عن أَبِي أَيُّوبَ، قَالَ قَالَ النَّبِيُّ ﷺ"], ["q", "مَنْ صَامَ رَمَضَانَ ثُمَّ أَتْبَعَهُ سِتًّا مِنْ شَوَّالٍ فَذَلِكَ صِيَامُ الدَّهْرِ"]], "source": "جامع الترمذي · ٧٥٩ · حسن صحيح", "english": "Abu Ayub narrated that :the Messenger of Allah said: \"Whoever fasts Ramadan, then follows it with six from Shawwal, then that is (equal in reward) to fasting everyday", "source_en": "Jami at-Tirmidhi · 759"}, {"parts": [["n", "عن عَبْدِ اللَّهِ بْنِ مَسْعُودٍ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "تَابِعُوا بَيْنَ الْحَجِّ وَالْعُمْرَةِ فَإِنَّهُمَا يَنْفِيَانِ الْفَقْرَ وَالذُّنُوبَ كَمَا يَنْفِي الْكِيرُ خَبَثَ الْحَدِيدِ وَالذَّهَبِ وَالْفِضَّةِ وَلَيْسَ لِلْحَجَّةِ الْمَبْرُورَةِ ثَوَابٌ إِلاَّ الْجَنَّةُ"]], "source": "جامع الترمذي · ٨١٠ · حسن صحيح", "english": "Abdullah (bin Mas'ud) narrated that:The Messenger of Allah said: \"Alternate between Hajj and Umrah; for those two remove poverty and sins just as the bellows removes filth from iron, gold, and silver - and there is no reward for Al-Hajj Al-Mabrur except for Paradise", "source_en": "Jami at-Tirmidhi · 810"}, {"parts": [["n", "عن أُمِّ مَعْقِلٍ، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "عُمْرَةٌ فِي رَمَضَانَ تَعْدِلُ حَجَّةً"]], "source": "جامع الترمذي · ٩٣٩ · حسن غريب", "english": "Umm Ma'qil narrated that:The Prophet said: \"Umrah during Ramadan is equal to Hajj", "source_en": "Jami at-Tirmidhi · 939"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ رضى الله عنه أَنَّ النَّبِيَّ ﷺ قَالَ"], ["q", "مَا مِنْ يَوْمٍ يُصْبِحُ الْعِبَادُ فِيهِ إِلاَّ مَلَكَانِ يَنْزِلاَنِ فَيَقُولُ أَحَدُهُمَا اللَّهُمَّ أَعْطِ مُنْفِقًا خَلَفًا، وَيَقُولُ الآخَرُ اللَّهُمَّ أَعْطِ مُمْسِكًا تَلَفًا"]], "source": "صحيح البخاري · ١٤٤٢", "english": "Narrated Abu Huraira:The Prophet (ﷺ) said, \"Every day two angels come down from Heaven and one of them says, 'O Allah! Compensate every person who spends in Your Cause,' and the other (angel) says, 'O Allah! Destroy every miser", "source_en": "Sahih al-Bukhari · 1442"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "سَبْعَةٌ يُظِلُّهُمُ اللَّهُ فِي ظِلِّهِ يَوْمَ لاَ ظِلَّ إِلاَّ ظِلُّهُ الإِمَامُ الْعَادِلُ، وَشَابٌّ نَشَأَ فِي عِبَادَةِ رَبِّهِ، وَرَجُلٌ قَلْبُهُ مُعَلَّقٌ فِي الْمَسَاجِدِ، وَرَجُلاَنِ تَحَابَّا فِي اللَّهِ اجْتَمَعَا عَلَيْهِ وَتَفَرَّقَا عَلَيْهِ، وَرَجُلٌ طَلَبَتْهُ امْرَأَةٌ ذَاتُ مَنْصِبٍ وَجَمَالٍ فَقَالَ إِنِّي أَخَافُ اللَّهَ. وَرَجُلٌ تَصَدَّقَ أَخْفَى حَتَّى لاَ تَعْلَمَ شِمَالُهُ مَا تُنْفِقُ يَمِينُهُ، وَرَجُلٌ ذَكَرَ اللَّهَ خَالِيًا فَفَاضَتْ عَيْنَاهُ"]], "source": "صحيح البخاري · ٦٦٠", "english": "Narrated Abu Huraira:The Prophet (ﷺ) said, \"Allah will give shade, to seven, on the Day when there will be no shade but His. (These seven persons are) a just ruler, a youth who has been brought up in the worship of Allah (i.e. worships Allah sincerely from childhood), a man whose heart is attached to the mosques (i.e. to pray the compulsory prayers in the mosque in congregation), two persons who love each other only for Allah's sake and they meet and part in Allah's cause only, a man who refuses the call of a charming woman of noble birth for illicit intercourse with her and says: I am afraid of Allah, a man who gives charitable gifts so secretly that his left hand does not know what his right hand has given (i.e. nobody knows how much he has given in charity), and a person who remembers Allah in seclusion and his eyes are then flooded with tears", "source_en": "Sahih al-Bukhari · 660"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ رضى الله عنه أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "قَالَ اللَّهُ أَنْفِقْ يَا ابْنَ آدَمَ أُنْفِقْ عَلَيْكَ"]], "source": "صحيح البخاري · ٥٣٥٢", "english": "Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"Allah said, 'O son of Adam! Spend, and I shall spend on you", "source_en": "Sahih al-Bukhari · 5352"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، قَالَ قَالَ النَّبِيُّ ﷺ"], ["q", "السَّاعِي عَلَى الأَرْمَلَةِ وَالْمِسْكِينِ كَالْمُجَاهِدِ فِي سَبِيلِ اللَّهِ، أَوِ الْقَائِمِ اللَّيْلَ الصَّائِمِ النَّهَارَ"]], "source": "صحيح البخاري · ٥٣٥٣", "english": "Narrated Abu Huraira:The Prophet (ﷺ) said, \"The one who looks after a widow or a poor person is like a Mujahid (warrior) who fights for Allah's Cause, or like him who performs prayers all the night and fasts all the day", "source_en": "Sahih al-Bukhari · 5353"}, {"parts": [["n", "عن سَهْلٍ، قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "أَنَا وَكَافِلُ الْيَتِيمِ فِي الْجَنَّةِ هَكَذَا"]], "source": "صحيح البخاري · ٥٣٠٤", "english": "Narrated Sahl:Allah's Messenger (ﷺ) said, \"I and the one who looks after an orphan will be like this in Paradise,\" showing his middle and index fingers and separating them", "source_en": "Sahih al-Bukhari · 5304"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ رضى الله عنه أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "بَيْنَا رَجُلٌ يَمْشِي فَاشْتَدَّ عَلَيْهِ الْعَطَشُ، فَنَزَلَ بِئْرًا فَشَرِبَ مِنْهَا، ثُمَّ خَرَجَ فَإِذَا هُوَ بِكَلْبٍ يَلْهَثُ، يَأْكُلُ الثَّرَى مِنَ الْعَطَشِ، فَقَالَ لَقَدْ بَلَغَ هَذَا مِثْلُ الَّذِي بَلَغَ بِي فَمَلأَ خُفَّهُ ثُمَّ أَمْسَكَهُ بِفِيهِ، ثُمَّ رَقِيَ، فَسَقَى الْكَلْبَ فَشَكَرَ اللَّهُ لَهُ، فَغَفَرَ لَهُ"], ["n", "قَالُوا يَا رَسُولَ اللَّهِ، وَإِنَّ لَنَا فِي الْبَهَائِمِ أَجْرًا قَالَ"], ["q", "فِي كُلِّ كَبِدٍ رَطْبَةٍ أَجْرٌ"]], "source": "صحيح البخاري · ٢٣٦٣", "english": "Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"While a man was walking he felt thirsty and went down a well and drank water from it. On coming out of it, he saw a dog panting and eating mud because of excessive thirst. The man said, 'This (dog) is suffering from the same problem as that of mine. So he (went down the well), filled his shoe with water, caught hold of it with his teeth and climbed up and watered the dog. Allah thanked him for his (good) deed and forgave him.\" The people asked, \"O Allah's Messenger (ﷺ)! Is there a reward for us in serving (the) animals?\" He replied, \"Yes, there is a reward for serving any animate", "source_en": "Sahih al-Bukhari · 2363"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ رضى الله عنه عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "يَا نِسَاءَ الْمُسْلِمَاتِ لاَ تَحْقِرَنَّ جَارَةٌ لِجَارَتِهَا، وَلَوْ فِرْسِنَ شَاةٍ"]], "source": "صحيح البخاري · ٢٥٦٦", "english": "Narrated Abu Huraira:The Prophet (ﷺ) said, \"O Muslim women! None of you should look down upon the gift sent by her female neighbor even if it were the trotters of the sheep (fleshless part of legs)", "source_en": "Sahih al-Bukhari · 2566"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "رَغِمَ أَنْفُ ثُمَّ رَغِمَ أَنْفُ ثُمَّ رَغِمَ أَنْفُ"], ["n", "قِيلَ مَنْ يَا رَسُولَ اللَّهِ قَالَ"], ["q", "مَنْ أَدْرَكَ أَبَوَيْهِ عِنْدَ الْكِبَرِ أَحَدَهُمَا أَوْ كِلَيْهِمَا فَلَمْ يَدْخُلِ الْجَنَّةَ"]], "source": "صحيح مسلم · ٢٥٥١", "english": "Musa b. 'Ali has narrated this hadith through the same chain of transmitters", "source_en": "Sahih Muslim · 2551"}, {"parts": [["n", "عن أَبِي الدَّرْدَاءِ، سَمِعَ النَّبِيَّ ﷺ يَقُولُ"], ["q", "الْوَالِدُ أَوْسَطُ أَبْوَابِ الْجَنَّةِ فَأَضِعْ ذَلِكَ الْبَابَ أَوِ احْفَظْهُ"]], "source": "سنن ابن ماجه · ٣٦٦٣ · صحيح عند الألباني", "english": "Abu Darda' heard the Prophet (ﷺ) say that:\"The father is the middle door of Paradise (i.e. the best way to Paradise), so it is up to you whether you take advantage of it or not", "source_en": "Sunan Ibn Majah · 3663"}, {"parts": [["n", "عن أَنَسِ بْنِ مَالِكٍ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "مَنْ عَالَ جَارِيَتَيْنِ حَتَّى تَبْلُغَا جَاءَ يَوْمَ الْقِيَامَةِ أَنَا وَهُوَ"]], "source": "صحيح مسلم · ٢٦٣١", "english": "Abu Darda' reported:We were with the Messenger of Allah (ﷺ) on some of his journeys on an intensely hot day so much so that a person would place his hand on his head (in order to protect himself) against excessive heat, and none amongst us was fasting but the Messenger of Allah (ﷺ) and Abdullah b. Rawaha", "source_en": "Sahih Muslim · 2631"}, {"parts": [["n", "عن ابْنِ عُمَرَ رضى الله عنهما عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "كُلُّكُمْ رَاعٍ، وَكُلُّكُمْ مَسْئُولٌ عَنْ رَعِيَّتِهِ، وَالأَمِيرُ رَاعٍ، وَالرَّجُلُ رَاعٍ عَلَى أَهْلِ بَيْتِهِ، وَالْمَرْأَةُ رَاعِيَةٌ عَلَى بَيْتِ زَوْجِهَا وَوَلَدِهِ، فَكُلُّكُمْ رَاعٍ وَكُلُّكُمْ مَسْئُولٌ عَنْ رَعِيَّتِهِ"]], "source": "صحيح البخاري · ٥٢٠٠", "english": "Narrated Ibn `Umar:The Prophet (ﷺ) said, \"All of you are guardians and are responsible for your wards. The ruler is a guardian and the man is a guardian of his family; the lady is a guardian and is responsible for her husband's house and his offspring; and so all of you are guardians and are responsible for your wards", "source_en": "Sahih al-Bukhari · 5200"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "لاَ يَفْرَكْ مُؤْمِنٌ مُؤْمِنَةً إِنْ كَرِهَ مِنْهَا خُلُقًا رَضِيَ مِنْهَا آخَرَ"], ["n", "أَوْ قَالَ"], ["q", "غَيْرَهُ"]], "source": "صحيح مسلم · ١٤٦٨", "english": "Abu Dharr reported:The Messenger of Allah (ﷺ) struck my thigh and said: How would you act if you survive among the people who would delay prayers beyond their (prescribed) time? He (Abu Dharr) said: What do you command (under this situation)? He (the Holy Prophet) slid: Observe prayer at its prescribed time, then go (to meet) your needs, and if the Iqama is pronounced, and you are present in the mosque, then observe prayer (along with the Jama'at)", "source_en": "Sahih Muslim · 1468"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ رضى الله عنه عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "تُنْكَحُ الْمَرْأَةُ لأَرْبَعٍ لِمَالِهَا وَلِحَسَبِهَا وَجَمَالِهَا وَلِدِينِهَا، فَاظْفَرْ بِذَاتِ الدِّينِ تَرِبَتْ يَدَاكَ"]], "source": "صحيح البخاري · ٥٠٩٠", "english": "Narrated Abu Huraira:The Prophet (ﷺ) said, \"A woman is married for four things, i.e., her wealth, her family status, her beauty and her religion. So you should marry the religious woman (otherwise) you will be a losers", "source_en": "Sahih al-Bukhari · 5090"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "إِذَا انْتَهَى أَحَدُكُمْ إِلَى الْمَجْلِسِ فَلْيُسَلِّمْ فَإِذَا أَرَادَ أَنْ يَقُومَ فَلْيُسَلِّمْ فَلَيْسَتِ الأُولَى بِأَحَقَّ مِنَ الآخِرَةِ"]], "source": "سنن أبي داود · ٥٢٠٨ · حسن صحيح عند الألباني", "english": "Narrated AbuHurayrah: The Prophet (ﷺ) said: When one of you comes to an assembly, he should give a salutation and if he feels inclined to get up, he should give a salutation, for the former is not more of a duty than the latter", "source_en": "Sunan Abi Dawud · 5208"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "يُسَلِّمُ الصَّغِيرُ عَلَى الْكَبِيرِ، وَالْمَارُّ عَلَى الْقَاعِدِ، وَالْقَلِيلُ عَلَى الْكَثِيرِ"]], "source": "صحيح البخاري · ٦٢٣١", "english": "Narrated Abu Huraira:The Prophet (ﷺ) said, \"The young should greet the old, the passer by should greet the sitting one, and the small group of persons should greet the large group of persons", "source_en": "Sahih al-Bukhari · 6231"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ رضى الله عنه عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "إِذَا عَطَسَ أَحَدُكُمْ فَلْيَقُلِ الْحَمْدُ لِلَّهِ. وَلْيَقُلْ لَهُ أَخُوهُ أَوْ صَاحِبُهُ يَرْحَمُكَ اللَّهُ. فَإِذَا قَالَ لَهُ يَرْحَمُكَ اللَّهُ. فَلْيَقُلْ يَهْدِيكُمُ اللَّهُ وَيُصْلِحُ بَالَكُمْ"]], "source": "صحيح البخاري · ٦٢٢٤", "english": "Narrated Abu Huraira:The Prophet (ﷺ) said, \" If anyone of you sneezes, he should say 'Al-Hamduli l-lah' (Praise be to Allah), and his (Muslim) brother or companion should say to him, 'Yar-hamuka-l-lah' (May Allah bestow his Mercy on you). When the latter says 'Yar-hamuka-llah\", the former should say, 'Yahdikumul-lah wa Yuslih balakum' (May Allah give you guidance and improve your condition)", "source_en": "Sahih al-Bukhari · 6224"}, {"parts": [["n", "عن جَابِرِ بْنِ عَبْدِ اللَّهِ، أَنَّهُ سَمِعَ النَّبِيَّ ﷺ يَقُولُ"], ["q", "إِذَا دَخَلَ الرَّجُلُ بَيْتَهُ فَذَكَرَ اللَّهَ عِنْدَ دُخُولِهِ وَعِنْدَ طَعَامِهِ قَالَ الشَّيْطَانُ لاَ مَبِيتَ لَكُمْ وَلاَ عَشَاءَ. وَإِذَا دَخَلَ فَلَمْ يَذْكُرِ اللَّهَ عِنْدَ دُخُولِهِ قَالَ الشَّيْطَانُ أَدْرَكْتُمُ الْمَبِيتَ. وَإِذَا لَمْ يَذْكُرِ اللَّهَ عِنْدَ طَعَامِهِ قَالَ أَدْرَكْتُمُ الْمَبِيتَ وَالْعَشَاءَ"]], "source": "صحيح مسلم · ٢٠١٨", "english": "Jabir b. 'Abdullah reported that while Allah's Messenger (ﷺ) was delivering the sermon on Friday a person came there, and the Messenger of Allah (ﷺ) said to him:So and so, have you prayed (two rak'ahs)? He said: No. He (the Holy Prophet) said: Then stand and pray", "source_en": "Sahih Muslim · 2018"}, {"parts": [["n", "عن ابْنِ عُمَرَ رضى الله عنهما عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "لاَ يُقِيمُ الرَّجُلُ الرَّجُلَ مِنْ مَجْلِسِهِ، ثُمَّ يَجْلِسُ فِيهِ"]], "source": "صحيح البخاري · ٦٢٦٩", "english": "Narrated Ibn `Umar:The Prophet (ﷺ) said, \"A man should not make another man get up from his (the latter's) seat (in a gathering) in order to sit there", "source_en": "Sahih al-Bukhari · 6269"}, {"parts": [["n", "عن أَبِي ذَرٍّ، قَالَ إِنَّ رَسُولَ اللَّهِ ﷺ قَالَ لَنَا"], ["q", "إِذَا غَضِبَ أَحَدُكُمْ وَهُوَ قَائِمٌ فَلْيَجْلِسْ فَإِنْ ذَهَبَ عَنْهُ الْغَضَبُ وَإِلاَّ فَلْيَضْطَجِعْ"]], "source": "سنن أبي داود · ٤٧٨٢ · صحيح عند الألباني", "english": "Narrated AbuDharr: The Messenger of Allah (ﷺ) said to us: When one of you becomes angry while standing, he should sit down. If the anger leaves him, well and good; otherwise he should lie down", "source_en": "Sunan Abi Dawud · 4782"}, {"parts": [["n", "عن ابْنِ عَبَّاسٍ، أَنَّ النَّبِيَّ ﷺ قَالَ لأَشَجِّ عَبْدِ الْقَيْسِ"], ["q", "إِنَّ فِيكَ خَصْلَتَيْنِ يُحِبُّهُمَا اللَّهُ الْحِلْمُ وَالأَنَاةُ"]], "source": "جامع الترمذي · ٢٠١١ · حسن صحيح", "english": "Ibn 'Abbas narrated that the Messenger of Allah said to the Ashajj 'Abdul-Qais:\"Indeed there are two traits in you that Allah loves: Forbearance, and deliberateness", "source_en": "Jami at-Tirmidhi · 2011"}, {"parts": [["n", "عن جَرِيرِ بْنِ عَبْدِ اللَّهِ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "لاَ يَرْحَمُ اللَّهُ مَنْ لاَ يَرْحَمُ النَّاسَ"]], "source": "صحيح البخاري · ٧٣٧٦", "english": "Narrated Jarir bin `Abdullah:Allah's Messenger (ﷺ) said, \"Allah will not be merciful to those who are not merciful to mankind", "source_en": "Sahih al-Bukhari · 7376"}, {"parts": [["n", "عن عَائِشَةَ، رَحِمَهَا اللَّهُ قَالَتْ سَمِعْتُ رَسُولَ اللَّهِ ﷺ يَقُولُ"], ["q", "إِنَّ الْمُؤْمِنَ لَيُدْرِكُ بِحُسْنِ خُلُقِهِ دَرَجَةَ الصَّائِمِ الْقَائِمِ"]], "source": "سنن أبي داود · ٤٧٩٨ · صحيح عند الألباني", "english": "Narrated Aisha, Ummul Mu'minin: The Messenger of Allah (ﷺ) said: By his good character a believer will attain the degree of one who prays during the night and fasts during the day", "source_en": "Sunan Abi Dawud · 4798"}, {"parts": [["n", "عن أَنَسٍ رضى الله عنه عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "لاَ عَدْوَى وَلاَ طِيَرَةَ، وَيُعْجِبُنِي الْفَأْلُ الصَّالِحُ، الْكَلِمَةُ الْحَسَنَةُ"]], "source": "صحيح البخاري · ٥٧٥٦", "english": "Narrated Anas:The Prophet (ﷺ) said, \"No 'Adwa (no contagious disease is conveyed to others without Allah's permission), nor Tiyara, but I like the good Fal, i.e., the good word", "source_en": "Sahih al-Bukhari · 5756"}, {"parts": [["n", "عن الْمِقْدَامِ رضى الله عنه عَنْ رَسُولِ اللَّهِ ﷺ قَالَ"], ["q", "مَا أَكَلَ أَحَدٌ طَعَامًا قَطُّ خَيْرًا مِنْ أَنْ يَأْكُلَ مِنْ عَمَلِ يَدِهِ، وَإِنَّ نَبِيَّ اللَّهِ دَاوُدَ عَلَيْهِ السَّلاَمُ كَانَ يَأْكُلُ مِنْ عَمَلِ يَدِهِ"]], "source": "صحيح البخاري · ٢٠٧٢", "english": "Narrated Al-Miqdam:The Prophet (ﷺ) said, \"Nobody has ever eaten a better meal than that which one has earned by working with one's own hands. The Prophet of Allah, David (ﷺ) used to eat from the earnings of his manual labor", "source_en": "Sahih al-Bukhari · 2072"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ رضى الله عنه أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "وَالَّذِي نَفْسِي بِيَدِهِ لأَنْ يَأْخُذَ أَحَدُكُمْ حَبْلَهُ فَيَحْتَطِبَ عَلَى ظَهْرِهِ خَيْرٌ لَهُ مِنْ أَنْ يَأْتِيَ رَجُلاً، فَيَسْأَلَهُ، أَعْطَاهُ أَوْ مَنَعَهُ"]], "source": "صحيح البخاري · ١٤٧٠", "english": "Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"By Him in Whose Hand my life is, it is better for anyone of you to take a rope and cut the wood (from the forest) and carry it over his back and sell it (as a means of earning his living) rather than to ask a person for something and that person may give him or not", "source_en": "Sahih al-Bukhari · 1470"}, {"parts": [["n", "عن ابْنِ عُمَرَ رضى الله عنهما قَالَ قَالَ النَّبِيُّ ﷺ"], ["q", "الْبَيِّعَانِ بِالْخِيَارِ مَا لَمْ يَتَفَرَّقَا، أَوْ يَقُولُ أَحَدُهُمَا لِصَاحِبِهِ اخْتَرْ"]], "source": "صحيح البخاري · ٢١٠٩", "english": "Narrated Ibn `Umar:Allah's Messenger (ﷺ) said, \"The seller and the buyer have the option of canceling or confirming the deal unless they separate, or one of them says to the other, 'Choose (i.e. decide to cancel or confirm the bargain now).\" Perhaps he said, 'Or if it is an optional sale.' \" Ibn `Umar, Shuraih, Ash-Shu`bi, Tawus, Ata, and Ibn Abu Mulaika agree upon this judgment", "source_en": "Sahih al-Bukhari · 2109"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ رضى الله عنه عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "مَنْ أَخَذَ أَمْوَالَ النَّاسِ يُرِيدُ أَدَاءَهَا أَدَّى اللَّهُ عَنْهُ، وَمَنْ أَخَذَ يُرِيدُ إِتْلاَفَهَا أَتْلَفَهُ اللَّهُ"]], "source": "صحيح البخاري · ٢٣٨٧", "english": "Narrated Abu Huraira:The Prophet (ﷺ) said, \"Whoever takes the money of the people with the intention of repaying it, Allah will repay it on his behalf, and whoever takes it in order to spoil it, then Allah will spoil him", "source_en": "Sahih al-Bukhari · 2387"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "نَفْسُ الْمُؤْمِنِ مُعَلَّقَةٌ بِدَيْنِهِ حَتَّى يُقْضَى عَنْهُ"]], "source": "جامع الترمذي · ١٠٧٩ · حسن", "english": "(Another chain) Abu Hurairah narrated that:The Messenger of Allah said: \"The believer's soul is suspended by his debt until it is settled for him", "source_en": "Jami at-Tirmidhi · 1079"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، قَالَ جَاءَ رَجُلٌ يَتَقَاضَى رَسُولَ اللَّهِ ﷺ بَعِيرًا فَقَالَ"], ["q", "أَعْطُوهُ سِنًّا فَوْقَ سِنِّهِ - وَقَالَ - خَيْرُكُمْ أَحْسَنُكُمْ قَضَاءً"]], "source": "صحيح مسلم · ١٦٠١", "english": "Ibn 'Umar reported that he summoned (people) to pray on a cold, windy and rainy night, and then observed at the end of the Adhin:Pray in your dwellings, pray in your dwellings, and then said: When it was a cold night or it was raining in a journey the Messenger of Allah (may peace he upon him) used to command the Mu'adhdhin to announce: Pray in your dwellings", "source_en": "Sahih Muslim · 1601"}, {"parts": [["n", "عن مَعْمَرِ بْنِ عَبْدِ اللَّهِ، عَنْ رَسُولِ اللَّهِ ﷺ قَالَ"], ["q", "لاَ يَحْتَكِرُ إِلاَّ خَاطِئٌ"]], "source": "صحيح مسلم · ١٦٠٥", "english": "Abd al-Hamid reported:I heard 'Abdullah b. al-Harith say: 'Abdullah b. 'Abbas addressed us on a rainy day, and the rest of the hadith is the same, but he made no mention of Jumu'a prayer, and added: He who did it (who commanded us to say prayer in our houses), i. e. the Messenger of Allah (ﷺ), is better than I", "source_en": "Sahih Muslim · 1605"}, {"parts": [["n", "عن سَعْدً عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "إِذَا سَمِعْتُمْ بِالطَّاعُونِ بِأَرْضٍ فَلاَ تَدْخُلُوهَا، وَإِذَا وَقَعَ بِأَرْضٍ وَأَنْتُمْ بِهَا فَلاَ تَخْرُجُوا مِنْهَا"]], "source": "صحيح البخاري · ٥٧٢٨", "english": "Narrated Saud:The Prophet (ﷺ) said, \"If you hear of an outbreak of plague in a land, do not enter it; but if the plague breaks out in a place while you are in it, do not leave that place", "source_en": "Sahih al-Bukhari · 5728"}, {"parts": [["n", "عن أبي هُرَيْرَةَ، أَنَّهُ، سَمِعَ رَسُولَ اللَّهِ ﷺ يَقُولُ"], ["q", "فِي الْحَبَّةِ السَّوْدَاءِ شِفَاءٌ مِنْ كُلِّ دَاءٍ إِلاَّ السَّامَ"]], "source": "صحيح البخاري · ٥٦٨٨", "english": "Narrated Abu Huraira:I heard Allah's Messenger (ﷺ) saying, \"There is healing in black cumin for all diseases except death", "source_en": "Sahih al-Bukhari · 5688"}, {"parts": [["n", "عن عَامِرُ بْنُ سَعْدٍ، عَنْ أَبِيهِ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "مَنْ تَصَبَّحَ كُلَّ يَوْمٍ سَبْعَ تَمَرَاتٍ عَجْوَةً لَمْ يَضُرُّهُ فِي ذَلِكَ الْيَوْمِ سُمٌّ وَلاَ سِحْرٌ"]], "source": "صحيح البخاري · ٥٤٤٥", "english": "Narrated Sa`d:Allah's Messenger (ﷺ) said, \"He who eats seven 'Ajwa dates every morning, will not be affected by poison or magic on the day he eats them", "source_en": "Sahih al-Bukhari · 5445"}, {"parts": [["n", "عن عَمْرِو بْنِ شُعَيْبٍ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "إِنَّ اللَّهَ يُحِبَّ أَنْ يُرَى أَثَرُ نِعْمَتِهِ عَلَى عَبْدِهِ"]], "source": "جامع الترمذي · ٢٨١٩ · حسن", "english": "Narrated 'Amr bin Shu'aib:from his father, from his grandfather who said: \"The Messenger of Allah (ﷺ) said: 'Indeed Allah loves to see the results of his favors upon His Slaves", "source_en": "Jami at-Tirmidhi · 2819"}, {"parts": [["n", "عن أَنَسِ بْنِ مَالِكٍ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "حُفَّتِ الْجَنَّةُ بِالْمَكَارِهِ وَحُفَّتِ النَّارُ بِالشَّهَوَاتِ"]], "source": "صحيح مسلم · ٢٨٢٢", "english": "Abdullah b. 'Umar reported:I saw the Messenger of Allah (ﷺ) riding on his camel at Dhu'l-Hulaifa and pronouncing Talbiya as it stood up with him", "source_en": "Sahih Muslim · 2822"}, {"parts": [["n", "عن عَبْدِ اللَّهِ رضى الله عنه قَالَ قَالَ النَّبِيُّ ﷺ"], ["q", "الْجَنَّةُ أَقْرَبُ إِلَى أَحَدِكُمْ مِنْ شِرَاكِ نَعْلِهِ، وَالنَّارُ مِثْلُ ذَلِكَ"]], "source": "صحيح البخاري · ٦٤٨٨", "english": "Narrated `Abdullah:The Prophet (ﷺ) said, \"Paradise is nearer to any of you than the Shirak (leather strap) of his shoe, and so is the (Hell) Fire", "source_en": "Sahih al-Bukhari · 6488"}, {"parts": [["n", "عن سَهْلِ بْنِ سَعْدٍ، عَنْ رَسُولِ اللَّهِ ﷺ قَالَ"], ["q", "إِنَّ فِي الْجَنَّةِ لَشَجَرَةً يَسِيرُ الرَّاكِبُ فِي ظِلِّهَا مِائَةَ عَامٍ، لاَ يَقْطَعُهَا"]], "source": "صحيح البخاري · ٦٥٥٢", "english": "Narrated Sahl bin Sa'd: Allah's Messenger (ﷺ) said, \"In Paradise there is a tree so big that in its shade a rider may travel for one hundred years without being able to cross it", "source_en": "Sahih al-Bukhari · 6552"}, {"parts": [["n", "عن سَهْلِ بْنِ سَعْدٍ السَّاعِدِيِّ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "مَوْضِعُ سَوْطٍ فِي الْجَنَّةِ خَيْرٌ مِنَ الدُّنْيَا وَمَا فِيهَا"]], "source": "صحيح البخاري · ٣٢٥٠", "english": "Narrated Sahl bin Sa`d Al-Saidi:Allah's Messenger (ﷺ) said, \"A place in Paradise equal to the size of a lash is better than the whole world and whatever is in it", "source_en": "Sahih al-Bukhari · 3250"}, {"parts": [["n", "عن أَبِي بَرْزَةَ الأَسْلَمِيِّ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "لاَ تَزُولُ قَدَمَا عَبْدٍ يَوْمَ الْقِيَامَةِ حَتَّى يُسْأَلَ عَنْ عُمْرِهِ فِيمَا أَفْنَاهُ وَعَنْ عِلْمِهِ فِيمَا فَعَلَ وَعَنْ مَالِهِ مِنْ أَيْنَ اكْتَسَبَهُ وَفِيمَا أَنْفَقَهُ وَعَنْ جِسْمِهِ فِيمَا أَبْلاَهُ"]], "source": "جامع الترمذي · ٢٤١٧ · صحيح عند الألباني", "english": "Abu Barzah Al-Aslami narrated that the Messenger of Allah (s.a.w) said:\"The feet of the slave of Allah shall not move [on the Day of Judgement] until he is asked about five things: about his life and what he did with it, about his knowledge and what he did with it, about his wealth and how he earned it and where he spent it on, about his body and for what did he wear it out.\" [He said:] This Hadith is Hasan Sahih. Sa'eed bin Abdullah bin Juraij (a narrator in the chain) [is from Al-Basrah], and he is the freed slave of Abu Barzah AlAslami, and Abu Barzah AlAslami's name is Nadlah bin 'Ubaid", "source_en": "Jami at-Tirmidhi · 2417"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "كُلُّ أُمَّتِي يَدْخُلُونَ الْجَنَّةَ، إِلاَّ مَنْ أَبَى"], ["n", "قَالُوا يَا رَسُولَ اللَّهِ وَمَنْ يَأْبَى قَالَ"], ["q", "مَنْ أَطَاعَنِي دَخَلَ الْجَنَّةَ، وَمَنْ عَصَانِي فَقَدْ أَبَى"]], "source": "صحيح البخاري · ٧٢٨٠", "english": "Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"All my followers will enter Paradise except those who refuse.\" They said, \"O Allah's Messenger (ﷺ)! Who will refuse?\" He said, \"Whoever obeys me will enter Paradise, and whoever disobeys me is the one who refuses (to enter it)", "source_en": "Sahih al-Bukhari · 7280"}, {"parts": [["n", "عن مُعَاذِ بْنِ جَبَلٍ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "مَنْ كَانَ آخِرُ كَلاَمِهِ لاَ إِلَهَ إِلاَّ اللَّهُ دَخَلَ الْجَنَّةَ"]], "source": "سنن أبي داود · ٣١١٦ · صحيح عند الألباني", "english": "Narrated Mu’adh bin Jabal :The Messenger of Allah (ﷺ) as saying: If anyone's last words are \"There is no god but Allah\" he will enter Paradise", "source_en": "Sunan Abi Dawud · 3116"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ رضى الله عنه قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "لَمَّا قَضَى اللَّهُ الْخَلْقَ كَتَبَ فِي كِتَابِهِ، فَهْوَ عِنْدَهُ فَوْقَ الْعَرْشِ إِنَّ رَحْمَتِي غَلَبَتْ غَضَبِي"]], "source": "صحيح البخاري · ٣١٩٤", "english": "Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"When Allah completed the creation, He wrote in His Book which is with Him on His Throne, \"My Mercy overpowers My Anger", "source_en": "Sahih al-Bukhari · 3194"}, {"parts": [["n", "عن أبي هُرَيْرَةَ، قَالَ سَمِعْتُ رَسُولَ اللَّهِ ﷺ يَقُولُ"], ["q", "جَعَلَ اللَّهُ الرَّحْمَةَ مِائَةَ جُزْءٍ، فَأَمْسَكَ عِنْدَهُ تِسْعَةً وَتِسْعِينَ جُزْءًا، وَأَنْزَلَ فِي الأَرْضِ جُزْءًا وَاحِدًا، فَمِنْ ذَلِكَ الْجُزْءِ يَتَرَاحَمُ الْخَلْقُ، حَتَّى تَرْفَعَ الْفَرَسُ حَافِرَهَا عَنْ وَلَدِهَا خَشْيَةَ أَنْ تُصِيبَهُ"]], "source": "صحيح البخاري · ٦٠٠٠", "english": "Narrated Abu Huraira:I heard Allah's Messenger (ﷺ) saying, Allah divided Mercy into one hundred parts. He kept ninety nine parts with Him and sent down one part to the earth, and because of that, its one single part, His Creations are merciful to each other, so that even the mare lifts up its hoofs away from its baby animal, lest it should trample on it", "source_en": "Sahih al-Bukhari · 6000"}, {"parts": [["n", "عن أَنَسٍ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "إِذَا أَرَادَ اللَّهُ بِعَبْدِهِ الْخَيْرَ عَجَّلَ لَهُ الْعُقُوبَةَ فِي الدُّنْيَا وَإِذَا أَرَادَ اللَّهُ بِعَبْدِهِ الشَّرَّ أَمْسَكَ عَنْهُ بِذَنْبِهِ حَتَّى يُوَفَّى بِهِ يَوْمَ الْقِيَامَةِ"]], "source": "جامع الترمذي · ٢٣٩٦ · حسن غريب", "english": "Anas narrated that the Messenger of Allah (ﷺ) said:\"When Allah wants good for his slave, He hastens his punishment in the world. And when He wants bad for His slave, He withholds his sins from him until he appears before Him on the Day of Judgement.\" And with this (same) chain, (it was reported) from the Prophet (ﷺ) who said: \"Indeed greater reward comes with greater trial. And indeed, when Allah loves a people He subjects them to trials, so whoever is content, then for him is pleasure, and whoever is discontent, then for him is wrath", "source_en": "Jami at-Tirmidhi · 2396"}, {"parts": [["n", "عن أبي هُرَيْرَةَ، يَقُولُ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "مَنْ يُرِدِ اللَّهُ بِهِ خَيْرًا يُصِبْ مِنْهُ"]], "source": "صحيح البخاري · ٥٦٤٥", "english": "Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"If Allah wants to do good to somebody, He afflicts him with trials", "source_en": "Sahih al-Bukhari · 5645"}, {"parts": [["n", "عن أَنَسِ بْنِ مَالِكٍ رضى الله عنه قَالَ مَرَّ النَّبِيُّ ﷺ بِامْرَأَةٍ تَبْكِي عِنْدَ قَبْرٍ فَقَالَ"], ["q", "اتَّقِي اللَّهَ وَاصْبِرِي"], ["n", "قَالَتْ إِلَيْكَ عَنِّي، فَإِنَّكَ لَمْ تُصَبْ بِمُصِيبَتِي، وَلَمْ تَعْرِفْهُ. فَقِيلَ لَهَا إِنَّهُ النَّبِيُّ ﷺ. فَأَتَتْ باب النَّبِيِّ ﷺ فَلَمْ تَجِدْ عِنْدَهُ بَوَّابِينَ فَقَالَتْ لَمْ أَعْرِفْكَ. فَقَالَ"], ["q", "إِنَّمَا الصَّبْرُ عِنْدَ الصَّدْمَةِ الأُولَى"]], "source": "صحيح البخاري · ١٢٨٣", "english": "Narrated Anas bin Malik:The Prophet (ﷺ) passed by a woman who was weeping beside a grave. He told her to fear Allah and be patient. She said to him, \"Go away, for you have not been afflicted with a calamity like mine.\" And she did not recognize him. Then she was informed that he was the Prophet (ﷺ) . so she went to the house of the Prophet (ﷺ) and there she did not find any guard. Then she said to him, \"I did not recognize you.\" He said, \"Verily, the patience is at the first stroke of a calamity", "source_en": "Sahih al-Bukhari · 1283"}, {"parts": [["n", "عن سَالِمٍ، عَنْ أَبِيهِ، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "لاَ حَسَدَ إِلاَّ فِي اثْنَتَيْنِ رَجُلٌ آتَاهُ اللَّهُ الْقُرْآنَ فَهْوَ يَتْلُوهُ آنَاءَ اللَّيْلِ وَآنَاءَ النَّهَارِ، وَرَجُلٌ آتَاهُ اللَّهُ مَالاً فَهْوَ يُنْفِقُهُ آنَاءَ اللَّيْلِ وَآنَاءَ النَّهَارِ"]], "source": "صحيح البخاري · ٧٥٢٩", "english": "Narrated Salim's father:The Prophet (ﷺ) said, \"Not to wish to be the like of except the like of two (persons): a man whom Allah has given the knowledge of the Qur'an and he recites it during the hours of the night and the hours of the day; and a man whom Allah has given wealth and he spends it (in Allah's Cause) during the hours of the night and during the hours of the day", "source_en": "Sahih al-Bukhari · 7529"}, {"parts": [["n", "عن ابْنِ عُمَرَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "الْمُؤْمِنُ الَّذِي يُخَالِطُ النَّاسَ وَيَصْبِرُ عَلَى أَذَاهُمْ أَعْظَمُ أَجْرًا مِنَ الْمُؤْمِنِ الَّذِي لاَ يُخَالِطُ النَّاسَ وَلاَ يَصْبِرُ عَلَى أَذَاهُمْ"]], "source": "سنن ابن ماجه · ٤٠٣٢ · صحيح عند الألباني", "english": "It was narrated from Ibn ‘Umar that the Messenger of Allah (ﷺ) said:“The believer who mixes with people and bears their annoyance with patience will have a greater reward than the believer who does not mix with people and does not put up with their annoyance.”", "source_en": "Sunan Ibn Majah · 4032"}, {"parts": [["n", "عن عَبْدِ اللَّهِ بْنِ عَمْرٍو، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "كَفَى بِالْمَرْءِ إِثْمًا أَنْ يُضَيِّعَ مَنْ يَقُوتُ"]], "source": "سنن أبي داود · ١٦٩٢ · حسن عند الألباني", "english": "Abd Allah bin ‘Amr reported the Messenger of Allah (ﷺ) as saying :It is sufficient sin for a man that he neglects him whom he maintains", "source_en": "Sunan Abi Dawud · 1692"}, {"parts": [["n", "عن أَنَسٍ رضى الله عنه قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "مَا مِنْ مُسْلِمٍ يَغْرِسُ غَرْسًا، أَوْ يَزْرَعُ زَرْعًا، فَيَأْكُلُ مِنْهُ طَيْرٌ أَوْ إِنْسَانٌ أَوْ بَهِيمَةٌ، إِلاَّ كَانَ لَهُ بِهِ صَدَقَةٌ"]], "source": "صحيح البخاري · ٢٣٢٠", "english": "Narrated Anas bin Malik:Allah's Messenger (ﷺ) said, \"There is none amongst the Muslims who plants a tree or sows seeds, and then a bird, or a person or an animal eats from it, but is regarded as a charitable gift for him", "source_en": "Sahih al-Bukhari · 2320"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "لَقَدْ رَأَيْتُ رَجُلاً يَتَقَلَّبُ فِي الْجَنَّةِ فِي شَجَرَةٍ قَطَعَهَا مِنْ ظَهْرِ الطَّرِيقِ كَانَتْ تُؤْذِي النَّاسَ"]], "source": "صحيح مسلم · ١٩١٤", "english": "Abu Ishaq reported:I saw a man asking Aswad b. Yazid who taught the Qur'an in the mosque: How do you recite the verse (fahal min muddakir) whether (the word muddakir) Is with (d) or (dh)? He (Aswad) said: It was with (d). I heard Abdullah b. Mas'ud saying that he had heard the Messenger of Allah (ﷺ) reciting (muddakir) with (d)", "source_en": "Sahih Muslim · 1914"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ ﷺ"], ["q", "مَنْ غَدَا إِلَى الْمَسْجِدِ أَوْ رَاحَ أَعَدَّ اللَّهُ لَهُ فِي الْجَنَّةِ نُزُلاً كُلَّمَا غَدَا أَوْ رَاحَ"]], "source": "صحيح مسلم · ٦٦٩", "english": "Al-Aawad and Hammam reported A'isha as saying:I used to scrape off the (drop of) semen from the garment of the Messenger of Allah (ﷺ)", "source_en": "Sahih Muslim · 669"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ رضى الله عنه أَنَّ النَّبِيَّ ﷺ قَالَ"], ["q", "صَلاَةٌ فِي مَسْجِدِي هَذَا خَيْرٌ مِنْ أَلْفِ صَلاَةٍ فِيمَا سِوَاهُ إِلاَّ الْمَسْجِدَ الْحَرَامَ"]], "source": "صحيح البخاري · ١١٩٠", "english": "Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"One prayer in my Mosque is better than one thousand prayers in any other mosque excepting Al-Masjid-Al-Haram", "source_en": "Sahih al-Bukhari · 1190"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ رضى الله عنه عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "لاَ تُشَدُّ الرِّحَالُ إِلاَّ إِلَى ثَلاَثَةِ مَسَاجِدَ الْمَسْجِدِ الْحَرَامِ، وَمَسْجِدِ الرَّسُولِ ﷺ وَمَسْجِدِ الأَقْصَى"]], "source": "صحيح البخاري · ١١٨٩", "english": "Narrated Abu Huraira:The Prophet (ﷺ) said, \"Do not set out on a journey except for three Mosques i.e. Al-Masjid-Al-Haram, the Mosque of Allah's Messenger (ﷺ) , and the Mosque of Al-Aqsa, (Mosque of Jerusalem)", "source_en": "Sahih al-Bukhari · 1189"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ رضى الله عنه عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "مَا بَيْنَ بَيْتِي وَمِنْبَرِي رَوْضَةٌ مِنْ رِيَاضِ الْجَنَّةِ، وَمِنْبَرِي عَلَى حَوْضِي"]], "source": "صحيح البخاري · ١١٩٦", "english": "Narrated Abu Huraira:The Prophet (ﷺ) said, \"Between my house and my pulpit there is a garden of the gardens of Paradise, and my pulpit is on my fountain tank (i.e. Al-Kauthar)", "source_en": "Sahih al-Bukhari · 1196"}, {"parts": [["n", "عن عَبْدِ اللَّهِ بْنِ عَدِيِّ بْنِ حَمْرَاءَ الزُّهْرِيِّ، قَالَ رَأَيْتُ رَسُولَ اللَّهِ ﷺ وَاقِفًا عَلَى الْحَزْوَرَةِ فَقَالَ"], ["q", "وَاللَّهِ إِنَّكِ لَخَيْرُ أَرْضِ اللَّهِ وَأَحَبُّ أَرْضِ اللَّهِ إِلَى اللَّهِ وَلَوْلاَ أَنِّي أُخْرِجْتُ مِنْكِ مَا خَرَجْتُ"]], "source": "جامع الترمذي · ٣٩٢٥ · حسن صحيح", "english": "Narrated 'Abdullah bin 'Adi bin Hamra [Az-Zuhri]:\"I saw the Messenger of Allah (ﷺ) standing at Al-Hazwarah, and he said: \"By Allah! You are the best of Allah's earth, and the most beloved of Allah's earth to Allah, and if it were not that I was expelled from you I would not have left", "source_en": "Jami at-Tirmidhi · 3925"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ رضى الله عنه أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "إِنَّ الإِيمَانَ لَيَأْرِزُ إِلَى الْمَدِينَةِ كَمَا تَأْرِزُ الْحَيَّةُ إِلَى جُحْرِهَا"]], "source": "صحيح البخاري · ١٨٧٦", "english": "Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"Verily, Belief returns and goes back to Medina as a snake returns and goes back to its hole (when in danger)", "source_en": "Sahih al-Bukhari · 1876"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "إِنَّ اللَّهَ يَرْضَى لَكُمْ ثَلاَثًا وَيَكْرَهُ لَكُمْ ثَلاَثًا فَيَرْضَى لَكُمْ أَنْ تَعْبُدُوهُ وَلاَ تُشْرِكُوا بِهِ شَيْئًا وَأَنْ تَعْتَصِمُوا بِحَبْلِ اللَّهِ جَمِيعًا وَلاَ تَفَرَّقُوا وَيَكْرَهُ لَكُمْ قِيلَ وَقَالَ وَكَثْرَةَ السُّؤَالِ وَإِضَاعَةَ الْمَالِ"]], "source": "صحيح مسلم · ١٧١٥", "english": "Abdullah b. 'Amr reported:It was narrated to me that the Messenger of Allah (ﷺ) had said: The prayer observed by a person sitting is half of the prayer. I came to him (ﷺ) and found him praying in a sitting position. I placed my hand on his head. He said: O 'Abdullah b. 'Amr, what is the matter with you? I said: Messenger of Allah, it has been narrated to me that you said: The prayer of a man in a sitting position is half of the prayer, whereas you are observing prayer sitting. He (the Holy Prophet) said: Yes, it is so, but I am not like anyone amongst you", "source_en": "Sahih Muslim · 1715"}, {"parts": [["n", "عن أَبِي سَعِيدٍ الْخُدْرِيِّ رضى الله عنه عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "إِيَّاكُمْ وَالْجُلُوسَ عَلَى الطُّرُقَاتِ"], ["n", "فَقَالُوا مَا لَنَا بُدٌّ، إِنَّمَا هِيَ مَجَالِسُنَا نَتَحَدَّثُ فِيهَا. قَالَ"], ["q", "فَإِذَا أَبَيْتُمْ إِلاَّ الْمَجَالِسَ فَأَعْطُوا الطَّرِيقَ حَقَّهَا"], ["n", "قَالُوا وَمَا حَقُّ الطَّرِيقِ قَالَ"], ["q", "غَضُّ الْبَصَرِ، وَكَفُّ الأَذَى، وَرَدُّ السَّلاَمِ، وَأَمْرٌ بِالْمَعْرُوفِ، وَنَهْىٌ عَنِ الْمُنْكَرِ"]], "source": "صحيح البخاري · ٢٤٦٥", "english": "Narrated Abu Sa`id Al-Khudri:The Prophet (ﷺ) said, \"Beware! Avoid sitting on the roads (ways).\" The people said, \"There is no way out of it as these are our sitting places where we have talks.\" The Prophet (ﷺ) said, \"If you must sit there, then observe the rights of the way.\" They asked, \"What are the rights of the way?\" He said, \"They are the lowering of your gazes (on seeing what is illegal to look at), refraining from harming people, returning greetings, advocating good and forbidding evil", "source_en": "Sahih al-Bukhari · 2465"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "إِنَّ اللَّهَ يَقُولُ يَوْمَ الْقِيَامَةِ أَيْنَ الْمُتَحَابُّونَ بِجَلاَلِي الْيَوْمَ أُظِلُّهُمْ فِي ظِلِّي يَوْمَ لاَ ظِلَّ إِلاَّ ظِلِّي"]], "source": "صحيح مسلم · ٢٥٦٦", "english": "Abu Huraira (Allah be pleased with him) reported:The Messenger of Allah (ﷺ) forbade (his Companions) from observing fast uninterruptedly. One of the Muslims said: Messenger of Allah, you yourself observe Saum Wisal, whereupon the Messenger of Allah (ﷺ) said: Who among you is like me? I spend night (in a state) that my Allah feeds me and provides me drink. When they (the Companions of the Holy Prophet) did not agree in abandoning the uninterrupted fast, then the Prophet (ﷺ) also observed this fast with them for a day, and then for a day. They then saw the new moon and he (the Holy Prophet) said: If the appearance of the new moon were delayed. I would have observed more (fasts) with you (and he did it) by way of warning to them as they had not agreed to refrain (from observing Saum Wisal)", "source_en": "Sahih Muslim · 2566"}, {"parts": [["n", "عن ثَوْبَانَ، مَوْلَى رَسُولِ اللَّهِ ﷺ قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "مَنْ عَادَ مَرِيضًا لَمْ يَزَلْ فِي خُرْفَةِ الْجَنَّةِ حَتَّى يَرْجِعَ"]], "source": "صحيح مسلم · ٢٥٦٨", "english": "Abu Huraira (Allah be pleased with him) reported Allah's Apostle (ﷺ) as saying (the words as said in the previous hadith) but with this alteration (of words):\" Take upon yourselves (the burden of the deeds) for which you have the strength to bear", "source_en": "Sahih Muslim · 2568"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "مَنْ دَعَا إِلَى هُدًى كَانَ لَهُ مِنَ الأَجْرِ مِثْلُ أُجُورِ مَنْ تَبِعَهُ لاَ يَنْقُصُ ذَلِكَ مِنْ أُجُورِهِمْ شَيْئًا وَمَنْ دَعَا إِلَى ضَلاَلَةٍ كَانَ عَلَيْهِ مِنَ الإِثْمِ مِثْلُ آثَامِ مَنْ تَبِعَهُ لاَ يَنْقُصُ ذَلِكَ مِنْ آثَامِهِمْ شَيْئًا"]], "source": "صحيح مسلم · ٢٦٧٤", "english": "Abu Sa'id al-Khudri (Allah be pleased with him) reported that the Messenger of Allah (ﷺ) forbade to observe fast on two days the day of Fitr and the day of Sacrifice ('Id-ul-Adha)", "source_en": "Sahih Muslim · 2674"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "بَادِرُوا بِالأَعْمَالِ سِتًّا الدَّجَّالَ وَالدُّخَانَ وَدَابَّةَ الأَرْضِ وَطُلُوعَ الشَّمْسِ مِنْ مَغْرِبِهَا وَأَمْرَ الْعَامَّةِ وَخُوَيِّصَةَ أَحَدِكُمْ"]], "source": "صحيح مسلم · ٢٩٤٧", "english": "(Abu Nadra reported:Ibn 'Abbas commanded the performance of Mut'a putting ihram for 'Umra during the months of Dhul-Hijja and after completing it. then putting on Ihram for Hajj), but Ibn Zubair forbade to do it. I made a mention of it to Jabir b. Abdullih and he said: It is through me that this hadith has been circulated. We entered into the state of Ihram as Tamattu' with the Messenger of Allah (ﷺ). When 'Umar was Installed as Caliph, he said: Verily Allah made permissible for His Messenger (ﷺ) whatever He liked and as Re liked. And (every command) of the Holy Qur'an has been revealed for every occasion. So accomplish Hajj and Umra for Allah as Allah has commanded you; and confirm by (proper conditions) the marriage of those women (with whom you have performed Mut'a). And any person would come to me with a marriage of appointed duration (Mut'a), I would stone him (to death)", "source_en": "Sahih Muslim · 2947"}, {"parts": [["n", "عن أَبِي ذَرٍّ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "أَلاَ أُخْبِرُكَ بِأَحَبِّ الْكَلاَمِ إِلَى اللَّهِ"], ["n", "قُلْتُ يَا رَسُولَ اللَّهِ أَخْبِرْنِي بِأَحَبِّ الْكَلاَمِ إِلَى اللَّهِ. فَقَالَ"], ["q", "إِنَّ أَحَبَّ الْكَلاَمِ إِلَى اللَّهِ سُبْحَانَ اللَّهِ وَبِحَمْدِهِ"]], "source": "صحيح مسلم · ٢٧٣١", "english": "This hadith has been narrated by Yahya b. Abu Kathir with the same chain of transmitters and he made this addition after these words:During every month, (fasting) for three days, there is for you ten times for every good and that is perpetual fasting (for three days would bring a reward for full thirty days). I said: What is the fast of the Messenger of Allah, David? He said: Half of the age (observing fast on alternate days for the whole life). And in the hadith no mention has been made of the recital of the Qur'an, and he did not say: Your visitor has a right upon you, but (instead) he said: Your son has a right upon you", "source_en": "Sahih Muslim · 2731"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "مَنْ قَالَ حِينَ يُصْبِحُ وَحِينَ يُمْسِي سُبْحَانَ اللَّهِ وَبِحَمْدِهِ مِائَةَ مَرَّةٍ. لَمْ يَأْتِ أَحَدٌ يَوْمَ الْقِيَامَةِ بِأَفْضَلَ مِمَّا جَاءَ بِهِ إِلاَّ أَحَدٌ قَالَ مِثْلَ مَا قَالَ أَوْ زَادَ عَلَيْهِ"]], "source": "صحيح مسلم · ٢٦٩٢", "english": "A'isha (Allah be pleased with her) reported Allah's Messenger (ﷺ) as saying:If anyone dies in a state (that he had to complete) some fasts, his heir must fast on his behalf", "source_en": "Sahih Muslim · 2692"}, {"parts": [["n", "عن أَبِي وَهْبٍ الْجُشَمِيِّ، وَكَانَتْ، لَهُ صُحْبَةٌ قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "تَسَمَّوْا بِأَسْمَاءِ الأَنْبِيَاءِ وَأَحَبُّ الأَسْمَاءِ إِلَى اللَّهِ عَبْدُ اللَّهِ وَعَبْدُ الرَّحْمَنِ وَأَصْدَقُهَا حَارِثٌ وَهَمَّامٌ وَأَقْبَحُهَا حَرْبٌ وَمُرَّةُ"]], "source": "س
