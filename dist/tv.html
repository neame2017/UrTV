 when you are told, \"Arise,\" then arise; Allah will raise those who have believed among you and those who were given knowledge, by degrees. And Allah is Acquainted with what you do.", "surah_en": "Al-Mujaadila", "translator": "Saheeh International"}, {"text": "وَٱلَّذِينَ جَآءُو مِنۢ بَعۡدِهِمۡ يَقُولُونَ رَبَّنَا ٱغۡفِرۡ لَنَا وَلِإِخۡوَٰنِنَا ٱلَّذِينَ سَبَقُونَا بِٱلۡإِيمَٰنِ وَلَا تَجۡعَلۡ فِي قُلُوبِنَا غِلّٗا لِّلَّذِينَ ءَامَنُواْ رَبَّنَآ إِنَّكَ رَءُوفٞ رَّحِيمٌ", "surah": "سورة الحشر", "ayah": 10, "english": "And [there is a share for] those who came after them, saying, \"Our Lord, forgive us and our brothers who preceded us in faith and put not in our hearts [any] resentment toward those who have believed. Our Lord, indeed You are Kind and Merciful.\"", "surah_en": "Al-Hashr", "translator": "Saheeh International"}, {"text": "هُوَ ٱللَّهُ ٱلَّذِي لَآ إِلَٰهَ إِلَّا هُوَ ٱلۡمَلِكُ ٱلۡقُدُّوسُ ٱلسَّلَٰمُ ٱلۡمُؤۡمِنُ ٱلۡمُهَيۡمِنُ ٱلۡعَزِيزُ ٱلۡجَبَّارُ ٱلۡمُتَكَبِّرُۚ سُبۡحَٰنَ ٱللَّهِ عَمَّا يُشۡرِكُونَ", "surah": "سورة الحشر", "ayah": 23, "english": "He is Allah, other than whom there is no deity, the Sovereign, the Pure, the Perfection, the Bestower of Faith, the Overseer, the Exalted in Might, the Compeller, the Superior. Exalted is Allah above whatever they associate with Him.", "surah_en": "Al-Hashr", "translator": "Saheeh International"}, {"text": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓاْ إِذَا نُودِيَ لِلصَّلَوٰةِ مِن يَوۡمِ ٱلۡجُمُعَةِ فَٱسۡعَوۡاْ إِلَىٰ ذِكۡرِ ٱللَّهِ وَذَرُواْ ٱلۡبَيۡعَۚ ذَٰلِكُمۡ خَيۡرٞ لَّكُمۡ إِن كُنتُمۡ تَعۡلَمُونَ", "surah": "سورة الجمعة", "ayah": 9, "english": "O you who have believed, when [the adhan] is called for the prayer on the day of Jumu'ah [Friday], then proceed to the remembrance of Allah and leave trade. That is better for you, if you only knew.", "surah_en": "Al-Jumu'a", "translator": "Saheeh International"}, {"text": "وَأَنفِقُواْ مِن مَّا رَزَقۡنَٰكُم مِّن قَبۡلِ أَن يَأۡتِيَ أَحَدَكُمُ ٱلۡمَوۡتُ فَيَقُولَ رَبِّ لَوۡلَآ أَخَّرۡتَنِيٓ إِلَىٰٓ أَجَلٖ قَرِيبٖ فَأَصَّدَّقَ وَأَكُن مِّنَ ٱلصَّٰلِحِينَ", "surah": "سورة المنافقون", "ayah": 10, "english": "And spend [in the way of Allah] from what We have provided you before death approaches one of you and he says, \"My Lord, if only You would delay me for a brief term so I would give charity and be among the righteous.\"", "surah_en": "Al-Munaafiqoon", "translator": "Saheeh International"}, {"text": "ٱللَّهُ لَآ إِلَٰهَ إِلَّا هُوَۚ وَعَلَى ٱللَّهِ فَلۡيَتَوَكَّلِ ٱلۡمُؤۡمِنُونَ", "surah": "سورة التغابن", "ayah": 13, "english": "Allah - there is no deity except Him. And upon Allah let the believers rely.", "surah_en": "At-Taghaabun", "translator": "Saheeh International"}, {"text": "إِن تُقۡرِضُواْ ٱللَّهَ قَرۡضًا حَسَنٗا يُضَٰعِفۡهُ لَكُمۡ وَيَغۡفِرۡ لَكُمۡۚ وَٱللَّهُ شَكُورٌ حَلِيمٌ", "surah": "سورة التغابن", "ayah": 17, "english": "If you loan Allah a goodly loan, He will multiply it for you and forgive you. And Allah is Most Appreciative and Forbearing.", "surah_en": "At-Taghaabun", "translator": "Saheeh International"}, {"text": "لِيُنفِقۡ ذُو سَعَةٖ مِّن سَعَتِهِۦۖ وَمَن قُدِرَ عَلَيۡهِ رِزۡقُهُۥ فَلۡيُنفِقۡ مِمَّآ ءَاتَىٰهُ ٱللَّهُۚ لَا يُكَلِّفُ ٱللَّهُ نَفۡسًا إِلَّا مَآ ءَاتَىٰهَاۚ سَيَجۡعَلُ ٱللَّهُ بَعۡدَ عُسۡرٖ يُسۡرٗا", "surah": "سورة الطلاق", "ayah": 7, "english": "Let a man of wealth spend from his wealth, and he whose provision is restricted - let him spend from what Allah has given him. Allah does not charge a soul except [according to] what He has given it. Allah will bring about, after hardship, ease.", "surah_en": "At-Talaaq", "translator": "Saheeh International"}, {"text": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُواْ قُوٓاْ أَنفُسَكُمۡ وَأَهۡلِيكُمۡ نَارٗا وَقُودُهَا ٱلنَّاسُ وَٱلۡحِجَارَةُ عَلَيۡهَا مَلَٰٓئِكَةٌ غِلَاظٞ شِدَادٞ لَّا يَعۡصُونَ ٱللَّهَ مَآ أَمَرَهُمۡ وَيَفۡعَلُونَ مَا يُؤۡمَرُونَ", "surah": "سورة التحريم", "ayah": 6, "english": "O you who have believed, protect yourselves and your families from a Fire whose fuel is people and stones, over which are [appointed] angels, harsh and severe; they do not disobey Allah in what He commands them but do what they are commanded.", "surah_en": "At-Tahrim", "translator": "Saheeh International"}, {"text": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُواْ تُوبُوٓاْ إِلَى ٱللَّهِ تَوۡبَةٗ نَّصُوحًا عَسَىٰ رَبُّكُمۡ أَن يُكَفِّرَ عَنكُمۡ سَيِّـَٔاتِكُمۡ وَيُدۡخِلَكُمۡ جَنَّٰتٖ تَجۡرِي مِن تَحۡتِهَا ٱلۡأَنۡهَٰرُ يَوۡمَ لَا يُخۡزِي ٱللَّهُ ٱلنَّبِيَّ وَٱلَّذِينَ ءَامَنُواْ مَعَهُۥۖ نُورُهُمۡ يَسۡعَىٰ بَيۡنَ أَيۡدِيهِمۡ وَبِأَيۡمَٰنِهِمۡ يَقُولُونَ رَبَّنَآ أَتۡمِمۡ لَنَا نُورَنَا وَٱغۡفِرۡ لَنَآۖ إِنَّكَ عَلَىٰ كُلِّ شَيۡءٖ قَدِيرٞ", "surah": "سورة التحريم", "ayah": 8, "english": "O you who have believed, repent to Allah with sincere repentance. Perhaps your Lord will remove from you your misdeeds and admit you into gardens beneath which rivers flow [on] the Day when Allah will not disgrace the Prophet and those who believed with him. Their light will proceed before them and on their right; they will say, \"Our Lord, perfect for us our light and forgive us. Indeed, You are over all things competent.\"", "surah_en": "At-Tahrim", "translator": "Saheeh International"}, {"text": "إِنَّ ٱلَّذِينَ يَخۡشَوۡنَ رَبَّهُم بِٱلۡغَيۡبِ لَهُم مَّغۡفِرَةٞ وَأَجۡرٞ كَبِيرٞ", "surah": "سورة الملك", "ayah": 12, "english": "Indeed, those who fear their Lord unseen will have forgiveness and great reward.", "surah_en": "Al-Mulk", "translator": "Saheeh International"}, {"text": "وَٱصۡبِرۡ عَلَىٰ مَا يَقُولُونَ وَٱهۡجُرۡهُمۡ هَجۡرٗا جَمِيلٗا", "surah": "سورة المزمل", "ayah": 10, "english": "And be patient over what they say and avoid them with gracious avoidance.", "surah_en": "Al-Muzzammil", "translator": "Saheeh International"}, {"text": "وَلِرَبِّكَ فَٱصۡبِرۡ", "surah": "سورة المدثر", "ayah": 7, "english": "But for your Lord be patient.", "surah_en": "Al-Muddaththir", "translator": "Saheeh International"}, {"text": "وَٱذۡكُرِ ٱسۡمَ رَبِّكَ بُكۡرَةٗ وَأَصِيلٗا", "surah": "سورة الإنسان", "ayah": 25, "english": "And mention the name of your Lord [in prayer] morning and evening", "surah_en": "Al-Insaan", "translator": "Saheeh International"}, {"text": "يَٰٓأَيُّهَا ٱلۡإِنسَٰنُ مَا غَرَّكَ بِرَبِّكَ ٱلۡكَرِيمِ", "surah": "سورة الانفطار", "ayah": 6, "english": "O mankind, what has deceived you concerning your Lord, the Generous,", "surah_en": "Al-Infitaar", "translator": "Saheeh International"}, {"text": "وَهُوَ ٱلۡغَفُورُ ٱلۡوَدُودُ", "surah": "سورة البروج", "ayah": 14, "english": "And He is the Forgiving, the Affectionate,", "surah_en": "Al-Burooj", "translator": "Saheeh International"}, {"text": "وَبَشِّرِ ٱلَّذِينَ ءَامَنُواْ وَعَمِلُواْ ٱلصَّٰلِحَٰتِ أَنَّ لَهُمۡ جَنَّٰتٖ تَجۡرِي مِن تَحۡتِهَا ٱلۡأَنۡهَٰرُۖ كُلَّمَا رُزِقُواْ مِنۡهَا مِن ثَمَرَةٖ رِّزۡقٗا قَالُواْ هَٰذَا ٱلَّذِي رُزِقۡنَا مِن قَبۡلُۖ وَأُتُواْ بِهِۦ مُتَشَٰبِهٗاۖ وَلَهُمۡ فِيهَآ أَزۡوَٰجٞ مُّطَهَّرَةٞۖ وَهُمۡ فِيهَا خَٰلِدُونَ", "surah": "سورة البقرة", "ayah": 25, "english": "And give good tidings to those who believe and do righteous deeds that they will have gardens [in Paradise] beneath which rivers flow. Whenever they are provided with a provision of fruit therefrom, they will say, \"This is what we were provided with before.\" And it is given to them in likeness. And they will have therein purified spouses, and they will abide therein eternally.", "surah_en": "Al-Baqara", "translator": "Saheeh International"}, {"text": "قُولُوٓاْ ءَامَنَّا بِٱللَّهِ وَمَآ أُنزِلَ إِلَيۡنَا وَمَآ أُنزِلَ إِلَىٰٓ إِبۡرَٰهِـۧمَ وَإِسۡمَٰعِيلَ وَإِسۡحَٰقَ وَيَعۡقُوبَ وَٱلۡأَسۡبَاطِ وَمَآ أُوتِيَ مُوسَىٰ وَعِيسَىٰ وَمَآ أُوتِيَ ٱلنَّبِيُّونَ مِن رَّبِّهِمۡ لَا نُفَرِّقُ بَيۡنَ أَحَدٖ مِّنۡهُمۡ وَنَحۡنُ لَهُۥ مُسۡلِمُونَ", "surah": "سورة البقرة", "ayah": 136, "english": "Say, [O believers], \"We have believed in Allah and what has been revealed to us and what has been revealed to Abraham and Ishmael and Isaac and Jacob and the Descendants and what was given to Moses and Jesus and what was given to the prophets from their Lord. We make no distinction between any of them, and we are Muslims [in submission] to Him.\"", "surah_en": "Al-Baqara", "translator": "Saheeh International"}, {"text": "إِنَّ فِي خَلۡقِ ٱلسَّمَٰوَٰتِ وَٱلۡأَرۡضِ وَٱخۡتِلَٰفِ ٱلَّيۡلِ وَٱلنَّهَارِ وَٱلۡفُلۡكِ ٱلَّتِي تَجۡرِي فِي ٱلۡبَحۡرِ بِمَا يَنفَعُ ٱلنَّاسَ وَمَآ أَنزَلَ ٱللَّهُ مِنَ ٱلسَّمَآءِ مِن مَّآءٖ فَأَحۡيَا بِهِ ٱلۡأَرۡضَ بَعۡدَ مَوۡتِهَا وَبَثَّ فِيهَا مِن كُلِّ دَآبَّةٖ وَتَصۡرِيفِ ٱلرِّيَٰحِ وَٱلسَّحَابِ ٱلۡمُسَخَّرِ بَيۡنَ ٱلسَّمَآءِ وَٱلۡأَرۡضِ لَأٓيَٰتٖ لِّقَوۡمٖ يَعۡقِلُونَ", "surah": "سورة البقرة", "ayah": 164, "english": "Indeed, in the creation of the heavens and earth, and the alternation of the night and the day, and the [great] ships which sail through the sea with that which benefits people, and what Allah has sent down from the heavens of rain, giving life thereby to the earth after its lifelessness and dispersing therein every [kind of] moving creature, and [His] directing of the winds and the clouds controlled between the heaven and the earth are signs for a people who use reason.", "surah_en": "Al-Baqara", "translator": "Saheeh International"}, {"text": "شَهۡرُ رَمَضَانَ ٱلَّذِيٓ أُنزِلَ فِيهِ ٱلۡقُرۡءَانُ هُدٗى لِّلنَّاسِ وَبَيِّنَٰتٖ مِّنَ ٱلۡهُدَىٰ وَٱلۡفُرۡقَانِۚ فَمَن شَهِدَ مِنكُمُ ٱلشَّهۡرَ فَلۡيَصُمۡهُۖ وَمَن كَانَ مَرِيضًا أَوۡ عَلَىٰ سَفَرٖ فَعِدَّةٞ مِّنۡ أَيَّامٍ أُخَرَۗ يُرِيدُ ٱللَّهُ بِكُمُ ٱلۡيُسۡرَ وَلَا يُرِيدُ بِكُمُ ٱلۡعُسۡرَ وَلِتُكۡمِلُواْ ٱلۡعِدَّةَ وَلِتُكَبِّرُواْ ٱللَّهَ عَلَىٰ مَا هَدَىٰكُمۡ وَلَعَلَّكُمۡ تَشۡكُرُونَ", "surah": "سورة البقرة", "ayah": 185, "english": "The month of Ramadhan [is that] in which was revealed the Qur'an, a guidance for the people and clear proofs of guidance and criterion. So whoever sights [the new moon of] the month, let him fast it; and whoever is ill or on a journey - then an equal number of other days. Allah intends for you ease and does not intend for you hardship and [wants] for you to complete the period and to glorify Allah for that [to] which He has guided you; and perhaps you will be grateful.", "surah_en": "Al-Baqara", "translator": "Saheeh International"}, {"text": "وَمَثَلُ ٱلَّذِينَ يُنفِقُونَ أَمۡوَٰلَهُمُ ٱبۡتِغَآءَ مَرۡضَاتِ ٱللَّهِ وَتَثۡبِيتٗا مِّنۡ أَنفُسِهِمۡ كَمَثَلِ جَنَّةِۭ بِرَبۡوَةٍ أَصَابَهَا وَابِلٞ فَـَٔاتَتۡ أُكُلَهَا ضِعۡفَيۡنِ فَإِن لَّمۡ يُصِبۡهَا وَابِلٞ فَطَلّٞۗ وَٱللَّهُ بِمَا تَعۡمَلُونَ بَصِيرٌ", "surah": "سورة البقرة", "ayah": 265, "english": "And the example of those who spend their wealth seeking means to the approval of Allah and assuring [reward for] themselves is like a garden on high ground which is hit by a downpour - so it yields its fruits in double. And [even] if it is not hit by a downpour, then a drizzle [is sufficient]. And Allah, of what you do, is Seeing.", "surah_en": "Al-Baqara", "translator": "Saheeh International"}, {"text": "ءَامَنَ ٱلرَّسُولُ بِمَآ أُنزِلَ إِلَيۡهِ مِن رَّبِّهِۦ وَٱلۡمُؤۡمِنُونَۚ كُلٌّ ءَامَنَ بِٱللَّهِ وَمَلَٰٓئِكَتِهِۦ وَكُتُبِهِۦ وَرُسُلِهِۦ لَا نُفَرِّقُ بَيۡنَ أَحَدٖ مِّن رُّسُلِهِۦۚ وَقَالُواْ سَمِعۡنَا وَأَطَعۡنَاۖ غُفۡرَانَكَ رَبَّنَا وَإِلَيۡكَ ٱلۡمَصِيرُ", "surah": "سورة البقرة", "ayah": 285, "english": "The Messenger has believed in what was revealed to him from his Lord, and [so have] the believers. All of them have believed in Allah and His angels and His books and His messengers, [saying], \"We make no distinction between any of His messengers.\" And they say, \"We hear and we obey. [We seek] Your forgiveness, our Lord, and to You is the [final] destination.\"", "surah_en": "Al-Baqara", "translator": "Saheeh International"}, {"text": "إِنَّمَا ٱلتَّوۡبَةُ عَلَى ٱللَّهِ لِلَّذِينَ يَعۡمَلُونَ ٱلسُّوٓءَ بِجَهَٰلَةٖ ثُمَّ يَتُوبُونَ مِن قَرِيبٖ فَأُوْلَٰٓئِكَ يَتُوبُ ٱللَّهُ عَلَيۡهِمۡۗ وَكَانَ ٱللَّهُ عَلِيمًا حَكِيمٗا", "surah": "سورة النساء", "ayah": 17, "english": "The repentance accepted by Allah is only for those who do wrong in ignorance [or carelessness] and then repent soon after. It is those to whom Allah will turn in forgiveness, and Allah is ever Knowing and Wise.", "surah_en": "An-Nisaa", "translator": "Saheeh International"}, {"text": "مَّآ أَصَابَكَ مِنۡ حَسَنَةٖ فَمِنَ ٱللَّهِۖ وَمَآ أَصَابَكَ مِن سَيِّئَةٖ فَمِن نَّفۡسِكَۚ وَأَرۡسَلۡنَٰكَ لِلنَّاسِ رَسُولٗاۚ وَكَفَىٰ بِٱللَّهِ شَهِيدٗا", "surah": "سورة النساء", "ayah": 79, "english": "What comes to you of good is from Allah, but what comes to you of evil, [O man], is from yourself. And We have sent you, [O Muhammad], to the people as a messenger, and sufficient is Allah as Witness.", "surah_en": "An-Nisaa", "translator": "Saheeh International"}, {"text": "لَّيۡسَ بِأَمَانِيِّكُمۡ وَلَآ أَمَانِيِّ أَهۡلِ ٱلۡكِتَٰبِۗ مَن يَعۡمَلۡ سُوٓءٗا يُجۡزَ بِهِۦ وَلَا يَجِدۡ لَهُۥ مِن دُونِ ٱللَّهِ وَلِيّٗا وَلَا نَصِيرٗا", "surah": "سورة النساء", "ayah": 123, "english": "Paradise is not [obtained] by your wishful thinking nor by that of the People of the Scripture. Whoever does a wrong will be recompensed for it, and he will not find besides Allah a protector or a helper.", "surah_en": "An-Nisaa", "translator": "Saheeh International"}, {"text": "ٱلۡحَمۡدُ لِلَّهِ ٱلَّذِي خَلَقَ ٱلسَّمَٰوَٰتِ وَٱلۡأَرۡضَ وَجَعَلَ ٱلظُّلُمَٰتِ وَٱلنُّورَۖ ثُمَّ ٱلَّذِينَ كَفَرُواْ بِرَبِّهِمۡ يَعۡدِلُونَ", "surah": "سورة الأنعام", "ayah": 1, "english": "[All] praise is [due] to Allah, who created the heavens and the earth and made the darkness and the light. Then those who disbelieve equate [others] with their Lord.", "surah_en": "Al-An'aam", "translator": "Saheeh International"}, {"text": "وَهُوَ ٱلۡقَاهِرُ فَوۡقَ عِبَادِهِۦۚ وَهُوَ ٱلۡحَكِيمُ ٱلۡخَبِيرُ", "surah": "سورة الأنعام", "ayah": 18, "english": "And He is the subjugator over His servants. And He is the Wise, the Acquainted [with all].", "surah_en": "Al-An'aam", "translator": "Saheeh International"}, {"text": "إِنَّ ٱللَّهَ فَالِقُ ٱلۡحَبِّ وَٱلنَّوَىٰۖ يُخۡرِجُ ٱلۡحَيَّ مِنَ ٱلۡمَيِّتِ وَمُخۡرِجُ ٱلۡمَيِّتِ مِنَ ٱلۡحَيِّۚ ذَٰلِكُمُ ٱللَّهُۖ فَأَنَّىٰ تُؤۡفَكُونَ", "surah": "سورة الأنعام", "ayah": 95, "english": "Indeed, Allah is the cleaver of grain and date seeds. He brings the living out of the dead and brings the dead out of the living. That is Allah; so how are you deluded?", "surah_en": "Al-An'aam", "translator": "Saheeh International"}, {"text": "وَتَمَّتۡ كَلِمَتُ رَبِّكَ صِدۡقٗا وَعَدۡلٗاۚ لَّا مُبَدِّلَ لِكَلِمَٰتِهِۦۚ وَهُوَ ٱلسَّمِيعُ ٱلۡعَلِيمُ", "surah": "سورة الأنعام", "ayah": 115, "english": "And the word of your Lord has been fulfilled in truth and in justice. None can alter His words, and He is the Hearing, the Knowing.", "surah_en": "Al-An'aam", "translator": "Saheeh International"}, {"text": "وَأَنَّ هَٰذَا صِرَٰطِي مُسۡتَقِيمٗا فَٱتَّبِعُوهُۖ وَلَا تَتَّبِعُواْ ٱلسُّبُلَ فَتَفَرَّقَ بِكُمۡ عَن سَبِيلِهِۦۚ ذَٰلِكُمۡ وَصَّىٰكُم بِهِۦ لَعَلَّكُمۡ تَتَّقُونَ", "surah": "سورة الأنعام", "ayah": 153, "english": "And, [moreover], this is My path, which is straight, so follow it; and do not follow [other] ways, for you will be separated from His way. This has He instructed you that you may become righteous.", "surah_en": "Al-An'aam", "translator": "Saheeh International"}, {"text": "وَلَقَدۡ مَكَّنَّٰكُمۡ فِي ٱلۡأَرۡضِ وَجَعَلۡنَا لَكُمۡ فِيهَا مَعَٰيِشَۗ قَلِيلٗا مَّا تَشۡكُرُونَ", "surah": "سورة الأعراف", "ayah": 10, "english": "And We have certainly established you upon the earth and made for you therein ways of livelihood. Little are you grateful.", "surah_en": "Al-A'raaf", "translator": "Saheeh International"}, {"text": "إِنَّ رَبَّكُمُ ٱللَّهُ ٱلَّذِي خَلَقَ ٱلسَّمَٰوَٰتِ وَٱلۡأَرۡضَ فِي سِتَّةِ أَيَّامٖ ثُمَّ ٱسۡتَوَىٰ عَلَى ٱلۡعَرۡشِۖ يُغۡشِي ٱلَّيۡلَ ٱلنَّهَارَ يَطۡلُبُهُۥ حَثِيثٗا وَٱلشَّمۡسَ وَٱلۡقَمَرَ وَٱلنُّجُومَ مُسَخَّرَٰتِۭ بِأَمۡرِهِۦٓۗ أَلَا لَهُ ٱلۡخَلۡقُ وَٱلۡأَمۡرُۗ تَبَارَكَ ٱللَّهُ رَبُّ ٱلۡعَٰلَمِينَ", "surah": "سورة الأعراف", "ayah": 54, "english": "Indeed, your Lord is Allah, who created the heavens and earth in six days and then established Himself above the Throne. He covers the night with the day, [another night] chasing it rapidly; and [He created] the sun, the moon, and the stars, subjected by His command. Unquestionably, His is the creation and the command; blessed is Allah, Lord of the worlds.", "surah_en": "Al-A'raaf", "translator": "Saheeh International"}, {"text": "وَهُوَ ٱلَّذِي يُرۡسِلُ ٱلرِّيَٰحَ بُشۡرَۢا بَيۡنَ يَدَيۡ رَحۡمَتِهِۦۖ حَتَّىٰٓ إِذَآ أَقَلَّتۡ سَحَابٗا ثِقَالٗا سُقۡنَٰهُ لِبَلَدٖ مَّيِّتٖ فَأَنزَلۡنَا بِهِ ٱلۡمَآءَ فَأَخۡرَجۡنَا بِهِۦ مِن كُلِّ ٱلثَّمَرَٰتِۚ كَذَٰلِكَ نُخۡرِجُ ٱلۡمَوۡتَىٰ لَعَلَّكُمۡ تَذَكَّرُونَ", "surah": "سورة الأعراف", "ayah": 57, "english": "And it is He who sends the winds as good tidings before His mercy until, when they have carried heavy rainclouds, We drive them to a dead land and We send down rain therein and bring forth thereby [some] of all the fruits. Thus will We bring forth the dead; perhaps you may be reminded.", "surah_en": "Al-A'raaf", "translator": "Saheeh International"}, {"text": "وَإِمَّا يَنزَغَنَّكَ مِنَ ٱلشَّيۡطَٰنِ نَزۡغٞ فَٱسۡتَعِذۡ بِٱللَّهِۚ إِنَّهُۥ سَمِيعٌ عَلِيمٌ", "surah": "سورة الأعراف", "ayah": 200, "english": "And if an evil suggestion comes to you from Satan, then seek refuge in Allah. Indeed, He is Hearing and Knowing.", "surah_en": "Al-A'raaf", "translator": "Saheeh International"}, {"text": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُواْ ٱسۡتَجِيبُواْ لِلَّهِ وَلِلرَّسُولِ إِذَا دَعَاكُمۡ لِمَا يُحۡيِيكُمۡۖ وَٱعۡلَمُوٓاْ أَنَّ ٱللَّهَ يَحُولُ بَيۡنَ ٱلۡمَرۡءِ وَقَلۡبِهِۦ وَأَنَّهُۥٓ إِلَيۡهِ تُحۡشَرُونَ", "surah": "سورة الأنفال", "ayah": 24, "english": "O you who have believed, respond to Allah and to the Messenger when he calls you to that which gives you life. And know that Allah intervenes between a man and his heart and that to Him you will be gathered.", "surah_en": "Al-Anfaal", "translator": "Saheeh International"}, {"text": "إِنَّمَا يَعۡمُرُ مَسَٰجِدَ ٱللَّهِ مَنۡ ءَامَنَ بِٱللَّهِ وَٱلۡيَوۡمِ ٱلۡأٓخِرِ وَأَقَامَ ٱلصَّلَوٰةَ وَءَاتَى ٱلزَّكَوٰةَ وَلَمۡ يَخۡشَ إِلَّا ٱللَّهَۖ فَعَسَىٰٓ أُوْلَٰٓئِكَ أَن يَكُونُواْ مِنَ ٱلۡمُهۡتَدِينَ", "surah": "سورة التوبة", "ayah": 18, "english": "The mosques of Allah are only to be maintained by those who believe in Allah and the Last Day and establish prayer and give zakah and do not fear except Allah, for it is expected that those will be of the [rightly] guided.", "surah_en": "At-Tawba", "translator": "Saheeh International"}, {"text": "هُوَ ٱلَّذِي جَعَلَ ٱلشَّمۡسَ ضِيَآءٗ وَٱلۡقَمَرَ نُورٗا وَقَدَّرَهُۥ مَنَازِلَ لِتَعۡلَمُواْ عَدَدَ ٱلسِّنِينَ وَٱلۡحِسَابَۚ مَا خَلَقَ ٱللَّهُ ذَٰلِكَ إِلَّا بِٱلۡحَقِّۚ يُفَصِّلُ ٱلۡأٓيَٰتِ لِقَوۡمٖ يَعۡلَمُونَ", "surah": "سورة يونس", "ayah": 5, "english": "It is He who made the sun a shining light and the moon a derived light and determined for it phases - that you may know the number of years and account [of time]. Allah has not created this except in truth. He details the signs for a people who know", "surah_en": "Yunus", "translator": "Saheeh International"}, {"text": "إِنَّ فِي ٱخۡتِلَٰفِ ٱلَّيۡلِ وَٱلنَّهَارِ وَمَا خَلَقَ ٱللَّهُ فِي ٱلسَّمَٰوَٰتِ وَٱلۡأَرۡضِ لَأٓيَٰتٖ لِّقَوۡمٖ يَتَّقُونَ", "surah": "سورة يونس", "ayah": 6, "english": "Indeed, in the alternation of the night and the day and [in] what Allah has created in the heavens and the earth are signs for a people who fear Allah", "surah_en": "Yunus", "translator": "Saheeh International"}, {"text": "وَإِذَا مَسَّ ٱلۡإِنسَٰنَ ٱلضُّرُّ دَعَانَا لِجَنۢبِهِۦٓ أَوۡ قَاعِدًا أَوۡ قَآئِمٗا فَلَمَّا كَشَفۡنَا عَنۡهُ ضُرَّهُۥ مَرَّ كَأَن لَّمۡ يَدۡعُنَآ إِلَىٰ ضُرّٖ مَّسَّهُۥۚ كَذَٰلِكَ زُيِّنَ لِلۡمُسۡرِفِينَ مَا كَانُواْ يَعۡمَلُونَ", "surah": "سورة يونس", "ayah": 12, "english": "And when affliction touches man, he calls upon Us, whether lying on his side or sitting or standing; but when We remove from him his affliction, he continues [in disobedience] as if he had never called upon Us to [remove] an affliction that touched him. Thus is made pleasing to the transgressors that which they have been doing", "surah_en": "Yunus", "translator": "Saheeh International"}, {"text": "وَلَا يَحۡزُنكَ قَوۡلُهُمۡۘ إِنَّ ٱلۡعِزَّةَ لِلَّهِ جَمِيعًاۚ هُوَ ٱلسَّمِيعُ ٱلۡعَلِيمُ", "surah": "سورة يونس", "ayah": 65, "english": "And let not their speech grieve you. Indeed, honor [due to power] belongs to Allah entirely. He is the Hearing, the Knowing.", "surah_en": "Yunus", "translator": "Saheeh International"}, {"text": "لَقَدۡ كَانَ فِي قَصَصِهِمۡ عِبۡرَةٞ لِّأُوْلِي ٱلۡأَلۡبَٰبِۗ مَا كَانَ حَدِيثٗا يُفۡتَرَىٰ وَلَٰكِن تَصۡدِيقَ ٱلَّذِي بَيۡنَ يَدَيۡهِ وَتَفۡصِيلَ كُلِّ شَيۡءٖ وَهُدٗى وَرَحۡمَةٗ لِّقَوۡمٖ يُؤۡمِنُونَ", "surah": "سورة يوسف", "ayah": 111, "english": "There was certainly in their stories a lesson for those of understanding. Never was the Qur'an a narration invented, but a confirmation of what was before it and a detailed explanation of all things and guidance and mercy for a people who believe.", "surah_en": "Yusuf", "translator": "Saheeh International"}, {"text": "ٱللَّهُ ٱلَّذِي رَفَعَ ٱلسَّمَٰوَٰتِ بِغَيۡرِ عَمَدٖ تَرَوۡنَهَاۖ ثُمَّ ٱسۡتَوَىٰ عَلَى ٱلۡعَرۡشِۖ وَسَخَّرَ ٱلشَّمۡسَ وَٱلۡقَمَرَۖ كُلّٞ يَجۡرِي لِأَجَلٖ مُّسَمّٗىۚ يُدَبِّرُ ٱلۡأَمۡرَ يُفَصِّلُ ٱلۡأٓيَٰتِ لَعَلَّكُم بِلِقَآءِ رَبِّكُمۡ تُوقِنُونَ", "surah": "سورة الرعد", "ayah": 2, "english": "It is Allah who erected the heavens without pillars that you [can] see; then He established Himself above the Throne and made subject the sun and the moon, each running [its course] for a specified term. He arranges [each] matter; He details the signs that you may, of the meeting with your Lord, be certain.", "surah_en": "Ar-Ra'd", "translator": "Saheeh International"}, {"text": "هُوَ ٱلَّذِيٓ أَنزَلَ مِنَ ٱلسَّمَآءِ مَآءٗۖ لَّكُم مِّنۡهُ شَرَابٞ وَمِنۡهُ شَجَرٞ فِيهِ تُسِيمُونَ", "surah": "سورة النحل", "ayah": 10, "english": "It is He who sends down rain from the sky; from it is drink and from it is foliage in which you pasture [animals].", "surah_en": "An-Nahl", "translator": "Saheeh International"}, {"text": "وَسَخَّرَ لَكُمُ ٱلَّيۡلَ وَٱلنَّهَارَ وَٱلشَّمۡسَ وَٱلۡقَمَرَۖ وَٱلنُّجُومُ مُسَخَّرَٰتُۢ بِأَمۡرِهِۦٓۚ إِنَّ فِي ذَٰلِكَ لَأٓيَٰتٖ لِّقَوۡمٖ يَعۡقِلُونَ", "surah": "سورة النحل", "ayah": 12, "english": "And He has subjected for you the night and day and the sun and moon, and the stars are subjected by His command. Indeed in that are signs for a people who reason.", "surah_en": "An-Nahl", "translator": "Saheeh International"}, {"text": "أَلَمۡ يَرَوۡاْ إِلَى ٱلطَّيۡرِ مُسَخَّرَٰتٖ فِي جَوِّ ٱلسَّمَآءِ مَا يُمۡسِكُهُنَّ إِلَّا ٱللَّهُۚ إِنَّ فِي ذَٰلِكَ لَأٓيَٰتٖ لِّقَوۡمٖ يُؤۡمِنُونَ", "surah": "سورة النحل", "ayah": 79, "english": "Do they not see the birds controlled in the atmosphere of the sky? None holds them up except Allah. Indeed in that are signs for a people who believe.", "surah_en": "An-Nahl", "translator": "Saheeh International"}, {"text": "وَجَعَلۡنَا ٱلَّيۡلَ وَٱلنَّهَارَ ءَايَتَيۡنِۖ فَمَحَوۡنَآ ءَايَةَ ٱلَّيۡلِ وَجَعَلۡنَآ ءَايَةَ ٱلنَّهَارِ مُبۡصِرَةٗ لِّتَبۡتَغُواْ فَضۡلٗا مِّن رَّبِّكُمۡ وَلِتَعۡلَمُواْ عَدَدَ ٱلسِّنِينَ وَٱلۡحِسَابَۚ وَكُلَّ شَيۡءٖ فَصَّلۡنَٰهُ تَفۡصِيلٗا", "surah": "سورة الإسراء", "ayah": 12, "english": "And We have made the night and day two signs, and We erased the sign of the night and made the sign of the day visible that you may seek bounty from your Lord and may know the number of years and the account [of time]. And everything We have set out in detail.", "surah_en": "Al-Israa", "translator": "Saheeh International"}, {"text": "وَيَسۡـَٔلُونَكَ عَنِ ٱلرُّوحِۖ قُلِ ٱلرُّوحُ مِنۡ أَمۡرِ رَبِّي وَمَآ أُوتِيتُم مِّنَ ٱلۡعِلۡمِ إِلَّا قَلِيلٗا", "surah": "سورة الإسراء", "ayah": 85, "english": "And they ask you, [O Muhammad], about the soul. Say, \"The soul is of the affair of my Lord. And mankind have not been given of knowledge except a little.\"", "surah_en": "Al-Israa", "translator": "Saheeh International"}, {"text": "وَٱضۡرِبۡ لَهُم مَّثَلَ ٱلۡحَيَوٰةِ ٱلدُّنۡيَا كَمَآءٍ أَنزَلۡنَٰهُ مِنَ ٱلسَّمَآءِ فَٱخۡتَلَطَ بِهِۦ نَبَاتُ ٱلۡأَرۡضِ فَأَصۡبَحَ هَشِيمٗا تَذۡرُوهُ ٱلرِّيَٰحُۗ وَكَانَ ٱللَّهُ عَلَىٰ كُلِّ شَيۡءٖ مُّقۡتَدِرًا", "surah": "سورة الكهف", "ayah": 45, "english": "And present to them the example of the life of this world, [its being] like rain which We send down from the sky, and the vegetation of the earth mingles with it and [then] it becomes dry remnants, scattered by the winds. And Allah is ever, over all things, Perfect in Ability.", "surah_en": "Al-Kahf", "translator": "Saheeh International"}, {"text": "وَوُضِعَ ٱلۡكِتَٰبُ فَتَرَى ٱلۡمُجۡرِمِينَ مُشۡفِقِينَ مِمَّا فِيهِ وَيَقُولُونَ يَٰوَيۡلَتَنَا مَالِ هَٰذَا ٱلۡكِتَٰبِ لَا يُغَادِرُ صَغِيرَةٗ وَلَا كَبِيرَةً إِلَّآ أَحۡصَىٰهَاۚ وَوَجَدُواْ مَا عَمِلُواْ حَاضِرٗاۗ وَلَا يَظۡلِمُ رَبُّكَ أَحَدٗا", "surah": "سورة الكهف", "ayah": 49, "english": "And the record [of deeds] will be placed [open], and you will see the criminals fearful of that within it, and they will say, \"Oh, woe to us! What is this book that leaves nothing small or great except that it has enumerated it?\" And they will find what they did present [before them]. And your Lord does injustice to no one.", "surah_en": "Al-Kahf", "translator": "Saheeh International"}, {"text": "لَهُۥ مَا فِي ٱلسَّمَٰوَٰتِ وَمَا فِي ٱلۡأَرۡضِ وَمَا بَيۡنَهُمَا وَمَا تَحۡتَ ٱلثَّرَىٰ", "surah": "سورة طه", "ayah": 6, "english": "To Him belongs what is in the heavens and what is on the earth and what is between them and what is under the soil.", "surah_en": "Taa-Haa", "translator": "Saheeh International"}, {"text": "وَإِن تَجۡهَرۡ بِٱلۡقَوۡلِ فَإِنَّهُۥ يَعۡلَمُ ٱلسِّرَّ وَأَخۡفَى", "surah": "سورة طه", "ayah": 7, "english": "And if you speak aloud - then indeed, He knows the secret and what is [even] more hidden.", "surah_en": "Taa-Haa", "translator": "Saheeh International"}, {"text": "وَمَن يَعۡمَلۡ مِنَ ٱلصَّٰلِحَٰتِ وَهُوَ مُؤۡمِنٞ فَلَا يَخَافُ ظُلۡمٗا وَلَا هَضۡمٗا", "surah": "سورة طه", "ayah": 112, "english": "But he who does of righteous deeds while he is a believer - he will neither fear injustice nor deprivation.", "surah_en": "Taa-Haa", "translator": "Saheeh International"}, {"text": "وَهُوَ ٱلَّذِي خَلَقَ ٱلَّيۡلَ وَٱلنَّهَارَ وَٱلشَّمۡسَ وَٱلۡقَمَرَۖ كُلّٞ فِي فَلَكٖ يَسۡبَحُونَ", "surah": "سورة الأنبياء", "ayah": 33, "english": "And it is He who created the night and the day and the sun and the moon; all [heavenly bodies] in an orbit are swimming.", "surah_en": "Al-Anbiyaa", "translator": "Saheeh International"}, {"text": "ذَٰلِكَۖ وَمَن يُعَظِّمۡ شَعَٰٓئِرَ ٱللَّهِ فَإِنَّهَا مِن تَقۡوَى ٱلۡقُلُوبِ", "surah": "سورة الحج", "ayah": 32, "english": "That [is so]. And whoever honors the symbols of Allah - indeed, it is from the piety of hearts.", "surah_en": "Al-Hajj", "translator": "Saheeh International"}, {"text": "أَلَمۡ تَرَ أَنَّ ٱللَّهَ سَخَّرَ لَكُم مَّا فِي ٱلۡأَرۡضِ وَٱلۡفُلۡكَ تَجۡرِي فِي ٱلۡبَحۡرِ بِأَمۡرِهِۦ وَيُمۡسِكُ ٱلسَّمَآءَ أَن تَقَعَ عَلَى ٱلۡأَرۡضِ إِلَّا بِإِذۡنِهِۦٓۚ إِنَّ ٱللَّهَ بِٱلنَّاسِ لَرَءُوفٞ رَّحِيمٞ", "surah": "سورة الحج", "ayah": 65, "english": "Do you not see that Allah has subjected to you whatever is on the earth and the ships which run through the sea by His command? And He restrains the sky from falling upon the earth, unless by His permission. Indeed Allah, to the people, is Kind and Merciful.", "surah_en": "Al-Hajj", "translator": "Saheeh International"}, {"text": "يَٰٓأَيُّهَا ٱلرُّسُلُ كُلُواْ مِنَ ٱلطَّيِّبَٰتِ وَٱعۡمَلُواْ صَٰلِحًاۖ إِنِّي بِمَا تَعۡمَلُونَ عَلِيمٞ", "surah": "سورة المؤمنون", "ayah": 51, "english": "[Allah said], \"O messengers, eat from the good foods and work righteousness. Indeed, I, of what you do, am Knowing.", "surah_en": "Al-Muminoon", "translator": "Saheeh International"}, {"text": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُواْ لَا تَدۡخُلُواْ بُيُوتًا غَيۡرَ بُيُوتِكُمۡ حَتَّىٰ تَسۡتَأۡنِسُواْ وَتُسَلِّمُواْ عَلَىٰٓ أَهۡلِهَاۚ ذَٰلِكُمۡ خَيۡرٞ لَّكُمۡ لَعَلَّكُمۡ تَذَكَّرُونَ", "surah": "سورة النور", "ayah": 27, "english": "O you who have believed, do not enter houses other than your own houses until you ascertain welcome and greet their inhabitants. That is best for you; perhaps you will be reminded.", "surah_en": "An-Noor", "translator": "Saheeh International"}, {"text": "قُل لِّلۡمُؤۡمِنِينَ يَغُضُّواْ مِنۡ أَبۡصَٰرِهِمۡ وَيَحۡفَظُواْ فُرُوجَهُمۡۚ ذَٰلِكَ أَزۡكَىٰ لَهُمۡۚ إِنَّ ٱللَّهَ خَبِيرُۢ بِمَا يَصۡنَعُونَ", "surah": "سورة النور", "ayah": 30, "english": "Tell the believing men to reduce [some] of their vision and guard their private parts. That is purer for them. Indeed, Allah is Acquainted with what they do.", "surah_en": "An-Noor", "translator": "Saheeh International"}, {"text": "وَٱلَّذِينَ يَقُولُونَ رَبَّنَا ٱصۡرِفۡ عَنَّا عَذَابَ جَهَنَّمَۖ إِنَّ عَذَابَهَا كَانَ غَرَامًا", "surah": "سورة الفرقان", "ayah": 65, "english": "And those who say, \"Our Lord, avert from us the punishment of Hell. Indeed, its punishment is ever adhering;", "surah_en": "Al-Furqaan", "translator": "Saheeh International"}, {"text": "وَٱلَّذِينَ إِذَآ أَنفَقُواْ لَمۡ يُسۡرِفُواْ وَلَمۡ يَقۡتُرُواْ وَكَانَ بَيۡنَ ذَٰلِكَ قَوَامٗا", "surah": "سورة الفرقان", "ayah": 67, "english": "And [they are] those who, when they spend, do so not excessively or sparingly but are ever, between that, [justly] moderate", "surah_en": "Al-Furqaan", "translator": "Saheeh International"}, {"text": "وَتَرَى ٱلۡجِبَالَ تَحۡسَبُهَا جَامِدَةٗ وَهِيَ تَمُرُّ مَرَّ ٱلسَّحَابِۚ صُنۡعَ ٱللَّهِ ٱلَّذِيٓ أَتۡقَنَ كُلَّ شَيۡءٍۚ إِنَّهُۥ خَبِيرُۢ بِمَا تَفۡعَلُونَ", "surah": "سورة النمل", "ayah": 88, "english": "And you see the mountains, thinking them rigid, while they will pass as the passing of clouds. [It is] the work of Allah, who perfected all things. Indeed, He is Acquainted with that which you do.", "surah_en": "An-Naml", "translator": "Saheeh International"}, {"text": "وَمِن رَّحۡمَتِهِۦ جَعَلَ لَكُمُ ٱلَّيۡلَ وَٱلنَّهَارَ لِتَسۡكُنُواْ فِيهِ وَلِتَبۡتَغُواْ مِن فَضۡلِهِۦ وَلَعَلَّكُمۡ تَشۡكُرُونَ", "surah": "سورة القصص", "ayah": 73, "english": "And out of His mercy He made for you the night and the day that you may rest therein and [by day] seek from His bounty and [that] perhaps you will be grateful.", "surah_en": "Al-Qasas", "translator": "Saheeh International"}, {"text": "مَن جَآءَ بِٱلۡحَسَنَةِ فَلَهُۥ خَيۡرٞ مِّنۡهَاۖ وَمَن جَآءَ بِٱلسَّيِّئَةِ فَلَا يُجۡزَى ٱلَّذِينَ عَمِلُواْ ٱلسَّيِّـَٔاتِ إِلَّا مَا كَانُواْ يَعۡمَلُونَ", "surah": "سورة القصص", "ayah": 84, "english": "Whoever comes [on the Day of Judgement] with a good deed will have better than it; and whoever comes with an evil deed - then those who did evil deeds will not be recompensed except [as much as] what they used to do.", "surah_en": "Al-Qasas", "translator": "Saheeh International"}, {"text": "وَوَصَّيۡنَا ٱلۡإِنسَٰنَ بِوَٰلِدَيۡهِ حُسۡنٗاۖ وَإِن جَٰهَدَاكَ لِتُشۡرِكَ بِي مَا لَيۡسَ لَكَ بِهِۦ عِلۡمٞ فَلَا تُطِعۡهُمَآۚ إِلَيَّ مَرۡجِعُكُمۡ فَأُنَبِّئُكُم بِمَا كُنتُمۡ تَعۡمَلُونَ", "surah": "سورة العنكبوت", "ayah": 8, "english": "And We have enjoined upon man goodness to parents. But if they endeavor to make you associate with Me that of which you have no knowledge, do not obey them. To Me is your return, and I will inform you about what you used to do.", "surah_en": "Al-Ankaboot", "translator": "Saheeh International"}, {"text": "ٱللَّهُ يَبۡسُطُ ٱلرِّزۡقَ لِمَن يَشَآءُ مِنۡ عِبَادِهِۦ وَيَقۡدِرُ لَهُۥٓۚ إِنَّ ٱللَّهَ بِكُلِّ شَيۡءٍ عَلِيمٞ", "surah": "سورة العنكبوت", "ayah": 62, "english": "Allah extends provision for whom He wills of His servants and restricts for him. Indeed Allah is, of all things, Knowing.", "surah_en": "Al-Ankaboot", "translator": "Saheeh International"}, {"text": "يُخۡرِجُ ٱلۡحَيَّ مِنَ ٱلۡمَيِّتِ وَيُخۡرِجُ ٱلۡمَيِّتَ مِنَ ٱلۡحَيِّ وَيُحۡيِ ٱلۡأَرۡضَ بَعۡدَ مَوۡتِهَاۚ وَكَذَٰلِكَ تُخۡرَجُونَ", "surah": "سورة الروم", "ayah": 19, "english": "He brings the living out of the dead and brings the dead out of the living and brings to life the earth after its lifelessness. And thus will you be brought out.", "surah_en": "Ar-Room", "translator": "Saheeh International"}, {"text": "وَمِنۡ ءَايَٰتِهِۦٓ أَنۡ خَلَقَكُم مِّن تُرَابٖ ثُمَّ إِذَآ أَنتُم بَشَرٞ تَنتَشِرُونَ", "surah": "سورة الروم", "ayah": 20, "english": "And of His signs is that He created you from dust; then, suddenly you were human beings dispersing [throughout the earth].", "surah_en": "Ar-Room", "translator": "Saheeh International"}, {"text": "وَمِنۡ ءَايَٰتِهِۦ مَنَامُكُم بِٱلَّيۡلِ وَٱلنَّهَارِ وَٱبۡتِغَآؤُكُم مِّن فَضۡلِهِۦٓۚ إِنَّ فِي ذَٰلِكَ لَأٓيَٰتٖ لِّقَوۡمٖ يَسۡمَعُونَ", "surah": "سورة الروم", "ayah": 23, "english": "And of His signs is your sleep by night and day and your seeking of His bounty. Indeed in that are signs for a people who listen.", "surah_en": "Ar-Room", "translator": "Saheeh International"}, {"text": "وَمِنۡ ءَايَٰتِهِۦ يُرِيكُمُ ٱلۡبَرۡقَ خَوۡفٗا وَطَمَعٗا وَيُنَزِّلُ مِنَ ٱلسَّمَآءِ مَآءٗ فَيُحۡيِۦ بِهِ ٱلۡأَرۡضَ بَعۡدَ مَوۡتِهَآۚ إِنَّ فِي ذَٰلِكَ لَأٓيَٰتٖ لِّقَوۡمٖ يَعۡقِلُونَ", "surah": "سورة الروم", "ayah": 24, "english": "And of His signs is [that] He shows you the lightning [causing] fear and aspiration, and He sends down rain from the sky by which He brings to life the earth after its lifelessness. Indeed in that are signs for a people who use reason.", "surah_en": "Ar-Room", "translator": "Saheeh International"}, {"text": "يَٰبُنَيَّ إِنَّهَآ إِن تَكُ مِثۡقَالَ حَبَّةٖ مِّنۡ خَرۡدَلٖ فَتَكُن فِي صَخۡرَةٍ أَوۡ فِي ٱلسَّمَٰوَٰتِ أَوۡ فِي ٱلۡأَرۡضِ يَأۡتِ بِهَا ٱللَّهُۚ إِنَّ ٱللَّهَ لَطِيفٌ خَبِيرٞ", "surah": "سورة لقمان", "ayah": 16, "english": "[And Luqman said], \"O my son, indeed if wrong should be the weight of a mustard seed and should be within a rock or [anywhere] in the heavens or in the earth, Allah will bring it forth. Indeed, Allah is Subtle and Acquainted.", "surah_en": "Luqman", "translator": "Saheeh International"}, {"text": "إِنَّ ٱللَّهَ يُمۡسِكُ ٱلسَّمَٰوَٰتِ وَٱلۡأَرۡضَ أَن تَزُولَاۚ وَلَئِن زَالَتَآ إِنۡ أَمۡسَكَهُمَا مِنۡ أَحَدٖ مِّنۢ بَعۡدِهِۦٓۚ إِنَّهُۥ كَانَ حَلِيمًا غَفُورٗا", "surah": "سورة فاطر", "ayah": 41, "english": "Indeed, Allah holds the heavens and the earth, lest they cease. And if they should cease, no one could hold them [in place] after Him. Indeed, He is Forbearing and Forgiving.", "surah_en": "Faatir", "translator": "Saheeh International"}, {"text": "لَا ٱلشَّمۡسُ يَنۢبَغِي لَهَآ أَن تُدۡرِكَ ٱلۡقَمَرَ وَلَا ٱلَّيۡلُ سَابِقُ ٱلنَّهَارِۚ وَكُلّٞ فِي فَلَكٖ يَسۡبَحُونَ", "surah": "سورة يس", "ayah": 40, "english": "It is not allowable for the sun to reach the moon, nor does the night overtake the day, but each, in an orbit, is swimming.", "surah_en": "Yaseen", "translator": "Saheeh International"}, {"text": "ٱللَّهُ خَٰلِقُ كُلِّ شَيۡءٖۖ وَهُوَ عَلَىٰ كُلِّ شَيۡءٖ وَكِيلٞ", "surah": "سورة الزمر", "ayah": 62, "english": "Allah is the Creator of all things, and He is, over all things, Disposer of affairs.", "surah_en": "Az-Zumar", "translator": "Saheeh International"}, {"text": "لَهُۥ مَقَالِيدُ ٱلسَّمَٰوَٰتِ وَٱلۡأَرۡضِۖ يَبۡسُطُ ٱلرِّزۡقَ لِمَن يَشَآءُ وَيَقۡدِرُۚ إِنَّهُۥ بِكُلِّ شَيۡءٍ عَلِيمٞ", "surah": "سورة الشورى", "ayah": 12, "english": "To Him belong the keys of the heavens and the earth. He extends provision for whom He wills and restricts [it]. Indeed He is, of all things, Knowing.", "surah_en": "Ash-Shura", "translator": "Saheeh International"}, {"text": "مَن كَانَ يُرِيدُ حَرۡثَ ٱلۡأٓخِرَةِ نَزِدۡ لَهُۥ فِي حَرۡثِهِۦۖ وَمَن كَانَ يُرِيدُ حَرۡثَ ٱلدُّنۡيَا نُؤۡتِهِۦ مِنۡهَا وَمَا لَهُۥ فِي ٱلۡأٓخِرَةِ مِن نَّصِيبٍ", "surah": "سورة الشورى", "ayah": 20, "english": "Whoever desires the harvest of the Hereafter - We increase for him in his harvest. And whoever desires the harvest of this world - We give him thereof, but there is not for him in the Hereafter any share.", "surah_en": "Ash-Shura", "translator": "Saheeh International"}, {"text": "وَٱلسَّمَآءَ بَنَيۡنَٰهَا بِأَيۡيْدٖ وَإِنَّا لَمُوسِعُونَ", "surah": "سورة الذاريات", "ayah": 47, "english": "And the heaven We constructed with strength, and indeed, We are [its] expander.", "surah_en": "Adh-Dhaariyat", "translator": "Saheeh International"}, {"text": "وَأَقِيمُواْ ٱلۡوَزۡنَ بِٱلۡقِسۡطِ وَلَا تُخۡسِرُواْ ٱلۡمِيزَانَ", "surah": "سورة الرحمن", "ayah": 9, "english": "And establish weight in justice and do not make deficient the balance.", "surah_en": "Ar-Rahmaan", "translator": "Saheeh International"}, {"text": "هُوَ ٱلَّذِي يُنَزِّلُ عَلَىٰ عَبۡدِهِۦٓ ءَايَٰتِۭ بَيِّنَٰتٖ لِّيُخۡرِجَكُم مِّنَ ٱلظُّلُمَٰتِ إِلَى ٱلنُّورِۚ وَإِنَّ ٱللَّهَ بِكُمۡ لَرَءُوفٞ رَّحِيمٞ", "surah": "سورة الحديد", "ayah": 9, "english": "It is He who sends down upon His Servant [Muhammad] verses of clear evidence that He may bring you out from darknesses into the light. And indeed, Allah is to you Kind and Merciful.", "surah_en": "Al-Hadid", "translator": "Saheeh International"}, {"text": "لَّا يَنۡهَىٰكُمُ ٱللَّهُ عَنِ ٱلَّذِينَ لَمۡ يُقَٰتِلُوكُمۡ فِي ٱلدِّينِ وَلَمۡ يُخۡرِجُوكُم مِّن دِيَٰرِكُمۡ أَن تَبَرُّوهُمۡ وَتُقۡسِطُوٓاْ إِلَيۡهِمۡۚ إِنَّ ٱللَّهَ يُحِبُّ ٱلۡمُقۡسِطِينَ", "surah": "سورة الممتحنة", "ayah": 8, "english": "Allah does not forbid you from those who do not fight you because of religion and do not expel you from your homes - from being righteous toward them and acting justly toward them. Indeed, Allah loves those who act justly.", "surah_en": "Al-Mumtahana", "translator": "Saheeh International"}, {"text": "أَوَلَمۡ يَرَوۡاْ إِلَى ٱلطَّيۡرِ فَوۡقَهُمۡ صَٰٓفَّٰتٖ وَيَقۡبِضۡنَۚ مَا يُمۡسِكُهُنَّ إِلَّا ٱلرَّحۡمَٰنُۚ إِنَّهُۥ بِكُلِّ شَيۡءِۭ بَصِيرٌ", "surah": "سورة الملك", "ayah": 19, "english": "Do they not see the birds above them with wings outspread and [sometimes] folded in? None holds them [aloft] except the Most Merciful. Indeed He is, of all things, Seeing.", "surah_en": "Al-Mulk", "translator": "Saheeh International"}];   // assets/shared/verses.json

e Last Day should talk what is good or keep quiet. (i.e. abstain from all kinds of evil and dirty talk)", "source_en": "Sahih al-Bukhari · 6018"}, {"parts": [["n", "عن تَمِيمٍ الدَّارِيِّ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "إِنَّ الدِّينَ النَّصِيحَةُ إِنَّ الدِّينَ النَّصِيحَةُ إِنَّ الدِّينَ النَّصِيحَةُ"], ["n", "قَالُوا لِمَنْ يَا رَسُولَ اللَّهِ قَالَ"], ["q", "لِلَّهِ وَكِتَابِهِ وَرَسُولِهِ وَأَئِمَّةِ الْمُؤْمِنِينَ وَعَامَّتِهِمْ وَأَئِمَّةِ الْمُسْلِمِينَ وَعَامَّتِهِمْ"]], "source": "سنن أبي داود · ٤٩٤٤ · صحيح عند الألباني", "english": "Tamim al-Dari reported the Prophet (May peace be upon him) as saying; Religion conduct; religion consists in sincere conduct. The people asked; to whom should it be directed, Messenger of Allah? He replied :To Allah, his book, his Apostle, the leaders (public authorities) of the believers and all the believers, and the leaders (public authorities) of Muslim and the Muslims and the Muslims in general", "source_en": "Sunan Abi Dawud · 4944"}, {"parts": [["n", "عن عَبْدَ اللَّهِ بْنَ عَمْرٍو، يَقُولُ قَالَ النَّبِيُّ ﷺ"], ["q", "الْمُسْلِمُ مَنْ سَلِمَ الْمُسْلِمُونَ مِنْ لِسَانِهِ وَيَدِهِ، وَالْمُهَاجِرُ مَنْ هَجَرَ مَا نَهَى اللَّهُ عَنْهُ"]], "source": "صحيح البخاري · ٦٤٨٤", "english": "Narrated `Abdullah bin `Amr:The Prophet (ﷺ) said, \"A Muslim is the one who avoids harming Muslims with his tongue or his hands. And a Muhajir (an emigrant) is the one who gives up (abandons) all what Allah has forbidden", "source_en": "Sahih al-Bukhari · 6484"}, {"parts": [["n", "عن عُثْمَانَ رضى الله عنه عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "خَيْرُكُمْ مَنْ تَعَلَّمَ الْقُرْآنَ وَعَلَّمَهُ"]], "source": "صحيح البخاري · ٥٠٢٧", "english": "Narrated `Uthman:The Prophet (ﷺ) said, \"The best among you (Muslims) are those who learn the Qur'an and teach it", "source_en": "Sahih al-Bukhari · 5027"}, {"parts": [["n", "عن أَبِي مَالِكٍ الأَشْعَرِيِّ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "الطُّهُورُ شَطْرُ الإِيمَانِ وَالْحَمْدُ لِلَّهِ تَمْلأُ rcy by Ar-Rahman. Be merciful on the earth, and you will be shown mercy from Who is above the heavens. The womb is named after Ar-Rahman, so whoever connects it, Allah connects him, and whoever severs it, Allah severs him", "source_en": "Jami at-Tirmidhi · 1924"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ رضى الله عنه أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "لَيْسَ الشَّدِيدُ بِالصُّرَعَةِ، إِنَّمَا الشَّدِيدُ الَّذِي يَمْلِكُ نَفْسَهُ عِنْدَ الْغَضَبِ"]], "source": "صحيح البخاري · ٦١١٤", "english": "Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"The strong is not the one who overcomes the people by his strength, but the strong is the one who controls himself while in anger", "source_en": "Sahih al-Bukhari · 6114"}, {"parts": [["n", "عن جَرِيرَ بْنَ عَبْدِ اللَّهِ، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "مَنْ لاَ يَرْحَمُ لاَ يُرْحَمُ"]], "source": "صحيح البخاري · ٦٠١٣", "english": "Narrated Jarir bin `Abdullah:The Prophet (ﷺ) said, \"He who is not merciful to others, will not be treated mercifully", "source_en": "Sahih al-Bukhari · 6013"}, {"parts": [["n", "عن جَابِرِ بْنِ عَبْدِ اللَّهِ رضى الله عنهما عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "كُلُّ مَعْرُوفٍ صَدَقَةٌ"]], "source": "صحيح البخاري · ٦٠٢١", "english": "Narrated Jabir bin `Abdullah:The Prophet (ﷺ) said, Enjoining, all that is good is a Sadaqa", "source_en": "Sahih al-Bukhari · 6021"}, {"parts": [["n", "عن النُّعْمَانِ بْنِ بَشِيرٍ، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "الدُّعَاءُ هُوَ الْعِبَادَةُ ﴿ قَالَ رَبُّكُمُ ادْعُونِي أَسْتَجِبْ لَكُمْ ﴾"]], "source": "سنن أبي داود · ١٤٧٩ · صحيح عند الألباني", "english": "Narrated An-Nu'man ibn Bashir: The Prophet (ﷺ) said: Supplication (du'a') is itself the worship. (He then recited:) \"And your Lord said: Call on Me, I will answer you\" (xI)", "source_en": "Sunan Abi Dawud · 1479"}, {"parts": [["n", "عن عَائِشَةَ رضى الله عنها قَالَتِ اسْتَأْذَنَ رَهْطٌ مِنَ الْيَهُودِ عَلَى النَّبِيِّ ﷺ فَقَالُوا السَّامُ عَلَيْكَ. فَقُلْتُ بَلْ عَلَيْكُمُ السَّامُ وَاللَّعْنَةُ. فَقَالَ"], ["q", "يَا عَائِشَةُ إِنَّ اللَّهَ رَفِيقٌ يُحِبُّ الرِّفْقَ فِي الأَمْرِ كُلِّهِ"], ["n", "قُلْتُ أَوَلَمْ تَسْمَعْ مَا قَالُوا قَالَ"], ["q", "قُلْتُ وَعَلَيْكُمْ"]], "source": "صحيح البخاري · ٦٩٢٧", "english": "Narrated `Aisha:A group of Jews asked permission to visit the Prophet (and when they were admitted) they said, \"As- Samu 'Alaika (Death be upon you).\" I said (to them), \"But death and the curse of Allah be upon you!\" The Prophet (ﷺ) said, \"O `Aisha! Allah is kind and lenient and likes that one should be kind and lenient in all matters.\" I said, \"Haven't you heard what they said?\" He said, \"I said (to them), 'Wa 'Alaikum (and upon you)", "source_en": "Sahih al-Bukhari · 6927"}, {"parts": [["n", "عن سَالِمٍ، عَنْ أَبِيهِ، سَمِعَ النَّبِيُّ ﷺ رَجُلاً يَعِظُ أَخَاهُ فِي الْحَيَاءِ فَقَالَ"], ["q", "الْحَيَاءُ مِنَ الإِيمَانِ"]], "source": "صحيح مسلم · ٣٦"}, {"parts": [["n", "عن عِمْرَانَ بْنَ حُصَيْنٍ، قَالَ قَالَ النَّبِيُّ ﷺ"], ["q", "الْحَيَاءُ لاَ يَأْتِي إِلاَّ بِخَيْرٍ"]], "source": "صحيح البخاري · ٦١١٧", "english": "Narrated Abu As-Sawar Al-Adawi:`Imran bin Husain said: The Prophet (ﷺ) said, \"Haya' (pious shyness from committing religeous indiscretions) does not bring anything except good.\" Thereupon Bashir bin Ka`b said, 'It is written in the wisdom paper: Haya' leads to solemnity; Haya' leads to tranquility (peace of mind).\" `Imran said to him, \"I am narrating to you the saying of Allah's Messenger (ﷺ) and you are speaking about your paper (wisdom book)?", "source_en": "Sahih al-Bukhari · 6117"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "إِنَّ اللَّهَ لاَ يَنْظُرُ إِلَى صُوَرِكُمْ وَأَمْوَالِكُمْ وَلَكِنْ يَنْظُرُ إِلَى قُلُوبِكُمْ وَأَعْمَالِكُمْ"]], "source": "صحيح مسلم · ٢٥٦٤", "english": "Ibn 'Umar reported that the Messenger of Allah (ﷺ) observed fasts uninterruptedly in Ramadan and the people (in his wake) did this. But he forbade them to do so. It was said to him (to the Holy Prophet):You yourself observe the fasts uninterruptedly (but you forbid us to do so) Upon this he said: I am not like you; I am fed and supplied drink (by Allah)", "source_en": "Sahih Muslim · 2564"}, {"parts": [["n", "عن أَبِي ذَرٍّ، قَالَ قَالَ لِيَ النَّبِيُّ ﷺ"], ["q", "لاَ تَحْقِرَنَّ مِنَ الْمَعْرُوفِ شَيْئًا وَلَوْ أَنْ تَلْقَى أَخَاكَ بِوَجْهٍ طَلْقٍ"]], "source": "صحيح مسلم · ٢٦٢٦", "english": "A'isha (Allah be pleased with her) reported that Hamza b. Amr al-Aslami asked the Messenger of Allah (ﷺ) thus:Messenger of Allah, I am a person devoted much to fasting. Should I fast during the journey? He (the Holy Prophet) said: Fast if you like and break it if you like", "source_en": "Sahih Muslim · 2626"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، يَبْلُغُ بِهِ النَّبِيَّ ﷺ قَالَ"], ["q", "الْمُؤْمِنُ الْقَوِيُّ خَيْرٌ وَأَحَبُّ إِلَى اللَّهِ مِنَ الْمُؤْمِنِ الضَّعِيفِ وَفِي كُلٍّ خَيْرٌ احْرِصْ عَلَى مَا يَنْفَعُكَ وَلاَ تَعْجِزْ فَإِنْ غَلَبَكَ أَمْرٌ فَقُلْ قَدَّرَ اللَّهُ وَمَا شَاءَ فَعَلَ وَإِيَّاكَ وَاللَّوْ فَإِنَّ اللَّوْ تَفْتَحُ عَمَلَ الشَّيْطَانِ"]], "source": "سنن ابن ماجه · ٤١٦٨ · صحيح عند الألباني", "english": "It was narrated that Abu Hurairah said, attributing it to the Prophet (ﷺ):“The stronger believer is better and more beloved to Allah than the weak believer, although both are good. Strive to seek that which will benefit you and do not feel helpless. If something overwhelms you, then say: Qaddarallah, wa ma sha'a fa’al (It is the decree of Allah and what He wills He does). And beware of (saying) ‘If only,’ for ‘If only’ opens the door to Satan.”", "source_en": "Sunan Ibn Majah · 4168"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، عَنْ رَسُولِ اللَّهِ ﷺ قَالَ"], ["q", "مَا نَقَصَتْ صَدَقَةٌ مِنْ مَالٍ وَمَا زَادَ اللَّهُ عَبْدًا بِعَفْوٍ إِلاَّ عِزًّا وَمَا تَوَاضَعَ أَحَدٌ لِلَّهِ إِلاَّ رَفَعَهُ اللَّهُ"]], "source": "صحيح مسلم · ٢٥٨٨", "english": "Umar b Abu Salama reported that he asked the Messenger of Allah (ﷺ):Should one observing fast kiss (his wife)? The Messenger of Allah (ﷺ) said to him: Ask her (Umm Salama). She informed him that the Messenger of Allah (ﷺ) did that, where upon he said: Messenger of Allah, Allah pardoned thee all thy sins, the previous and the later ones. Upon this the Messenger of Allah (ﷺ) ) said: By Allah, I am the most God conscious among you and I fear Him most among you", "source_en": "Sahih Muslim · 2588"}, {"parts": [["n", "عن عَبْدُ اللَّهِ بْنُ عَمْرٍو إِنَّ رَسُولَ اللَّهِ ﷺ لَمْ يَكُنْ فَاحِشًا وَلاَ مُتَفَحِّشًا وَقَالَ"], ["q", "إِنَّ مِنْ أَحَبِّكُمْ إِلَىَّ أَحْسَنَكُمْ أَخْلاَقًا"], ["n", "وَقَالَ"], ["q", "اسْتَقْرِئُوا الْقُرْآنَ مِنْ أَرْبَعَةٍ مِنْ عَبْدِ اللَّهِ بْنِ مَسْعُودٍ، وَسَالِمٍ مَوْلَى أَبِي حُذَيْفَةَ، وَأُبَىِّ بْنِ كَعْبٍ، وَمُعَاذِ بْنِ جَبَلٍ"]], "source": "صحيح البخاري · ٣٧٥٩", "english": "Narrated `Abdullah bin `Amr:Allah's Messenger (ﷺ) neither talked in an insulting manner nor did he ever speak evil intentionally. He used to say, \"The most beloved to me amongst you is the one who has the best character and manners.\" He added, \" Learn the Qur'an from (any of these) four persons. `Abdullah bin Mas`ud, Salim the freed slave of Abu Hudhaifa, Ubai bin Ka`b, and Mu`adh bin Jabal", "source_en": "Sahih al-Bukhari · 3759"}, {"parts": [["n", "عن عَائِشَةَ، قَالَتْ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "خَيْرُكُمْ خَيْرُكُمْ لأَهْلِهِ وَأَنَا خَيْرُكُمْ لأَهْلِي وَإِذَا مَاتَ صَاحِبُكُمْ فَدَعُوهُ"]], "source": "جامع الترمذي · ٣٨٩٥ · حسن غريب", "english": "Narrated 'Aishah:that the Messenger of Allah (ﷺ) said: \"The best of you is the best to his wives, and I am the best of you to my wives, and when your companion dies, leave him alone", "source_en": "Jami at-Tirmidhi · 3895"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "أَكْمَلُ الْمُؤْمِنِينَ إِيمَانًا أَحْسَنُهُمْ خُلُقًا"]], "source": "سنن أبي داود · ٤٦٨٢ · حسن صحيح عند الألباني", "english": "Narrated AbuHurayrah: The Prophet (ﷺ) said: The most perfect believer in respect of faith is he who is best of them in manners", "source_en": "Sunan Abi Dawud · 4682"}, {"parts": [["n", "عن عَدِيَّ بْنَ حَاتِمٍ رضى الله عنه قَالَ سَمِعْتُ رَسُولَ اللَّهِ ﷺ يَقُولُ"], ["q", "اتَّقُوا النَّارَ وَلَوْ بِشِقِّ تَمْرَةٍ"]], "source": "صحيح البخاري · ١٤١٧", "english": "Narrated `Adi bin Hatim heard the Prophet (ﷺ) saying:\"Save yourself from Hell-fire even by giving half a date-fruit in charity", "source_en": "Sahih al-Bukhari · 1417"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "كَلِمَتَانِ خَفِيفَتَانِ عَلَى اللِّسَانِ، ثَقِيلَتَانِ فِي الْمِيزَانِ، حَبِيبَتَانِ إِلَى الرَّحْمَنِ سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، سُبْحَانَ اللَّهِ الْعَظِيمِ"]], "source": "صحيح البخاري · ٦٦٨٢", "english": "Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"(The following are) two words (sentences or utterances) that are very easy for the tongue to say, and very heavy in the balance (of reward), and most beloved to the Gracious Almighty (And they are): Subhan Allahi wa bi-hamdihi; Subhan Allahi-l-'Adhim", "source_en": "Sahih al-Bukhari · 6682"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "أَيُّهَا النَّاسُ إِنَّ اللَّهَ طَيِّبٌ لاَ يَقْبَلُ إِلاَّ طَيِّبًا وَإِنَّ اللَّهَ أَمَرَ الْمُؤْمِنِينَ بِمَا أَمَرَ بِهِ الْمُرْسَلِينَ فَقَالَ ﴿ يَا أَيُّهَا الرُّسُلُ كُلُوا مِنَ الطَّيِّبَاتِ وَاعْمَلُوا صَالِحًا إِنِّي بِمَا تَعْمَلُونَ عَلِيمٌ﴾ وَقَالَ ﴿ يَا أَيُّهَا الَّذِينَ آمَنُوا كُلُوا مِنْ طَيِّبَاتِ مَا رَزَقْنَاكُمْ﴾"]], "source": "صحيح مسلم · ١٠١٥", "english": "Abu Sa'id al-Khudri reported:The Apostle of Allah (ﷺ) used to recite in every rak'ah of the first two rak'ahs of the noon prayer about thirty verses and in the last two about fifteen verses or half (of the first rak'ah) and in every rak'ah of the 'Asr prayer of the first two rak'ahs about fifteen verses and in the last two verses half (of the first ones)", "source_en": "Sahih Muslim · 1015"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "الدُّنْيَا سِجْنُ الْمُؤْمِنِ وَجَنَّةُ الْكَافِرِ"]], "source": "صحيح مسلم · ٢٩٥٦", "english": "Jubair. b. Mut'im reported:I lost my camel and went in search of it on the day of 'Arafa, and I saw the Messenger of Allah (ﷺ) staying along with people in 'Ara'fit. Thereupon I said: By Allah, he is among the Hums (Quraish) ; what has happened to him that he has come to this (place)? The Quraish were counted among Hums", "source_en": "Sahih Muslim · 2956"}, {"parts": [["n", "عن شَدَّادِ بْنِ أَوْسٍ، قَالَ ثِنْتَانِ حَفِظْتُهُمَا عَنْ رَسُولِ اللَّهِ ﷺ قَالَ"], ["q", "إِنَّ اللَّهَ كَتَبَ الإِحْسَانَ عَلَى كُلِّ شَىْءٍ فَإِذَا قَتَلْتُمْ فَأَحْسِنُوا الْقِتْلَةَ وَإِذَا ذَبَحْتُمْ فَأَحْسِنُوا الذَّبْحَ وَلْيُحِدَّ أَحَدُكُمْ شَفْرَتَهُ فَلْيُرِحْ ذَبِيحَتَهُ"]], "source": "صحيح مسلم · ١٩٥٥", "english": "Abdullah (b. 'Umar) reported from his father that while he was addressing the people on Friday (sermon), a person, one of the Companions of the Messenger of Allah (ﷺ), entered (the mosque). Umar said to him loudly:What is this hour (for attending the prayer)? He said: I was busy today and I did not return to my house when I heard the call (to Friday prayer), and I did no more but performed ablution only. Upon this Umar said: just ablution! You know that the Messenger of Allah (ﷺ) commanded (us) to take a bath (on Friday)", "source_en": "Sahih Muslim · 1955"}, {"parts": [["n", "عن أَنَسَ بْنَ مَالِكٍ رضى الله عنه يَقُولُ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "انْصُرْ أَخَاكَ ظَالِمًا أَوْ مَظْلُومًا"]], "source": "صحيح البخاري · ٢٤٤٣", "english": "Narrated Anas bin Malik:Allah's Messenger (ﷺ) said, \"Help your brother, whether he is an oppressor or he is an oppressed one", "source_en": "Sahih al-Bukhari · 2443"}, {"parts": [["n", "عن أَبِي مُوسَى رضى الله عنه عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "الْمُؤْمِنُ لِلْمُؤْمِنِ كَالْبُنْيَانِ يَشُدُّ بَعْضُهُ بَعْضًا"]], "source": "صحيح البخاري · ٢٤٤٦", "english": "Narrated Abu Musa:The Prophet (ﷺ) said, \"A believer to another believer is like a building whose different parts enforce each other.\" The Prophet (ﷺ) then clasped his hands with the fingers interlaced (while saying that)", "source_en": "Sahih al-Bukhari · 2446"}, {"parts": [["n", "عن النُّعْمَانِ بْنِ بَشِيرٍ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "مَثَلُ الْمُؤْمِنِينَ فِي تَوَادِّهِمْ وَتَرَاحُمِهِمْ وَتَعَاطُفِهِمْ مَثَلُ الْجَسَدِ إِذَا اشْتَكَى مِنْهُ عُضْوٌ تَدَاعَى لَهُ سَائِرُ الْجَسَدِ بِالسَّهَرِ وَالْحُمَّى"]], "source": "صحيح مسلم · ٢٥٨٦", "english": "Hafsa (Allah be pleased with her) reported that the Messenger of Allah (ﷺ) kissed (his wives) while fasting", "source_en": "Sahih Muslim · 2586"}, {"parts": [["n", "عن جُبَيْرَ بْنَ مُطْعِمٍ أَنَّهُ، سَمِعَ النَّبِيَّ ﷺ يَقُولُ"], ["q", "لاَ يَدْخُلُ الْجَنَّةَ قَاطِعٌ"]], "source": "صحيح البخاري · ٥٩٨٤", "english": "Narrated Jubair bin Mut`im:That he heard the Prophet (ﷺ) saying, \"The person who severs the bond of kinship will not enter Paradise", "source_en": "Sahih al-Bukhari · 5984"}, {"parts": [["n", "عن أَنَسُ بْنُ مَالِكٍ، أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "مَنْ أَحَبَّ أَنْ يُبْسَطَ لَهُ فِي رِزْقِهِ، وَيُنْسَأَ لَهُ فِي أَثَرِهِ، فَلْيَصِلْ رَحِمَهُ"]], "source": "صحيح البخاري · ٥٩٨٦", "english": "Narrated Anas bin Malik:Allah's Apostle said, \"Whoever loves that he be granted more wealth and that his lease of life be prolonged then he should keep good relations with his Kith and kin", "source_en": "Sahih al-Bukhari · 5986"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "لاَ تَدْخُلُونَ الْجَنَّةَ حَتَّى تُؤْمِنُوا وَلاَ تُؤْمِنُوا حَتَّى تَحَابُّوا. أَوَلاَ أَدُلُّكُمْ عَلَى شَىْءٍ إِذَا فَعَلْتُمُوهُ تَحَابَبْتُمْ أَفْشُوا السَّلاَمَ بَيْنَكُمْ"]], "source": "صحيح مسلم · ٥٤"}, {"parts": [["n", "عن أَبِي بَكْرِ بْنِ أَبِي مُوسَى، عَنْ أَبِيهِ، أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "مَنْ صَلَّى الْبَرْدَيْنِ دَخَلَ الْجَنَّةَ"]], "source": "صحيح البخاري · ٥٧٤", "english": "Narrated Abu Bakr bin Abi Musa:My father said, \"Allah's Messenger (ﷺ) said, 'Whoever prays the two cool prayers (`Asr and Fajr) will go to Paradise", "source_en": "Sahih al-Bukhari · 574"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ رضى الله عنه أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "مَنْ قَالَ سُبْحَانَ اللَّهِ وَبِحَمْدِهِ. فِي يَوْمٍ مِائَةَ مَرَّةٍ حُطَّتْ خَطَايَاهُ، وَإِنْ كَانَتْ مِثْلَ زَبَدِ الْبَحْرِ"]], "source": "صحيح البخاري · ٦٤٠٥", "english": "Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"Whoever says, 'Subhan Allah wa bihamdihi,' one hundred times a day, will be forgiven all his sins even if they were as much as the foam of the sea", "source_en": "Sahih al-Bukhari · 6405"}, {"parts": [["n", "عن سَمُرَةَ بْنِ جُنْدَبٍ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "أَحَبُّ الْكَلاَمِ إِلَى اللَّهِ أَرْبَعٌ سُبْحَانَ اللَّهِ وَالْحَمْدُ لِلَّهِ وَلاَ إِلَهَ إِلاَّ اللَّهُ وَاللَّهُ أَكْبَرُ. لاَ يَضُرُّكَ بَأَيِّهِنَّ بَدَأْتَ. وَلاَ تُسَمِّيَنَّ غُلاَمَكَ يَسَارًا وَلاَ رَبَاحًا وَلاَ نَجِيحًا وَلاَ أَفْلَحَ فَإِنَّكَ تَقُولُ أَثَمَّ هُوَ فَلاَ يَكُونُ فَيَقُولُ لاَ"]], "source": "صحيح مسلم · ٢١٣٧", "english": "Abdullah b. 'Umar said that Sa'd b. Ubada complained of illness. The Messenger of Allah (ﷺ) came to visit him accompanied by 'Abd al-Rahman b. 'Auf, Sa'd b. Abi Waqqas and 'Abdullah b. Mas'ud. As he entered (his room) he found him in a swoon. Upon this he said:Has he died? They said: Messenger of Allah, it is not so. The Messenger of Allah (ﷺ) wept. When the people saw Allah's Messenger (ﷺ) weeping, they also began to weep. He said. Listen, Allah does not punish for the tears that the eye sheds or the grief the heart feels, but He punishes for this (pointing to his tongue), or He may show mercy", "source_en": "Sahih Muslim · 2137"}, {"parts": [["n", "عن عَبْدَ اللَّهِ بْنَ مَسْعُودٍ، يَقُولُ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "مَنْ قَرَأَ حَرْفًا مِنْ كِتَابِ اللَّهِ فَلَهُ بِهِ حَسَنَةٌ وَالْحَسَنَةُ بِعَشْرِ أَمْثَالِهَا لاَ أَقُولُ الم حَرْفٌ وَلَكِنْ أَلِفٌ حَرْفٌ وَلاَمٌ حَرْفٌ وَمِيمٌ حَرْفٌ"]], "source": "جامع الترمذي · ٢٩١٠ · حسن صحيح", "english": "Narrated Muhammad bin Ka'b Al-Qurazi:\"I heard 'Abdullah bin Mas'ud saying: 'The Messenger of Allah (ﷺ) said: \"[Whoever recites a letter] from Allah's Book, then he receives the reward from it, and the reward of ten the like of it. I do not say that Alif Lam Mim is a letter, but Alif is a letter, Lam is a letter and Mim is a letter", "source_en": "Jami at-Tirmidhi · 2910"}, {"parts": [["n", "عن مُعَاوِيَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "مَنْ يُرِدِ اللَّهُ بِهِ خَيْرًا يُفَقِّهْهُ فِي الدِّينِ، وَاللَّهُ الْمُعْطِي وَأَنَا الْقَاسِمُ، وَلاَ تَزَالُ هَذِهِ الأُمَّةُ ظَاهِرِينَ عَلَى مَنْ خَالَفَهُمْ حَتَّى يَأْتِيَ أَمْرُ اللَّهِ وَهُمْ ظَاهِرُونَ"]], "source": "صحيح البخاري · ٣١١٦", "english": "Narrated Muawiya:Allah's Messenger (ﷺ) said, \"If Allah wants to do good for somebody, he makes him comprehend the Religion (i.e. Islam), and Allah is the Giver and I am Al-Qasim (i.e. the distributor), and this (Muslim) nation will remain victorious over their opponents, till Allah's Order comes and they will still be victorious", "source_en": "Sahih al-Bukhari · 3116"}, {"parts": [["n", "عن عَبْدِ اللَّهِ بْنِ عَمْرٍو، أَنَّ النَّبِيَّ ﷺ قَالَ"], ["q", "بَلِّغُوا عَنِّي وَلَوْ آيَةً، وَحَدِّثُوا عَنْ بَنِي إِسْرَائِيلَ وَلاَ حَرَجَ، وَمَنْ كَذَبَ عَلَىَّ مُتَعَمِّدًا فَلْيَتَبَوَّأْ مَقْعَدَهُ مِنَ النَّارِ"]], "source": "صحيح البخاري · ٣٤٦١", "english": "Narrated `Abdullah bin `Amr:The Prophet (ﷺ) said, \"Convey (my teachings) to the people even if it were a single sentence, and tell others the stories of Bani Israel (which have been taught to you), for it is not sinful to do so. And whoever tells a lie on me intentionally, will surely take his place in the (Hell) Fire", "source_en": "Sahih al-Bukhari · 3461"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "لَيْسَ الْغِنَى عَنْ كَثْرَةِ الْعَرَضِ، وَلَكِنَّ الْغِنَى غِنَى النَّفْسِ"]], "source": "صحيح البخاري · ٦٤٤٦", "english": "Narrated Abu Huraira:The Prophet (ﷺ) said, \"Wealth is not in having many possessions, but rather (true) wealth is feeling sufficiency in the soul", "source_en": "Sahih al-Bukhari · 6446"}, {"parts": [["n", "عن صُهَيْبٍ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "عَجَبًا لأَمْرِ الْمُؤْمِنِ إِنَّ أَمْرَهُ كُلَّهُ خَيْرٌ وَلَيْسَ ذَاكَ لأَحَدٍ إِلاَّ لِلْمُؤْمِنِ إِنْ أَصَابَتْهُ سَرَّاءُ شَكَرَ فَكَانَ خَيْرًا لَهُ وَإِنْ أَصَابَتْهُ ضَرَّاءُ صَبَرَ فَكَانَ خَيْرًا لَهُ"]], "source": "صحيح مسلم · ٢٩٩٩", "english": "Amr b. Dinar said:We asked Ibn Umar about a person who came for Umra and circumambulated the House, but he did not run between al-Safa' and al-Marwa, whether he is allowed to (put off Ihram) and have intercourse with his wife. He replied: Allah's Messenger (ﷺ) circumambulated the House seven times and offered two rak'ahs of prayer after staying (at 'Arafat), and ran between al-Safa and al-Marwa seven times.\" Verily there is in Allah's Messenger a model pattern for you\" (xxxill)", "source_en": "Sahih Muslim · 2999"}, {"parts": [["n", "عن عَبْدِ اللَّهِ، عَنِ النَّبِيِّ ﷺ أَنَّهُ قَالَ"], ["q", "الْمَرْءُ مَعَ مَنْ أَحَبَّ"]], "source": "صحيح البخاري · ٦١٦٨", "english": "Narrated `Abdullah:The Prophet (ﷺ) said, \"Everyone will be with those whom he loves", "source_en": "Sahih al-Bukhari · 6168"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "إِنَّ الدِّينَ يُسْرٌ، وَلَنْ يُشَادَّ الدِّينَ أَحَدٌ إِلاَّ غَلَبَهُ، فَسَدِّدُوا وَقَارِبُوا وَأَبْشِرُوا، وَاسْتَعِينُوا بِالْغَدْوَةِ وَالرَّوْحَةِ وَشَىْءٍ مِنَ الدُّلْجَةِ"]], "source": "صحيح البخاري · ٣٩", "english": "Narrated Abu Huraira: The Prophet (ﷺ) said, \"Religion is very easy and whoever overburdens himself in his religion will not be able to continue in that way. So you should not be extremists, but try to be near to perfection and receive the good tidings that you will be rewarded; and gain strength by worshipping in the mornings, the afternoons, and during the last hours of the nights.\" (See Fath-ul-Bari, Page 102, Vol)", "source_en": "Sahih al-Bukhari · 39"}, {"parts": [["n", "عن ابْنِ عَبَّاسٍ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "لاَ ضَرَرَ وَلاَ ضِرَارَ"]], "source": "سنن ابن ماجه · ٢٣٤١ · صحيح عند الألباني", "english": "It was narrated from Ibn 'Abbas that the Messenger of Allah (ﷺ) said:“There should be neither harming nor reciprocating harm.”", "source_en": "Sunan Ibn Majah · 2341"}, {"parts": [["n", "عن عَبْدِ اللَّهِ رضى الله عنه عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "إِنَّ الصِّدْقَ يَهْدِي إِلَى الْبِرِّ، وَإِنَّ الْبِرَّ يَهْدِي إِلَى الْجَنَّةِ، وَإِنَّ الرَّجُلَ لَيَصْدُقُ حَتَّى يَكُونَ صِدِّيقًا، وَإِنَّ الْكَذِبَ يَهْدِي إِلَى الْفُجُورِ، وَإِنَّ الْفُجُورَ يَهْدِي إِلَى النَّارِ، وَإِنَّ الرَّجُلَ لَيَكْذِبُ، حَتَّى يُكْتَبَ عِنْدَ اللَّهِ كَذَّابًا"]], "source": "صحيح البخاري · ٦٠٩٤", "english": "Narrated `Abdullah:The Prophet (ﷺ) said, \"Truthfulness leads to righteousness, and righteousness leads to Paradise. And a man keeps on telling the truth until he becomes a truthful person. Falsehood leads to Al-Fajur (i.e. wickedness, evil-doing), and Al-Fajur (wickedness) leads to the (Hell) Fire, and a man may keep on telling lies till he is written before Allah, a liar", "source_en": "Sahih al-Bukhari · 6094"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "آيَةُ الْمُنَافِقِ ثَلاَثٌ إِذَا حَدَّثَ كَذَبَ، وَإِذَا وَعَدَ أَخْلَفَ، وَإِذَا اؤْتُمِنَ خَانَ"]], "source": "صحيح البخاري · ٦٠٩٥", "english": "Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"The signs of a hypocrite are three: Whenever he speaks, he tells a lie; and whenever he promises, he breaks his promise; and whenever he is entrusted, he betrays (proves to be dishonest)", "source_en": "Sahih al-Bukhari · 6095"}, {"parts": [["n", "عن ابْنِ عُمَرَ رضى الله عنهما قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "مَا زَالَ جِبْرِيلُ يُوصِينِي بِالْجَارِ حَتَّى ظَنَنْتُ أَنَّهُ سَيُوَرِّثُهُ"]], "source": "صحيح البخاري · ٦٠١٥", "english": "Narrates Ibn `Umar:Allah's Apostle said, Gabriel kept on recommending me about treating the neighbors in a kind and polite manner, so much so that I thought that he would order (me) to make them (my) heirs", "source_en": "Sahih al-Bukhari · 6015"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "لاَ يَشْكُرُ اللَّهَ مَنْ لاَ يَشْكُرُ النَّاسَ"]], "source": "سنن أبي داود · ٤٨١١ · صحيح عند الألباني", "english": "Narrated Abu Hurayrah: The Prophet (ﷺ) said: He who does not thank the people is not thankful to Allah", "source_en": "Sunan Abi Dawud · 4811"}, {"parts": [["n", "عن حَكِيمِ بْنِ حِزَامٍ رضى الله عنه عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "الْيَدُ الْعُلْيَا خَيْرٌ مِنَ الْيَدِ السُّفْلَى، وَابْدَأْ بِمَنْ تَعُولُ، وَخَيْرُ الصَّدَقَةِ عَنْ ظَهْرِ غِنًى، وَمَنْ يَسْتَعْفِفْ يُعِفَّهُ اللَّهُ، وَمَنْ يَسْتَغْنِ يُغْنِهِ اللَّهُ"]], "source": "صحيح البخاري · ١٤٢٧", "english": "Narrated Hakim bin Hizam:The Prophet (ﷺ) said, \"The upper hand is better than the lower hand (i.e. he who gives in charity is better than him who takes it). One should start giving first to his dependents. And the best object of charity is that which is given by a wealthy person (from the money which is left after his expenses). And whoever abstains from asking others for some financial help, Allah will give him and save him from asking others, Allah will make him self-sufficient", "source_en": "Sahih al-Bukhari · 1427"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "إِيَّاكُمْ وَالظَّنَّ فَإِنَّ الظَّنَّ أَكْذَبُ الْحَدِيثِ، وَلاَ تَحَسَّسُوا، وَلاَ تَجَسَّسُوا، وَلاَ تَبَاغَضُوا، وَلاَ تَدَابَرُوا، وَكُونُوا عِبَادَ اللَّهِ إِخْوَانًا"]], "source": "صحيح البخاري · ٦٧٢٤", "english": "Narrated Abu Huraira:Allah's Messenger (ﷺ) said, 'Beware of suspicion, for it is the worst of false tales and don't look for the other's faults and don't spy and don't hate each other, and don't desert (cut your relations with) one another O Allah's slaves, be brothers!\" (See Hadith No)", "source_en": "Sahih al-Bukhari · 6724"}, {"parts": [["n", "عن أَنَسِ بْنِ مَالِكٍ، أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "لاَ تَبَاغَضُوا، وَلاَ تَحَاسَدُوا، وَلاَ تَدَابَرُوا، وَكُونُوا عِبَادَ اللَّهِ إِخْوَانًا، وَلاَ يَحِلُّ لِمُسْلِمٍ أَنْ يَهْجُرَ أَخَاهُ فَوْقَ ثَلاَثِ لَيَالٍ"]], "source": "صحيح البخاري · ٦٠٧٦", "english": "Narrated Anas bin Malik:Allah's Messenger (ﷺ) said, \"Do not hate one another, nor be jealous of one another; and do not desert one another, but O Allah's worshipers! Be Brothers! And it is unlawful for a Muslim to desert his brother Muslim (and not to talk to him) for more than three nights", "source_en": "Sahih al-Bukhari · 6076"}, {"parts": [["n", "عن الْمِقْدَامِ بْنِ مَعْدِيكَرِبَ، - وَقَدْ كَانَ أَدْرَكَهُ - عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "إِذَا أَحَبَّ الرَّجُلُ أَخَاهُ فَلْيُخْبِرْهُ أَنَّهُ يُحِبُّهُ"]], "source": "سنن أبي داود · ٥١٢٤ · صحيح عند الألباني", "english": "Narrated Al-Miqdam ibn Ma'dikarib: The Prophet (ﷺ) said: When a man loves his brother, he should tell him that he loves him", "source_en": "Sunan Abi Dawud · 5124"}, {"parts": [["n", "عن عَبْدَ اللَّهِ بْنَ عُمَرَ رضى الله عنهما أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "الْمُسْلِمُ أَخُو الْمُسْلِمِ، لاَ يَظْلِمُهُ وَلاَ يُسْلِمُهُ، وَمَنْ كَانَ فِي حَاجَةِ أَخِيهِ كَانَ اللَّهُ فِي حَاجَتِهِ، وَمَنْ فَرَّجَ عَنْ مُسْلِمٍ كُرْبَةً فَرَّجَ اللَّهُ عَنْهُ كُرْبَةً مِنْ كُرُبَاتِ يَوْمِ الْقِيَامَةِ، وَمَنْ سَتَرَ مُسْلِمًا سَتَرَهُ اللَّهُ يَوْمَ الْقِيَامَةِ"]], "source": "صحيح البخاري · ٢٤٤٢", "english": "Narrated `Abdullah bin `Umar:Allah's Messenger (ﷺ) said, \"A Muslim is a brother of another Muslim, so he should not oppress him, nor should he hand him over to an oppressor. Whoever fulfilled the needs of his brother, Allah will fulfill his needs; whoever brought his (Muslim) brother out of a discomfort, Allah will bring him out of the discomforts of the Day of Resurrection, and whoever screened a Muslim, Allah will screen him on the Day of Resurrection", "source_en": "Sahih al-Bukhari · 2442"}, {"parts": [["n", "عن عَبْدِ اللَّهِ بْنِ عُمَرَ، أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "صَلاَةُ الْجَمَاعَةِ تَفْضُلُ صَلاَةَ الْفَذِّ بِسَبْعٍ وَعِشْرِينَ دَرَجَةً"]], "source": "صحيح البخاري · ٦٤٥", "english": "Narrated `Abdullah bin `Umar:Allah's Messenger (ﷺ) said, \"The prayer in congregation is twenty seven times superior to the prayer offered by a person alone", "source_en": "Sahih al-Bukhari · 645"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "مَنْ صَامَ رَمَضَانَ إِيمَانًا وَاحْتِسَابًا غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ"]], "source": "صحيح البخاري · ٣٨", "english": "Narrated Abu Huraira: Allah's Messenger (ﷺ) said, \"Whoever observes fasts during the month of Ramadan out of sincere faith, and hoping to attain Allah's rewards, then all his past sins will be forgiven", "source_en": "Sahih al-Bukhari · 38"}, {"parts": [["n", "عن أَنَسَ بْنَ مَالِكٍ رضى الله عنه قَالَ قَالَ النَّبِيُّ ﷺ"], ["q", "تَسَحَّرُوا فَإِنَّ فِي السَّحُورِ بَرَكَةً"]], "source": "صحيح البخاري · ١٩٢٣", "english": "Narrated Anas bin Malik:The Prophet (ﷺ) said, \"Take Suhur as there is a blessing in it", "source_en": "Sahih al-Bukhari · 1923"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ رضى الله عنه أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "الصِّيَامُ جُنَّةٌ، فَلاَ يَرْفُثْ وَلاَ يَجْهَلْ، وَإِنِ امْرُؤٌ قَاتَلَهُ أَوْ شَاتَمَهُ فَلْيَقُلْ إِنِّي صَائِمٌ. مَرَّتَيْنِ، وَالَّذِي نَفْسِي بِيَدِهِ لَخُلُوفُ فَمِ الصَّائِمِ أَطْيَبُ عِنْدَ اللَّهِ تَعَالَى مِنْ رِيحِ الْمِسْكِ، يَتْرُكُ طَعَامَهُ وَشَرَابَهُ وَشَهْوَتَهُ مِنْ أَجْلِي، الصِّيَامُ لِي، وَأَنَا أَجْزِي بِهِ، وَالْحَسَنَةُ بِعَشْرِ أَمْثَالِهَا"]], "source": "صحيح البخاري · ١٨٩٤", "english": "Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"Fasting is a shield (or a screen or a shelter). So, the person observing fasting should avoid sexual relation with his wife and should not behave foolishly and impudently, and if somebody fights with him or abuses him, he should tell him twice, 'I am fasting.\" The Prophet (ﷺ) added, \"By Him in Whose Hands my soul is, the smell coming out from the mouth of a fasting person is better in the sight of Allah than the smell of musk. (Allah says about the fasting person), 'He has left his food, drink and desires for My sake. The fast is for Me. So I will reward (the fasting person) for it and the reward of good deeds is multiplied ten times", "source_en": "Sahih al-Bukhari · 1894"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "الْعُمْرَةُ إِلَى الْعُمْرَةِ كَفَّارَةٌ لِمَا بَيْنَهُمَا وَالْحَجُّ الْمَبْرُورُ لَيْسَ لَهُ جَزَاءٌ إِلاَّ الْجَنَّةُ"]], "source": "صحيح مسلم · ١٣٤٩", "english": "Ka'b b. 'Ujra reported Allah's Messenger (ﷺ) as saying:There are certain ejaculations, the repeaters of which or the performers of which after every prescribed prayer will never be caused disappointment:\" Glory be to Allah\" thirty-three times.\" Praise be to Allah\" thirty-three times, and\" Allah is most Great\" thirty-four times", "source_en": "Sahih Muslim · 1349"}, {"parts": [["n", "عن عَائِشَةَ، زَوْجِ النَّبِيِّ ﷺ عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "إِنَّ الرِّفْقَ لاَ يَكُونُ فِي شَىْءٍ إِلاَّ زَانَهُ وَلاَ يُنْزَعُ مِنْ شَىْءٍ إِلاَّ شَانَهُ"]], "source": "صحيح مسلم · ٢٥٩٤", "english": "Sulaiman b. Yasar reported that he asked Umm Salama whether a person (who gets up) in the morning in a state of junub should observe fast. She said:The Messenger of Allah (ﷺ) (at times) got up in the morning in a state of junub, not because of sexual dreams (but on account of intercourse at night), and then observed fast", "source_en": "Sahih Muslim · 2594"}, {"parts": [["n", "عن ابْنِ عَبَّاسٍ رضى الله عنهما قَالَ قَالَ النَّبِيُّ ﷺ"], ["q", "نِعْمَتَانِ مَغْبُونٌ فِيهِمَا كَثِيرٌ مِنَ النَّاسِ، الصِّحَّةُ وَالْفَرَاغُ"]], "source": "صحيح البخاري · ٦٤١٢", "english": "Narrated Ibn `Abbas:The Prophet (ﷺ) said: \"There are two blessings that many people are deceived into losing: health and free time", "source_en": "Sahih al-Bukhari · 6412"}, {"parts": [["n", "عن عُمَرَ، يَقُولُ سَمِعْتُ رَسُولَ اللَّهِ ﷺ يَقُولُ"], ["q", "لَوْ أَنَّكُمْ تَوَكَّلْتُمْ عَلَى اللَّهِ حَقَّ تَوَكُّلِهِ لَرَزَقَكُمْ كَمَا يَرْزُقُ الطَّيْرَ تَغْدُو خِمَاصًا وَتَرُوحُ بِطَانًا"]], "source": "سنن ابن ماجه · ٤١٦٤ · صحيح عند الألباني", "english": "‘Umar said:“I heard the Messenger of Allah (ﷺ) say: ‘If you were to rely upon Allah with the reliance He is due, you would be given provision like the birds: They go out hungry in the morning and come back with full bellies in the evening.”", "source_en": "Sunan Ibn Majah · 4164"}, {"parts": [["n", "عن جَابِرِ بْنِ عَبْدِ اللَّهِ، أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "اتَّقُوا الظُّلْمَ فَإِنَّ الظُّلْمَ ظُلُمَاتٌ يَوْمَ الْقِيَامَةِ وَاتَّقُوا الشُّحَّ فَإِنَّ الشُّحَّ أَهْلَكَ مَنْ كَانَ قَبْلَكُمْ حَمَلَهُمْ عَلَى أَنْ سَفَكُوا دِمَاءَهُمْ وَاسْتَحَلُّوا مَحَارِمَهُمْ"]], "source": "صحيح مسلم · ٢٥٧٨", "english": "A'isha (Allah be pleased with her) said that the Messenger of Allah (ﷺ) used to embrace (his wives) while fasting", "source_en": "Sahih Muslim · 2578"}, {"parts": [["n", "عن عَبْدُ اللَّهِ قَالَ النَّبِيُّ ﷺ"], ["q", "سِبَابُ الْمُسْلِمِ فُسُوقٌ، وَقِتَالُهُ كُفْرٌ"]], "source": "صحيح البخاري · ٧٠٧٦", "english": "Narrated `Abdullah:The Prophet, said, \"Abusing a Muslim is Fusuq (evil doing) and killing him is Kufr (disbelief)", "source_en": "Sahih al-Bukhari · 7076"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ رضى الله عنه عَنِ النَّبِيِّ ﷺ أَنَّهُ قَالَ"], ["q", "لاَ يُلْدَغُ الْمُؤْمِنُ مِنْ جُحْرٍ وَاحِدٍ مَرَّتَيْنِ"]], "source": "صحيح البخاري · ٦١٣٣", "english": "Narrated Abu Huraira:The Prophet (ﷺ) said, \"A believer is not stung twice (by something) out of one and the same hole", "source_en": "Sahih al-Bukhari · 6133"}, {"parts": [["n", "عن جَابِرِ بْنِ عَبْدِ اللَّهِ رضى الله عنهما أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "رَحِمَ اللَّهُ رَجُلاً سَمْحًا إِذَا بَاعَ، وَإِذَا اشْتَرَى، وَإِذَا اقْتَضَى"]], "source": "صحيح البخاري · ٢٠٧٦", "english": "Narrated Jabir bin `Abdullah:Allah's Messenger (ﷺ) said, \"May Allah's mercy be on him who is lenient in his buying, selling, and in demanding back his money", "source_en": "Sahih al-Bukhari · 2076"}, {"parts": [["n", "عن عَبْدِ اللَّهِ بْنِ عُمَرَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "أَعْطُوا الأَجِيرَ أَجْرَهُ قَبْلَ أَنْ يَجِفَّ عَرَقُهُ"]], "source": "سنن ابن ماجه · ٢٤٤٣ · صحيح عند الألباني", "english": "It was narrated from 'Abdullah bin 'Umar that the Messenger of Allah (ﷺ) said:“Give the worker his wages before his sweat dries.”", "source_en": "Sunan Ibn Majah · 2443"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ رضى الله عنه عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "مَا أَنْزَلَ اللَّهُ دَاءً إِلاَّ أَنْزَلَ لَهُ شِفَاءً"]], "source": "صحيح البخاري · ٥٦٧٨", "english": "Narrated Abu Huraira:The Prophet (ﷺ) said, \"There is no disease that Allah has created, except that He also has created its treatment", "source_en": "Sahih al-Bukhari · 5678"}, {"parts": [["n", "عن الْمِقْدَامَ بْنَ مَعْدِيكَرِبَ، يَقُولُ سَمِعْتُ رَسُولَ اللَّهِ ﷺ يَقُولُ"], ["q", "مَا مَلأَ آدَمِيٌّ وِعَاءً شَرًّا مِنْ بَطْنٍ حَسْبُ الآدَمِيِّ لُقَيْمَاتٌ يُقِمْنَ صُلْبَهُ فَإِنْ غَلَبَتِ الآدَمِيَّ نَفْسُهُ فَثُلُثٌ لِلطَّعَامِ وَثُلُثٌ لِلشَّرَابِ وَثُلُثٌ لِلنَّفَسِ"]], "source": "سنن ابن ماجه · ٣٣٤٩ · صحيح عند الألباني", "english": "Miqdam bin Madikarib said:“I heard the Messenger of Allah (ﷺ) say: ‘A human being fills no worse vessel than his stomach. It is sufficient for a human being to eat a few mouthfuls to keep his spine straight. But if he must (fill it), then one third of food, one third for drink and one third for air.’”", "source_en": "Sunan Ibn Majah · 3349"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ رضى الله عنه أَنَّهُ قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "طَعَامُ الاِثْنَيْنِ كَافِي الثَّلاَثَةِ، وَطَعَامُ الثَّلاَثَةِ كَافِي الأَرْبَعَةِ"]], "source": "صحيح البخاري · ٥٣٩٢", "english": "Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"The food for two persons is sufficient for three, and the food of three persons is sufficient for four persons", "source_en": "Sahih al-Bukhari · 5392"}, {"parts": [["n", "عن عَلِيٍّ، - رضى الله عنه - قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "يَا أَهْلَ الْقُرْآنِ أَوْتِرُوا فَإِنَّ اللَّهَ وِتْرٌ يُحِبُّ الْوِتْرَ"]], "source": "سنن أبي داود · ١٤١٦ · صحيح عند الألباني", "english": "Narrated Ali ibn AbuTalib: The Prophet (ﷺ) said: Allah is single (witr) and loves what is single, so observe the witr, you who follow the Qur'an", "source_en": "Sunan Abi Dawud · 1416"}, {"parts": [["n", "عن عَلِيٍّ، رضى الله عنه قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "مِفْتَاحُ الصَّلاَةِ الطُّهُورُ وَتَحْرِيمُهَا التَّكْبِيرُ وَتَحْلِيلُهَا التَّسْلِيمُ"]], "source": "سنن أبي داود · ٦١ · حسن صحيح عند الألباني", "english": "Narrated Ali ibn AbuTalib: The key to prayer is purification; its beginning is takbir and its end is taslim", "source_en": "Sunan Abi Dawud · 61"}, {"parts": [["n", "عن جَرِيرٍ، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "مَنْ يُحْرَمِ الرِّفْقَ يُحْرَمِ الْخَيْرَ"]], "source": "صحيح مسلم · ٢٥٩٢", "english": "Abu Bakr b. 'Abd al-Rahman b. al-Harith b. Hisham reported on the authority of 'A'isha and Umm Salama, the wives of the Messenger of Allah (ﷺ):The Messenger of Allah (ﷺ) at times got up in the morning in a state of junub on account of having a sexual intercourse (with his wives during night) but not due to sexual dreams in the month of Ramadan, and would observe fast", "source_en": "Sahih Muslim · 2592"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ رضى الله عنه قَالَ قَالَ النَّبِيُّ ﷺ"], ["q", "يَقُولُ اللَّهُ تَعَالَى أَنَا عِنْدَ ظَنِّ عَبْدِي بِي، وَأَنَا مَعَهُ إِذَا ذَكَرَنِي، فَإِنْ ذَكَرَنِي فِي نَفْسِهِ ذَكَرْتُهُ فِي نَفْسِي، وَإِنْ ذَكَرَنِي فِي مَلأٍ ذَكَرْتُهُ فِي مَلأٍ خَيْرٍ مِنْهُمْ، وَإِنْ تَقَرَّبَ إِلَىَّ بِشِبْرٍ تَقَرَّبْتُ إِلَيْهِ ذِرَاعًا، وَإِنْ تَقَرَّبَ إِلَىَّ ذِرَاعًا تَقَرَّبْتُ إِلَيْهِ بَاعًا، وَإِنْ أَتَانِي يَمْشِي أَتَيْتُهُ هَرْوَلَةً"]], "source": "صحيح البخاري · ٧٤٠٥", "english": "Narrated Abu Huraira:The Prophet (ﷺ) said, \"Allah says: 'I am just as My slave thinks I am, (i.e. I am able to do for him what he thinks I can do for him) and I am with him if He remembers Me. If he remembers Me in himself, I too, remember him in Myself; and if he remembers Me in a group of people, I remember him in a group that is better than they; and if he comes one span nearer to Me, I go one cubit nearer to him; and if he comes one cubit nearer to Me, I go a distance of two outstretched arms nearer to him; and if he comes to Me walking, I go to him running", "source_en": "Sahih al-Bukhari · 7405"}, {"parts": [["n", "عن جَابِرَ بْنَ عَبْدِ اللَّهِ، رضى الله عنهما يَقُولُ سَمِعْتُ رَسُولَ اللَّهِ ﷺ يَقُولُ"], ["q", "أَفْضَلُ الذِّكْرِ لاَ إِلَهَ إِلاَّ اللَّهُ وَأَفْضَلُ الدُّعَاءِ الْحَمْدُ لِلَّهِ"]], "source": "جامع الترمذي · ٣٣٨٣ · حسن غريب", "english": "Jabir bin `Abdullah (ra) narrated that :the Messenger of Allah (ﷺ) said: “The best remembrance is: ‘there is none worthy of worship except Allah (Lā ilāha illallāh)’ and the best supplication is: ‘All praise is due to Allah (Al-ḥamdulillāh).’”", "source_en": "Jami at-Tirmidhi · 3383"}, {"parts": [["n", "عن أبي هُرَيْرَةَ سَمِعْتُ رَسُولَ اللَّهِ ﷺ يَقُولُ"], ["q", "وَاللَّهِ إِنِّي لأَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ فِي الْيَوْمِ أَكْثَرَ مِنْ سَبْعِينَ مَرَّةً"]], "source": "صحيح البخاري · ٦٣٠٧", "english": "Narrated Abu Huraira:I heard Allah's Messenger (ﷺ) saying.\" By Allah! I ask for forgiveness from Allah and turn to Him in repentance more than seventy times a day", "source_en": "Sahih al-Bukhari · 6307"}, {"parts": [["n", "عن عَائِشَةَ، - رضى الله عنها - أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ:"], ["q", "اكْلَفُوا مِنَ الْعَمَلِ مَا تُطِيقُونَ، فَإِنَّ اللَّهَ لاَ يَمَلُّ حَتَّى تَمَلُّوا، وَإِنَّ أَحَبَّ الْعَمَلِ إِلَى اللَّهِ أَدْوَمُهُ وَإِنْ قَلَّ"]], "source": "سنن أبي داود · ١٣٦٨ · صحيح عند الألباني", "english": "Narrated 'Aishah:The Messenger of Allah (ﷺ) as saying: Choose such actions as you are capable of performing, for Allah does not grow weary till you do. The acts most pleasing to Allah are those which are done most continuously, even if they amount to little. Whenever he began an action, he would do it continuously", "source_en": "Sunan Abi Dawud · 1368"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "مَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الآخِرِ فَلاَ يُؤْذِي جَارَهُ"]], "source": "صحيح البخاري · ٥١٨٥", "english": "Narrated Abu Huraira:The Prophet (ﷺ) said, \"Whoever believes in Allah and the Last Day should not hurt (trouble) his neighbor. And I advise you to take care of the women, for they are created from a rib and the most crooked portion of the rib is its upper part; if you try to straighten it, it will break, and if you leave it, it will remain crooked, so I urge you to take care of the women", "source_en": "Sahih al-Bukhari · 5185"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، قَالَ قَالَ النَّبِيُّ ﷺ"], ["q", "أَدِّ الأَمَانَةَ إِلَى مَنِ ائْتَمَنَكَ وَلاَ تَخُنْ مَنْ خَانَكَ"]], "source": "جامع الترمذي · ١٢٦٤ · حسن غريب", "english": "Narrated Abu Hurairah: That the Prophet (ﷺ) said: \"Fulfill the trust for the one who entrusted you, and do not cheat the one who cheated you.\" [Abu 'Eisa said:] This Hadith is Hasan Gharib. Some of the people of knowledge followed this Hadith, they said that when something belonging to a man is with another and he leaves (with it), then he has something that belongs to him, he may not withhold from him an equivalent to what the other took of his. Some of the people of knowledge among the Tabi'in allowed that. This is the view of Sufyan Ath-Thawri, he said: \"If one man has some Dirham that belong to another, and the second has some Dinar belonging to the first, he may not withhold any in place of his Dirham, unless it so happens that he has some Dirham of his, then in that case he can withhold some of his D
