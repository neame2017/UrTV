نن أبي داود · ٤٩٥٠ · صحيح عند الألباني", "english": "Narrated AbuWahb al-Jushami: The Prophet (ﷺ) said: Call yourselves by the names of the Prophets. The names dearest to Allah are Abdullah and AbdurRahman, the truest are Harith and Hammam, and the worst are Harb and Murrah", "source_en": "Sunan Abi Dawud · 4950"}, {"parts": [["n", "عن أَبِي سَعِيدٍ الْخُدْرِيِّ، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "إِنَّ الدُّنْيَا حُلْوَةٌ خَضِرَةٌ وَإِنَّ اللَّهَ مُسْتَخْلِفُكُمْ فِيهَا فَيَنْظُرُ كَيْفَ تَعْمَلُونَ فَاتَّقُوا الدُّنْيَا وَاتَّقُوا النِّسَاءَ فَإِنَّ أَوَّلَ فِتْنَةِ بَنِي إِسْرَائِيلَ كَانَتْ فِي النِّسَاءِ"]], "source": "صحيح مسلم · ٢٧٤٢", "english": "Abdullah b. Amr (Allah be pleased with them) reported that the Messenger of Allah (ﷺ) had said to him:Observe fast for a day and there would be reward for you for the rest (of the days). He said: I am capable of doing more than this. He then said: Observe fast for two days, and there would be reward for you for the rest (of the days). He said: I am capable of doing more than this. He (the Holy Prophet) said: Observe fast for three days and there would be reward for you for the rest of the days. He said: I am capable of doing more than this, whereupon he said: Observe fast for four days and there would be reward for you for the rest of the days. He said: I am capable of doing more than this. Thereupon he said: Then observe fast (which is the) best in the eye of Allah, the fast of David (peace be upon him) ; he used to observe fast one day and break on the other day", "source_en": "Sahih Muslim · 2742"}, {"parts": [["n", "عن عَبْدِ اللَّهِ بْنِ عُمَرَ، أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "لاَ يَنْظُرُ اللَّهُ يَوْمَ الْقِيَامَةِ إِلَى مَنْ جَرَّ ثَوْبَهُ خُيَلاَءَ"]], "source": "جامع الترمذي · ١٧٣٠ · حسن صحيح", "english": "Narrated 'Abdullah bin 'Umar: That the Messenger of Allah (ﷺ) said: \"On the day of judgement, Allah will not look at one who arrogantly drags his garment. [Abu 'Eisa said:] There are narrations on this topic from Hudhaifah, Abu Sa'eed, Abu Hurairah, Samurah, Abu Dharr, 'Aishah and Hubaib bin Mughfil. The Hadith of Ibn 'Umar is Hasan Sahih", "source_en": "Jami at-Tirmidhi · 1730"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ رضى الله عنه قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "الْعَيْنُ حَقٌّ"]], "source": "صحيح البخاري · ٥٩٤٤", "english": "Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"The evil eye is a fact,\" and he forbade tattooing", "source_en": "Sahih al-Bukhari · 5944"}, {"parts": [["n", "عن أَبِي قَتَادَةَ، قَالَ قَالَ النَّبِيُّ ﷺ"], ["q", "الرُّؤْيَا الصَّالِحَةُ مِنَ اللَّهِ، وَالْحُلْمُ مِنَ الشَّيْطَانِ، فَمَنْ رَأَى شَيْئًا يَكْرَهُهُ فَلْيَنْفِثْ عَنْ شِمَالِهِ ثَلاَثًا، وَلْيَتَعَوَّذْ مِنَ الشَّيْطَانِ، فَإِنَّهَا لاَ تَضُرُّهُ، وَإِنَّ الشَّيْطَانَ لاَ يَتَرَاءَى بِي"]], "source": "صحيح البخاري · ٦٩٩٥", "english": "Narrated Abu Qatada:The Prophet (ﷺ) said, \"A good dream is from Allah, and a bad dream is from Satan. So whoever has seen (in a dream) something he dislikes, then he should spit without saliva, thrice on his left and seek refuge with Allah from Satan, for it will not harm him, and Satan cannot appear in my shape", "source_en": "Sahih al-Bukhari · 6995"}, {"parts": [["n", "عن عَمْرِو بْنِ شُعَيْبٍ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، أَنَّ النَّبِيَّ ﷺ قَالَ"], ["q", "خَيْرُ الدُّعَاءِ دُعَاءُ يَوْمِ عَرَفَةَ وَخَيْرُ مَا قُلْتُ أَنَا وَالنَّبِيُّونَ مِنْ قَبْلِي لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ"]], "source": "جامع الترمذي · ٣٥٨٥ · حسن عند الألباني", "english": "Amr bin Shu`aib narrated from his father, from his grandfather, that the Prophet (ﷺ) said:“The best of supplication is the supplication of the Day of `Arafah. And the best of what I and the Prophets before me have said is: None has the right to be worshipped but Allah, Alone, without partner, to Him belongs all that exists, and to Him belongs the Praise, and He is powerful over all things. (Lā ilāha illallāh, waḥdahu lā sharīka lahu, lahul-mulku wa lahul-ḥamdu, wa huwa `alā kulli shai’in qadīr).’”", "source_en": "Jami at-Tirmidhi · 3585"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ رضى الله عنه عَنِ النَّبِيِّ ﷺ"], ["q", "إِنَّ اللَّهَ يُحِبُّ الْعُطَاسَ، وَيَكْرَهُ التَّثَاؤُبَ، فَإِذَا عَطَسَ فَحَمِدَ اللَّهَ، فَحَقٌّ عَلَى كُلِّ مُسْلِمٍ سَمِعَهُ أَنْ يُشَمِّتَهُ، وَأَمَّا التَّثَاوُبُ فَإِنَّمَا هُوَ مِنَ الشَّيْطَانِ، فَلْيَرُدَّهُ مَا اسْتَطَاعَ، فَإِذَا قَالَ هَا. ضَحِكَ مِنْهُ الشَّيْطَانُ"]], "source": "صحيح البخاري · ٦٢٢٣", "english": "Narrated Abu Huraira:The Prophet (ﷺ) said, \"Allah likes sneezing and dislikes yawning, so if someone sneezes and then praises Allah, then it is obligatory on every Muslim who heard him, to say: May Allah be merciful to you (Yar-hamuka-l-lah). But as regards yawning, it is from Satan, so one must try one's best to stop it, if one says 'Ha' when yawning, Satan will laugh at him", "source_en": "Sahih al-Bukhari · 6223"}, {"parts": [["n", "عن جَابِرٍ، أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "إِنَّ مِنْ أَحَبِّكُمْ إِلَىَّ وَأَقْرَبِكُمْ مِنِّي مَجْلِسًا يَوْمَ الْقِيَامَةِ أَحَاسِنَكُمْ أَخْلاَقًا وَإِنَّ أَبْغَضَكُمْ إِلَىَّ وَأَبْعَدَكُمْ مِنِّي مَجْلِسًا يَوْمَ الْقِيَامَةِ الثَّرْثَارُونَ وَالْمُتَشَدِّقُونَ وَالْمُتَفَيْهِقُونَ"], ["n", "قَالُوا يَا رَسُولَ اللَّهِ قَدْ عَلِمْنَا الثَّرْثَارُونَ وَالْمُتَشَدِّقُونَ فَمَا الْمُتَفَيْهِقُونَ قَالَ"], ["q", "الْمُتَكَبِّرُونَ"]], "source": "جامع الترمذي · ٢٠١٨ · حسن غريب", "english": "Jabir narrated that the Messenger of Allah said:\"Indeed the most beloved among you to me, and the nearest to sit with me on the Day of Judgment is the best of you in character. And indeed, the most disliked among you to me, and the one sitting furthest from me on the Day of Judgement are the Thartharun, and the Mutashaddiqun and the Muthafaihiqun.\" They said: \"O Messenger of Allah! We know about the Thartharun, and the Mutashaddiqun, but what about the Muthafaihiqun?\"' He said:\"The arrogant", "source_en": "Jami at-Tirmidhi · 2018"}, {"parts": [["n", "عن أَبِي سَعِيدٍ الْخُدْرِيِّ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "أَفْضَلُ الْجِهَادِ كَلِمَةُ عَدْلٍ عِنْدَ سُلْطَانٍ جَائِرٍ"], ["n", "أَوْ"], ["q", "أَمِيرٍ جَائِرٍ"]], "source": "سنن أبي داود · ٤٣٤٤ · صحيح عند الألباني", "english": "Narrated AbuSa'id al-Khudri: The Prophet (ﷺ) said: The best fighting (jihad) in the path of Allah is (to speak) a word of justice to an oppressive ruler", "source_en": "Sunan Abi Dawud · 4344"}, {"parts": [["n", "عن سَهْلِ بْنِ سَعْدٍ السَّاعِدِيِّ رضى الله عنه أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "رِبَاطُ يَوْمٍ فِي سَبِيلِ اللَّهِ خَيْرٌ مِنَ الدُّنْيَا وَمَا عَلَيْهَا، وَمَوْضِعُ سَوْطِ أَحَدِكُمْ مِنَ الْجَنَّةِ خَيْرٌ مِنَ الدُّنْيَا وَمَا عَلَيْهَا، وَالرَّوْحَةُ يَرُوحُهَا الْعَبْدُ فِي سَبِيلِ اللَّهِ أَوِ الْغَدْوَةُ خَيْرٌ مِنَ الدُّنْيَا وَمَا عَلَيْهَا"]], "source": "صحيح البخاري · ٢٨٩٢", "english": "Narrated Sahl bin Sa`d As-Sa'idi:Allah's Messenger (ﷺ) said, \"To guard Muslims from infidels in Allah's Cause for one day is better than the world and whatever is on its surface, and a place in Paradise as small as that occupied by the whip of one of you is better than the world and whatever is on its surface; and a morning's or an evening's journey which a slave (person) travels in Allah's Cause is better than the world and whatever is on its surface", "source_en": "Sahih al-Bukhari · 2892"}, {"parts": [["n", "عن ابْنِ عَبَّاسٍ، قَالَ سَمِعْتُ رَسُولَ اللَّهِ ﷺ يَقُولُ"], ["q", "عَيْنَانِ لاَ تَمَسُّهُمَا النَّارُ عَيْنٌ بَكَتْ مِنْ خَشْيَةِ اللَّهِ وَعَيْنٌ بَاتَتْ تَحْرُسُ فِي سَبِيلِ اللَّهِ"]], "source": "جامع الترمذي · ١٦٣٩ · حسن", "english": "Narrated Ibn 'Abbas: \"I heard the Messenger of Allah (ﷺ) saying, 'There are two eyes that shall not be touched by the Fire: An eye that wept from the fear of Allah, and an eye that spent the night standing on guard in the cause of Allah.\" [Abu 'Eisa said:] There are narrations on this topic from 'Uthman and Abu Raihanah. The Hadith of Ibn 'Abbas is a Hasan Gharib Hadith, we do not know of it except through the narration of Shu'aib bin Ruzaiq", "source_en": "Jami at-Tirmidhi · 1639"}, {"parts": [["n", "عن عَبْدِ اللَّهِ، قَالَ قَالَ لَنَا رَسُولُ اللَّهِ ﷺ"], ["q", "يَا مَعْشَرَ الشَّبَابِ مَنِ اسْتَطَاعَ مِنْكُمُ الْبَاءَةَ فَلْيَتَزَوَّجْ"]], "source": "سنن النسائي · ٣٢١٠ · صحيح عند الألباني", "english": "Narrated 'Abdullah:It was narrated that 'Abdullah said: \"The Messenger of Allah said to us: 'O young men, whoever among you can afford it, let him get married,'\" and he quoted the same hadith", "source_en": "Sunan an-Nasa'i · 3210"}, {"parts": [["n", "عن ابْنِ عَبَّاسٍ، عَنْ رَسُولِ اللَّهِ ﷺ فِيمَا يَرْوِي عَنْ رَبِّهِ تَبَارَكَ وَتَعَالَى قَالَ"], ["q", "إِنَّ اللَّهَ كَتَبَ الْحَسَنَاتِ وَالسَّيِّئَاتِ ثُمَّ بَيَّنَ ذَلِكَ فَمَنْ هَمَّ بِحَسَنَةٍ فَلَمْ يَعْمَلْهَا كَتَبَهَا اللَّهُ عِنْدَهُ حَسَنَةً كَامِلَةً وَإِنْ هَمَّ بِهَا فَعَمِلَهَا كَتَبَهَا اللَّهُ عَزَّ وَجَلَّ عِنْدَهُ عَشْرَ حَسَنَاتٍ إِلَى سَبْعِمِائَةِ ضِعْفٍ إِلَى أَضْعَافٍ كَثِيرَةٍ وَإِنْ هَمَّ بِسَيِّئَةٍ فَلَمْ يَعْمَلْهَا كَتَبَهَا اللَّهُ عِنْدَهُ حَسَنَةً كَامِلَةً وَإِنْ هَمَّ بِهَا فَعَمِلَهَا كَتَبَهَا اللَّهُ سَيِّئَةً وَاحِدَةً"]], "source": "صحيح مسلم · ١٣١", "english": "Abu Malik narrated on the authority of his father that he heard the Apostle (ﷺ) say:He who held belief in the unity of Allah, and then narrated what has been stated above", "source_en": "Sahih Muslim · 131"}, {"parts": [["n", "عن أَبِي مُوسَى، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "إِنَّ اللَّهَ عَزَّ وَجَلَّ يَبْسُطُ يَدَهُ بِاللَّيْلِ لِيَتُوبَ مُسِيءُ النَّهَارِ وَيَبْسُطُ يَدَهُ بِالنَّهَارِ لِيَتُوبَ مُسِيءُ اللَّيْلِ حَتَّى تَطْلُعَ الشَّمْسُ مِنْ مَغْرِبِهَا"]], "source": "صحيح مسلم · ٦٩٨٩", "english": "Abu Musa reported Allah's Messenger (ﷺ) as saying that Allah, the Exalted and Glorious, Stretches out His Hand during the night so that the people may repent for the fault committed from dawn till dusk and He stretches out His Hand during the day so that the people may repent for the fault committed from dusk to dawn. (He would accept repentance) before the sun rises in the west (before the Day of Resurrection). A hadith like this has been narrated on the authority of Shu'ba with the same chain of transmitters", "source_en": "Sahih Muslim · 6989"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، أَنَّهُ سَمِعَ رَسُولَ اللَّهِ ﷺ يَقُولُ"], ["q", "أَرَأَيْتُمْ لَوْ أَنَّ نَهَرًا بِبَابِ أَحَدِكُمْ، يَغْتَسِلُ فِيهِ كُلَّ يَوْمٍ خَمْسًا، مَا تَقُولُ ذَلِكَ يُبْقِي مِنْ دَرَنِهِ"], ["n", "قَالُوا لاَ يُبْقِي مِنْ دَرَنِهِ شَيْئًا. قَالَ"], ["q", "فَذَلِكَ مِثْلُ الصَّلَوَاتِ الْخَمْسِ، يَمْحُو اللَّهُ بِهَا الْخَطَايَا"]], "source": "صحيح البخاري · ٥٢٨", "english": "Narrated Abu Huraira:I heard Allah's Messenger (ﷺ) saying, \"If there was a river at the door of anyone of you and he took a bath in it five times a day would you notice any dirt on him?\" They said, \"Not a trace of dirt would be left.\" The Prophet (ﷺ) added, \"That is the example of the five prayers with which Allah blots out (annuls) evil deeds", "source_en": "Sahih al-Bukhari · 528"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ ﷺ كَانَ يَقُولُ"], ["q", "الصَّلَوَاتُ الْخَمْسُ وَالْجُمُعَةُ إِلَى الْجُمُعَةِ وَرَمَضَانُ إِلَى رَمَضَانَ مُكَفِّرَاتٌ مَا بَيْنَهُنَّ إِذَا اجْتَنَبَ الْكَبَائِرَ"]], "source": "صحيح مسلم · ٢٣٣", "english": "It is reported on the authority of Abu Huraira that the Messenger of Allah (may peace and blessing be upon him) observed:Allah does not shower His blessings from the heaven that in the morning a group of men disbelieve it (to be a blessing from Allah). Allah sends down rain, but they (the disbelievers) say: Such and such star (is responsible for that)", "source_en": "Sahih Muslim · 233"}, {"parts": [["n", "عن أبي هُرَيْرَةَ رضى الله عنه قَالَ سَمِعْتُ النَّبِيَّ ﷺ يَقُولُ"], ["q", "مَنْ حَجَّ لِلَّهِ فَلَمْ يَرْفُثْ وَلَمْ يَفْسُقْ رَجَعَ كَيَوْمِ وَلَدَتْهُ أُمُّهُ"]], "source": "صحيح البخاري · ١٥٢١", "english": "Narrated Abu Huraira:The Prophet (ﷺ) said, \"Whoever performs Hajj for Allah's pleasure and does not have sexual relations with his wife, and does not do evil or sins then he will return (after Hajj free from all sins) as if he were born anew", "source_en": "Sahih al-Bukhari · 1521"}, {"parts": [["n", "عن ابْنِ عَبَّاسٍ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "مَا مِنْ أَيَّامٍ الْعَمَلُ الصَّالِحُ فِيهَا أَحَبُّ إِلَى اللَّهِ مِنْ هَذِهِ الأَيَّامِ"], ["n", "يَعْنِي أَيَّامَ الْعَشْرِ. قَالُوا يَا رَسُولَ اللَّهِ وَلاَ الْجِهَادُ فِي سَبِيلِ اللَّهِ قَالَ"], ["q", "وَلاَ الْجِهَادُ فِي سَبِيلِ اللَّهِ إِلاَّ رَجُلٌ خَرَجَ بِنَفْسِهِ وَمَالِهِ فَلَمْ يَرْجِعْ مِنْ ذَلِكَ بِشَىْءٍ"]], "source": "سنن أبي داود · ٢٤٣٨ · صحيح عند الألباني", "english": "Narrated Ibn 'Abbas:The Messenger of Allah (ﷺ) as saying: There is no virtue more to the liking of Allah in any day than in these days, that is, the first ten days of Dhu al-Hijjah. They (the Companions) asked: Messenger of Allah, not even the struggle in the path of Allah (Jihad) ? He said: (Yes), not even the struggle in the path of Allah, except a man who goes out (in the path of Allah) with his life and property, and does not return with any of them", "source_en": "Sunan Abi Dawud · 2438"}, {"parts": [["n", "عن جَابِرِ بْنِ عَبْدِ اللَّهِ، أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "مَنْ قَالَ حِينَ يَسْمَعُ النِّدَاءَ اللَّهُمَّ رَبَّ هَذِهِ الدَّعْوَةِ التَّامَّةِ وَالصَّلاَةِ الْقَائِمَةِ آتِ مُحَمَّدًا الْوَسِيلَةَ وَالْفَضِيلَةَ وَابْعَثْهُ مَقَامًا مَحْمُودًا الَّذِي وَعَدْتَهُ، حَلَّتْ لَهُ شَفَاعَتِي يَوْمَ الْقِيَامَةِ"]], "source": "صحيح البخاري · ٦١٤", "english": "Narrated Jabir bin `Abdullah:Allah's Messenger (ﷺ) said, \"Whoever after listening to the Adhan says, 'Allahumma Rabba hadhihi-dda` watit-tammah, was-salatil qa'imah, ati Muhammadan al-wasilata wal-fadilah, wa b`ath-hu maqaman mahmudan-il-ladhi wa`adtahu' [O Allah! Lord of this perfect call (perfect by not ascribing partners to You) and of the regular prayer which is going to be established, give Muhammad the right of intercession and illustriousness, and resurrect him to the best and the highest place in Paradise that You promised him (of)], then my intercession for him will be allowed on the Day of Resurrection", "source_en": "Sahih al-Bukhari · 614"}, {"parts": [["n", "عن مُعَاوِيَةَ بْنَ أَبِي سُفْيَانَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "الْمُؤَذِّنُونَ أَطْوَلُ النَّاسِ أَعْنَاقًا يَوْمَ الْقِيَامَةِ"]], "source": "سنن ابن ماجه · ٧٢٥ · صحيح عند الألباني", "english": "It was narrated that 'Esa bin Talhah said:\"I heard Mu'awiyah bin Abu Sufyan say that Messenger of Allah said: \"The Mu'adh-dhin will have the longest necks of all people on the Day of Resurrection", "source_en": "Sunan Ibn Majah · 725"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "لَوْ يَعْلَمُ النَّاسُ مَا فِي النِّدَاءِ وَالصَّفِّ الأَوَّلِ، ثُمَّ لَمْ يَجِدُوا إِلاَّ أَنْ يَسْتَهِمُوا عَلَيْهِ لاَسْتَهَمُوا، وَلَوْ يَعْلَمُونَ مَا فِي التَّهْجِيرِ لاَسْتَبَقُوا إِلَيْهِ، وَلَوْ يَعْلَمُونَ مَا فِي الْعَتَمَةِ وَالصُّبْحِ لأَتَوْهُمَا وَلَوْ حَبْوًا"]], "source": "صحيح البخاري · ٦١٥", "english": "Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"If the people knew the reward for pronouncing the Adhan and for standing in the first row (in congregational prayers) and found no other way to get that except by drawing lots they would draw lots, and if they knew the reward of the Zuhr prayer (in the early moments of its stated time) they would race for it (go early) and if they knew the reward of `Isha' and Fajr (morning) prayers in congregation, they would come to offer them even if they had to crawl", "source_en": "Sahih al-Bukhari · 615"}, {"parts": [["n", "عن أَبِي قَتَادَةَ السَّلَمِيِّ، أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "إِذَا دَخَلَ أَحَدُكُمُ الْمَسْجِدَ فَلْيَرْكَعْ رَكْعَتَيْنِ قَبْلَ أَنْ يَجْلِسَ"]], "source": "صحيح البخاري · ٤٤٤", "english": "Narrated Abu Qatada Al-Aslami:Allah's Messenger (ﷺ) said, \"If anyone of you enters a mosque, he should pray two rak`at before sitting", "source_en": "Sahih al-Bukhari · 444"}, {"parts": [["n", "عن نُعَيْمٍ الْمُجْمِرِ، قَالَ رَقِيتُ مَعَ أَبِي هُرَيْرَةَ عَلَى ظَهْرِ الْمَسْجِدِ، فَتَوَضَّأَ فَقَالَ إِنِّي سَمِعْتُ النَّبِيَّ ﷺ يَقُولُ"], ["q", "إِنَّ أُمَّتِي يُدْعَوْنَ يَوْمَ الْقِيَامَةِ غُرًّا مُحَجَّلِينَ مِنْ آثَارِ الْوُضُوءِ، فَمَنِ اسْتَطَاعَ مِنْكُمْ أَنْ يُطِيلَ غُرَّتَهُ فَلْيَفْعَلْ"]], "source": "صحيح البخاري · ١٣٦", "english": "Narrated Nu`am Al-Mujmir:Once I went up the roof of the mosque, along with Abu Huraira. He performed ablution and said, \"I heard the Prophet (ﷺ) saying, \"On the Day of Resurrection, my followers will be called \"Al-Ghurr-ul- Muhajjalun\" from the trace of ablution and whoever can increase the area of his radiance should do so (i.e. by performing ablution regularly)", "source_en": "Sahih al-Bukhari · 136"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، رضى الله عنه عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "مَا جَلَسَ قَوْمٌ مَجْلِسًا لَمْ يَذْكُرُوا اللَّهَ فِيهِ وَلَمْ يُصَلُّوا عَلَى نَبِيِّهِمْ إِلاَّ كَانَ عَلَيْهِمْ تِرَةً فَإِنْ شَاءَ عَذَّبَهُمْ وَإِنْ شَاءَ غَفَرَ لَهُمْ"]], "source": "جامع الترمذي · ٣٣٨٠ · حسن صحيح", "english": "Abu Hurairah [may Allah be pleased with him] narrated that :the Prophet said: “No group gather in a sitting in which they do not remember Allah, nor sent Salat upon their Prophet, except it will be a source of remorse for them. If He wills, He will punish them, and if He wills, He will forgive them.”", "source_en": "Jami at-Tirmidhi · 3380"}, {"parts": [["n", "عن أَبِي سَعِيدٍ الْخُدْرِيِّ، أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "يَا أَبَا سَعِيدٍ مَنْ رَضِيَ بِاللَّهِ رَبًّا وَبِالإِسْلاَمِ دِينًا وَبِمُحَمَّدٍ نَبِيًّا وَجَبَتْ لَهُ الْجَنَّةُ"], ["n", "فَعَجِبَ لَهَا أَبُو سَعِيدٍ فَقَالَ أَعِدْهَا عَلَىَّ يَا رَسُولَ اللَّهِ فَفَعَلَ ثُمَّ قَالَ"], ["q", "وَأُخْرَى يُرْفَعُ بِهَا الْعَبْدُ مِائَةَ دَرَجَةٍ فِي الْجَنَّةِ مَا بَيْنَ كُلِّ دَرَجَتَيْنِ كَمَا بَيْنَ السَّمَاءِ وَالأَرْضِ"], ["n", "قَالَ وَمَا هِيَ يَا رَسُولَ اللَّهِ قَالَ"], ["q", "الْجِهَادُ فِي سَبِيلِ اللَّهِ الْجِهَادُ فِي سَبِيلِ اللَّهِ"]], "source": "صحيح مسلم · ١٨٨٤", "english": "This hadith has been transmitted by Qatada with the same chain of transmitters. But Shu'ba (one of the narrators) said:At the end of Surah al-Kahf, but Hammam said: At the beginning of Surah al-Kahf", "source_en": "Sahih Muslim · 1884"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ رضى الله عنه أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "إِنَّ لِلَّهِ تِسْعَةً وَتِسْعِينَ اسْمَا مِائَةً إِلاَّ وَاحِدًا مَنْ أَحْصَاهَا دَخَلَ الْجَنَّةَ"]], "source": "صحيح البخاري · ٢٧٣٦", "english": "Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"Allah has ninety-nine names, i.e. one-hundred minus one, and whoever knows them will go to Paradise.\" (Please see Hadith No. 419 Vol)", "source_en": "Sahih al-Bukhari · 2736"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "قَالَ اللَّهُ تَبَارَكَ وَتَعَالَى أَنَا أَغْنَى الشُّرَكَاءِ عَنِ الشِّرْكِ مَنْ عَمِلَ عَمَلاً أَشْرَكَ فِيهِ مَعِي غَيْرِي تَرَكْتُهُ وَشِرْكَهُ"]], "source": "صحيح مسلم · ٢٩٨٥", "english": "Hafsa (Allah be pleased with her) reported:I said: Messenger of Allah what is the matter with you that you have not put off Ihram? The rest of the hadith is the same", "source_en": "Sahih Muslim · 2985"}, {"parts": [["n", "عن أَنَسٍ رضى الله عنه عَنِ النَّبِيِّ ﷺ يَرْوِيهِ عَنْ رَبِّهِ، قَالَ"], ["q", "إِذَا تَقَرَّبَ الْعَبْدُ إِلَىَّ شِبْرًا تَقَرَّبْتُ إِلَيْهِ ذِرَاعًا، وَإِذَا تَقَرَّبَ مِنِّي ذِرَاعًا تَقَرَّبْتُ مِنْهُ بَاعًا، وَإِذَا أَتَانِي مَشْيًا أَتَيْتُهُ هَرْوَلَةً"]], "source": "صحيح البخاري · ٧٥٣٦", "english": "Narrated Anas:The Prophet (ﷺ) said, \"My Lord says, 'If My slave comes nearer to me for a span, I go nearer to him for a cubit; and if he comes nearer to Me for a cubit, I go nearer to him for the span of outstretched arms; and if he comes to Me walking, I go to him running", "source_en": "Sahih al-Bukhari · 7536"}, {"parts": [["n", "عن عَبْدِ اللَّهِ بْنِ عُمَرَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "مَنِ اسْتَعَاذَ بِاللَّهِ فَأَعِيذُوهُ وَمَنْ سَأَلَ بِاللَّهِ فَأَعْطُوهُ وَمَنْ دَعَاكُمْ فَأَجِيبُوهُ وَمَنْ صَنَعَ إِلَيْكُمْ مَعْرُوفًا فَكَافِئُوهُ فَإِنْ لَمْ تَجِدُوا مَا تُكَافِئُونَهُ فَادْعُوا لَهُ حَتَّى تَرَوْا أَنَّكُمْ قَدْ كَافَأْتُمُوهُ"]], "source": "سنن أبي داود · ١٦٧٢ · صحيح عند الألباني", "english": "Narrated Abdullah ibn Umar: The Prophet (ﷺ) said: If anyone seeks protection in Allah's name, grant him protection; if anyone begs in Allah's name, give him something; if anyone gives you an invitation, accept it; and if anyone does you a kindness, recompense him; but if you have not the means to do so, pray for him until you feel that you have compensated him", "source_en": "Sunan Abi Dawud · 1672"}, {"parts": [["n", "عن أُسَامَةَ بْنِ زَيْدٍ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "مَنْ صُنِعَ إِلَيْهِ مَعْرُوفٌ فَقَالَ لِفَاعِلِهِ جَزَاكَ اللَّهُ خَيْرًا فَقَدْ أَبْلَغَ فِي الثَّنَاءِ"]], "source": "جامع الترمذي · ٢٠٣٥ · حسن", "english": "Usamah bin Zaid narrated that the Messenger of Allah (s.a.w) said:\"Whoever some good was done to him, and he says: 'May Allah reward you in goodness' then he has done the most that he can of praise", "source_en": "Jami at-Tirmidhi · 2035"}, {"parts": [["n", "عن أَبِي سَعِيدٍ الْخُدْرِيِّ، وَعَنْ أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "مَا يُصِيبُ الْمُسْلِمَ مِنْ نَصَبٍ وَلاَ وَصَبٍ وَلاَ هَمٍّ وَلاَ حُزْنٍ وَلاَ أَذًى وَلاَ غَمٍّ حَتَّى الشَّوْكَةِ يُشَاكُهَا، إِلاَّ كَفَّرَ اللَّهُ بِهَا مِنْ خَطَايَاهُ"]], "source": "صحيح البخاري · ٥٦٤١", "english": "Narrated Abu Sa`id Al-Khudri and Abu Huraira:The Prophet (ﷺ) said, \"No fatigue, nor disease, nor sorrow, nor sadness, nor hurt, nor distress befalls a Muslim, even if it were the prick he receives from a thorn, but that Allah expiates some of his sins for that", "source_en": "Sahih al-Bukhari · 5641"}, {"parts": [["n", "عن أَنَسِ بْنِ مَالِكٍ رضى الله عنه قَالَ النَّبِيُّ ﷺ"], ["q", "لاَ يَتَمَنَّيَنَّ أَحَدُكُمُ الْمَوْتَ مِنْ ضُرٍّ أَصَابَهُ، فَإِنْ كَانَ لاَ بُدَّ فَاعِلاً فَلْيَقُلِ اللَّهُمَّ أَحْيِنِي مَا كَانَتِ الْحَيَاةُ خَيْرًا لِي، وَتَوَفَّنِي إِذَا كَانَتِ الْوَفَاةُ خَيْرًا لِي"]], "source": "صحيح البخاري · ٥٦٧١", "english": "Narrated Anas bin Malik:The Prophet (ﷺ) said, \"None of you should wish for death because of a calamity befalling him; but if he has to wish for death, he should say: \"O Allah! Keep me alive as long as life is better for me, and let me die if death is better for me", "source_en": "Sahih al-Bukhari · 5671"}, {"parts": [["n", "عن أَبِي مُوسَى، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "مَنْ أَحَبَّ لِقَاءَ اللَّهِ أَحَبَّ اللَّهُ لِقَاءَهُ، وَمَنْ كَرِهَ لِقَاءَ اللَّهِ كَرِهَ اللَّهُ لِقَاءَهُ"]], "source": "صحيح البخاري · ٦٥٠٨", "english": "Narrated Abu Musa:The Prophet (ﷺ) said: \"Whoever loves to meet Allah, Allah loves to meet him; and whoever hates to meet Allah, Allah hates to meet him", "source_en": "Sahih al-Bukhari · 6508"}, {"parts": [["n", "عن مُطَرِّفٍ، عَنْ أَبِيهِ، قَالَ أَتَيْتُ النَّبِيَّ ﷺ وَهُوَ يَقْرَأُ ﴿ أَلْهَاكُمُ التَّكَاثُرُ﴾ قَالَ"], ["q", "يَقُولُ ابْنُ آدَمَ مَالِي مَالِي - قَالَ - وَهَلْ لَكَ يَا ابْنَ آدَمَ مِنْ مَالِكَ إِلاَّ مَا أَكَلْتَ فَأَفْنَيْتَ أَوْ لَبِسْتَ فَأَبْلَيْتَ أَوْ تَصَدَّقْتَ فَأَمْضَيْتَ"]], "source": "صحيح مسلم · ٢٩٥٨", "english": "This hadith has been narrated by Shu'ba with the same chain of transmitters", "source_en": "Sahih Muslim · 2958"}, {"parts": [["n", "عن ابْنَ عَبَّاسٍ رضى الله عنهما يَقُولُ سَمِعْتُ النَّبِيَّ ﷺ يَقُولُ"], ["q", "لَوْ كَانَ لاِبْنِ آدَمَ وَادِيَانِ مِنْ مَالٍ لاَبْتَغَى ثَالِثًا، وَلاَ يَمْلأُ جَوْفَ ابْنِ آدَمَ إِلاَّ التُّرَابُ، وَيَتُوبُ اللَّهُ عَلَى مَنْ تَابَ"]], "source": "صحيح البخاري · ٦٤٣٦", "english": "Narrated Ibn `Abbas:I heard the Prophet (ﷺ) saying, \"If the son of Adam (the human being) had two valleys of money, he would wish for a third, for nothing can fill the belly of Adam's son except dust, and Allah forgives him who repents to Him", "source_en": "Sahih al-Bukhari · 6436"}, {"parts": [["n", "عن أَنَسٍ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "يَهْرَمُ ابْنُ آدَمَ وَتَشِبُّ مِنْهُ اثْنَتَانِ الْحِرْصُ عَلَى الْمَالِ وَالْحِرْصُ عَلَى الْعُمُرِ"]], "source": "صحيح مسلم · ١٠٤٧", "english": "Hammam b. Munabbih reported:This is what Abu Huraira transmitted to us from Muhammad the Messenger of Allah (ﷺ), and he narrated (some) ahadith out of (these narrations and one of them is this): The Messenger of Allah (ﷺ) said: When any one of you stands to lead people In prayer, he should shorten it, for amongst them are the aged, and amongst them are the weak, but when he prays by himself, he may prolong his prayer as he likes", "source_en": "Sahih Muslim · 1047"}, {"parts": [["n", "عن كَعْبِ بْنِ عِيَاضٍ، قَالَ سَمِعْتُ النَّبِيَّ ﷺ يَقُولُ"], ["q", "إِنَّ لِكُلِّ أُمَّةٍ فِتْنَةً وَفِتْنَةُ أُمَّتِي الْمَالُ"]], "source": "جامع الترمذي · ٢٣٣٦ · صحيح غريب", "english": "Ka'b bin 'Iyad narrated that the Prophet (s.a.w) said:\"Indeed there is a fitnah for every Ummah, and the Fitnah for my Ummah is wealth", "source_en": "Jami at-Tirmidhi · 2336"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "سَبَقَ دِرْهَمٌ مِائَةَ أَلْفِ دِرْهَمٍ"], ["n", "قَالُوا وَكَيْفَ قَالَ"], ["q", "كَانَ لِرَجُلٍ دِرْهَمَانِ تَصَدَّقَ بِأَحَدِهِمَا وَانْطَلَقَ رَجُلٌ إِلَى عُرْضِ مَالِهِ فَأَخَذَ مِنْهُ مِائَةَ أَلْفِ دِرْهَمٍ فَتَصَدَّقَ بِهَا"]], "source": "سنن النسائي · ٢٥٢٧ · حسن عند الألباني", "english": "It was narrated from Abu Hurairah that the Messenger of Allah said:\"A Dirham surpassed a hundred thousand Dirhams.\" They said: \"How?\" He said: \"A man had two Dirhams and gave one in charity, and another man went part of his wealth and took out a hundred thousand Dirhams and gave them in charity", "source_en": "Sunan an-Nasa'i · 2527"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، قَالَ أَتَى رَسُولَ اللَّهِ ﷺ رَجُلٌ فَقَالَ يَا رَسُولَ اللَّهِ أَىُّ الصَّدَقَةِ أَعْظَمُ فَقَالَ"], ["q", "أَنْ تَصَدَّقَ وَأَنْتَ صَحِيحٌ شَحِيحٌ تَخْشَى الْفَقْرَ وَتَأْمُلُ الْغِنَى وَلاَ تُمْهِلْ حَتَّى إِذَا بَلَغَتِ الْحُلْقُومَ قُلْتَ لِفُلاَنٍ كَذَا وَلِفُلاَنٍ كَذَا أَلاَ وَقَدْ كَانَ لِفُلاَنٍ"]], "source": "صحيح مسلم · ١٠٣٢", "english": "Abu Barza Aslami reported:The Messenger of Allah (ﷺ) used to recite from sixty to one hundred verses in the morning prayer", "source_en": "Sahih Muslim · 1032"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "إِذَا مَاتَ الإِنْسَانُ انْقَطَعَ عَنْهُ عَمَلُهُ إِلاَّ مِنْ ثَلاَثَةِ أَشْيَاءَ مِنْ صَدَقَةٍ جَارِيَةٍ أَوْ عِلْمٍ يُنْتَفَعُ بِهِ أَوْ وَلَدٍ صَالِحٍ يَدْعُو لَهُ"]], "source": "سنن أبي داود · ٢٨٨٠ · صحيح عند الألباني", "english": "Narrated Abu Hurairah:The Messenger of Allah (ﷺ) as saying: When a man dies, his action discontinues from him except three things, namely, perpetual sadaqah (charity), or the knowledge by which benefit is acquired, or a pious child who prays for him", "source_en": "Sunan Abi Dawud · 2880"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "مَنْ تَصَدَّقَ بِعَدْلِ تَمْرَةٍ مِنْ كَسْبٍ طَيِّبٍ، وَلاَ يَصْعَدُ إِلَى اللَّهِ إِلاَّ الطَّيِّبُ، فَإِنَّ اللَّهَ يَتَقَبَّلُهَا بِيَمِينِهِ، ثُمَّ يُرَبِّيهَا لِصَاحِبِهِ كَمَا يُرَبِّي أَحَدُكُمْ فَلُوَّهُ، حَتَّى تَكُونَ مِثْلَ الْجَبَلِ"], ["n", "وَرَوَاهُ وَرْقَاءُ عَنْ عَبْدِ اللَّهِ بْنِ دِينَارٍ عَنْ سَعِيدِ بْنِ يَسَارٍ عَنْ أَبِي هُرَيْرَةَ عَنِ النَّبِيِّ ﷺ"], ["q", "وَلاَ يَصْعَدُ إِلَى اللَّهِ إِلاَّ الطَّيِّبُ"]], "source": "صحيح البخاري · ٧٤٣٠", "english": "Narrated Abu Huraira: Allah's Messenger (ﷺ) said, \"If somebody gives in charity something equal to a date from his honestly earned money ----for nothing ascends to Allah except good---- then Allah will take it in His Right (Hand) and bring it up for its owner as anyone of you brings up a baby horse, till it becomes like a mountain.\" Abu Huraira said: The Prophet. said, \"Nothing ascends to Allah except good", "source_en": "Sahih al-Bukhari · 7430"}, {"parts": [["n", "عن سَعِيدُ بْنُ أَبِي بُرْدَةَ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "عَلَى كُلِّ مُسْلِمٍ صَدَقَةٌ"], ["n", "فَقَالُوا يَا نَبِيَّ اللَّهِ فَمَنْ لَمْ يَجِدْ قَالَ"], ["q", "يَعْمَلُ بِيَدِهِ فَيَنْفَعُ نَفْسَهُ وَيَتَصَدَّقُ"], ["n", "قَالُوا فَإِنْ لَمْ يَجِدْ قَالَ"], ["q", "يُعِينُ ذَا الْحَاجَةِ الْمَلْهُوفَ"], ["n", "قَالُوا فَإِنْ لَمْ يَجِدْ. قَالَ"], ["q", "فَلْيَعْمَلْ بِالْمَعْرُوفِ، وَلْيُمْسِكْ عَنِ الشَّرِّ فَإِنَّهَا لَهُ صَدَقَةٌ"]], "source": "صحيح البخاري · ١٤٤٥", "english": "Narrated Abu Burda:from his father from his grandfather that the Prophet (ﷺ) said, \"Every Muslim has to give in charity.\" The people asked, \"O Allah's Prophet! If someone has nothing to give, what will he do?\" He said, \"He should work with his hands and benefit himself and also give in charity (from what he earns).\" The people further asked, \"If he cannot find even that?\" He replied, \"He should help the needy who appeal for help.\" Then the people asked, \"If he cannot do that?\" He replied, \"Then he should perform good deeds and keep away from evil deeds and this will be regarded as charitable deeds", "source_en": "Sahih al-Bukhari · 1445"}, {"parts": [["n", "عن ابْنِ عُمَرَ رضى الله عنهما قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "بُنِيَ الإِسْلاَمُ عَلَى خَمْسٍ شَهَادَةِ أَنْ لاَ إِلَهَ إِلاَّ اللَّهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ، وَإِقَامِ الصَّلاَةِ، وَإِيتَاءِ الزَّكَاةِ، وَالْحَجِّ، وَصَوْمِ رَمَضَانَ"]], "source": "صحيح البخاري · ٨", "english": "Narrated Ibn 'Umar: Allah's Messenger (ﷺ) said: Islam is based on (the following) five (principles): 1. To testify that none has the right to be worshipped but Allah and Muhammad is Allah's Messenger (ﷺ). 2. To offer the (compulsory congregational) prayers dutifully and perfectly. 3. To pay Zakat (i.e. obligatory charity) . 4. To perform Hajj. (i.e. Pilgrimage to Mecca) 5. To observe fast during the month of Ramadan", "source_en": "Sahih al-Bukhari · 8"}, {"parts": [["n", "عن مُعَاذٍ، قَالَ أَنَا رَدِيفُ النَّبِيِّ، ﷺ فَقَالَ"], ["q", "يَا مُعَاذُ"], ["n", "قُلْتُ لَبَّيْكَ وَسَعْدَيْكَ. ثُمَّ قَالَ مِثْلَهُ ثَلاَثًا"], ["q", "هَلْ تَدْرِي مَا حَقُّ اللَّهِ عَلَى الْعِبَادِ أَنْ يَعْبُدُوهُ وَلاَ يُشْرِكُوا بِهِ شَيْئًا"], ["n", "ثُمَّ سَارَ سَاعَةً فَقَالَ"], ["q", "يَا مُعَاذُ"], ["n", "قُلْتُ لَبَّيْكَ وَسَعْدَيْكَ. قَالَ"], ["q", "هَلْ تَدْرِي مَا حَقُّ الْعِبَادِ عَلَى اللَّهِ إِذَا فَعَلُوا ذَلِكَ أَنْ لاَ يُعَذِّبَهُمْ"]], "source": "صحيح البخاري · ٦٢٦٧", "english": "Narrated Mu`adh:While I was a companion rider with the Prophet (ﷺ) he said, \"O Mu`adh!\" I replied, \"Labbaik wa Sa`daik.\" He repeated this call three times and then said, \"Do you know what Allah's Right on His slaves is?\" I replied, \"No.\" He said, Allah's Right on His slaves is that they should worship Him (Alone) and should not join partners in worship with Him.\" He said, \"O Mu`adh!\" I replied, \"Labbaik wa Sa`daik.\" He said, \"Do you know what the right of (Allah's) salves on Allah is, if they do that (worship Him Alone and join none in His worship)? It is that He will not punish them.\" (another chain through Mu'adh)", "source_en": "Sahih al-Bukhari · 6267"}, {"parts": [["n", "عن أَبِي أُمَامَةَ، عَنْ رَسُولِ اللَّهِ ﷺ أَنَّهُ قَالَ"], ["q", "مَنْ أَحَبَّ لِلَّهِ وَأَبْغَضَ لِلَّهِ وَأَعْطَى لِلَّهِ وَمَنَعَ لِلَّهِ فَقَدِ اسْتَكْمَلَ الإِيمَانَ"]], "source": "سنن أبي داود · ٤٦٨١ · صحيح عند الألباني", "english": "Narrated AbuUmamah: The Prophet (ﷺ) said: If anyone loves for Allah's sake, hates for Allah's sake, gives for Allah's sake and withholds for Allah's sake, he will have perfect faith", "source_en": "Sunan Abi Dawud · 4681"}, {"parts": [["n", "عن أبي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "حَقُّ الْمُسْلِمِ عَلَى الْمُسْلِمِ خَمْسٌ"]], "source": "صحيح مسلم · ٢١٦٢", "english": "This hadith has been narrated by Yahya b. Sa'id with the same chain of transmitters like one narrated by 'Abd al-'Aziz (with the change of these words):\" You did not spare the Messenger of Allah (ﷺ) the botheration", "source_en": "Sahih Muslim · 2162"}, {"parts": [["n", "عن ابْنِ عَبَّاسٍ رضى الله عنهما أَنَّ رَسُولَ اللَّهِ ﷺ دَخَلَ عَلَى رَجُلٍ يَعُودُهُ فَقَالَ"], ["q", "لاَ بَأْسَ طَهُورٌ إِنْ شَاءَ اللَّهُ"], ["n", "فَقَالَ كَلاَّ بَلْ حُمَّى تَفُورُ عَلَى شَيْخٍ كَبِيرٍ كَيْمَا تُزِيرَهُ الْقُبُورَ. قَالَ النَّبِيُّ ﷺ"], ["q", "فَنَعَمْ إِذًا"]], "source": "صحيح البخاري · ٥٦٦٢", "english": "Narrated Ibn `Abbas:Allah's Messenger (ﷺ) entered upon sick man to pay him a visit, and said to him, \"Don't worry, Allah willing, (your sickness will be) an expiation for your sins.\" The man said, \"No, it is but a fever that is boiling within an old man and will send him to his grave.\" On that, the Prophet (ﷺ) said, \"Then yes, it is so", "source_en": "Sahih al-Bukhari · 5662"}, {"parts": [["n", "عن عَائِشَةَ رضى الله عنها أَنَّ رَسُولَ اللَّهِ ﷺ كَانَ إِذَا أَتَى مَرِيضًا أَوْ أُتِيَ بِهِ قَالَ"], ["q", "أَذْهِبِ الْبَاسَ رَبَّ النَّاسِ، اشْفِ وَأَنْتَ الشَّافِي لاَ شِفَاءَ إِلاَّ شِفَاؤُكَ، شِفَاءً لاَ يُغَادِرُ سَقَمًا"]], "source": "صحيح البخاري · ٥٦٧٥", "english": "Narrated `Aisha:Whenever Allah's Messenger (ﷺ) paid a visit to a patient, or a patient was brought to him, he used to invoke Allah, saying, \"Take away the disease, O the Lord of the people! Cure him as You are the One Who cures. There is no cure but Yours, a cure that leaves no disease", "source_en": "Sahih al-Bukhari · 5675"}, {"parts": [["n", "عن عُثْمَانَ، - يَعْنِي ابْنَ عَفَّانَ - يَقُولُ سَمِعْتُ رَسُولَ اللَّهِ ﷺ يَقُولُ"], ["q", "مَنْ قَالَ بِسْمِ اللَّهِ الَّذِي لاَ يَضُرُّ مَعَ اسْمِهِ شَىْءٌ فِي الأَرْضِ وَلاَ فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ ثَلاَثَ مَرَّاتٍ لَمْ تُصِبْهُ فَجْأَةُ بَلاَءٍ حَتَّى يُصْبِحَ وَمَنْ قَالَهَا حِينَ يُصْبِحُ ثَلاَثَ مَرَّاتٍ لَمْ تُصِبْهُ فَجْأَةُ بَلاَءٍ حَتَّى يُمْسِيَ"]], "source": "سنن أبي داود · ٥٠٨٨ · صحيح عند الألباني", "english": "Narrated Uthman ibn Affan: Aban ibn Uthman said: I heard Uthman ibn Affan (his father) say: I heard the Messenger of Allah (ﷺ) say: If anyone says three times: \"In the name of Allah, when Whose name is mentioned nothing on Earth or in Heaven can cause harm, and He is the Hearer, the Knower\" he will not suffer sudden affliction till the morning, and if anyone says this in the morning, he will not suffer sudden affliction till the evening. Aban was afflicted by some paralysis and when a man who heard the tradition began to look at him, he said to him: Why are you looking at me? I swear by Allah, I did not tell a lie about Uthman, nor did Uthman tell a lie about the Prophet (ﷺ), but that day when I was afflicted by it, I became angry and forgot to say them", "source_en": "Sunan Abi Dawud · 5088"}, {"parts": [["n", "عن أَنَسِ بْنِ مَالِكٍ، أَنَّ النَّبِيَّ ﷺ قَالَ"], ["q", "إِذَا خَرَجَ الرَّجُلُ مِنْ بَيْتِهِ فَقَالَ بِسْمِ اللَّهِ تَوَكَّلْتُ عَلَى اللَّهِ لاَ حَوْلَ وَلاَ قُوَّةَ إِلاَّ بِاللَّهِ"], ["n", "قَالَ"], ["q", "يُقَالُ حِينَئِذٍ هُدِيتَ وَكُفِيتَ وَوُقِيتَ فَتَتَنَحَّى لَهُ الشَّيَاطِينُ فَيَقُولُ لَهُ شَيْطَانٌ آخَرُ كَيْفَ لَكَ بِرَجُلٍ قَدْ هُدِيَ وَكُفِيَ وَوُقِيَ"]], "source": "سنن أبي داود · ٥٠٩٥ · صحيح عند الألباني", "english": "Narrated Anas ibn Malik: The Prophet (ﷺ) said: When a man goes out of his house and says: \"In the name of Allah, I trust in Allah; there is no might and no power but in Allah,\" the following will be said to him at that time: \"You are guided, defended and protected.\" The devils will go far from him and another devil will say: How can you deal with a man who has been guided, defended and protected?", "source_en": "Sunan Abi Dawud · 5095"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ ﷺ أَنَّهُ كَانَ يَقُولُ إِذَا أَصْبَحَ"], ["q", "اللَّهُمَّ بِكَ أَصْبَحْنَا وَبِكَ أَمْسَيْنَا وَبِكَ نَحْيَا وَبِكَ نَمُوتُ وَإِلَيْكَ النُّشُورُ"], ["n", "وَإِذَا أَمْسَى قَالَ"], ["q", "اللَّهُمَّ بِكَ أَمْسَيْنَا وَبِكَ نَحْيَا وَبِكَ نَمُوتُ وَإِلَيْكَ النُّشُورُ"]], "source": "سنن أبي داود · ٥٠٦٨ · صحيح عند الألباني", "english": "Narrated AbuHurayrah: The Prophet (ﷺ) used to say in the morning: \"O Allah, by Thee we come to the morning, by Thee we come to the evening, by Thee are we resurrected.\" In the evening he would say: \"O Allah, by Thee we come to the evening, by Thee we die, and to Thee are we resurrected", "source_en": "Sunan Abi Dawud · 5068"}, {"parts": [["n", "عن ابْنِ عَبَّاسٍ رضى الله عنهما قَالَ كَانَ النَّبِيُّ ﷺ يَدْعُو عِنْدَ الْكَرْبِ"], ["q", "لاَ إِلَهَ إِلاَّ اللَّهُ الْعَظِيمُ الْحَلِيمُ، لاَ إِلَهَ إِلاَّ اللَّهُ رَبُّ السَّمَوَاتِ وَالأَرْضِ، رَبُّ الْعَرْشِ الْعَظِيمِ"]], "source": "صحيح البخاري · ٦٣٤٥", "english": "Narrated Ibn `Abbas:The Prophet (ﷺ) used to invoke Allah at the time of distress, saying, \"La ilaha illal-lahu Al-`Azim, al- Halim, La ilaha illal-lahu Rabbu-s-samawati wal-ard wa Rabbu-l-arsh il-azim", "source_en": "Sahih al-Bukhari · 6345"}, {"parts": [["n", "عن أَبِي بُرْدَةَ بْنِ أَبِي مُوسَى الأَشْعَرِيِّ، عَنْ أَبِيهِ، عَنِ النَّبِيِّ ﷺ أَنَّهُ كَانَ يَدْعُو بِهَذَا الدُّعَاءِ"], ["q", "اللَّهُمَّ اغْفِرْ لِي خَطِيئَتِي وَجَهْلِي وَإِسْرَافِي فِي أَمْرِي وَمَا أَنْتَ أَعْلَمُ بِهِ مِنِّي اللَّهُمَّ اغْفِرْ لِي جِدِّي وَهَزْلِي وَخَطَئِي وَعَمْدِي وَكُلُّ ذَلِكَ عِنْدِي اللَّهُمَّ اغْفِرْ لِي مَا قَدَّمْتُ وَمَا أَخَّرْتُ وَمَا أَسْرَرْتُ وَمَا أَعْلَنْتُ وَمَا أَنْتَ أَعْلَمُ بِهِ مِنِّي أَنْتَ الْمُقَدِّمُ وَأَنْتَ الْمُؤَخِّرُ وَأَنْتَ عَلَى كُلِّ شَىْءٍ قَدِيرٌ"]], "source": "صحيح مسلم · ٢٧١٩", "english": "Abdullah b. Shaqiq reported. I asked 'A'isha (Allah be pleased with her) about fasting of the Messenger of Allah (ﷺ). She said:He used to observe fast (at times) so continuously that we said: He has fasted, he has fasted. And (at times) he did not observe fast (for days) and we began to say: He has abandoned fasting, he has abandoned fasting. She said: I did not see him observing fast throughout the whole of the month since he arrived in Medina, but that of Ramadan", "source_en": "Sahih Muslim · 2719"}, {"parts": [["n", "عن عَائِشَةَ، رضى الله عنها أَنَّ النَّبِيَّ ﷺ كَانَ إِذَا سَلَّمَ قَالَ"], ["q", "اللَّهُمَّ أَنْتَ السَّلاَمُ وَمِنْكَ السَّلاَمُ تَبَارَكْتَ يَا ذَا الْجَلاَلِ وَالإِكْرَامِ"]], "source": "سنن أبي داود · ١٥١٢ · صحيح عند الألباني", "english": "Aishah said:When the Prophet (ﷺ) uttered taslim, he used to say: \"O Allah, You are As-Salam, and from you is As-Salam. You are blessed, O One of Magnificence and Generosity", "source_en": "Sunan Abi Dawud · 1512"}, {"parts": [["n", "عن أُمِّ سَلَمَةَ، أَنَّ النَّبِيَّ ﷺ كَانَ يَقُولُ إِذَا صَلَّى الصُّبْحَ حِينَ يُسَلِّمُ"], ["q", "اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا، وَرِزْقًا طَيِّبًا، وَعَمَلاً مُتَقَبَّلاً"]], "source": "سنن ابن ماجه · ٩٢٥ · صحيح عند الألباني", "english": "It was narrated from Umm Salamah that when the Prophet (ﷺ) performed the Subh (morning prayer), while he said the Salam, he would say:‘Allahumma inni as’aluka ‘ilman nafi’an, wa rizqan tayyiban, wa ‘amalan mutaqabbalan (O Allah, I ask You for beneficial knowledge, goodly provision and acceptable deeds).’”", "source_en": "Sunan Ibn Majah · 925"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، رضى الله عنه قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "اللَّهُمَّ انْفَعْنِي بِمَا عَلَّمْتَنِي وَعَلِّمْنِي مَا يَنْفَعُنِي وَزِدْنِي عِلْمًا الْحَمْدُ لِلَّهِ عَلَى كُلِّ حَالٍ وَأَعُوذُ بِاللَّهِ مِنْ حَالِ أَهْلِ النَّارِ"]], "source": "جامع الترمذي · ٣٥٩٩ · صحيح عند الألباني", "english": "Abu Hurairah, may Allah be pleased with him, narrated that the Messenger of Allah (ﷺ) said:“O Allah, benefit me with that which You have taught me, and teach me that which will benefit me, and increase me in knowledge. All praise is due to Allah in every condition, and I seek refuge in Allah from the condition of the people of the Fire (Allāhummanfa`nī bimā `allamtanī wa `allimnī mā yanfa`unī, wa zidnī `ilma, al-ḥamdulillāhi `alā kulli ḥālin, wa a`ūdhu billāhi min ḥāli ahlin-nār).”", "source_en": "Jami at-Tirmidhi · 3599"}, {"parts": [["n", "عن عَلِيٍّ، قَالَ قَالَ لِي رَسُولُ اللَّهِ ﷺ"], ["q", "قُلِ اللَّهُمَّ اهْدِنِي وَسَدِّدْنِي وَاذْكُرْ بِالْهُدَى هِدَايَتَكَ الطَّرِيقَ وَالسَّدَادِ سَدَادَ السَّهْمِ"]], "source": "صحيح مسلم · ٢٧٢٥", "english": "This hadith has been narrated on the authority of Abu Bishr with the same chain of transmitters (with a slight variation of words and these are), that he (the narrator) said:\" During any month continuously since he came to Medina", "source_en": "Sahih Muslim · 2725"}, {"parts": [["n", "عن أبي مَالِكٍ الأَشْجَعِيُّ، عَنْ أَبِيهِ، قَالَ كَانَ الرَّجُلُ إِذَا أَسْلَمَ عَلَّمَهُ النَّبِيُّ ﷺ الصَّلاَةَ ثُمَّ أَمَرَهُ أَنْ يَدْعُوَ بِهَؤُلاَءِ الْكَلِمَاتِ"], ["q", "اللَّهُمَّ اغْفِرْ لِي وَارْحَمْنِي وَاهْدِنِي وَعَافِنِي وَارْزُقْنِي"]], "source": "صحيح مسلم · ٢٦٩٧", "english": "Abdullah b. Buraida (Allah be pleased with him) reported on the authority of his father:When we were sitting with the Messenger of Allah (ﷺ), a woman came to him and said: I had gifted to my mother a maid-servant, and now she (the mother) has died. Thereupon he (the Holy Prophet) said: There is a definite reward for you and she (the maid-servant) has been returned to you as an inheritance. She (that woman) again said: Fasts of a month (of Ramadan) are due upon her; should I observe them on her behalf? He (the Holy Prophet) said: Observe fasts on her behalf. She (again) said: She did not perform Hajj, should I perform it on her behalf? He (the Holy Prophet) said: Perform Hajj on her behalf", "source_en": "Sahih Muslim · 2697"}, {"parts": [["n", "عن ابْنِ عَبَّاسٍ، قَالَ كَانَ النَّبِيُّ ﷺ يَدْعُو"], ["q", "رَبِّ أَعِنِّي وَلاَ تُعِنْ عَلَىَّ وَانْصُرْنِي وَلاَ تَنْصُرْ عَلَىَّ وَامْكُرْ لِي وَلاَ تَمْكُرْ عَلَىَّ وَاهْدِنِي وَيَسِّرْ هُدَاىَ إِلَىَّ وَانْصُرْنِي عَلَى مَنْ بَغَى عَلَىَّ اللَّهُمَّ اجْعَلْنِي لَكَ شَاكِرًا لَكَ ذَاكِرًا لَكَ رَاهِبًا لَكَ مِطْوَاعًا إِلَيْكَ مُخْبِتًا أَوْ مُنِيبًا رَبِّ تَقَبَّلْ تَوْبَتِي وَاغْسِلْ حَوْبَتِي وَأَجِبْ دَعْوَتِي وَثَبِّتْ حُجَّتِي وَاهْدِ قَلْبِي وَسَدِّدْ لِسَانِي وَاسْلُلْ سَخِيمَةَ قَلْبِي"]], "source": "سنن أبي داود · ١٥١٠ · صحيح عند الألباني", "english": "Narrated Abdullah ibn Abbas: The Prophet (ﷺ) used to supplicate Allah: \"My Lord, help me and do not give help against me; grant me victory, and do not grant victory over me; plan on my behalf and do not plan against me; guide me, and made my right guidance easy for me; grant me victory over those who act wrongfully towards me; O Allah, make me grateful to Thee, mindful of Thee, full of fear towards Thee, devoted to Thy obedience, humble before Thee, or penitent. My Lord, accept my repentance, wash away my sin, answer my supplication, clearly establish my evidence, guide my heart, make true my tongue and draw out malice in my breast", "source_en": "Sunan Abi Dawud · 1510"}, {"parts": [["n", "عن عَمِّهِ، قَالَ كَانَ النَّبِيُّ ﷺ يَقُولُ"], ["q", "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ مُنْكَرَاتِ الأَخْلاَقِ وَالأَعْمَالِ وَالأَهْوَاءِ"]], "source": "جامع الترمذي · ٣٥٩١ · صحيح عند الألباني", "english": "Ziyad bin `Ilaqah narrated from his uncle, that he said:“[The Prophet (ﷺ)] used to say: ‘O Allah, I seek refuge in You from evil character, evil actions, and evil desires (Allāhumma innī a`ūdhu bika min munkarātil-akhlāqi wal-a`māli wal-ahwā’).’”", "source_en": "Jami at-Tirmidhi · 3591"}, {"parts": [["n", "عن أَنَسِ بْنِ مَالِكٍ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "مَنْ سَأَلَ اللَّهَ الْجَنَّةَ ثَلاَثَ مَرَّاتٍ قَالَتِ الْجَنَّةُ اللَّهُمَّ أَدْخِلْهُ الْجَنَّةَ. وَمَنِ اسْتَجَارَ مِنَ النَّارِ ثَلاَثَ مَرَّاتٍ قَالَتِ النَّارُ اللَّهُمَّ أَجِرْهُ مِنَ النَّارِ"]], "source": "جامع الترمذي · ٢٥٧٢ · صحيح عند الألباني", "english": "Anas bin Malik narrated that the Messenger of Allah (s.a.w) said:\"Whoever asks Allah (s.w.t) Paradise three times, Paradise says: 'O Allah, admit him into Paradise', and whoever seeks refuge from the Fire three times, the Fire says: 'O Allah, save him from the Fire.'\" Other chains report similar narrations", "source_en": "Jami at-Tirmidhi · 2572"}, {"parts": [["n", "عن سَلْمَانَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "إِنَّ رَبَّكُمْ تَبَارَكَ وَتَعَالَى حَيِيٌّ كَرِيمٌ يَسْتَحْيِي مِنْ عَبْدِهِ إِذَا رَفَعَ يَدَيْهِ إِلَيْهِ أَنْ يَرُدَّهُمَا صِفْرًا"]], "source": "سنن أبي داود · ١٤٨٨ · صحيح عند الألباني", "english": "Narrated Salman al-Farsi: The Prophet (ﷺ) said: Your Lord is munificent and generous, and is ashamed to turn away empty the hands of His servant when he raises them to Him", "source_en": "Sunan Abi Dawud · 1488"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، رضى الله عنه عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "لَيْسَ شَيْءٌ أَكْرَمَ عَلَى اللَّهِ تَعَالَى مِنَ الدُّعَاءِ"]], "source": "جامع الترمذي · ٣٣٧٠ · حسن غريب", "english": "Abu Hurairah narrated that:The Prophet said: “There is nothing more honorable with Allah [Most High] than supplication.”", "source_en": "Jami at-Tirmidhi · 3370"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، أَنَّ النَّبِيَّ ﷺ قَالَ"], ["q", "ثَلاَثُ دَعَوَاتٍ مُسْتَجَابَاتٌ لاَ شَكَّ فِيهِنَّ دَعْوَةُ الْوَالِدِ وَدَعْوَةُ الْمُسَافِرِ وَدَعْوَةُ الْمَظْلُومِ"]], "source": "سنن أبي داود · ١٥٣٦ · حسن عند الألباني", "english": "Narrated AbuHurayrah: The Prophet (ﷺ) said: Three supplications are answered, there being no doubt about them; that of a father, that of a traveller and that of one who has been wronged", "source_en": "Sunan Abi Dawud · 1536"}, {"parts": [["n", "عن عَبْدِ اللَّهِ بْنِ عَمْرٍو وَقَالَ سُفْيَانُ لَمْ يَرْفَعْهُ الأَعْمَشُ إِلَى النَّبِيِّ ﷺ وَرَفَعَهُ حَسَنٌ وَفِطْرٌ عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "لَيْسَ الْوَاصِلُ بِالْمُكَافِئِ، وَلَكِنِ الْوَاصِلُ الَّذِي إِذَا قَطَعَتْ رَحِمُهُ وَصَلَهَا"]], "source": "صحيح البخاري · ٥٩٩١", "english": "Narrated `Abdullah bin `Amr:The Prophet (ﷺ) said, \"Al-Wasil is not the one who recompenses the good done to him by his relatives, but Al-Wasil is the one who keeps good relations with those relatives who had severed the bond of kinship with him", "source_en": "Sahih al-Bukhari · 5991"}, {"parts": [["n", "عن عَائِشَةَ، قَالَتْ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "الرَّحِمُ مُعَلَّقَةٌ بِالْعَرْشِ تَقُولُ مَنْ وَصَلَنِي وَصَلَهُ اللَّهُ وَمَنْ قَطَعَنِي قَطَعَهُ اللَّهُ"]], "source": "صحيح مسلم · ٢٥٥٥", "english": "A hadith like this has been transmitted by Sahl b. Sa'd", "source_en": "Sahih Muslim · 2555"}, {"parts": [["n", "عن أَبِي، عَنْ أَبِيهِ، قَالَ سَمِعْتُ رَسُولَ اللَّهِ ﷺ يَقُولُ"], ["q", "وَيْلٌ لِلَّذِي يُحَدِّثُ فَيَكْذِبُ لِيُضْحِكَ بِهِ الْقَوْمَ وَيْلٌ لَهُ وَيْلٌ لَهُ"]], "source": "سنن أبي داود · ٤٩٩٠ · حسن عند الألباني", "english": "Narrated Mu'awiyah ibn Jaydah al-Qushayri: The Messenger of Allah (ﷺ) said: Woe to him who tells things, speaking falsely, to make people laugh thereby. Woe to him! Woe to him", "source_en": "Sunan Abi Dawud · 4990"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "أَتَدْرُونَ مَا الْغِيبَةُ"], ["n", "قَالُوا اللَّهُ وَرَسُولُهُ أَعْلَمُ. قَالَ"], ["q", "ذِكْرُكَ أَخَاكَ بِمَا يَكْرَهُ"], ["n", "قِيلَ أَفَرَأَيْتَ إِنْ كَانَ فِي أَخِي مَا أَقُولُ قَالَ"], ["q", "إِنْ كَانَ فِيهِ مَا تَقُولُ فَقَدِ اغْتَبْتَهُ وَإِنْ لَمْ يَكُنْ فِيهِ فَقَدْ بَهَتَّهُ"]], "source": "صحيح مسلم · ٢٥٨٩", "english": "Abu Bakr (he is Abu Bakr b. Abd al-Rahman b. Harith) reported:I heard Abu Huraira (Allah be pleased with him) narrating that he who is overtaken by dawn in a state of seminal emission should not observe fast. I made a mention of it to 'Abd al-Rahman b. Harith (i. e. to his father) but he denied it. 'Abd al-Rahman went and I also went along with him till we came to'A'isha and Umm Salama (Allah be pleased with both of them) and Abd al-Rahman asked them about it. Both of them said: (At times it so happened) that the Messenger of Allah (ﷺ) woke up in the morning in a state of junub (but without seminal emission in a dream) and observed fast He (the narrator) said: We then proceeded till we went to Marwan and Abd al-Rahman made a mention of it to him. Upon this Marwan said: I stress upon you (with an oath) that you better go to Abu Huraira and refer to him what is said about it. So we came to Abu Huraira and Abu Bakr had been with us throughout and 'Abd al-Rahman made a mention of it to him, whereupon Abu Huraira said: Did they (the two wives of the Holy Prophet) tell you this? He replied: Yes Upon this (Abu Huraira) said: They have better knowledge. Abu Huraira then attributed that what was said about it to Fadl b. 'Abbas and said: I heard it from Fadl and not from the Messenger of Allah (ﷺ). Abu Huraira then retracted from what he used to say about it. Ibn Juraij (one of the narrators) reported: I asked 'Abd al-Malik, if they (the two wives) said (made the statement) in regard to Ramadan, whereupon he said: It was so, and he (the Holy Prophet) (woke up in the) morning in a state of junub which was not due to the wet dream and then observed fast", "source_en": "Sahih Muslim · 2589"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "أَتَدْرُونَ مَا الْمُفْلِسُ"], ["n", "قَالُوا الْمُفْلِسُ فِينَا مَنْ لاَ دِرْهَمَ لَهُ وَلاَ مَتَاعَ. فَقَالَ"], ["q", "إِنَّ الْمُفْلِسَ مِنْ أُمَّتِي يَأْتِي يَوْمَ الْقِيَامَةِ بِصَلاَةٍ وَصِيَامٍ وَزَكَاةٍ وَيَأْتِي قَدْ شَتَمَ هَذَا وَقَذَفَ هَذَا وَأَكَلَ مَالَ هَذَا وَسَفَكَ دَمَ هَذَا وَضَرَبَ هَذَا فَيُعْطَى هَذَا مِنْ حَسَنَاتِهِ وَهَذَا مِنْ حَسَنَاتِهِ فَإِنْ فَنِيَتْ حَسَنَاتُهُ قَبْلَ أَنْ يُقْضَى مَا عَلَيْهِ أُخِذَ مِنْ خَطَايَاهُمْ فَطُرِحَتْ عَلَيْهِ ثُمَّ طُرِحَ فِي النَّارِ"]], "source": "صحيح مسلم · ٢٥٨١", "english": "Urwa b. Zubair narrated that 'A'isha the Mother of the Believers (Allah be pleased with her) informed him that the Messenger of Allah (ﷺ) kissed her while fasting", "source_en": "Sahih Muslim · 2581"}, {"parts": [["n", "عن أَبِي الدَّرْدَاءِ، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "مَنْ رَدَّ عَنْ عِرْضِ أَخِيهِ رَدَّ اللَّهُ عَنْ وَجْهِهِ النَّارَ يَوْمَ الْقِيَامَةِ"]], "source": "جامع الترمذي · ١٩٣١ · حسن", "english": "Abu Ad-Darda narrated that the Messenger of Allah said:\"Whoever protects his brother's honor, Allah protects his face from the Fire on the Day of Resurrection", "source_en": "Jami at-Tirmidhi · 1931"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "تُفْتَحُ أَبْوَابُ الْجَنَّةِ يَوْمَ الاِثْنَيْنِ وَيَوْمَ الْخَمِيسِ فَيُغْفَرُ لِكُلِّ عَبْدٍ لاَ يُشْرِكُ بِاللَّهِ شَيْئًا إِلاَّ رَجُلاً كَانَتْ بَيْنَهُ وَبَيْنَ أَخِيهِ شَحْنَاءُ فَيُقَالُ أَنْظِرُوا هَذَيْنِ حَتَّى يَصْطَلِحَا أَنْظِرُوا هَذَيْنِ حَتَّى يَصْطَلِحَا أَنْظِرُوا هَذَيْنِ حَتَّى يَصْطَلِحَا"]], "source": "صحيح مسلم · ٦٥٤٤", "english": "Abu Huraira reported Allah's Messenger (ﷺ) as saying:The gates of Paradise are not opened but on two days, Monday and Thursday. and then every servant (of Allah) is granted pardon who does not associate anything with Allah except the person in whose (heart) there is rancour against his brother. And it would be said: Look towards both of them until there is reconciliation; look toward both of them until there is reconciliation; look towards both of them until there is reconciliation. This hadith has been narrated on the authority of Suhail who narrated it on the authority of his father with the chain of transmitters of MaIik, but with this variation of wording:, (Those would not be granted pardon) who bycott each other", "source_en": "Sahih Muslim · 6544"}, {"parts": [["n", "عن سَهْلِ بْنِ مُعَاذٍ، عَنْ أَبِيهِ، أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "مَنْ كَظَمَ غَيْظًا - وَهُوَ قَادِرٌ عَلَى أَنْ يُنْفِذَهُ - دَعَاهُ اللَّهُ عَزَّ وَجَلَّ عَلَى رُءُوسِ الْخَلاَئِقِ يَوْمَ الْقِيَامَةِ حَتَّى يُخَيِّرَهُ اللَّهُ مِنَ الْحُورِ مَا شَاءَ"]], "source": "سنن أبي داود · ٤٧٧٧ · حسن عند الألباني", "english": "Narrated Mu'adh ibn Anas: The Messenger of Allah (ﷺ) said: If anyone suppresses anger when he is in a position to give vent to it, Allah, the Exalted, will call him on the Day of Resurrection over the heads of all creatures, and ask him to choose any of the bright and large eyed maidens he wishes. Abu Dawud said: The name of the transmitter Abu Marhum is 'Abd al-Rahman b. Maimun", "source_en": "Sunan Abi Dawud · 4777"}, {"parts": [["n", "عن سُلَيْمَانَ بْنِ صُرَدٍ، قَالَ كُنْتُ جَالِسًا مَعَ النَّبِيِّ ﷺ وَرَجُلاَنِ يَسْتَبَّانِ، فَأَحَدُهُمَا احْمَرَّ وَجْهُهُ وَانْتَفَخَتْ أَوْدَاجُهُ، فَقَالَ النَّبِيُّ ﷺ"], ["q", "إِنِّي لأَعْلَمُ كَلِمَةً لَوْ قَالَهَا ذَهَبَ عَنْهُ مَا يَجِدُ، لَوْ قَالَ أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ. ذَهَبَ عَنْهُ مَا يَجِدُ"], ["n", "فَقَالُوا لَهُ إِنَّ النَّبِيَّ ﷺ قَالَ"], ["q", "تَعَوَّذْ بِاللَّهِ مِنَ الشَّيْطَانِ"]], "source": "صحيح البخاري · ٣٢٨٢", "english": "Narrated Sulaiman bin Surad:While I was sitting in the company of the Prophet, two men abused each other and the face of one of them became red with anger, and his jugular veins swelled (i.e. he became furious). On that the Prophet said, \"I know a word, the saying of which will cause him to relax, if he does say it. If he says: 'I seek Refuge with Allah from Satan.' then all his anger will go away.\" Somebody said to him, \"The Prophet has said, 'Seek refuge with Allah from Satan.\"' The angry man said, \"Am I mad?", "source_en": "Sahih al-Bukhari · 3282"}, {"parts": [["n", "عن عَبْدَ اللَّهِ بْنَ بُسْرٍ، يَقُولُ قَالَ النَّبِيُّ ﷺ"], ["q", "طُوبَى لِمَنْ وَجَدَ فِي صَحِيفَتِهِ اسْتِغْفَارًا كَثِيرًا"]], "source": "سنن ابن ماجه · ٣٨١٨ · صحيح عند الألباني", "english": "Abdullah bin Busr said that :the Prophet (saas) said: \"Glad tidings to those who find a lot of seeking forgiveness in the record of their deeds", "source_en": "Sunan Ibn Majah · 3818"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "وَالَّذِي نَفْسِي بِيَدِهِ لَوْ لَمْ تُذْنِبُوا لَذَهَبَ اللَّهُ بِكُمْ وَلَجَاءَ بِقَوْمٍ يُذْنِبُونَ فَيَسْتَغْفِرُونَ اللَّهَ فَيَغْفِرُ لَهُمْ"]], "source": "صحيح مسلم · ٢٧٤٩", "english": "This hadith has been narrated by Ghailan b. Jarir with the same chain of transmitters, but with one variation, that there has been made mention of Monday and not of Thursday", "source_en": "Sahih Muslim · 2749"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، عَنْ رَسُولِ اللَّهِ ﷺ قَالَ"], ["q", "إِنَّ الْعَبْدَ إِذَا أَخْطَأَ خَطِيئَةً نُكِتَتْ فِي قَلْبِهِ نُكْتَةٌ سَوْدَاءُ فَإِذَا هُوَ نَزَعَ وَاسْتَغْفَرَ وَتَابَ سُقِلَ قَلْبُهُ وَإِنْ عَادَ زِيدَ فِيهَا حَتَّى تَعْلُوَ قَلْبَهُ وَهُوَ الرَّانُ الَّذِي ذَكَرَ اللَّهُ: ( كلاَّ بَلْ رَانَ عَلَى قُلُوبِهِمْ مَا كَانُوا يَكْسِبُونَ )"]], "source": "جامع الترمذي · ٣٣٣٤ · حسن عند الألباني", "english": "Abu Hurairah narrated that :the Messenger of Allah said: “Verily, when the slave (of Allah) commits a sin, a black spot appears on his heart. When he refrains from it, seeks forgiveness and repents, his heart is polished clean. But if he returns, it increases until it covers his entire heart. And that is the ‘Ran’ which Allah mentioned: ‘Nay, but on their hearts is the Ran which they used to earn.’”", "source_en": "Jami at-Tirmidhi · 3334"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "رَحِمَ اللَّهُ رَجُلاً قَامَ مِنَ اللَّيْلِ فَصَلَّى وَأَيْقَظَ امْرَأَتَهُ فَإِنْ أَبَتْ نَضَحَ فِي وَجْهِهَا الْمَاءَ رَحِمَ اللَّهُ امْرَأَةً قَامَتْ مِنَ اللَّيْلِ فَصَلَّتْ وَأَيْقَظَتْ زَوْجَهَا فَإِنْ أَبَى نَضَحَتْ فِي وَجْهِهِ الْمَاءَ"]], "source": "سنن أبي داود · ١٣٠٨ · حسن صحيح عند الألباني", "english": "Narrated AbuHurayrah: The Prophet (ﷺ) said: May Allah have mercy on a man who gets up at night and prays, and awakens his wife; if she refuses, he should sprinkle water on her face. May Allah have mercy on a woman who gets up at night and prays, and awakens her husband; if he refuses, she would sprinkle water on his face", "source_en": "Sunan Abi Dawud · 1308"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "تُعْرَضُ الأَعْمَالُ يَوْمَ الاِثْنَيْنِ وَالْخَمِيسِ فَأُحِبُّ أَنْ يُعْرَضَ عَمَلِي وَأَنَا صَائِمٌ"]], "source": "جامع الترمذي · ٧٤٧ · حسن غريب", "english": "Abu Hurairah narrated that:the Messenger of Allah said: \"Deeds are presented on Monday and Thursday, and I love that my deeds be presented while I am fasting", "source_en": "Jami at-Tirmidhi · 747"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، - رضى الله عنه - قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "مَنْ نَسِيَ وَهُوَ صَائِمٌ فَأَكَلَ أَوْ شَرِبَ فَلْيُتِمَّ صَوْمَهُ فَإِنَّمَا أَطْعَمَهُ اللَّهُ وَسَقَاهُ"]], "source": "صحيح مسلم · ١١٥٥", "english": "Umar b. Abu Salama reported:I saw the Messenger of Allah (ﷺ) praying in a single garment with its ends crossing each other. 'Isa b. Hammad added:\" placing on his shoulders", "source_en": "Sahih Muslim · 1155"}, {"parts": [["n", "عن ابْنِ الْمُسَيَّبِ، قَالَ قَالَتْ عَائِشَةُ إِنَّ رَسُولَ اللَّهِ ﷺ قَالَ"], ["q", "مَا مِنْ يَوْمٍ أَكْثَرَ مِنْ أَنْ يُعْتِقَ اللَّهُ فِيهِ عَبْدًا مِنَ النَّارِ مِنْ يَوْمِ عَرَفَةَ وَإِنَّهُ لَيَدْنُو ثُمَّ يُبَاهِي بِهِمُ الْمَلاَئِكَةَ فَيَقُولُ مَا أَرَادَ هَؤُلاَءِ"]], "source": "صحيح مسلم · ١٣٤٨", "english": "Abu Huraira narrated it from the Messenger of Allah (ﷺ) that they (the poor among the emigrants) said:Messenger of Allah, the possessors of great wealth have obtained the highest ranks and lasting bliss, and the rest of the hadith is the same as transmitted by Qutaiba on the authority of Laith except that he inserted the words of Abu Salih in the narration of Abu Huraira that\" the poor of the emigrants came back,\" to the end of the hadith,, but this addition was made that Suhail said (that every part of the supplication, i. e. Glorification of Allah, His Praise and declaration of His Greatness) should be uttered eleven times making the total as thirty-three", "source_en": "Sahih Muslim · 1348"}, {"parts": [["n", "عن أَوْسِ بْنِ أَوْسٍ، قَالَ قَالَ النَّبِيُّ ﷺ"], ["q", "إِنَّ مِنْ أَفْضَلِ أَيَّامِكُمْ يَوْمَ الْجُمُعَةِ فَأَكْثِرُوا عَلَىَّ مِنَ الصَّلاَةِ فِيهِ فَإِنَّ صَلاَتَكُمْ مَعْرُوضَةٌ عَلَىَّ"], ["n", "قَالَ فَقَالُوا يَا رَسُولَ اللَّهِ وَكَيْفَ تُعْرَضُ صَلاَتُنَا عَلَيْكَ وَقَدْ أَرِمْتَ قَالَ يَقُولُونَ بَلِيتَ. قَالَ"], ["q", "إِنَّ اللَّهَ تَبَارَكَ وَتَعَالَى حَرَّمَ عَلَى الأَرْضِ أَجْسَادَ الأَنْبِيَاءِ صَلَّى اللَّهُ عَلَيْهِمْ"]], "source": "سنن أبي داود · ١٥٣١ · صحيح عند الألباني", "english": "Aws b. Aws reported the Messenger of Allah (ﷺ) as saying:Among the most excellent of your days is Friday; so invoke many blessings on me on that day, for your blessing will be submitted to me. They (the Companions) asked: Messenger of Allah, how can our blessings be submitted to you, when your body has decayed? He (ﷺ) said: Allah has prohibited the earth from consuming the bodies of Prophets", "source_en": "Sunan Abi Dawud · 1531"}, {"parts": [["n", "عن بُرَيْدَةَ، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "بَشِّرِ الْمَشَّائِينَ فِي الظُّلَمِ إِلَى الْمَسَاجِدِ بِالنُّورِ التَّامِّ يَوْمَ الْقِيَامَةِ"]], "source": "سنن أبي داود · ٥٦١ · صحيح عند الألباني", "english": "Narrated Buraydah ibn al-Hasib: The Prophet (ﷺ) said: Give good tidings to those who walk to the mosques in darkness for having a perfect light on the Day of Judgment", "source_en": "Sunan Abi Dawud · 561"}, {"parts": [["n", "عن جَابِرٍ، قَالَ سَمِعْتُ النَّبِيَّ ﷺ يَقُولُ"], ["q", "إِنَّ فِي اللَّيْلِ لَسَاعَةً لاَ يُوَافِقُهَا رَجُلٌ مُسْلِمٌ يَسْأَلُ اللَّهَ خَيْرًا مِنْ أَمْرِ الدُّنْيَا وَالآخِرَةِ إِلاَّ أَعْطَاهُ إِيَّاهُ وَذَلِكَ كُلَّ لَيْلَةٍ"]], "source": "صحيح مسلم · ٧٥٧", "english": "This hadith has been thus reported by another chain of transmitters:Umm Habiba b. Jahsh came to the Messenger of Allah (ﷺ) and she had been a mustahada for seven years, and the rest of the hadith was narrated like that of 'Amr b. al-Harith up to the words:\" There came the redness of the blood over water.\" and nothing was narrated beyond it", "source_en": "Sahih Muslim · 757"}, {"parts": [["n", "عن أَبِي الدَّرْدَاءِ، أَنَّ النَّبِيَّ ﷺ قَالَ"], ["q", "مَنْ حَفِظَ عَشْرَ آيَاتٍ مِنْ أَوَّلِ سُورَةِ الْكَهْفِ عُصِمَ مِنَ الدَّجَّالِ"]], "source": "صحيح مسلم · ٨٠٩", "english": "Ibn Abbas reported:The Messenger of Allah (ﷺ) happened to pass by a goat thrown (away) which had been in fact given to the freed slave-girl of Maimuna as charity. Upon this the Messenger of Allah (way peace he upon him) said: Why did they not get its skin? They had better tan it and make use of it", "source_en": "Sahih Muslim · 809"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "إِنَّ سُورَةً مِنَ الْقُرْآنِ ثَلاَثُونَ آيَةً شَفَعَتْ لِرَجُلٍ حَتَّى غُفِرَ لَهُ وَهِيَ سُورَةُ تَبَارَكَ الَّذِي بِيَدِهِ الْمُلْكُ"]], "source": "جامع الترمذي · ٢٨٩١ · حسن عند الألباني", "english": "Narrated Abu Hurairah:that the Prophet (ﷺ) said: \"Indeed there is a Surah in the Qur'an of thirty Ayat, which intercedes for a man until he is forgiven. It is [Surah] Tabarak Alladhi Biyadihil-Mulk", "source_en": "Jami at-Tirmidhi · 2891"}, {"parts": [["n", "عن ابْنِ عُمَرَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "رَحِمَ اللَّهُ امْرَأً صَلَّى قَبْلَ الْعَصْرِ أَرْبَعًا"]], "source": "سنن أبي داود · ١٢٧١ · حسن عند الألباني", "english": "Narrated Abdullah ibn Umar: The Prophet (ﷺ) said: May Allah show mercy to a man who prays four rak'ahs before the afternoon prayer", "source_en": "Sunan Abi Dawud · 1271"}, {"parts": [["n", "عن عَبْدِ اللَّهِ، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "اجْعَلُوا آخِرَ صَلاَتِكُمْ بِاللَّيْلِ وِتْرًا"]], "source": "صحيح البخاري · ٩٩٨", "english": "Narrated `Abdullah bin `Umar:The Prophet (ﷺ) said, \"Make witr as your last prayer at night", "source_en": "Sahih al-Bukhari · 998"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "مَا يَزَالُ الْبَلاَءُ بِالْمُؤْمِنِ وَالْمُؤْمِنَةِ فِي نَفْسِهِ وَوَلَدِهِ وَمَالِهِ حَتَّى يَلْقَى اللَّهَ وَمَا عَلَيْهِ خَطِيئَةٌ"]], "source": "جامع الترمذي · ٢٣٩٩ · حسن صحيح", "english": "Abu Hurairah narrated that the Messenger of Allah(s.a.w) said:\"Trials will not cease afflicting the believing man and the believing woman in their self, children, and wealth, until they meet Allah without having any sin", "source_en": "Jami at-Tirmidhi · 2399"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "إِنَّ مِمَّا يَلْحَقُ الْمُؤْمِنَ مِنْ عَمَلِهِ وَحَسَنَاتِهِ بَعْدَ مَوْتِهِ عِلْمًا عَلَّمَهُ وَنَشَرَهُ وَوَلَدًا صَالِحًا تَرَكَهُ وَمُصْحَفًا وَرَّثَهُ أَوْ مَسْجِدًا بَنَاهُ أَوْ بَيْتًا لاِبْنِ السَّبِيلِ بَنَاهُ أَوْ نَهْرًا أَجْرَاهُ أَوْ صَدَقَةً أَخْرَجَهَا مِنْ مَالِهِ فِي صِحَّتِهِ وَحَيَاتِهِ يَلْحَقُهُ مِنْ بَعْدِ مَوْتِهِ"]], "source": "سنن ابن ماجه · ٢٤٢ · حسن عند الألباني", "english": "It was narrated that Abu Hurairah said:\"The Messenger of Allah said: 'The rewards of the good deeds that will reach a believer after his death are: Knowledge which he taught and spread; a righteous son whom he leaves behind; a copy of the Qur'an that he leaves as a legacy; a mosque that he built; a house that he built for wayfarers; a canal that he dug; or charity that he gave during his lifetime when he was in good health. These deeds will reach him after his death", "source_en": "Sunan Ibn Majah · 242"}, {"parts": [["n", "عن أَبِي أُمَامَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "إِنَّ أَوْلَى النَّاسِ بِاللَّهِ مَنْ بَدَأَهُمْ بِالسَّلاَمِ"]], "source": "سنن أبي داود · ٥١٩٧ · صحيح عند الألباني", "english": "Narrated AbuUmamah: The Prophet (ﷺ) said: Those who are nearest to Allah are they who are first to give a salutation", "source_en": "Sunan Abi Dawud · 5197"}, {"parts": [["n", "عن الْبَرَاءِ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "مَا مِنْ مُسْلِمَيْنِ يَلْتَقِيَانِ فَيَتَصَافَحَانِ إِلاَّ غُفِرَ لَهُمَا قَبْلَ أَنْ يَفْتَرِقَا"]], "source": "سنن أبي داود · ٥٢١٢ · صحيح عند الألباني", "english": "Narrated Al-Bara' ibn Azib: The Prophet (ﷺ) said: Two Muslims will not meet and shake hands having their sins forgiven them before they separate", "source_en": "Sunan Abi Dawud · 5212"}, {"parts": [["n", "عن سَهْلِ بْنِ سَعْدٍ قَالَ اطَّلَعَ رَجُلٌ مِنْ جُحْرٍ فِي حُجَرِ النَّبِيِّ ﷺ وَمَعَ النَّبِيِّ ﷺ مِدْرًى يَحُكُّ بِهِ رَأْسَهُ فَقَالَ"], ["q", "لَوْ أَعْلَمُ أَنَّكَ تَنْظُرُ لَطَعَنْتُ بِهِ فِي عَيْنِكَ، إِنَّمَا جُعِلَ الاِسْتِئْذَانُ مِنْ أَجْلِ الْبَصَرِ"]], "source": "صحيح البخاري · ٦٢٤١", "english": "Narrated Sahl bin Sa`d:A man peeped through a round hole into the dwelling place of the Prophet, while the Prophet (ﷺ) had a Midray (an iron comb) with which he was scratching his head. the Prophet (ﷺ) said, \" Had known you were looking (through the hole), I would have pierced your eye with it (i.e., the comb).\" Verily! The order of taking permission to enter has been enjoined because of that sight, (that one should not look unlawfully at the state of others). (See Hadith No. 807, Vol)", "source_en": "Sahih al-Bukhari · 6241"}, {"parts": [["n", "عن أَصْحَابَ النَّبِيِّ، ﷺ قَالُوا يَا رَسُولَ اللَّهِ إِنَّا نَأْكُلُ وَلاَ نَشْبَعُ. قَالَ"], ["q", "فَلَعَلَّكُمْ تَفْتَرِقُونَ"], ["n", "قَالُوا نَعَمْ. قَالَ"], ["q", "فَاجْتَمِعُوا عَلَى طَعَامِكُمْ وَاذْكُرُوا اسْمَ اللَّهِ عَلَيْهِ يُبَارَكْ لَكُمْ فِيهِ"]], "source": "سنن أبي داود · ٣٧٦٤ · حسن عند الألباني", "english": "Narrated Wahshi ibn Harb: The Companions of the Prophet (ﷺ) said: Messenger of Allah (ﷺ) we eat but we are not satisfied. He said: Perhaps you eat separately. They replied: Yes. He said: If you gather together at your food and mention Allah's name, you will be blessed in it. Abu Dawud said: If you are invited to a wedding feast before you, do not take it until the owner of the house (i.e. the host) allows you (to eat)", "source_en": "Sunan Abi Dawud · 3764"}, {"parts": [["n", "عن أبي بَكْرِ بْنُ عُبَيْدِ اللَّهِ بْنِ عَبْدِ اللَّهِ بْنِ عُمَرَ، عَنْ جَدِّهِ ابْنِ عُمَرَ، أَنَّ النَّبِيَّ ﷺ قَالَ"], ["q", "إِذَا أَكَلَ أَحَدُكُمْ فَلْيَأْكُلْ بِيَمِينِهِ وَإِذَا شَرِبَ فَلْيَشْرَبْ بِيَمِينِهِ فَإِنَّ الشَّيْطَانَ يَأْكُلُ بِشِمَالِهِ وَيَشْرَبُ بِشِمَالِهِ"]], "source": "سنن أبي داود · ٣٧٧٦ · صحيح عند الألباني", "english": "Ibn ‘Umar reported the Prophet(ﷺ) as sayings:When any of you eats, he should eat with his right hand, and when he drinks, he should drink with his right hand, for the devil eats with his left hand and drinks with his left hand", "source_en": "Sunan Abi Dawud · 3776"}, {"parts": [["n", "عن ابْنِ عَبَّاسٍ، أَنَّ النَّبِيَّ ﷺ قَالَ"], ["q", "إِنَّ الْبَرَكَةَ تَنْزِلُ وَسَطَ الطَّعَامِ فَكُلُوا مِنْ حَافَتَيْهِ وَلاَ تَأْكُلُوا مِنْ وَسَطِهِ"]], "source": "جامع الترمذي · ١٨٠٥ · حسن صحيح", "english": "Narrated Ibn 'Abbas: That the Prophet (ﷺ) said: \"Indeed the blessing descends to the middle of the food, so eat from its edges, and do not eat from its middle.\" [Abu 'Eisa said:] This Hadith is Hasan Sahih. It is only known through the narration of 'Ata' bin As-Sa'ib. Shu'bah and Ath-Thawri reported from 'Ata' bin As-Sa'ib. There is something about this topic from Ibn 'Umar", "source_en": "Jami at-Tirmidhi · 1805"}, {"parts": [["n", "عن سَهْلِ بْنِ مُعَاذِ بْنِ أَنَسٍ، عَنْ أَبِيهِ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "مَنْ أَكَلَ طَعَامًا فَقَالَ الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنِي هَذَا وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلاَ قُوَّةٍ. غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ"]], "source": "جامع الترمذي · ٣٤٥٨ · حسن عند الألباني", "english": "Sahl bin Mu`adh bin Anas narrated from his father that:The Messenger of Allah (ﷺ) said: “Whoever eats food and then says: ‘All praise is due to Allah who fed me this and granted it as provision to me, without any effort from me nor power, (Al-ḥamdulillāh, alladhī aṭ`amanī hādha wa razaqanīhi min ghairi ḥawlin minnī, wa lā quwwatin)’ his past sins shall be forgiven.”", "source_en": "Jami at-Tirmidhi · 3458"}, {"parts": [["n", "عن أَبِي أُمَامَةَ، أَنَّ النَّبِيَّ ﷺ كَانَ إِذَا رَفَعَ مَائِدَتَهُ قَالَ"], ["q", "الْحَمْدُ لِلَّهِ كَثِيرًا طَيِّبًا مُبَارَكًا فِيهِ، غَيْرَ مَكْفِيٍّ، وَلاَ مُوَدَّعٍ وَلاَ مُسْتَغْنًى عَنْهُ، رَبَّنَا"]], "source": "صحيح البخاري · ٥٤٥٨", "english": "Narrated Abu Umama:Whenever the dining sheet of the Prophet (ﷺ) was taken away (i.e., whenever he finished his meal), he used to say: \"Al-hamdu li l-lah kathiran taiyiban mubarakan fihi ghaira makfiy wala muWada` wala mustaghna'anhu Rabbuna", "source_en": "Sahih al-Bukhari · 5458"}, {"parts": [["n", "عن عَبْدِ اللَّهِ بْنِ أَبِي قَتَادَةَ، عَنْ أَبِيهِ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "إِذَا شَرِبَ أَحَدُكُمْ فَلاَ يَتَنَفَّسْ فِي الإِنَاءِ، وَإِذَا بَالَ أَحَدُكُمْ فَلاَ يَمْسَحْ ذَكَرَهُ بِيَمِينِهِ، وَإِذَا تَمَسَّحَ أَحَدُكُمْ فَلاَ يَتَمَسَّحْ بِيَمِينِهِ"]], "source": "صحيح البخاري · ٥٦٣٠", "english": "Narrated Abu Qatada:Allah's Messenger (ﷺ) said, \"When you drink (water), do not breath in the vessel; and when you urinate, do not touch your penis with your right hand. And when you cleanse yourself after defecation, do not use your right hand", "source_en": "Sahih al-Bukhari · 5630"}, {"parts": [["n", "عن أَبِي مُوسَى الأَشْعَرِيِّ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "إِنَّ مِنْ إِجْلاَلِ اللَّهِ إِكْرَامَ ذِي الشَّيْبَةِ الْمُسْلِمِ وَحَامِلِ الْقُرْآنِ غَيْرِ الْغَالِي فِيهِ وَالْجَافِي عَنْهُ وَإِكْرَامَ ذِي السُّلْطَانِ الْمُقْسِطِ"]], "source": "سنن أبي داود · ٤٨٤٣ · حسن صحيح عند الألباني", "english": "Narrated AbuMusa al-Ash'ari: The Prophet (ﷺ) said: Glorifying Allah involves showing honour to a grey-haired Muslim and to one who can expound the Qur'an, but not to one who acts extravagantly regarding it, or turns away from it, and showing honour to a just ruler", "source_en": "Sunan Abi Dawud · 4843"}, {"parts": [["n", "عن أَبِي سَعِيدٍ الْخُدْرِيِّ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "إِنَّ اللَّهَ يَقُولُ لأَهْلِ الْجَنَّةِ يَا أَهْلَ الْجَنَّةِ. يَقُولُونَ لَبَّيْكَ رَبَّنَا وَسَعْدَيْكَ. فَيَقُولُ هَلْ رَضِيتُمْ فَيَقُولُونَ وَمَا لَنَا لاَ نَرْضَى وَقَدْ أَعْطَيْتَنَا مَا لَمْ تُعْطِ أَحَدًا مِنْ خَلْقِكَ. فَيَقُولُ أَنَا أُعْطِيكُمْ أَفْضَلَ مِنْ ذَلِكَ. قَالُوا يَا رَبِّ وَأَىُّ شَىْءٍ أَفْضَلُ مِنْ ذَلِكَ فَيَقُولُ أُحِلُّ عَلَيْكُمْ رِضْوَانِي فَلاَ أَسْخَطُ عَلَيْكُمْ بَعْدَهُ أَبَدًا"]], "source": "صحيح البخاري · ٦٥٤٩", "english": "Narrated Abu Sa`id Al-Khudri:Allah's Messenger (ﷺ) said, \"Allah will say to the people of Paradise, 'O the people of Paradise!' They will say, 'Labbaik, O our Lord, and Sa`daik!' Allah will say, 'Are you pleased?\" They will say, 'Why should we not be pleased since You have given us what You have not given to anyone of Your creation?' Allah will say, 'I will give you something better than that.' They will reply, 'O our Lord! And what is better than that?' Allah will say, 'I will bestow My pleasure and contentment upon you so that I will never be angry with you after for-ever", "source_en": "Sahih al-Bukhari · 6549"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ رضى الله عنه قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "إِنَّ أَوَّلَ زُمْرَةٍ يَدْخُلُونَ الْجَنَّةَ عَلَى صُورَةِ الْقَمَرِ لَيْلَةَ الْبَدْرِ، ثُمَّ الَّذِينَ يَلُونَهُمْ عَلَى أَشَدِّ كَوْكَبٍ دُرِّيٍّ فِي السَّمَاءِ إِضَاءَةً، لاَ يَبُولُونَ وَلاَ يَتَغَوَّطُونَ وَلاَ يَتْفِلُونَ وَلاَ يَمْتَخِطُونَ، أَمْشَاطُهُمُ الذَّهَبُ، وَرَشْحُهُمُ الْمِسْكُ، وَمَجَامِرُهُمُ الأَلُوَّةُ الأَنْجُوجُ عُودُ الطِّيبِ، وَأَزْوَاجُهُمُ الْحُورُ الْعِينُ، عَلَى خَلْقِ رَجُلٍ وَاحِدٍ عَلَى صُورَةِ أَبِيهِمْ آدَمَ، سِتُّونَ ذِرَاعًا فِي السَّمَاءِ"]], "source": "صحيح البخاري · ٣٣٢٧", "english": "Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"The first group of people who will enter Paradise, will be glittering like the full moon and those who will follow them, will glitter like the most brilliant star in the sky. They will not urinate, relieve nature, spit, or have any nasal secretions. Their combs will be of gold, and their sweat will smell like musk. The aloes-wood will be used in their centers. Their wives will be houris. All of them will look alike and will resemble their father Adam (in stature), sixty cubits tall", "source_en": "Sahih al-Bukhari · 3327"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ ﷺ قَالَ"], ["q", "مَنْ يَدْخُلُ الْجَنَّةَ يَنْعَمُ لاَ يَبْأَسُ لاَ تَبْلَى ثِيَابُهُ وَلاَ يَفْنَى شَبَابُهُ"]], "source": "صحيح مسلم · ٢٨٣٦", "english": "A'isha (Allah be pleased with her) said:I still seem to see the glistening of the perfume where the hair was parted on Allah's Messeinger's (ﷺ) head while he was in the state of Ihram", "source_en": "Sahih Muslim · 2836"}, {"parts": [["n", "عن عَبْدُ اللَّهِ بْنُ عَمْرٍو قَالَ النَّبِيُّ ﷺ"], ["q", "حَوْضِي مَسِيرَةُ شَهْرٍ، مَاؤُهُ أَبْيَضُ مِنَ اللَّبَنِ، وَرِيحُهُ أَطْيَبُ مِنَ الْمِسْكِ، وَكِيزَانُهُ كَنُجُومِ السَّمَاءِ، مَنْ شَرِبَ مِنْهَا فَلاَ يَظْمَأُ أَبَدًا"]], "source": "صحيح البخاري · ٦٥٧٩", "english": "Narrated `Abdullah bin `Amr:The Prophet (ﷺ) said, \"My Lake-Fount is (so large that it takes) a month's journey to cross it. Its water is whiter than milk, and its smell is nicer than musk (a kind of Perfume), and its drinking cups are (as numerous) as the (number of) stars of the sky; and whoever drinks from it, will never be thirsty", "source_en": "Sahih al-Bukhari · 6579"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ، قَالَ قَالَ النَّبِيُّ ﷺ"], ["q", "إِذَا أَوَى أَحَدُكُمْ إِلَى فِرَاشِهِ فَلْيَنْفُضْ فِرَاشَهُ بِدَاخِلَةِ إِزَارِهِ، فَإِنَّهُ لاَ يَدْرِي مَا خَلَفَهُ عَلَيْهِ، ثُمَّ يَقُولُ بِاسْمِكَ رَبِّ وَضَعْتُ جَنْبِي، وَبِكَ أَرْفَعُهُ، إِنْ أَمْسَكْتَ نَفْسِي فَارْحَمْهَا، وَإِنْ أَرْسَلْتَهَا فَاحْفَظْهَا بِمَا تَحْفَظُ بِهِ عِبَادَكَ الصَّالِحِينَ"]], "source": "صحيح البخاري · ٦٣٢٠", "english": "Narrated Abu Huraira:The Prophet (ﷺ) said, \"When anyone of you go to bed, he should shake out his bed with the inside of his waist sheet, for he does not know what has come on to it after him, and then he should say: 'Bismika Rabbi Wada`tu Janbi wa bika arfa'uhu, In amsakta nafsi farhamha wa in arsaltaha fahfazha bima tahfazu bihi ibadakas-salihin", "source_en": "Sahih al-Bukhari · 6320"}, {"parts": [["n", "عن الْبَرَاءُ بْنُ عَازِبٍ رضى الله عنهما قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "إِذَا أَتَيْتَ مَضْجَعَكَ فَتَوَضَّأْ وَضُوءَكَ لِلصَّلاَةِ، ثُمَّ اضْطَجِعْ عَلَى شِقِّكَ الأَيْمَنِ، وَقُلِ اللَّهُمَّ أَسْلَمْتُ وَجْهِي إِلَيْكَ، وَفَوَّضْتُ أَمْرِي إِلَيْكَ، وَأَلْجَأْتُ ظَهْرِي إِلَيْكَ، رَغْبَةً وَرَهْبَةً إِلَيْكَ، لاَ مَلْجَأَ وَلاَ مَنْجَا مِنْكَ إِلاَّ إِلَيْكَ، آمَنْتُ بِكِتَابِكَ الَّذِي أَنْزَلْتَ، وَبِنَبِيِّكَ الَّذِي أَرْسَلْتَ. فَإِنْ مُتَّ مُتَّ عَلَى الْفِطْرَةِ، فَاجْعَلْهُنَّ آخِرَ مَا تَقُولُ"], ["n", "فَقُلْتُ أَسْتَذْكِرُهُنَّ وَبِرَسُولِكَ الَّذِي أَرْسَلْتَ. قَالَ"], ["q", "لاَ، وَبِنَبِيِّكَ الَّذِي أَرْسَلْتَ"]], "source": "صحيح البخاري · ٦٣١١", "english": "Narrated Al-Bara bin `Azib:Allah's Messenger (ﷺ) said to me, \"When you want to go to bed, perform ablution as you do for prayer, then lie down on your right side and say: 'Allahumma aslamtu wajhi ilaika, wa fawwadtu 'amri ilaika wa alja'tu dhahri ilaika, raghbatan wa rahbatan ilaika, la malja'a wa la manja minka illa ilaika. Amantu bikitabik al-ladhi anzalta wa binabiyyika al-ladhi arsalta'. If you should die then (after reciting this) you will die on the religion of Islam (i.e., as a Muslim); so let these words be the last you say (before going to bed)\" While I was memorizing it, I said, \"Wa birasulika al-ladhi arsalta (in Your Apostle whom You have sent).' The Prophet (ﷺ) said, \"No, but say: Wa binabiyyika al-ladhi arsalta (in Your Prophet whom You have sent)", "source_en": "Sahih al-Bukhari · 6311"}, {"parts": [["n", "عن حُذَيْفَةَ، قَالَ كَانَ النَّبِيُّ ﷺ إِذَا أَرَادَ أَنْ يَنَامَ قَالَ"], ["q", "بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا"], ["n", "وَإِذَا اسْتَيْقَظَ مِنْ مَنَامِهِ قَالَ"], ["q", "الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا، وَإِلَيْهِ النُّشُورُ"]], "source": "صحيح البخاري · ٦٣٢٤", "english": "Narrated Hudhaifa:Whenever the Prophet (ﷺ) intended to go to bed, he would recite: \"Bismika Allahumma amutu wa ahya (With Your name, O Allah, I die and I live).\" And when he woke up from his sleep, he would say: \"Al-hamdu lil-lahil-ladhi ahyana ba'da ma amatana; wa ilaihi an-nushur (All the Praises are for Allah Who has made us alive after He made us die (sleep) and unto Him is the Resurrection", "source_en": "Sahih al-Bukhari · 6324"}, {"parts": [["n", "عن يَعْلَى، أَنَّ رَسُولَ اللَّهِ ﷺ رَأَى رَجُلاً يَغْتَسِلُ بِالْبَرَازِ فَصَعِدَ الْمِنْبَرَ فَحَمِدَ اللَّهَ وَأَثْنَى عَلَيْهِ وَقَالَ"], ["q", "إِنَّ اللَّهَ عَزَّ وَجَلَّ حَلِيمٌ حَيِيٌّ سِتِّيرٌ يُحِبُّ الْحَيَاءَ وَالسَّتْرَ فَإِذَا اغْتَسَلَ أَحَدُكُمْ فَلْيَسْتَتِرْ"]], "source": "سنن النسائي · ٤٠٦ · صحيح عند الألباني", "english": "It was narrated from Ya'la that the Messenger of Allah (ﷺ) saw a man performing Ghusl in an open place, so he ascended the Minbar and praised and glorified Allah, then he said:'Allah, the Mighty and Sublime, is forbearing, modest and concealing, and He loves modesty and concealment. When any one of you performs Ghusl, let him conceal himself", "source_en": "Sunan an-Nasa'i · 406"}, {"parts": [["n", "عن أَنَسٍ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "إِنَّ لِكُلِّ دِينٍ خُلُقًا وَخُلُقُ الإِسْلاَمِ الْحَيَاءُ"]], "source": "سنن ابن ماجه · ٤١٨١ · حسن عند الألباني", "english": "It was narrated from Anas that the Messenger of Allah (ﷺ) said:“Every religion has its distinct characteristic, and the distinct characteristic of Islam is modesty.”", "source_en": "Sunan Ibn Majah · 4181"}, {"parts": [["n", "عن أَنَسٍ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "إِذَا أَرَادَ اللَّهُ بِعَبْدٍ خَيْرًا اسْتَعْمَلَهُ"], ["n", "فَقِيلَ كَيْفَ يَسْتَعْمِلُهُ يَا رَسُولَ اللَّهِ قَالَ"], ["q", "يُوَفِّقُهُ لِعَمَلٍ صَالِحٍ قَبْلَ الْمَوْتِ"]], "source": "جامع الترمذي · ٢١٤٢ · حسن صحيح", "english": "Anas narrated that the Messenger of Allah (s.a.w) said:\"When Allah wants good for a slave, He puts him in action.\" It was said: \"How does he put him in action O Messenger Of Allah?\" He said: \"By making him meet up with the righteous deeds before death", "source_en": "Jami at-Tirmidhi · 2142"}, {"parts": [["n", "عن عَلِيٍّ رضى الله عنه قَالَ كَانَ النَّبِيُّ ﷺ فِي جَنَازَةٍ فَأَخَذَ شَيْئًا فَجَعَلَ يَنْكُتُ بِهِ الأَرْضَ فَقَالَ"], ["q", "مَا مِنْكُمْ مِنْ أَحَدٍ إِلاَّ وَقَدْ كُتِبَ مَقْعَدُهُ مِنَ النَّارِ وَمَقْعَدُهُ مِنَ الْجَنَّةِ"], ["n", "قَالُوا يَا رَسُولَ اللَّهِ أَفَلاَ نَتَّكِلُ عَلَى كِتَابِنَا وَنَدَعُ الْعَمَلَ قَالَ"], ["q", "اعْمَلُوا فَكُلٌّ مُيَسَّرٌ لِمَا خُلِقَ لَهُ، أَمَّا مَنْ كَانَ مِنْ أَهْلِ السَّعَادَةِ فَيُيَسَّرُ لِعَمَلِ أَهْلِ السَّعَادَةِ، وَأَمَّا مَنْ كَانَ مِنْ أَهْلِ الشَّقَاءِ فَيُيَسَّرُ لِعَمَلِ أَهْلِ الشَّقَاوَةِ"]], "source": "صحيح البخاري · ٤٩٤٩", "english": "Narrated `Ali:While the Prophet (ﷺ) was in a funeral procession. he picked up something and started scraping the ground with it, and said, \"There is none among you but has his place written for him either in the Hell Fire or in Paradise.\" They said, \"O Allah's Messenger (ﷺ)! Shall we not depend upon what has been written for us and give up deeds? He said, \"Carry on doing (good) deeds, for everybody will find easy to do such deeds as will lead him to his destined place for which he has been created. So he who is destined to be among the happy (in the Hereafter), will find it easy to do the deeds characteristic of such people, while he who is destined to be among the miserable ones, will find it easy to do the deeds characteristic of such people.\" Then he recited: 'As for him who gives (in charity) and fears Allah, and believes in the best", "source_en": "Sahih al-Bukhari · 4949"}, {"parts": [["n", "عن أَبِي ذَرٍّ الْغِفَارِيِّ، قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "إِنَّ اللَّهَ تَجَاوَزَ عَنْ أُمَّتِي الْخَطَأَ وَالنِّسْيَانَ وَمَا اسْتُكْرِهُوا عَلَيْهِ"]], "source": "سنن ابن ماجه · ٢٠٤٣ · صحيح عند الألباني", "english": "It was narrated from Abu Dharr Al-Ghifari that the Messenger of Allah (ﷺ) said:Allah has forgiven for me my nation their mistakes and forgetfulness, and what they are forced to do", "source_en": "Sunan Ibn Majah · 2043"}, {"parts": [["n", "عن أَبِي هُرَيْرَةَ رضى الله عنه قَالَ قَالَ رَسُولُ اللَّهِ ﷺ"], ["q", "إِذَا ضُيِّعَتِ
